<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>🔢 Skaičių Eilutė</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/common.css">
    <script src="../shared/common.js"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f3e8ff;
            background-image: radial-gradient(#d8b4fe 20%, transparent 20%);
            background-size: 22px 22px;
            color: #1e293b;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .frog-hop {
            animation: frogHop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes frogHop {
            0% { transform: translateY(0) scale(1); }
            45% { transform: translateY(-28px) scale(1.25); }
            100% { transform: translateY(0) scale(1); }
        }

        .app-card {
            background-color: rgba(255, 255, 255, 0.96);
            border-color: #d8b4fe;
        }

        .panel-box {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
        }

        .opt-btn {
            background-color: #ede9fe;
            color: #5b21b6;
            border-color: #c4b5fd;
        }
        .opt-btn:hover {
            background-color: #ddd6fe;
        }

        /* Train carriage styling */
        .carriage {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 3.1rem;
            height: 3.5rem;
            border-radius: 0.85rem;
            font-weight: 900;
            font-size: 1.45rem;
            border: 3px solid;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.15);
            margin-bottom: 0.5rem;
        }
        .carriage::before, .carriage::after {
            content: '';
            position: absolute;
            bottom: -9px;
            width: 12px;
            height: 12px;
            background-color: #334155;
            border: 2px solid #94a3b8;
            border-radius: 9999px;
        }
        .carriage::before { left: 6px; }
        .carriage::after { right: 6px; }

        @media (min-width: 640px) {
            .carriage {
                min-width: 4.4rem;
                height: 4.5rem;
                font-size: 2rem;
            }
            .carriage::before, .carriage::after {
                width: 15px;
                height: 15px;
                bottom: -11px;
            }
        }

        /* Lily pad styling */
        .lily-pad {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 2.35rem;
            height: 2.35rem;
            border-radius: 9999px;
            background: radial-gradient(circle at 35% 35%, #4ade80, #16a34a);
            border: 3px solid #15803d;
            color: #052e16;
            font-weight: 900;
            font-size: 0.95rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.15s ease, background 0.2s ease;
            cursor: pointer;
        }
        .lily-pad:active {
            transform: scale(0.9);
        }
        @media (min-width: 640px) {
            .lily-pad {
                width: 3.1rem;
                height: 3.1rem;
                font-size: 1.25rem;
            }
        }

        /* Neighbor houses */
        .house-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 5.5rem;
        }
        .house-roof {
            width: 0;
            height: 0;
            border-left: 3.1rem solid transparent;
            border-right: 3.1rem solid transparent;
            border-bottom: 2.1rem solid #ef4444;
        }
        .house-body {
            width: 5.2rem;
            height: 4.5rem;
            border-radius: 0 0 0.85rem 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.75rem;
            border: 3px solid;
            box-shadow: 0 6px 10px -2px rgba(0,0,0,0.15);
        }
        @media (min-width: 640px) {
            .house-card { width: 7.2rem; }
            .house-roof {
                border-left: 4rem solid transparent;
                border-right: 4rem solid transparent;
                border-bottom: 2.7rem solid #ef4444;
            }
            .house-body {
                width: 6.8rem;
                height: 5.6rem;
                font-size: 2.35rem;
            }
        }

        /* Tamsioji Tema (Dark Mode) */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0b1120 !important;
                background-image: radial-gradient(#1e293b 25%, transparent 25%) !important;
                color: #f8fafc !important;
            }
            .app-card {
                background-color: #0f172a !important;
                border-color: #334155 !important;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6) !important;
                color: #f8fafc !important;
            }
            .bg-purple-100, .bg-emerald-100, .bg-amber-100 {
                background-color: #1e293b !important;
                color: #f8fafc !important;
                border-color: #475569 !important;
            }
            .carriage:not(.bg-green-500) {
                background-color: #1e293b !important;
                color: #f8fafc !important;
            }
            .house-body:not(.bg-green-500):not(.bg-purple-600) {
                background-color: #1e293b !important;
                color: #f8fafc !important;
            }
            .panel-box {
                background-color: #1e293b !important;
                border-color: #334155 !important;
                color: #f8fafc !important;
            }
            .opt-btn {
                background-color: #1e293b !important;
                color: #f8fafc !important;
                border-color: #334155 !important;
            }
            .opt-btn:hover {
                background-color: #334155 !important;
            }
            .text-main-title {
                color: #f8fafc !important;
            }
            .text-sub-title {
                color: #cbd5e1 !important;
            }
            .pond-box {
                background-color: #0c4a6e !important;
                border-color: #0369a1 !important;
            }
        }
    </style>
</head>
<body class="h-screen max-h-screen overflow-hidden flex items-center justify-center p-2 sm:p-4">

    <div id="app" class="app-card w-full max-w-2xl rounded-3xl shadow-xl flex flex-col relative fade-in border-4 overflow-hidden max-h-full">
        <!-- Content rendered by JS -->
    </div>

    <script>
        const state = {
            mode: 'train', // 'train' | 'frog' | 'neighbors'
            score: 0,
            streak: 0,
            question: 1,
            maxQuestions: 10,
            // Mode 1: Train
            sequence: [],
            missingIdx: 2,
            correctVal: 0,
            step: 1,
            isIncreasing: true,
            options: [],
            // Mode 2: Frog
            frogStart: 3,
            frogDelta: 4,
            frogTarget: 7,
            frogPos: 3,
            // Mode 3: Neighbors
            centerNum: 15,
            leftVal: null,
            rightVal: null,
            activeSide: 'left', // 'left' | 'right'
            waiting: false,
            firstTry: true
        };

        const app = document.getElementById('app');

        function renderTopBar() {
            return `
                <div class="top-bar bg-purple-100 border-b-2 border-purple-300 text-slate-800 px-3 sm:px-5 py-2 sm:py-2.5 flex justify-between items-center font-bold text-sm sm:text-lg shadow-sm shrink-0">
                    <div class="flex items-center gap-2">
                        <button onclick="renderStartScreen()" class="top-badge bg-white/90 hover:bg-purple-200 border border-purple-300 px-2 py-0.5 rounded-lg text-sm sm:text-base transition active:scale-95" title="Pradžia">🏠</button>
                        <span class="flex items-center gap-1">⭐ <span class="text-purple-700 dark:text-amber-300 font-black">${state.score}</span></span>
                    </div>
                    <div class="top-badge bg-white/90 border border-purple-300 px-2.5 py-0.5 rounded-xl font-black text-purple-700 dark:text-amber-300">🎯 ${state.question} / ${state.maxQuestions}</div>
                    <div class="flex items-center gap-1">🔥 <span class="text-purple-700 dark:text-amber-300 font-black">${state.streak}</span></div>
                </div>
            `;
        }

        function renderStartScreen() {
            app.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-5 sm:p-8 text-center fade-in">
                    <div class="text-5xl sm:text-6xl mb-2 bounce">🔢</div>
                    <h1 class="text-main-title text-3xl sm:text-5xl font-black text-gray-800 mb-4 tracking-tight">${_col('Skaičių Eilutė')}</h1>
                    
                    <div class="flex flex-col gap-3 w-full max-w-md">
                        <button onclick="startGame('train')" class="btn-tinted w-full py-3.5 sm:py-4 px-4 rounded-2xl bg-purple-100 hover:bg-purple-200 text-slate-800 font-black text-lg sm:text-2xl shadow-lg transition transform active:scale-95 border-2 border-b-4 border-purple-400 flex items-center justify-center gap-2.5">
                            <span class="text-3xl">🚂</span>
                            <span>${_col('Traukinukas')}</span>
                        </button>
                        <button onclick="startGame('frog')" class="btn-tinted w-full py-3.5 sm:py-4 px-4 rounded-2xl bg-emerald-100 hover:bg-emerald-200 text-slate-800 font-black text-lg sm:text-2xl shadow-lg transition transform active:scale-95 border-2 border-b-4 border-emerald-400 flex items-center justify-center gap-2.5">
                            <span class="text-3xl">🐸</span>
                            <span>${_col('Varlytė')}</span>
                        </button>
                        <button onclick="startGame('neighbors')" class="btn-tinted w-full py-3.5 sm:py-4 px-4 rounded-2xl bg-amber-100 hover:bg-amber-200 text-slate-800 font-black text-lg sm:text-2xl shadow-lg transition transform active:scale-95 border-2 border-b-4 border-amber-400 flex items-center justify-center gap-2.5">
                            <span class="text-3xl">🏠</span>
                            <span>${_col('Kaimynai')}</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function startGame(mode) {
            initAudio();
            state.mode = mode;
            state.score = 0;
            state.streak = 0;
            state.question = 1;
            generateQuestion();
        }

        function generateQuestion() {
            state.waiting = false;
            state.firstTry = true;

            if (state.mode === 'train') {
                generateTrainQuestion();
            } else if (state.mode === 'frog') {
                generateFrogQuestion();
            } else {
                generateNeighborsQuestion();
            }
        }

        // === MODE 1: SKAIČIŲ TRAUKINUKAS ===
        function generateTrainQuestion() {
            const configs = [
                { step: 1, inc: true, maxStart: 15 },
                { step: 2, inc: true, maxStart: 12 },
                { step: 5, inc: true, maxStart: 25 },
                { step: 10, inc: true, maxStart: 50 },
                { step: 1, inc: false, minStart: 6, maxStart: 20 },
                { step: 2, inc: false, minStart: 10, maxStart: 20 }
            ];
            const cfg = configs[Math.floor(Math.random() * configs.length)];
            state.step = cfg.step;
            state.isIncreasing = cfg.inc;

            let startNum;
            if (cfg.step === 10) {
                startNum = (Math.floor(Math.random() * 5) + 1) * 10;
            } else if (cfg.step === 5) {
                startNum = (Math.floor(Math.random() * 6)) * 5;
            } else if (cfg.step === 2) {
                startNum = cfg.inc ? (Math.floor(Math.random() * 7) * 2) : (10 + Math.floor(Math.random() * 6) * 2);
            } else {
                startNum = cfg.inc ? Math.floor(Math.random() * 15) + 1 : Math.floor(Math.random() * 14) + 6;
            }

            const seq = [];
            for (let i = 0; i < 5; i++) {
                seq.push(cfg.inc ? startNum + i * cfg.step : startNum - i * cfg.step);
            }
            state.sequence = seq;
            state.missingIdx = Math.floor(Math.random() * 4) + 1; // index 1..4
            state.correctVal = seq[state.missingIdx];

            const opts = new Set([state.correctVal]);
            while (opts.size < 4) {
                const diff = (Math.floor(Math.random() * 3) + 1) * (Math.random() > 0.4 ? cfg.step : 1);
                const sign = Math.random() > 0.5 ? 1 : -1;
                const cand = state.correctVal + diff * sign;
                if (cand >= 0 && cand !== state.correctVal) {
                    opts.add(cand);
                }
            }
            state.options = Array.from(opts).sort(() => Math.random() - 0.5);
            renderTrainScreen();
        }

        function renderTrainScreen() {
            const carriageColors = [
                'bg-rose-100 border-rose-400 text-rose-900',
                'bg-amber-100 border-amber-400 text-amber-900',
                'bg-emerald-100 border-emerald-400 text-emerald-900',
                'bg-sky-100 border-sky-400 text-sky-900',
                'bg-purple-100 border-purple-400 text-purple-900'
            ];

            const trainHtml = state.sequence.map((num, idx) => {
                if (idx === state.missingIdx) {
                    return `
                        <div class="flex items-center">
                            <span class="text-slate-400 font-black text-xs sm:text-base mx-0.5">═</span>
                            <div id="missing-carriage" class="carriage bg-yellow-100 border-dashed border-amber-500 text-amber-600 animate-pulse">
                                ?
                            </div>
                        </div>
                    `;
                }
                return `
                    <div class="flex items-center">
                        <span class="text-slate-400 font-black text-xs sm:text-base mx-0.5">═</span>
                        <div class="carriage ${carriageColors[idx % carriageColors.length]}">
                            ${num}
                        </div>
                    </div>
                `;
            }).join('');

            const ruleHint = state.isIncreasing
                ? `📈 ${_col('Skaičiuojame po')} +${state.step} ${_col('į priekį')}`
                : `📉 ${_col('Skaičiuojame po')} -${state.step} ${_col('atgal')}`;

            const optionsHtml = state.options.map((opt, idx) => `
                <button id="btn-${idx}" onclick="checkTrainAnswer(${idx}, ${opt})" class="opt-btn py-3 sm:py-4 rounded-2xl font-black text-2xl sm:text-4xl shadow-md border-b-4 transition transform active:scale-95">
                    ${opt}
                </button>
            `).join('');

            app.innerHTML = `
                ${renderTopBar()}
                <div class="flex-1 flex flex-col justify-between p-3 sm:p-5 fade-in overflow-hidden">
                    <div class="text-center flex items-center justify-center gap-2">
                        <span class="text-3xl">🚂</span>
                        <span class="text-2xl sm:text-3xl font-black">❓</span>
                        <span class="inline-block px-3 py-1 rounded-full bg-purple-100 text-purple-900 font-extrabold text-sm sm:text-base border border-purple-300">
                            ${state.isIncreasing ? '+' : '-'}${state.step}
                        </span>
                    </div>

                    <div id="train-container" class="panel-box p-3 sm:p-5 rounded-2xl flex items-center justify-center overflow-x-auto">
                        <div class="text-3xl sm:text-5xl mr-0.5 mb-2 shrink-0">🚂</div>
                        ${trainHtml}
                    </div>

                    <div id="feedback" class="h-6 sm:h-8 flex items-center justify-center font-black text-base sm:text-xl opacity-0 transition-opacity"></div>

                    <div class="grid grid-cols-2 gap-2.5 sm:gap-3.5">
                        ${optionsHtml}
                    </div>
                </div>
            `;
        }

        function checkTrainAnswer(idx, val) {
            if (state.waiting) return;
            const btn = document.getElementById(`btn-${idx}`);
            const feedback = document.getElementById('feedback');
            const missingCarriage = document.getElementById('missing-carriage');
            const trainContainer = document.getElementById('train-container');

            if (val === state.correctVal) {
                state.waiting = true;
                playSound('correct');
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }
                btn.className = "py-3 sm:py-4 bg-green-500 text-white rounded-2xl font-black text-2xl sm:text-4xl shadow-md border-b-4 border-green-700 bounce";
                if (missingCarriage) {
                    missingCarriage.textContent = val;
                    missingCarriage.className = "carriage bg-green-500 border-green-700 text-white bounce";
                }
                feedback.innerHTML = `${_col('Teisingai! Traukinukas važiuoja toliau!')} 🚂🎉`;
                feedback.className = "h-6 sm:h-8 flex items-center justify-center font-black text-base sm:text-xl text-green-500 opacity-100";

                setTimeout(() => {
                    if (state.question >= state.maxQuestions) {
                        renderEndScreen();
                    } else {
                        state.question++;
                        generateQuestion();
                    }
                }, 1150);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playSound('wrong');
                btn.disabled = true;
                btn.className = "py-3 sm:py-4 bg-red-100 text-red-400 border-red-200 border-2 rounded-2xl font-bold text-2xl sm:text-4xl line-through opacity-60 cursor-not-allowed shake";
                feedback.innerHTML = `${_col('Bandyk dar kartą!')} 🤔`;
                feedback.className = "h-6 sm:h-8 flex items-center justify-center font-black text-base sm:text-xl text-red-500 opacity-100";
                trainContainer.classList.remove('shake');
                void trainContainer.offsetWidth;
                trainContainer.classList.add('shake');
            }
        }

        // === MODE 2: VARLYTĖS ŠUOLIAI ===
        function generateFrogQuestion() {
            const goForward = Math.random() > 0.4;
            if (goForward) {
                state.frogStart = Math.floor(Math.random() * 7); // 0..6
                const maxJump = Math.min(5, 10 - state.frogStart);
                state.frogDelta = Math.floor(Math.random() * maxJump) + 1;
                state.frogTarget = state.frogStart + state.frogDelta;
            } else {
                state.frogStart = Math.floor(Math.random() * 7) + 4; // 4..10
                const maxBack = Math.min(5, state.frogStart);
                state.frogDelta = -(Math.floor(Math.random() * maxBack) + 1);
                state.frogTarget = state.frogStart + state.frogDelta;
            }
            state.frogPos = state.frogStart;
            renderFrogScreen();
        }

        function renderFrogScreen() {
            const dirText = state.frogDelta > 0
                ? `+${state.frogDelta} ${_col('į priekį')} ➡️`
                : `${state.frogDelta} ${_col('atgal')} ⬅️`;

            let lilyPadsHtml = '';
            for (let i = 0; i <= 10; i++) {
                const isFrogHere = (i === state.frogPos);
                const isStart = (i === state.frogStart);
                lilyPadsHtml += `
                    <button id="lily-${i}" onclick="onLilyPadClick(${i})" class="lily-pad ${isStart ? 'ring-4 ring-yellow-400' : ''}">
                        <span id="frog-icon-${i}" class="text-lg sm:text-2xl leading-none ${isFrogHere ? 'block frog-hop' : 'hidden'}">🐸</span>
                        <span class="${isFrogHere ? 'text-xs sm:text-sm' : ''}">${i}</span>
                    </button>
                `;
            }

            app.innerHTML = `
                ${renderTopBar()}
                <div class="flex-1 flex flex-col justify-between p-3 sm:p-5 fade-in overflow-hidden">
                    <div class="panel-box p-3 rounded-2xl text-center shadow-sm">
                        <div class="text-xl sm:text-3xl font-black text-main-title flex items-center justify-center gap-2">
                            <span>🐸</span>
                            <span>${state.frogStart} ${state.frogDelta > 0 ? '+' : ''}${state.frogDelta} = <span class="text-emerald-600">❓</span></span>
                        </div>
                    </div>

                    <!-- Pond with Number Line of Lily Pads -->
                    <div id="pond-container" class="pond-box bg-sky-100 border-4 border-sky-300 rounded-3xl p-3 sm:p-5 flex flex-col items-center justify-center shadow-inner">
                        <div class="flex flex-wrap sm:flex-nowrap items-center justify-center gap-1 sm:gap-1.5 w-full">
                            ${lilyPadsHtml}
                        </div>
                    </div>

                    <div id="feedback" class="h-7 sm:h-8 flex items-center justify-center font-black text-base sm:text-xl opacity-0 transition-opacity"></div>
                </div>
            `;
        }

        function onLilyPadClick(padNum) {
            if (state.waiting) return;
            const feedback = document.getElementById('feedback');
            const pond = document.getElementById('pond-container');
            const clickedPad = document.getElementById(`lily-${padNum}`);

            if (padNum === state.frogTarget) {
                state.waiting = true;
                state.frogPos = padNum;
                playSound('hop');
                setTimeout(() => playSound('correct'), 160);

                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }

                // Move frog to target pad with hop animation
                for (let i = 0; i <= 10; i++) {
                    const icon = document.getElementById(`frog-icon-${i}`);
                    if (icon) {
                        if (i === padNum) {
                            icon.className = "text-lg sm:text-2xl leading-none block frog-hop";
                        } else {
                            icon.className = "hidden";
                        }
                    }
                }
                if (clickedPad) {
                    clickedPad.classList.add('ring-4', 'ring-green-400', 'bounce');
                }

                feedback.innerHTML = `${_col('Kva kva! Puikus šuolis ant')} ${padNum}! 🐸🎉`;
                feedback.className = "h-7 sm:h-8 flex items-center justify-center font-black text-base sm:text-xl text-green-500 opacity-100";

                setTimeout(() => {
                    if (state.question >= state.maxQuestions) {
                        renderEndScreen();
                    } else {
                        state.question++;
                        generateQuestion();
                    }
                }, 1200);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playSound('wrong');
                if (clickedPad) {
                    clickedPad.classList.add('opacity-50', 'shake');
                }
                const hint = state.frogDelta > 0
                    ? `Skaičiuok nuo ${state.frogStart} į dešinę po vieną lapelį!`
                    : `Skaičiuok nuo ${state.frogStart} į kairę atgal!`;
                feedback.innerHTML = `${_col(hint)} 🤔`;
                feedback.className = "h-7 sm:h-8 flex items-center justify-center font-black text-xs sm:text-base text-red-500 opacity-100";
                pond.classList.remove('shake');
                void pond.offsetWidth;
                pond.classList.add('shake');
            }
        }

        // === MODE 3: SKAIČIAUS KAIMYNAI (PRIEŠ IR PO) ===
        function generateNeighborsQuestion() {
            state.centerNum = Math.floor(Math.random() * 19) + 1; // 1..19 so neighbors are 0..20
            state.leftVal = null;
            state.rightVal = null;
            state.activeSide = 'left';

            const leftAns = state.centerNum - 1;
            const rightAns = state.centerNum + 1;
            const opts = new Set([leftAns, rightAns]);
            while (opts.size < 6) {
                const cand = Math.max(0, state.centerNum + Math.floor(Math.random() * 9) - 4);
                if (cand !== state.centerNum) {
                    opts.add(cand);
                }
            }
            state.options = Array.from(opts).sort(() => Math.random() - 0.5);
            renderNeighborsScreen();
        }

        function selectNeighborHouse(side) {
            if (state.waiting) return;
            state.activeSide = side;
            playSound('hop');
            updateNeighborsUI();
        }

        function renderNeighborsScreen() {
            const tilesHtml = state.options.map((num, idx) => `
                <button id="tile-${idx}" onclick="onNeighborTileClick(${num}, ${idx})" class="opt-btn py-3 sm:py-3.5 rounded-2xl font-black text-2xl sm:text-3xl shadow-md border-b-4 transition transform active:scale-95">
                    ${num}
                </button>
            `).join('');

            app.innerHTML = `
                ${renderTopBar()}
                <div class="flex-1 flex flex-col justify-between p-3 sm:p-5 fade-in overflow-hidden">
                    <div class="text-center">
                        <div class="text-xl sm:text-2xl font-black text-main-title flex items-center justify-center gap-2">
                            <span>🏡</span>
                            <span>⬅️ ❓ ${state.centerNum} ❓ ➡️</span>
                        </div>
                    </div>

                    <!-- 3 Little Houses -->
                    <div id="houses-container" class="flex items-end justify-center gap-3 sm:gap-6 my-1">
                        <!-- Left Neighbor House -->
                        <div onclick="selectNeighborHouse('left')" class="house-card cursor-pointer">
                            <span class="text-base sm:text-lg font-black mb-0.5">⬅️</span>
                            <div class="house-roof"></div>
                            <div id="house-left" class="house-body">?</div>
                        </div>

                        <!-- Center Number House -->
                        <div class="house-card">
                            <span class="text-base sm:text-lg font-black mb-0.5">🏡</span>
                            <div class="house-roof" style="border-bottom-color: #7c3aed;"></div>
                            <div class="house-body bg-purple-600 border-purple-800 text-white">
                                ${state.centerNum}
                            </div>
                        </div>

                        <!-- Right Neighbor House -->
                        <div onclick="selectNeighborHouse('right')" class="house-card cursor-pointer">
                            <span class="text-base sm:text-lg font-black mb-0.5">➡️</span>
                            <div class="house-roof"></div>
                            <div id="house-right" class="house-body">?</div>
                        </div>
                    </div>

                    <div id="feedback" class="h-6 sm:h-7 flex items-center justify-center font-black text-sm sm:text-lg opacity-0 transition-opacity"></div>

                    <!-- 6 Number Tiles -->
                    <div class="grid grid-cols-3 gap-2 sm:gap-3">
                        ${tilesHtml}
                    </div>
                </div>
            `;
            updateNeighborsUI();
        }

        function updateNeighborsUI() {
            const leftEl = document.getElementById('house-left');
            const rightEl = document.getElementById('house-right');
            if (!leftEl || !rightEl) return;

            if (state.leftVal !== null) {
                leftEl.textContent = state.leftVal;
                leftEl.className = "house-body bg-green-500 border-green-700 text-white bounce";
            } else {
                leftEl.textContent = '?';
                leftEl.className = `house-body ${state.activeSide === 'left' ? 'bg-amber-100 border-amber-500 text-amber-800 ring-4 ring-amber-300' : 'bg-slate-100 border-slate-300 text-slate-500'}`;
            }

            if (state.rightVal !== null) {
                rightEl.textContent = state.rightVal;
                rightEl.className = "house-body bg-green-500 border-green-700 text-white bounce";
            } else {
                rightEl.textContent = '?';
                rightEl.className = `house-body ${state.activeSide === 'right' ? 'bg-amber-100 border-amber-500 text-amber-800 ring-4 ring-amber-300' : 'bg-slate-100 border-slate-300 text-slate-500'}`;
            }
        }

        function onNeighborTileClick(num, idx) {
            if (state.waiting) return;
            const leftTarget = state.centerNum - 1;
            const rightTarget = state.centerNum + 1;
            const tileBtn = document.getElementById(`tile-${idx}`);
            const feedback = document.getElementById('feedback');
            const housesContainer = document.getElementById('houses-container');

            // Allow smart placement into matching neighbor house if empty
            if (num === leftTarget && state.leftVal === null) {
                state.leftVal = num;
                if (state.rightVal === null) state.activeSide = 'right';
                if (tileBtn) {
                    tileBtn.disabled = true;
                    tileBtn.className = "py-3 sm:py-3.5 bg-green-500 text-white rounded-2xl font-black text-2xl sm:text-3xl shadow-md border-b-4 border-green-700 opacity-80";
                }
                playSound('hop');
                updateNeighborsUI();
            } else if (num === rightTarget && state.rightVal === null) {
                state.rightVal = num;
                if (state.leftVal === null) state.activeSide = 'left';
                if (tileBtn) {
                    tileBtn.disabled = true;
                    tileBtn.className = "py-3 sm:py-3.5 bg-green-500 text-white rounded-2xl font-black text-2xl sm:text-3xl shadow-md border-b-4 border-green-700 opacity-80";
                }
                playSound('hop');
                updateNeighborsUI();
            } else {
                state.firstTry = false;
                state.streak = 0;
                playSound('wrong');
                if (tileBtn) {
                    tileBtn.disabled = true;
                    tileBtn.className = "py-3 sm:py-3.5 bg-red-100 text-red-400 border-red-200 border-2 rounded-2xl font-bold text-2xl sm:text-3xl line-through opacity-50 cursor-not-allowed shake";
                }
                feedback.innerHTML = `${_col('Pagalvok: kas eina prieš ir po')} ${state.centerNum}? 🤔`;
                feedback.className = "h-6 sm:h-7 flex items-center justify-center font-black text-xs sm:text-base text-red-500 opacity-100";
                housesContainer.classList.remove('shake');
                void housesContainer.offsetWidth;
                housesContainer.classList.add('shake');
                return;
            }

            // Check if both neighbors are now filled
            if (state.leftVal === leftTarget && state.rightVal === rightTarget) {
                state.waiting = true;
                playSound('correct');
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }
                feedback.innerHTML = `${_col('Puiku! Abu kaimynai surasti!')} 🏠🎉`;
                feedback.className = "h-6 sm:h-7 flex items-center justify-center font-black text-base sm:text-xl text-green-500 opacity-100";

                setTimeout(() => {
                    if (state.question >= state.maxQuestions) {
                        renderEndScreen();
                    } else {
                        state.question++;
                        generateQuestion();
                    }
                }, 1150);
            }
        }

        function renderEndScreen() {
            playSound('win');

            let stars = 1;
            if (state.score >= 8) stars = 3;
            else if (state.score >= 5) stars = 2;

            const starHtml = Array(3).fill(0).map((_, i) =>
                `<span class="text-5xl sm:text-6xl ${i < stars ? 'text-yellow-400 bounce' : 'text-gray-400 opacity-40'} drop-shadow-md" style="animation-delay: ${i * 0.2}s">⭐</span>`
            ).join('');

            let message = "Neblogai! Pasitreniruok dar!";
            if (stars === 3) message = "Tobula! Tu tikras skaičių meistras!";
            else if (stars === 2) message = "Labai geras rezultatas!";

            app.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-6 sm:p-8 text-center fade-in">
                    <h2 class="text-main-title text-3xl sm:text-4xl font-black text-gray-800 mb-4">${_col('Žaidimas baigtas!')}</h2>
                    
                    <div class="flex justify-center gap-2 mb-4">
                        ${starHtml}
                    </div>
                    
                    <p class="text-sub-title text-xl sm:text-2xl font-bold text-gray-700 mb-2">${_col(message)} 🏆</p>
                    <p class="text-sub-title text-lg sm:text-xl text-gray-600 mb-8">${_col('Surinkai:')} <span class="font-black text-green-500">${state.score} / ${state.maxQuestions}</span></p>
                    
                    <button onclick="renderStartScreen()" class="btn-tinted w-full max-w-xs py-4 rounded-2xl bg-blue-100 hover:bg-blue-200 text-slate-800 font-black text-xl sm:text-2xl shadow-lg transition transform active:scale-95 border-2 border-b-4 border-blue-400">
                        🔄 ${_col('Dar kartą')}
                    </button>
                </div>
            `;
        }

        // Initialize
        renderStartScreen();
    </script>
</body>
</html>
