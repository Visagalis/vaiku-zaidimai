<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <!-- PWA Nustatymai -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Žodžiai">
    
    <!-- Integruota Ikona (SVG Data URI) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦉</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22 style=%22background-color: %230f172a;%22><rect width=%22100%22 height=%22100%22 fill=%22%230f172a%22/><text x=%2250%25%22 y=%2255%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%2270%22>🦉</text></svg>">

    <!-- Integruotas Manifestas (Data URI) -->
    <link rel="manifest" href='data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%C5%BDod%C5%BEi%C5%B3%20D%C4%97lion%C4%97%20Vaikams%22%2C%22short_name%22%3A%22%C5%BDod%C5%BEiai%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%230f172a%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%A6%89%3C%2Ftext%3E%3C%2Fsvg%3E%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D'>

    <title>Žodžių Dėlionė</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/common.css">
    <script src="../shared/common.js"></script>
    <style>
        :root {
            --bg-color: #fdfcf0;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #64748b;
            --border-color: #fef08a;
            --pool-bg: #fffbeb;
            --overlay-bg: #ffffff;
        }

        body:not(.dark-mode) {
            --sc-0: #dc2626;
            --sc-1: #1d4ed8;
            --sc-2: #15803d;
            --sc-3: #c2410c;
            --sc-4: #7e22ce;
            --sc-5: #be185d;
        }

        .dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --pool-bg: #0f172a;
            --overlay-bg: #0f172a;
        }

        body:not(.dark-mode) .letter-tile:not(.slot-locked):not(.pool-btn-disabled):not(.bg-rose-500) {
            background-color: #ffffff !important;
            border-color: #e2e8f0 !important;
        }

        .dark-mode .letter-tile:not(.slot-locked):not(.pool-btn-disabled):not(.bg-rose-500) {
            background-color: #1e293b !important;
            border-color: #334155 !important;
        }

        .dark-mode #letters-pool .letter-tile:not(.pool-btn-disabled) {
            background-color: #334155 !important;
            border-color: #0f172a !important;
        }

        .dark-mode #end-screen .bg-yellow-100 {
            background-color: rgba(113, 63, 18, 0.35) !important;
        }

        body:not(.dark-mode) #end-screen .bg-yellow-100 {
            background-color: #fef9c3 !important;
            color: #1f2937 !important;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
            user-select: none; /* Prevent text selection for app-like feel */
        }

        .fullscreen-overlay {
            background-color: var(--overlay-bg);
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .main-card {
            background-color: var(--card-bg);
            transition: background-color 0.3s ease;
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        @media (min-width: 768px) {
            .main-card {
                height: 100%;
                min-height: 100vh;
                min-height: 100dvh;
                border-width: 8px;
                border-radius: 3rem;
                margin: 0;
                max-height: none;
                padding-top: 0;
                padding-bottom: 0;
            }
        }

        .slot-locked {
            background-color: #ecfdf5 !important;
            border-color: #10b981 !important;
            transform: scale(1.04);
            pointer-events: none;
            box-shadow: 0 3px 0 #059669;
        }

        .dark-mode .slot-locked {
            background-color: #064e3b !important;
            border-color: #10b981 !important;
            box-shadow: 0 3px 0 #047857;
        }

        .slot-active {
            border-color: #f59e0b !important;
            background-color: rgba(254, 243, 199, 0.7) !important;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.45);
            transform: scale(1.04);
        }

        .dark-mode .slot-active {
            border-color: #f59e0b !important;
            background-color: rgba(120, 53, 15, 0.35) !important;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.4);
            transform: scale(1.04);
        }

        .letter-tile {
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .pool-btn-disabled {
            background-color: #e2e8f0 !important;
            color: #94a3b8 !important;
            border-color: #cbd5e1 !important;
            pointer-events: none;
            box-shadow: none !important;
            transform: scale(0.92) !important;
            opacity: 0.25;
        }

        .dark-mode .pool-btn-disabled {
            background-color: #334155 !important;
            color: #475569 !important;
            border-color: #1e293b !important;
        }
        
        .star-gold { color: #fbbf24; text-shadow: 0 0 8px rgba(251, 191, 36, 0.4); }
        .star-lost { color: #94a3b8; opacity: 0.2; }
    </style>
</head>
<body class="dark-mode">

    <div id="main-app" class="main-card max-w-4xl relative overflow-hidden border-0 md:border-8" style="border-color: var(--border-color)">
        
        <!-- Header -->
        <div id="header-ui" class="flex justify-between items-center px-3 sm:px-4 py-2 sm:py-2.5 z-20 hidden w-full flex-shrink-0 border-b border-black/10 dark:border-white/10 bg-black/5 dark:bg-white/5">
            <div class="flex gap-1.5 sm:gap-2">
                <button onclick="location.reload()" class="bg-white dark:bg-slate-700 border-2 border-slate-300 dark:border-slate-600 px-2.5 py-1.5 rounded-xl font-bold hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors text-sm shadow-sm active:scale-95" title="Pradžia">
                    🏠
                </button>
                <button onclick="toggleDarkMode()" id="dark-toggle" class="bg-indigo-600 text-white border-2 border-indigo-400 px-2.5 sm:px-3 py-1.5 rounded-xl font-bold hover:bg-indigo-500 transition-colors text-xs shadow-sm active:scale-95">
                    ☀️ Diena
                </button>
                <button onclick="toggleStats()" class="bg-white dark:bg-slate-700 border-2 border-yellow-300 px-2.5 sm:px-3 py-1.5 rounded-xl font-bold text-yellow-700 dark:text-yellow-400 hover:bg-yellow-50 dark:hover:bg-slate-600 transition-colors text-xs shadow-sm active:scale-95" title="Pasiekimai">
                    📊
                </button>
            </div>
            <div class="flex gap-2 sm:gap-3 items-center">
                <div class="flex items-center gap-1">
                    <span class="text-base sm:text-lg">⭐</span>
                    <span id="total-stars-display" class="text-base sm:text-lg font-black text-yellow-500">0</span>
                </div>
                <div class="bg-yellow-400 text-slate-900 px-2.5 py-1 rounded-xl text-xs sm:text-sm font-black shadow-sm">
                    🎯 <span id="current-word-num">1</span> / <span id="max-words-num">10</span>
                </div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="fullscreen-overlay absolute inset-0 z-[110] flex flex-col items-center justify-center p-4 text-center overflow-y-auto">
            <div class="text-6xl sm:text-7xl md:text-8xl mb-2 mt-auto md:mt-0 select-none">🦉</div>
            <h1 class="text-3xl sm:text-5xl md:text-6xl font-black mb-1 tracking-tight">
                🧩 <span>Raidžių Dėlionė</span>
            </h1>
            <p class="text-sm sm:text-base font-bold text-slate-500 dark:text-slate-400 mb-5 sm:mb-6">
                Sudėliok žodžius iš sumaišytų raidžių!
            </p>
            
            <div class="grid grid-cols-2 gap-2.5 sm:gap-3.5 w-full max-w-sm sm:max-w-md mb-6">
                <button onclick="startGame(5)" class="py-3 sm:py-3.5 px-3 rounded-2xl bg-sky-500 hover:bg-sky-600 text-white font-black text-base sm:text-xl shadow-md border-b-4 border-sky-700 transition transform active:scale-95 flex flex-col items-center justify-center">
                    <span>🌱 5 žodžiai</span>
                    <span class="text-xs font-semibold opacity-85">Greitas</span>
                </button>
                <button onclick="startGame(10)" class="py-3 sm:py-3.5 px-3 rounded-2xl bg-amber-500 hover:bg-amber-600 text-white font-black text-base sm:text-xl shadow-md border-b-4 border-amber-700 transition transform active:scale-95 flex flex-col items-center justify-center">
                    <span>⭐ 10 žodžių</span>
                    <span class="text-xs font-semibold opacity-85">Klasikinis</span>
                </button>
                <button onclick="startGame(20)" class="py-3 sm:py-3.5 px-3 rounded-2xl bg-purple-500 hover:bg-purple-600 text-white font-black text-base sm:text-xl shadow-md border-b-4 border-purple-700 transition transform active:scale-95 flex flex-col items-center justify-center">
                    <span>🏆 20 žodžių</span>
                    <span class="text-xs font-semibold opacity-85">Ilgas</span>
                </button>
                <button onclick="startGame(30)" class="py-3 sm:py-3.5 px-3 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white font-black text-base sm:text-xl shadow-md border-b-4 border-emerald-700 transition transform active:scale-95 flex flex-col items-center justify-center">
                    <span>🌟 Visi (30)</span>
                    <span class="text-xs font-semibold opacity-85">Meistras</span>
                </button>
            </div>

            <!-- Install App Button (Hidden by default) -->
            <button id="pwa-install-btn" class="hidden mb-auto md:mb-0 bg-slate-800 dark:bg-slate-700 text-white font-bold py-2.5 px-5 rounded-xl shadow-md border border-slate-600 flex items-center gap-2 hover:bg-slate-700 transition-all text-sm">
                📲 Įdiegti programėlę
            </button>
        </div>

        <!-- Game View -->
        <div id="game-view" class="flex-1 flex flex-col items-center justify-between p-2 sm:p-4 hidden w-full overflow-hidden">
            
            <div class="flex-1 flex flex-col items-center justify-center w-full min-h-0 py-1">
                <div id="emoji-box" class="text-6xl sm:text-7xl md:text-8xl select-none drop-shadow-xl transition-all duration-300 cursor-default text-center leading-tight mb-1">
                    🌙
                </div>

                <div id="current-word-stars-ui" class="flex flex-wrap justify-center gap-1 sm:gap-1.5 text-xl sm:text-2xl md:text-3xl px-2">
                    <!-- Stars -->
                </div>
            </div>

            <div class="w-full flex flex-col items-center justify-end shrink-0 gap-2 sm:gap-3.5 pb-1 sm:pb-3 max-w-lg">
                <div id="word-slots" class="flex flex-wrap justify-center items-center gap-1.5 sm:gap-2.5 w-full px-1 min-h-[48px] sm:min-h-[58px]">
                    <!-- Slots -->
                </div>

                <div class="w-full p-2.5 sm:p-4 rounded-3xl border-2 border-dashed border-amber-300 dark:border-slate-600 bg-amber-50/60 dark:bg-slate-900/60 shadow-inner flex flex-col items-center justify-center">
                    <div id="letters-pool" class="flex flex-wrap justify-center items-center gap-2 sm:gap-3 w-full min-h-[48px] sm:min-h-[58px]">
                        <!-- Letters -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Success Overlay -->
        <div id="success-overlay" class="fullscreen-overlay hidden absolute inset-0 z-[120] flex flex-col items-center justify-center p-4 text-center overflow-y-auto">
            <div id="success-emoji-large" class="text-6xl sm:text-7xl md:text-8xl mb-2 pop-in drop-shadow-2xl">🌟</div>
            <h3 class="text-2xl sm:text-4xl md:text-5xl font-black text-emerald-500 mb-2 uppercase italic">🎉 Puiku!</h3>
            
            <div id="success-stars-container" class="flex flex-wrap justify-center gap-1.5 sm:gap-2 mb-4 text-3xl sm:text-4xl md:text-5xl max-w-full">
                <!-- Stars -->
            </div>
            
            <div class="mb-6 w-full px-4">
                <span id="success-word-text" class="text-3xl sm:text-5xl md:text-7xl font-black uppercase tracking-wide break-words leading-none"></span>
            </div>
            <button onclick="loadNextWord()" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xl sm:text-3xl font-black py-3 sm:py-4 px-8 sm:px-12 rounded-2xl sm:rounded-3xl shadow-xl transition-all transform hover:scale-105 active:scale-95 border-b-4 sm:border-b-8 border-emerald-700 flex items-center justify-center gap-2">
                <span>Toliau</span> <span>➔</span>
            </button>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="fullscreen-overlay hidden absolute inset-0 z-[130] flex flex-col items-center justify-center p-4 text-center overflow-y-auto">
            <div class="text-6xl sm:text-8xl mb-2">🏆</div>
            <h2 class="text-3xl sm:text-5xl font-black mb-3 uppercase italic">🎉 Šaunuolis!</h2>
            
            <div class="bg-yellow-100 dark:bg-yellow-900/30 p-4 sm:p-6 rounded-3xl mb-5 border-4 border-yellow-400 w-full max-w-sm sm:max-w-md">
                <p class="text-3xl sm:text-5xl font-black text-yellow-500">
                    ⭐ <span id="final-stars-earned">0</span> / <span id="final-stars-possible">0</span>
                </p>
            </div>

            <div class="flex flex-col gap-2.5 sm:gap-3 w-full max-w-xs sm:max-w-sm">
                <button id="retry-mistakes-btn" onclick="retryMistakes()" class="hidden bg-orange-500 hover:bg-orange-600 text-white text-lg sm:text-xl font-black py-3 sm:py-3.5 px-6 rounded-2xl shadow-lg active:scale-95 border-b-4 border-orange-700">
                    🛠️ Pataisyti klaidas
                </button>
                
                <button onclick="location.reload()" class="bg-sky-500 hover:bg-sky-600 text-white text-lg sm:text-xl font-black py-3 sm:py-3.5 px-6 rounded-2xl shadow-lg active:scale-95 border-b-4 border-sky-700">
                    🔄 Dar kartą
                </button>
            </div>
        </div>
        
        <!-- Stats Modal -->
        <div id="stats-view" class="fullscreen-overlay hidden absolute inset-0 z-[140] flex flex-col">
            <div class="p-4 flex justify-between items-center flex-shrink-0 pt-12 md:pt-4 border-b border-black/5 dark:border-white/5">
                <h2 class="text-lg font-black uppercase italic">Mano pasiekimai</h2>
                <button onclick="toggleStats()" class="bg-slate-700 text-white font-bold px-4 py-2 rounded-xl text-xs">Uždaryti</button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 custom-scroll">
                <table class="w-full text-left">
                    <tbody id="stats-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- PWA INSTALL LOGIC ---
        let deferredPrompt;
        const pwaBtn = document.getElementById('pwa-install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            pwaBtn.classList.remove('hidden');
        });

        pwaBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    deferredPrompt = null;
                    pwaBtn.classList.add('hidden');
                }
            }
        });

        const wordsData = [
            { word: 'KATĖ', emoji: '🐱' }, 
            { word: 'ŠUO', emoji: '🐶' },
            { word: 'NAMAS', emoji: '🏠' }, 
            { word: 'GĖLĖ', emoji: '🌸' },
            { word: 'MEDIS', emoji: '🌳' }, 
            { word: 'SAULĖ', emoji: '☀️' },
            { word: 'RATAS', emoji: '🛞' }, 
            { word: 'BATAI', emoji: '👟👟' }, 
            { word: 'MORKA', emoji: '🥕' }, 
            { word: 'PELĖ', emoji: '🐭' },
            { word: 'BITĖ', emoji: '🐝' }, 
            { word: 'KNYGA', emoji: '📖' },
            { word: 'VARLĖ', emoji: '🐸' }, 
            { word: 'LEDAI', emoji: '🍦🍦' }, 
            { word: 'SŪRIS', emoji: '🧀' }, 
            { word: 'ŽUVIS', emoji: '🐟' },
            { word: 'LOVA', emoji: '🛏️' },
            { word: 'KĖDĖ', emoji: '🪑' },
            { word: 'DUONA', emoji: '🍞' }, 
            { word: 'PIENAS', emoji: '🥛' },
            { word: 'OBUOLYS', emoji: '🍎' }, 
            { word: 'VIŠTA', emoji: '🐔' },
            { word: 'BRAŠKĖ', emoji: '🍓' }, 
            { word: 'KELIAS', emoji: '🛣️' },
            { word: 'MIŠKAS', emoji: '🌲🌳' }, 
            { word: 'SNIEGAS', emoji: '🌨️' },
            { word: 'JŪRA', emoji: '🌊' }, 
            { word: 'KRIAUŠĖ', emoji: '🍐' },
            { word: 'LAPĖ', emoji: '🦊' }, 
            { word: 'MEŠKA', emoji: '🐻' }
        ];

        let gameWords = [];
        let currentIndex = 0;
        let totalStarsEarned = 0;
        let totalPossibleStars = 0; 
        let currentWordObj = null;
        let userProgress = []; 
        let lockedSlots = [];
        let currentPool = []; 
        let wordMistakes = {};
        let isDarkMode = true;
        let maxWordsCount = 10;
        let currentWordStarPotential = 0;
        let isRetryMode = false;

        const slotsEl = document.getElementById('word-slots');
        const poolEl = document.getElementById('letters-pool');
        const emojiEl = document.getElementById('emoji-box');
        const overlay = document.getElementById('success-overlay');
        const successWordText = document.getElementById('success-word-text');
        const successEmojiLarge = document.getElementById('success-emoji-large');
        const starTotalDisplay = document.getElementById('total-stars-display');
        const currentWordNumEl = document.getElementById('current-word-num');
        const maxWordsNumEl = document.getElementById('max-words-num');
        const starPotentialUI = document.getElementById('current-word-stars-ui');
        const retryBtn = document.getElementById('retry-mistakes-btn');

        function toggleDarkMode() {
            const currentlyDark = isDarkMode();
            const nextMode = currentlyDark ? 'light' : 'dark';
            setThemeMode(nextMode);
            applyTheme(nextMode);
            updateThemeUI();
        }

        function updateThemeUI() {
            const dark = isDarkMode();
            document.body.classList.toggle('dark-mode', dark);
            document.body.classList.toggle('light-mode', !dark);
            const btn = document.getElementById('dark-toggle');
            if (btn) {
                btn.innerHTML = dark ? '☀️ Diena' : '🌙 Naktis';
                btn.className = dark
                    ? 'bg-indigo-600 text-white border-2 border-indigo-400 px-2.5 sm:px-3 py-1.5 rounded-xl font-bold hover:bg-indigo-500 transition-colors text-xs shadow-sm active:scale-95'
                    : 'bg-slate-800 text-white border-2 border-slate-600 px-2.5 sm:px-3 py-1.5 rounded-xl font-bold hover:bg-slate-700 text-xs shadow-sm active:scale-95';
            }
        }

        function startGame(count) {
            getAudioCtx();
            isRetryMode = false;
            maxWordsCount = Math.min(count, wordsData.length);
            gameWords = shuffle([...wordsData]).slice(0, maxWordsCount);
            wordMistakes = {}; 
            
            totalPossibleStars = gameWords.reduce((acc, obj) => acc + obj.word.length, 0);
            totalStarsEarned = 0;
            
            currentIndex = 0;
            updateStarDisplay();
            maxWordsNumEl.textContent = maxWordsCount;
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('header-ui').classList.remove('hidden');
            document.getElementById('header-ui').classList.add('flex');
            document.getElementById('game-view').classList.remove('hidden');
            document.getElementById('game-view').classList.add('flex');
            
            loadWord();
        }

        function updateStarDisplay() {
            starTotalDisplay.textContent = totalStarsEarned;
        }

        function retryMistakes() {
            isRetryMode = true;
            const imperfects = gameWords.filter(w => (wordMistakes[w.word] || 0) > 0);
            
            imperfects.forEach(w => {
                const mistakes = wordMistakes[w.word];
                const length = w.word.length;
                const earnedForThis = Math.max(1, length - mistakes);
                totalStarsEarned -= earnedForThis;
            });
            updateStarDisplay();

            gameWords = shuffle([...imperfects]);
            gameWords.forEach(w => wordMistakes[w.word] = 0);
            
            currentIndex = 0;
            document.getElementById('end-screen').classList.add('hidden');
            loadWord();
        }

        function loadWord() {
            currentWordObj = gameWords[currentIndex];
            const word = currentWordObj.word;
            userProgress = Array(word.length).fill(null);
            lockedSlots = Array(word.length).fill(false);
            
            currentWordStarPotential = word.length;
            
            const letterColors = getWordLetterColors(word);
            currentPool = word.split('').map((char, index) => ({
                char: char,
                id: index,
                color: letterColors[index],
                used: false
            }));

            // Svarbu: shuffle grąžina NAUJĄ masyvą, todėl priskiriame atgal!
            let shuffled = shuffle(currentPool);
            if (word.length > 1) {
                let attempts = 0;
                while (attempts < 12 && shuffled.every((item, idx) => item.char === word[idx])) {
                    shuffled = shuffle(currentPool);
                    attempts++;
                }
                // Jei po atsitiktinio maišymo raidės vis dar sutaptų su originalu, sukeičiame elementus
                if (shuffled.every((item, idx) => item.char === word[idx])) {
                    for (let i = 0; i < shuffled.length - 1; i++) {
                        if (shuffled[i].char !== shuffled[i + 1].char) {
                            const tmp = shuffled[i];
                            shuffled[i] = shuffled[i + 1];
                            shuffled[i + 1] = tmp;
                            break;
                        }
                    }
                }
            }
            currentPool = shuffled;

            if (!wordMistakes[word]) wordMistakes[word] = 0;

            emojiEl.textContent = currentWordObj.emoji;
            currentWordNumEl.textContent = isRetryMode ? '↺' : (currentIndex + 1);
            overlay.classList.add('hidden');
            
            updateStarPotentialUI();
            render();
        }

        function updateStarPotentialUI() {
            starPotentialUI.innerHTML = '';
            for (let i = 0; i < currentWordObj.word.length; i++) {
                const star = document.createElement('span');
                star.textContent = '⭐';
                star.className = i < currentWordStarPotential ? 'star-gold' : 'star-lost';
                starPotentialUI.appendChild(star);
            }
        }

        function render() {
            slotsEl.innerHTML = '';
            const word = currentWordObj.word;
            const wordLen = word.length;
            const letterColors = getWordLetterColors(word);
            const nextEmptyIdx = userProgress.indexOf(null);

            // Responsive langelių dydžiai pagal žodžio ilgį, kad 7 raidžių žodis tilptų telefone
            let slotSize = "w-11 h-11 text-xl sm:w-14 sm:h-14 sm:text-2xl md:w-16 md:h-16 md:text-3xl";
            if (wordLen <= 4) {
                slotSize = "w-14 h-14 text-2xl sm:w-16 sm:h-16 sm:text-3xl md:w-20 md:h-20 md:text-4xl";
            } else if (wordLen === 5) {
                slotSize = "w-12 h-12 text-2xl sm:w-14 sm:h-14 sm:text-3xl md:w-16 md:h-16 md:text-4xl";
            } else {
                slotSize = "w-10 h-10 min-[370px]:w-11 min-[370px]:h-11 text-xl sm:w-13 sm:h-13 sm:text-2xl md:w-16 md:h-16 md:text-3xl";
            }

            userProgress.forEach((char, i) => {
                const slot = document.createElement('div');
                const isActive = (i === nextEmptyIdx);

                slot.className = `${slotSize} border-3 sm:border-4 rounded-2xl flex items-center justify-center font-black letter-tile flex-shrink-0 transition-all select-none
                    ${lockedSlots[i] 
                        ? 'slot-locked' 
                        : isActive 
                            ? 'slot-active' 
                            : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 opacity-90 shadow-sm'}`;
                
                slot.textContent = char || '';
                if (char) {
                    slot.style.color = letterColors[i];
                }
                slotsEl.appendChild(slot);
            });

            poolEl.innerHTML = '';
            let btnSize = "w-11 h-11 text-xl sm:w-13 sm:h-13 sm:text-2xl md:w-16 md:h-16 md:text-3xl";
            if (wordLen <= 4) {
                btnSize = "w-13 h-13 text-2xl sm:w-15 sm:h-15 sm:text-3xl md:w-18 md:h-18 md:text-4xl";
            } else if (wordLen === 5) {
                btnSize = "w-12 h-12 text-2xl sm:w-14 sm:h-14 sm:text-3xl md:w-16 md:h-16 md:text-4xl";
            } else {
                btnSize = "w-10 h-10 min-[370px]:w-11 min-[370px]:h-11 text-xl sm:w-13 sm:h-13 sm:text-2xl md:w-16 md:h-16 md:text-3xl";
            }

            currentPool.forEach((item, poolIdx) => {
                const btn = document.createElement('button');
                btn.id = `pool-btn-${poolIdx}`;
                btn.className = `${btnSize} rounded-2xl font-black letter-tile select-none transition-all
                    ${item.used 
                        ? 'pool-btn-disabled' 
                        : 'bg-white dark:bg-slate-700 border-b-4 border-slate-300 dark:border-slate-900 shadow-md hover:bg-yellow-50 dark:hover:bg-slate-600 active:border-b-0 active:translate-y-1 active:scale-95'}`;
                btn.textContent = item.char;
                if (!item.used && item.color) {
                    btn.style.color = item.color;
                }
                btn.onclick = () => !item.used && placeLetter(item, poolIdx);
                poolEl.appendChild(btn);
            });
        }

        function placeLetter(poolItem, poolIdx) {
            const emptyIdx = userProgress.indexOf(null);
            if (emptyIdx !== -1) {
                if (currentWordObj.word[emptyIdx] === poolItem.char) {
                    playSound('correct');
                    userProgress[emptyIdx] = poolItem.char;
                    lockedSlots[emptyIdx] = true;
                    if (poolItem.id !== emptyIdx) {
                        const exactItem = currentPool.find(p => !p.used && p.id === emptyIdx && p.char === poolItem.char);
                        if (exactItem) {
                            const tempColor = poolItem.color;
                            const tempId = poolItem.id;
                            poolItem.color = exactItem.color;
                            poolItem.id = exactItem.id;
                            exactItem.color = tempColor;
                            exactItem.id = tempId;
                        }
                    }
                    poolItem.used = true; 
                    render();
                    checkWin();
                } else {
                    playSound('wrong');
                    wordMistakes[currentWordObj.word]++;
                    
                    if (currentWordStarPotential > 1) {
                        currentWordStarPotential--;
                        updateStarPotentialUI();
                    }
                    
                    const slots = slotsEl.children;
                    const tempErrorSlot = slots[emptyIdx];
                    const tappedBtn = document.getElementById(`pool-btn-${poolIdx}`);

                    if (tempErrorSlot) {
                        tempErrorSlot.textContent = poolItem.char;
                        tempErrorSlot.classList.remove('shake-anim');
                        void tempErrorSlot.offsetWidth;
                        tempErrorSlot.classList.add('shake-anim', 'bg-rose-500', 'border-rose-700', 'text-white');
                    }
                    if (tappedBtn) {
                        tappedBtn.classList.remove('shake-anim');
                        void tappedBtn.offsetWidth;
                        tappedBtn.classList.add('shake-anim', 'bg-rose-100', 'border-rose-400');
                    }
                    
                    setTimeout(() => {
                        if (tempErrorSlot && !lockedSlots[emptyIdx]) {
                            tempErrorSlot.textContent = '';
                            tempErrorSlot.classList.remove('shake-anim', 'bg-rose-500', 'border-rose-700', 'text-white');
                        }
                        if (tappedBtn && !poolItem.used) {
                            tappedBtn.classList.remove('shake-anim', 'bg-rose-100', 'border-rose-400');
                        }
                    }, 450);
                }
            }
        }

        function checkWin() {
            if (lockedSlots.every(s => s === true)) {
                totalStarsEarned += currentWordStarPotential;
                updateStarDisplay();
                
                playSound('win');
                successEmojiLarge.textContent = currentWordObj.emoji;
                successWordText.innerHTML = _col(currentWordObj.word);
                
                const starsOverlayContainer = document.getElementById('success-stars-container');
                starsOverlayContainer.innerHTML = '';
                for(let i=0; i<currentWordStarPotential; i++) {
                    const s = document.createElement('span');
                    s.textContent = '⭐';
                    s.className = 'bounce-anim inline-block';
                    s.style.animationDelay = `${i * 0.1}s`;
                    starsOverlayContainer.appendChild(s);
                }
                
                setTimeout(() => {
                    overlay.classList.remove('hidden');
                }, 400);
            }
        }

        function loadNextWord() {
            currentIndex++;
            if (currentIndex >= gameWords.length) {
                showFinalResults();
            } else {
                loadWord();
            }
        }

        function showFinalResults() {
            document.getElementById('final-stars-earned').textContent = totalStarsEarned;
            document.getElementById('final-stars-possible').textContent = totalPossibleStars;
            
            const imperfects = gameWords.filter(w => (wordMistakes[w.word] || 0) > 0);
            
            if (imperfects.length > 0) {
                retryBtn.classList.remove('hidden');
                retryBtn.textContent = `PATAISYTI KLAIDAS (${imperfects.length}) 🛠️`;
            } else {
                retryBtn.classList.add('hidden');
            }

            document.getElementById('end-screen').classList.remove('hidden');
        }

        function toggleStats() {
            const statsView = document.getElementById('stats-view');
            statsView.classList.toggle('hidden');
            if (!statsView.classList.contains('hidden')) updateStatsTable();
        }

        function updateStatsTable() {
            const tbody = document.getElementById('stats-table-body');
            tbody.innerHTML = '';
            
            const stats = gameWords.map(w => ({
                word: w.word,
                emoji: w.emoji,
                mistakes: wordMistakes[w.word] || 0,
                finished: gameWords.indexOf(w) < currentIndex
            }));

            stats.forEach(item => {
                const row = document.createElement('tr');
                row.className = "border-b border-slate-100 dark:border-slate-800";
                row.innerHTML = `<td class="py-3 font-bold text-base sm:text-lg">${item.emoji} <span>${_col(item.word)}</span></td><td class="text-center font-black text-rose-500 text-base sm:text-lg">${item.mistakes}</td><td class="text-right text-[10px] font-bold uppercase opacity-40">${item.finished ? 'Baigta' : 'Dabar'}</td>`;
                tbody.appendChild(row);
            });
        }

        // Pradinė temos sinchronizacija
        updateThemeUI();
    </script>
</body>
</html>
