<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>🍎 Tekstiniai Uždavinukai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fef2f2;
            background-image: radial-gradient(#fca5a5 20%, transparent 20%);
            background-size: 20px 20px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .btn-3d {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-3d:active {
            transform: translateY(4px);
        }

        @keyframes bounce-scale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .bounce-anim {
            animation: bounce-scale 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .shake-anim {
            animation: shake 0.4s ease-in-out;
        }

        /* Tamsioji tema */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0b1120 !important;
                background-image: radial-gradient(#1e293b 20%, transparent 20%) !important;
                color: #f1f5f9 !important;
            }
            #app {
                background-color: #0f172a !important;
                border-color: #334155 !important;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6) !important;
            }
            h2, h1, .text-slate-800 {
                color: #f8fafc !important;
            }
            .text-slate-600 {
                color: #94a3b8 !important;
            }
            .btn-3d {
                background-color: #1e293b !important;
                border-color: #334155 !important;
                color: #f8fafc !important;
                box-shadow: 0 5px 0 #0f172a !important;
            }
            .btn-3d:hover {
                background-color: #273549 !important;
            }
            .bg-rose-100\/60, .bg-rose-50 {
                background-color: rgba(30, 41, 59, 0.7) !important;
                border-color: #334155 !important;
            }
        }
    </style>
    <!-- Apsauga nuo priartinimo gestais (pinch to zoom) -->
    <script>
        document.addEventListener("gesturestart", function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("gesturechange", function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("gestureend", function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("touchstart", function(e) {
            if (e.touches && e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });
        document.addEventListener("touchmove", function(e) {
            if (e.touches && e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });
        document.addEventListener("wheel", function(e) {
            if (e.ctrlKey) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</head>
<body class="h-screen max-h-screen flex items-center justify-center p-2 sm:p-4 overflow-hidden transition-colors duration-200">

    <div id="app" class="w-full max-w-2xl bg-white/95 backdrop-blur-md rounded-3xl shadow-xl flex flex-col relative border-4 border-rose-300 overflow-hidden max-h-full">
        <!-- Turinis bus atvaizduotas dinamiškai per JS -->
    </div>

    <script>
        // Web Audio API
        let audioCtx;
        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playTone(freq, type, duration, startTime=0) {
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);
            gain.gain.setValueAtTime(0.15, ctx.currentTime + startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + startTime);
            osc.stop(ctx.currentTime + startTime + duration);
        }

        function playCorrectSound() {
            playTone(440, 'sine', 0.15, 0);
            playTone(554.37, 'sine', 0.15, 0.08);
            playTone(659.25, 'sine', 0.25, 0.16);
        }

        function playWrongSound() {
            playTone(280, 'sawtooth', 0.2, 0);
            playTone(200, 'sawtooth', 0.25, 0.1);
        }

        function playWinSound() {
            [440, 554, 659, 880].forEach((freq, idx) => {
                playTone(freq, 'sine', 0.25, idx * 0.12);
            });
        }

        // === SKIEMENŲ SPALVINIMAS ===
        const _V = 'aeėęiįyouųūąAEĖĘIĮYOUŲŪĄ';
        const _D = ['ai','au','ei','eu','ie','uo','ui','oi','ia','io','iu'];
        const _L = /[a-ząčęėįšųūžA-ZĄČĘĖĮŠŲŪŽ]/;
        const _O = new Set(['bl','br','dr','dv','fl','fr','gl','gr','gn','kl','kr','kn','kv','pl','pr','sk','sl','sm','sn','sp','sr','st','sv','šl','šv','šn','tr','tv','vr','žl','žv','str','skr','spr']);
        const _SC = ['#dc2626','#2563eb','#16a34a','#ea580c','#9333ea','#db2777'];

        function _syl(word) {
            if (!word || word.length <= 1) return [word || ''];
            const r = []; let s = '', i = 0, n = word.length;
            while (i < n) {
                const c = word[i];
                if (!_L.test(c)) { s += c; i++; continue; }
                if (!_V.includes(c)) { s += c; i++; }
                else {
                    s += c; i++;
                    if (i < n && _V.includes(word[i]) && _D.includes((c + word[i]).toLowerCase())) { s += word[i]; i++; }
                    let j = i, u = [];
                    while (j < n && !_V.includes(word[j])) {
                        if (!_L.test(word[j])) break;
                        if (j+1 < n) { const p = (word[j]+word[j+1]).toLowerCase(); if (p==='ch'||p==='dz'||p==='dž') { u.push(word[j]+word[j+1]); j+=2; continue; } }
                        u.push(word[j]); j++;
                    }
                    if (j >= n || (j < n && !_V.includes(word[j]) && !_L.test(word[j]))) {
                        s += u.join(''); while (j < n && !_L.test(word[j])) { s += word[j]; j++; } i = j;
                        if (i >= n) { r.push(s); s = ''; }
                    } else if (u.length === 0) { r.push(s); s = ''; }
                    else if (u.length === 1) { r.push(s); s = u[0]; i = j; }
                    else {
                        let sp = u.length - 1;
                        if (u.length >= 3) { const l2 = (u[u.length-2]+u[u.length-1]).toLowerCase(); if (_O.has(l2)) sp = u.length - 2; }
                        if (u.length >= 4) { const l3 = (u[u.length-3]+u[u.length-2]+u[u.length-1]).toLowerCase(); if (_O.has(l3)) sp = u.length - 3; }
                        s += u.slice(0, sp).join(''); r.push(s); s = u.slice(sp).join(''); i = j;
                    }
                }
            }
            if (s) r.push(s);
            return r.filter(x => x.length > 0);
        }

        function _col(text) {
            if (!text) return '';
            return text.split(/(\s+)/).map(token => {
                if (!token.trim() || !/[a-ząčęėįšųūžA-ZĄČĘĖĮŠŲŪŽ]/.test(token)) return token;
                const syls = _syl(token);
                return syls.map((s, i) => '<span style="color:' + _SC[i % _SC.length] + '">' + s + '</span>').join('');
            }).join('');
        }
        // === /SKIEMENŲ SPALVINIMAS ===

        // Tekstinių uždavinių bazė
        const TASKS_EASY = [
            {
                story: "Ema pintinėje turėjo 5 obuolius 🍎. 2 obuolius suvalgė 😋. Kiek obuolių liko?",
                visual: "🍎 🍎 🍎 <span class='opacity-30 line-through'>🍎 🍎</span>",
                correct: 3,
                equation: "5 - 2 = 3",
                options: [3, 7, 2, 4]
            },
            {
                story: "Ant šakos tupėjo 4 paukšteliai 🐦. Atskrido dar 3 🐦. Kiek paukštelių dabar?",
                visual: "🐦 🐦 🐦 🐦 + 🐦 🐦 🐦",
                correct: 7,
                equation: "4 + 3 = 7",
                options: [7, 6, 8, 1]
            },
            {
                story: "Lukas turėjo 3 mašinėles 🚗. Gimtadienio proga gavo dar 2 🚗. Kiek mašinėlių turi Lukas?",
                visual: "🚗 🚗 🚗 + 🚗 🚗",
                correct: 5,
                equation: "3 + 2 = 5",
                options: [5, 4, 6, 1]
            },
            {
                story: "Prie gėlės skraidė 6 drugeliai 🦋. 2 drugeliai nuskrido. Kiek drugelių liko?",
                visual: "🦋 🦋 🦋 🦋 <span class='opacity-30 line-through'>🦋 🦋</span>",
                correct: 4,
                equation: "6 - 2 = 4",
                options: [4, 8, 5, 3]
            },
            {
                story: "Lėkštėje buvo 5 sausainiai 🍪. Vaikai suvalgė 4 🍪. Kiek sausainių liko?",
                visual: "🍪 <span class='opacity-30 line-through'>🍪 🍪 🍪 🍪</span>",
                correct: 1,
                equation: "5 - 4 = 1",
                options: [1, 2, 9, 0]
            },
            {
                story: "Ežere plaukiojo 2 antys 🦆. Prie jų atplaukė dar 4 🦆. Kiek ančių plaukioja?",
                visual: "🦆 🦆 + 🦆 🦆 🦆 🦆",
                correct: 6,
                equation: "2 + 4 = 6",
                options: [6, 7, 5, 2]
            },
            {
                story: "Pintinėje buvo 7 grybai 🍄. 3 grybai pasirodė sukirmiję ir buvo išmesti. Kiek gerų grybų liko?",
                visual: "🍄 🍄 🍄 🍄 <span class='opacity-30 line-through'>🍄 🍄 🍄</span>",
                correct: 4,
                equation: "7 - 3 = 4",
                options: [4, 10, 5, 3]
            },
            {
                story: "Vaikas pastatė bokštą iš 5 kaladėlių 🧱. Užkėlė dar 3 kaladėles. Kiek kaladėlių bokšte?",
                visual: "🧱 🧱 🧱 🧱 🧱 + 🧱 🧱 🧱",
                correct: 8,
                equation: "5 + 3 = 8",
                options: [8, 7, 9, 2]
            },
            {
                story: "Dėžutėje buvo 8 pieštukai ✏️. 5 pieštukus paėmė sesė. Kiek pieštukų liko dėžutėje?",
                visual: "✏️ ✏️ ✏️ <span class='opacity-30 line-through'>✏️ ✏️ ✏️ ✏️ ✏️</span>",
                correct: 3,
                equation: "8 - 5 = 3",
                options: [3, 13, 4, 2]
            },
            {
                story: "Vazoje žydėjo 3 tulpės 🌷 ir 4 narcizai 🌼. Kiek iš viso gėlių buvo vazoje?",
                visual: "🌷 🌷 🌷 + 🌼 🌼 🌼 🌼",
                correct: 7,
                equation: "3 + 4 = 7",
                options: [7, 8, 6, 1]
            }
        ];

        const TASKS_HARD = [
            {
                story: "Mantas turėjo 10 balionų 🎈. 4 balionai nuskriejo į dangų 💨. Kiek balionų liko Mantui?",
                visual: "🎈 🎈 🎈 🎈 🎈 🎈 <span class='opacity-30 line-through'>🎈 🎈 🎈 🎈</span>",
                correct: 6,
                equation: "10 - 4 = 6",
                options: [6, 14, 7, 5]
            },
            {
                story: "Ant stalo buvo 8 saldainiai 🍬. Tėtis nupirko dar 6 🍬. Kiek iš viso saldainių yra ant stalo?",
                visual: "8 🍬 + 6 🍬",
                correct: 14,
                equation: "8 + 6 = 14",
                options: [14, 13, 15, 2]
            },
            {
                story: "Akvariume plaukiojo 12 žuvyčių 🐟. 5 žuvytės pasislėpė namelyje. Kiek žuvyčių matosi?",
                visual: "12 🐟 - 5 🐟",
                correct: 7,
                equation: "12 - 5 = 7",
                options: [7, 17, 8, 6]
            },
            {
                story: "Knygų lentynoje buvo 9 pasakų knygelės 📚. Bibliotekoje vaikas pasiskolino dar 4 📚. Kiek knygų dabar?",
                visual: "9 📚 + 4 📚",
                correct: 13,
                equation: "9 + 4 = 13",
                options: [13, 12, 14, 5]
            },
            {
                story: "Mama nuskynė 15 braškių 🍓. Vaikai suvalgė 5 🍓. Kiek braškių liko lėkštėje?",
                visual: "15 🍓 - 5 🍓",
                correct: 10,
                equation: "15 - 5 = 10",
                options: [10, 20, 9, 11]
            },
            {
                story: "Autobuse važiavo 11 keleivių 🚌. Stotelėje įlipo dar 4 keleiviai. Kiek keleivių važiuoja dabar?",
                visual: "11 👤 + 4 👤",
                correct: 15,
                equation: "11 + 4 = 15",
                options: [15, 14, 16, 7]
            },
            {
                story: "Giriukas turėjo 14 riešutų 🌰. Voveraitei atidavė 6 🌰. Kiek riešutų liko Giriukui?",
                visual: "14 🌰 - 6 🌰",
                correct: 8,
                equation: "14 - 6 = 8",
                options: [8, 20, 7, 9]
            },
            {
                story: "Kiškis darže rado 7 morkas 🥕, o vėliau dar 8 🥕. Kiek morkų turi kiškis?",
                visual: "7 🥕 + 8 🥕",
                correct: 15,
                equation: "7 + 8 = 15",
                options: [15, 14, 16, 1]
            }
        ];

        let state = {
            mode: 'easy',
            questions: [],
            currentIndex: 0,
            score: 0,
            streak: 0,
            firstTry: true,
            waiting: false
        };

        const appEl = document.getElementById('app');

        function shuffle(arr) {
            return [...arr].sort(() => Math.random() - 0.5);
        }

        function renderStartScreen() {
            appEl.innerHTML = `
                <div class="p-6 sm:p-8 flex flex-col items-center justify-center text-center">
                    <div class="text-6xl sm:text-7xl mb-2 animate-bounce">🍎</div>
                    <h1 class="text-3xl sm:text-5xl font-black text-rose-700 mb-2">Tekstiniai Uždavinukai</h1>
                    <p class="text-lg sm:text-xl font-bold text-slate-600 mb-6 sm:mb-8">Perskaityk trumpą istoriją ir suskaičiuok!</p>
                    
                    <div class="flex flex-col gap-3.5 sm:gap-4 w-full max-w-sm">
                        <button onclick="startGame('easy')" class="btn-3d py-3.5 sm:py-4 px-6 bg-rose-500 hover:bg-rose-600 text-white rounded-2xl text-xl sm:text-2xl font-black shadow-[0_6px_0_#e11d48] active:shadow-[0_0px_0_#e11d48] transition-all">
                            🟢 Lengva (Iki 10)
                        </button>
                        <button onclick="startGame('hard')" class="btn-3d py-3.5 sm:py-4 px-6 bg-orange-500 hover:bg-orange-600 text-white rounded-2xl text-xl sm:text-2xl font-black shadow-[0_6px_0_#c2410c] active:shadow-[0_0px_0_#c2410c] transition-all">
                            🟠 Sunkiau (Iki 20)
                        </button>
                    </div>
                </div>
            `;
        }

        function startGame(mode) {
            getAudioCtx();
            state.mode = mode;
            state.score = 0;
            state.streak = 0;
            state.currentIndex = 0;
            const pool = mode === 'easy' ? TASKS_EASY : TASKS_HARD;
            state.questions = shuffle(pool).slice(0, 8);
            renderQuestion();
        }

        function renderQuestion() {
            if (state.currentIndex >= state.questions.length) {
                renderEndScreen();
                return;
            }

            state.firstTry = true;
            state.waiting = false;
            const q = state.questions[state.currentIndex];
            const options = shuffle([...q.options]);

            const optionsHtml = options.map((opt, idx) => `
                <button id="btn-${idx}" onclick="handleAnswer(${opt}, this)" 
                    class="btn-3d py-3 sm:py-4 px-4 bg-rose-50 hover:bg-rose-100 text-rose-950 border-2 border-rose-300 rounded-2xl text-2xl sm:text-3xl font-black shadow-[0_5px_0_#fca5a5] active:shadow-[0_0px_0_#fca5a5] transition-all flex items-center justify-center text-center">
                    ${opt}
                </button>
            `).join('');

            appEl.innerHTML = `
                <!-- Top Status Bar -->
                <div class="bg-rose-500 text-white px-4 py-2 sm:py-2.5 flex justify-between items-center font-bold text-sm sm:text-base shadow">
                    <div>⭐ Taškai: <span class="text-yellow-200">${state.score}</span></div>
                    <div class="bg-rose-600 px-3 py-1 rounded-xl">Uždavinys: ${state.currentIndex + 1} / ${state.questions.length}</div>
                    <div>🔥 Serija: <span class="text-orange-200">${state.streak}</span></div>
                </div>

                <div class="p-3 sm:p-5 flex-1 flex flex-col justify-between items-center">
                    <div class="w-full bg-rose-50/80 rounded-2xl p-3 sm:p-4 border-2 border-rose-200 shadow-sm text-center mb-1">
                        <p class="text-lg sm:text-2xl font-black text-slate-800 leading-snug">
                            ${_col(q.story)}
                        </p>
                    </div>

                    <div class="my-auto py-2 px-4 flex items-center justify-center text-2xl sm:text-3xl tracking-wide bg-white rounded-xl border border-rose-100 min-h-[50px]">
                        ${q.visual}
                    </div>

                    <div id="feedback" class="h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 opacity-0 transition-opacity">
                        Pranešimas
                    </div>

                    <div class="grid grid-cols-2 gap-2.5 sm:gap-3.5 w-full mt-1">
                        ${optionsHtml}
                    </div>
                </div>
            `;
        }

        function handleAnswer(selected, btn) {
            if (state.waiting) return;

            const q = state.questions[state.currentIndex];
            const feedback = document.getElementById('feedback');

            if (selected === q.correct) {
                state.waiting = true;
                playCorrectSound();
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }

                btn.classList.remove('bg-rose-50', 'text-rose-950', 'border-rose-300');
                btn.classList.add('bg-green-500', 'text-white', 'border-green-600', 'shadow-[0_5px_0_#15803d]', 'bounce-anim');

                feedback.textContent = `Teisingai! ${q.equation} 🎉`;
                feedback.className = "h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 text-green-600 opacity-100";

                setTimeout(() => {
                    state.currentIndex++;
                    renderQuestion();
                }, 1300);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playWrongSound();

                btn.classList.remove('bg-rose-50', 'text-rose-950');
                btn.classList.add('bg-red-100', 'text-red-400', 'line-through', 'border-red-300', 'opacity-60', 'shake-anim');
                btn.disabled = true;

                feedback.textContent = "Bandyk dar kartą! 🤔";
                feedback.className = "h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 text-red-500 opacity-100";

                setTimeout(() => {
                    btn.classList.remove('shake-anim');
                }, 400);
            }
        }

        function renderEndScreen() {
            playWinSound();
            let stars = "⭐";
            if (state.score >= 7) stars = "⭐⭐⭐";
            else if (state.score >= 5) stars = "⭐⭐";

            appEl.innerHTML = `
                <div class="p-6 sm:p-8 flex flex-col items-center justify-center text-center">
                    <div class="text-7xl mb-2">🎉</div>
                    <h2 class="text-3xl sm:text-4xl font-black text-green-600 mb-2">Šaunuolis!</h2>
                    <div class="text-5xl mb-4 tracking-wider">${stars}</div>
                    <p class="text-xl font-bold text-slate-700 mb-1">Surinkai taškų:</p>
                    <p class="text-4xl font-black text-rose-600 mb-6">${state.score} / ${state.questions.length}</p>
                    
                    <div class="flex flex-col sm:flex-row gap-3 w-full max-w-sm">
                        <button onclick="startGame(state.mode)" class="btn-3d flex-1 py-3.5 bg-rose-500 hover:bg-rose-600 text-white rounded-2xl text-lg font-black shadow-[0_5px_0_#e11d48] active:shadow-[0_0px_0_#e11d48] transition-all">
                            Dar kartą
                        </button>
                        <button onclick="renderStartScreen()" class="btn-3d flex-1 py-3.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-2xl text-lg font-black shadow-[0_5px_0_#94a3b8] active:shadow-[0_0px_0_#94a3b8] transition-all">
                            Iš pradžių
                        </button>
                    </div>
                </div>
            `;
        }

        renderStartScreen();
    </script>
</body>
</html>
