<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
  <title>Skaitymo Žaidimas Vaikams</title>
  
  <!-- Tailwind CSS stiliams -->
  <link rel="stylesheet" href="../shared/tailwind.min.css">
  
  <!-- React ir Babel bibliotekos, kad kodas veiktų tiesiai naršyklėje -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="../shared/common.css?v=2">
  <script src="../shared/common.js?v=2"></script>
  <script src="../shared/vocabulary.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    
    @media (prefers-color-scheme: dark) {
      body, .bg-yellow-50, .bg-blue-100 {
        background-color: #0b1120 !important;
        color: #f8fafc;
      }
      h1.text-blue-600, span.text-blue-600 {
        color: #38bdf8 !important;
      }
      .bg-green-100.text-green-600 {
        background-color: #064e3b !important;
        color: #4ade80 !important;
        border-color: #22c55e !important;
      }
      .bg-red-100.text-red-600 {
        background-color: #7f1d1d !important;
        color: #fca5a5 !important;
        border-color: #ef4444 !important;
      }
      .bg-gray-300.text-gray-500 {
        background-color: #1e293b !important;
        color: #64748b !important;
        border: 2px solid #334155 !important;
      }
      .bg-white {
        background-color: #0f172a !important;
        border-color: #334155 !important;
      }
      .border-yellow-200, .border-blue-200 {
        border-color: #334155 !important;
      }
      .text-gray-500, .text-gray-700 {
        color: #94a3b8 !important;
      }
      /* Options grid buttons */
      .grid button.bg-white {
        background-color: #1e293b !important;
        border-color: #334155 !important;
      }
      .grid button.bg-white:hover {
        border-color: #38bdf8 !important;
      }
      .border-gray-100 {
        border-color: #334155 !important;
      }
      /* Selected placeholder */
      .border-gray-300 {
        border-color: #475569 !important;
        color: #64748b !important;
      }
      /* Selected emoji */
      .border-blue-500.bg-blue-50 {
        background-color: #1e293b !important;
        border-color: #3b82f6 !important;
        box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4) !important;
      }
      /* Success emoji */
      .border-green-500.bg-green-50 {
        background-color: #1e293b !important;
        border-color: #22c55e !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // Pilnas žodžių sąrašas su tiksliais skiemenimis
    const WORDS_DATA = VOCABULARY;

    const PRAISE_WORDS = ["Puiku!", "Šaunuolis!", "Teisingai!", "Nuostabu!", "Labai gerai!"];

    function App() {
      const [gameState, setGameState] = useState('start');
      const [score, setScore] = useState(0);
      const [streak, setStreak] = useState(0);
      const [currentWord, setCurrentWord] = useState(null);
      const [options, setOptions] = useState([]);
      const [selectedEmoji, setSelectedEmoji] = useState(null);
      const [feedback, setFeedback] = useState(null);
      const [wrongAnswers, setWrongAnswers] = useState(new Set());
      const [hasExtraChance, setHasExtraChance] = useState(true);
      const [hintUsed, setHintUsed] = useState(false);
      
      const [roundDeck, setRoundDeck] = useState([]);
      const [roundIndex, setRoundIndex] = useState(0);
      const [totalQuestions, setTotalQuestions] = useState(10);
      const [firstTry, setFirstTry] = useState(true);
      const [firstTryScore, setFirstTryScore] = useState(0);
      const [missedWords, setMissedWords] = useState([]);

      const playIncorrectSound = playWrongSound;
      const isInIframe = typeof window !== 'undefined' && window.self !== window.top;

      const loadQuestion = useCallback((idx, deck) => {
        if (!deck || idx >= deck.length) return;
        const correctItem = deck[idx];
        const otherItems = WORDS_DATA.filter(item => item.word !== correctItem.word);
        const shuffledOthers = shuffleArray(otherItems);
        const wrongOptions = shuffledOthers.slice(0, 9).map(item => item.emoji);
        const allOptions = shuffleArray([correctItem.emoji, ...wrongOptions]);
        
        setCurrentWord(correctItem);
        setOptions(allOptions);
        setSelectedEmoji(null);
        setFeedback(null);
        setWrongAnswers(new Set());
        setHasExtraChance(true);
        setHintUsed(false);
        setFirstTry(true);
      }, []);

      const startGame = useCallback(() => {
        initAudio();
        const deck = shuffleArray(WORDS_DATA).slice(0, 10);
        setRoundDeck(deck);
        setTotalQuestions(deck.length);
        setRoundIndex(0);
        setScore(0);
        setStreak(0);
        setFirstTryScore(0);
        setMissedWords([]);
        setGameState('playing');
        loadQuestion(0, deck);
      }, [loadQuestion]);

      const retryMistakes = useCallback(() => {
        initAudio();
        if (!missedWords || missedWords.length === 0) {
          startGame();
          return;
        }
        const deck = shuffleArray([...missedWords]);
        setRoundDeck(deck);
        setTotalQuestions(deck.length);
        setRoundIndex(0);
        setScore(0);
        setStreak(0);
        setFirstTryScore(0);
        setMissedWords([]);
        setGameState('playing');
        loadQuestion(0, deck);
      }, [missedWords, startGame, loadQuestion]);

      useEffect(() => {
        window.__restartSkaitymas = startGame;
        window.__retrySkaitymas = retryMistakes;
        window.__menuSkaitymas = () => {
          clearGameTimers();
          setGameState('start');
        };
        return () => {
          delete window.__restartSkaitymas;
          delete window.__retrySkaitymas;
          delete window.__menuSkaitymas;
        };
      }, [startGame, retryMistakes]);

      const handleEmojiClick = (emoji) => {
        if (feedback?.type === 'success' || wrongAnswers.has(emoji)) return;
        playSelectSound();
        setSelectedEmoji(emoji);
      };

      const handleUseHint = () => {
        if (hintUsed || !currentWord || feedback?.type === 'success') return;
        if (typeof playHintSound === 'function') playHintSound();
        setHintUsed(true);
        const candidates = options.filter(em => em !== currentWord.emoji && !wrongAnswers.has(em));
        const toRemove = shuffleArray(candidates).slice(0, 5);
        setWrongAnswers(prev => new Set([...prev, ...toRemove]));
        if (toRemove.includes(selectedEmoji)) {
          setSelectedEmoji(null);
        }
      };

      const handleConfirmGuess = () => {
        if (!selectedEmoji || feedback?.type === 'success') return;

        if (selectedEmoji === currentWord.emoji) {
          playCorrectSound();
          
          const isFirstTry = firstTry;
          const newStreak = streak + 1;
          const pointsEarned = 10 + (Math.floor(newStreak / 5) * 5);
          const nextScore = score + pointsEarned;
          
          setScore(nextScore);
          setStreak(newStreak);
          if (isFirstTry) {
            setFirstTryScore(prev => prev + 1);
          }
          
          const praise = PRAISE_WORDS[Math.floor(Math.random() * PRAISE_WORDS.length)];
          setFeedback({ text: `${praise} +${pointsEarned}`, type: 'success' });
          
          setGameTimeout(() => {
            const nextIdx = roundIndex + 1;
            if (nextIdx >= roundDeck.length) {
              setGameState('end');
            } else {
              setRoundIndex(nextIdx);
              loadQuestion(nextIdx, roundDeck);
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
          }, 1500);

        } else {
          playIncorrectSound();
          setFirstTry(false);
          setMissedWords(prev => {
            if (currentWord && !prev.some(w => w.word === currentWord.word)) {
              return [...prev, currentWord];
            }
            return prev;
          });
          
          if (hasExtraChance) {
            setHasExtraChance(false);
            setFeedback({ text: "Ne tas! Bandyk dar kartą (Serija išsaugota)", type: 'error' });
          } else {
            setStreak(0); 
            setFeedback({ text: "Suklydai! Serija nutrūko.", type: 'error' });
          }

          setWrongAnswers(prev => new Set([...prev, selectedEmoji]));
          setSelectedEmoji(null);
          
          setGameTimeout(() => {
            setFeedback(prev => prev?.type === 'error' ? null : prev);
          }, 2000);
        }
      };

      if (gameState === 'start') {
        return (
          <div className="min-h-screen bg-blue-100 flex flex-col items-center justify-center p-4 font-sans text-center select-none">
            <h1 className="text-4xl md:text-6xl font-extrabold text-blue-600 mb-6 drop-shadow-sm">
              Skaitymo Žaidimas
            </h1>
            
            <div className="text-7xl md:text-8xl mb-8 animate-bounce">
              🐶🐱🚗
            </div>

            <button 
              onClick={startGame}
              className="bg-green-500 hover:bg-green-600 text-white text-2xl md:text-3xl font-black py-4 md:py-5 px-10 rounded-full shadow-[0_8px_0_rgb(21,128,61)] active:shadow-[0_0px_0_rgb(21,128,61)] active:translate-y-2 transition-all cursor-pointer flex items-center gap-2"
            >
              <span>Žaisti</span> <span>➔</span>
            </button>
          </div>
        );
      }

      if (gameState === 'end') {
        const endHtml = typeof renderEndScreenHelper === 'function' ? renderEndScreenHelper({
          score: firstTryScore,
          total: totalQuestions,
          restartFn: 'window.__restartSkaitymas && window.__restartSkaitymas()',
          retryFn: missedWords.length > 0 ? 'window.__retrySkaitymas && window.__retrySkaitymas()' : null,
          mistakesCount: missedWords.length,
          menuFn: 'window.__menuSkaitymas && window.__menuSkaitymas()',
          menuText: 'Meniu'
        }) : '';

        return (
          <div className="min-h-screen bg-blue-100 flex items-center justify-center p-4 font-sans select-none">
            <div
              className="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border-2 border-blue-200"
              dangerouslySetInnerHTML={{ __html: endHtml }}
            />
          </div>
        );
      }

      return (
        <div className="h-screen max-h-screen overflow-hidden bg-yellow-50 flex flex-col items-center justify-between p-2.5 sm:p-5 font-sans selection:bg-transparent select-none">
          
          {/* Informacinė juosta */}
          <div className="top-bar w-full max-w-4xl flex justify-between items-center gap-1.5 sm:gap-3 bg-white px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-2xl sm:rounded-3xl shadow-md border-2 sm:border-4 border-yellow-200 shrink-0">
            <div className="flex items-center gap-1.5 sm:gap-2 shrink-0 whitespace-nowrap">
              <button onClick={() => { clearGameTimers(); setGameState('start'); }} className="p-1.5 sm:p-2 bg-slate-100 hover:bg-slate-200 active:scale-95 rounded-xl sm:rounded-2xl text-base sm:text-xl transition-all shrink-0" title="Atgal">{isInIframe ? '🔙' : '🏠'}</button>
              <span className="text-base sm:text-2xl font-black text-blue-600 flex items-center gap-1 whitespace-nowrap shrink-0">
                <span>⭐</span>
                <span>{score}</span>
              </span>
            </div>
            
            {/* Progresas ir šansas */}
            <div className="flex items-center gap-1.5 sm:gap-2 shrink-0 whitespace-nowrap">
              <div className="top-badge flex items-center gap-1 bg-amber-50 px-2.5 sm:px-3 py-1 rounded-full text-amber-800 font-extrabold shadow-sm border border-amber-300 text-xs sm:text-base whitespace-nowrap shrink-0" title="Progresas">
                <span>🎯</span>
                <span>{Math.min(roundIndex + 1, totalQuestions)} / {totalQuestions}</span>
              </div>
              <span className={`text-xl sm:text-2xl transition-all duration-300 shrink-0 ${hasExtraChance ? 'opacity-100 scale-100' : 'opacity-20 scale-75 grayscale'}`} title="Šansas">
                ❤️
              </span>
            </div>

            <div className="text-base sm:text-2xl font-black text-orange-500 flex items-center gap-1 whitespace-nowrap shrink-0">
              <span>🔥</span>
              <span>{streak}</span>
            </div>
          </div>

          {/* Žodis (suskirstytas spalvotais skiemenimis) */}
          <div className="w-full max-w-4xl flex flex-col items-center justify-center my-1">
            <div className="flex items-center justify-center gap-3">
              <h2 className="text-4xl sm:text-6xl lg:text-7xl font-black tracking-wide text-center uppercase break-all flex flex-wrap justify-center drop-shadow-sm leading-tight">
                {currentWord?.syllables.map((syl, index) => (
                  <span key={index} style={{ color: SYLLABLE_COLORS[index % SYLLABLE_COLORS.length] }}>
                    {syl}
                  </span>
                ))}
              </h2>
              {typeof hasLithuanianTTS === 'function' && hasLithuanianTTS() && currentWord && (
                <button
                  type="button"
                  onClick={() => speakLT(currentWord.word)}
                  className="speak-btn"
                  title="Išklausyti žodį"
                  aria-label="Išklausyti žodį"
                >
                  🔊
                </button>
              )}
            </div>
            {!hintUsed && (
              <button onClick={handleUseHint} className="hint-btn mt-1.5">
                <span>💡</span> <span>Užuomina</span>
              </button>
            )}
            
            {/* Pasirinktas emoji ir pranešimai */}
            <div className="mt-2 flex flex-col items-center justify-center w-full">
              {/* Pasirinkto emoji rodymas */}
              <div className="h-16 sm:h-24 flex items-center justify-center w-full">
                {selectedEmoji ? (
                  <div className="text-5xl sm:text-7xl drop-shadow-md transition-all scale-110 animate-[bounce_0.3s_ease-out_1]">
                    {selectedEmoji}
                  </div>
                ) : (
                  <div className="w-14 h-14 sm:w-20 sm:h-20 border-4 border-dashed border-gray-300 rounded-2xl sm:rounded-3xl flex items-center justify-center text-gray-300 text-2xl sm:text-4xl opacity-50">
                    ?
                  </div>
                )}
              </div>

              {/* Klaidos/Sėkmės pranešimas */}
              <div className="h-8 mt-1 flex items-center justify-center w-full">
                {feedback && (
                  <div className={`text-sm sm:text-xl font-bold px-4 py-1 rounded-full text-center ${
                    feedback.type === 'success' 
                      ? 'bg-green-100 text-green-600 border-2 border-green-400 animate-bounce' 
                      : 'bg-red-100 text-red-600 border-2 border-red-400'
                  }`}>
                    {feedback.text}
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* Patvirtinimo mygtukas */}
          <div className="w-full flex items-center justify-center my-1 shrink-0">
              <button
                onClick={handleConfirmGuess}
                disabled={!selectedEmoji || feedback?.type === 'success'}
                className={`
                  text-lg sm:text-2xl font-black py-2.5 sm:py-3.5 px-8 rounded-full transition-all w-full max-w-sm flex items-center justify-center gap-2
                  ${selectedEmoji && feedback?.type !== 'success'
                    ? 'bg-blue-500 hover:bg-blue-600 text-white shadow-[0_5px_0_rgb(29,78,216)] active:shadow-[0_0px_0_rgb(29,78,216)] active:translate-y-[5px] animate-pulse cursor-pointer' 
                    : 'bg-gray-300 text-gray-500 cursor-not-allowed opacity-70'}
                `}
              >
                <span>✅</span> <span>Patvirtinti</span>
              </button>
          </div>

          {/* Tinklelis: 5 stulpeliai x 2 eilutės mažuose ekranuose, kad nereikėtų slinkti */}
          <div className="w-full max-w-3xl grid grid-cols-5 gap-2 sm:gap-4 pb-1 shrink-0">
            {options.map((emoji, index) => {
              const isWrong = wrongAnswers.has(emoji);
              const isSelected = selectedEmoji === emoji;
              const isCorrectAndFound = feedback?.type === 'success' && emoji === currentWord?.emoji;
              
              return (
                <button
                  key={index}
                  onClick={() => handleEmojiClick(emoji)}
                  disabled={isWrong || feedback?.type === 'success'}
                  className={`
                    aspect-square flex items-center justify-center text-3xl min-[380px]:text-4xl sm:text-6xl bg-white rounded-2xl sm:rounded-3xl shadow-md
                    border-2 sm:border-4 transition-all duration-200 cursor-pointer
                    ${isWrong ? 'opacity-25 grayscale cursor-not-allowed scale-95 border-gray-200' : 'border-gray-100 hover:border-blue-200 hover:scale-[1.02]'}
                    ${isSelected && !isCorrectAndFound ? 'border-blue-500 bg-blue-50 scale-105 shadow-lg shadow-blue-200 ring-2 sm:ring-4 ring-blue-300 ring-opacity-50' : ''}
                    ${isCorrectAndFound ? 'scale-110 border-green-500 bg-green-50 shadow-green-200 shadow-xl z-10' : ''}
                  `}
                  style={{
                    animation: isWrong && feedback?.type === 'error' ? 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both' : 'none'
                  }}
                >
                  {emoji}
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    // Aplikacijos paleidimas
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
