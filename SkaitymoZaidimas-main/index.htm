<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
  <title>Skaitymo Žaidimas Vaikams</title>
  
  <!-- Tailwind CSS stiliams -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React ir Babel bibliotekos, kad kodas veiktų tiesiai naršyklėje -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="../shared/common.css">
  <script src="../shared/common.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    
    @media (prefers-color-scheme: dark) {
      body, .bg-yellow-50, .bg-blue-100 {
        background-color: #0b1120 !important;
        color: #f8fafc;
      }
      h1.text-blue-600, span.text-blue-600 {
        color: #38bdf8 !important;
      }
      .bg-green-100.text-green-600 {
        background-color: #064e3b !important;
        color: #4ade80 !important;
        border-color: #22c55e !important;
      }
      .bg-red-100.text-red-600 {
        background-color: #7f1d1d !important;
        color: #fca5a5 !important;
        border-color: #ef4444 !important;
      }
      .bg-gray-300.text-gray-500 {
        background-color: #1e293b !important;
        color: #64748b !important;
        border: 2px solid #334155 !important;
      }
      .bg-white {
        background-color: #0f172a !important;
        border-color: #334155 !important;
      }
      .border-yellow-200 {
        border-color: #334155 !important;
      }
      .text-gray-500, .text-gray-700 {
        color: #94a3b8 !important;
      }
      /* Options grid buttons */
      .grid button.bg-white {
        background-color: #1e293b !important;
        border-color: #334155 !important;
      }
      .grid button.bg-white:hover {
        border-color: #38bdf8 !important;
      }
      .border-gray-100 {
        border-color: #334155 !important;
      }
      /* Selected placeholder */
      .border-gray-300 {
        border-color: #475569 !important;
        color: #64748b !important;
      }
      /* Selected emoji */
      .border-blue-500.bg-blue-50 {
        background-color: #1e293b !important;
        border-color: #3b82f6 !important;
        box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4) !important;
      }
      /* Success emoji */
      .border-green-500.bg-green-50 {
        background-color: #1e293b !important;
        border-color: #22c55e !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // Pilnas žodžių sąrašas su tiksliais skiemenimis
    const WORDS_DATA = [
      { word: "TELEFONAS", syllables: ["TE", "LE", "FO", "NAS"], emoji: "📱" },
      { word: "DRUGELIS", syllables: ["DRU", "GE", "LIS"], emoji: "🦋" },
      { word: "AGURKAS", syllables: ["A", "GUR", "KAS"], emoji: "🥒" },
      { word: "ŠUO", syllables: ["ŠUO"], emoji: "🐶" },
      { word: "PICA", syllables: ["PI", "CA"], emoji: "🍕" },
      { word: "PASPIRTUKAS", syllables: ["PAS", "PIR", "TU", "KAS"], emoji: "🛴" },
      { word: "TRAUKINYS", syllables: ["TRAU", "KI", "NYS"], emoji: "🚂" },
      { word: "VAIVORYKŠTĖ", syllables: ["VAI", "VO", "RYKŠ", "TĖ"], emoji: "🌈" },
      { word: "KATĖ", syllables: ["KA", "TĖ"], emoji: "🐱" },
      { word: "RANKA", syllables: ["RAN", "KA"], emoji: "✋" },
      { word: "EŽYS", syllables: ["E", "ŽYS"], emoji: "🦔" },
      { word: "LANGAS", syllables: ["LAN", "GAS"], emoji: "🪟" },
      { word: "MEDIS", syllables: ["ME", "DIS"], emoji: "🌳" },
      { word: "APELSINAS", syllables: ["A", "PEL", "SI", "NAS"], emoji: "🍊" },
      { word: "AKIS", syllables: ["A", "KIS"], emoji: "👁️" },
      { word: "ŽIRAFA", syllables: ["ŽI", "RA", "FA"], emoji: "🦒" },
      { word: "MAŠINA", syllables: ["MA", "ŠI", "NA"], emoji: "🚗" },
      { word: "OŽYS", syllables: ["O", "ŽYS"], emoji: "🐐" },
      { word: "KOJA", syllables: ["KO", "JA"], emoji: "🦵" },
      { word: "PILIS", syllables: ["PI", "LIS"], emoji: "🏰" },
      { word: "POMIDORAS", syllables: ["PO", "MI", "DO", "RAS"], emoji: "🍅" },
      { word: "MEŠKA", syllables: ["MEŠ", "KA"], emoji: "🐻" },
      { word: "PELĖ", syllables: ["PE", "LĖ"], emoji: "🐭" },
      { word: "SNIEGAS", syllables: ["SNIE", "GAS"], emoji: "🌨️" },
      { word: "LŪPA", syllables: ["LŪ", "PA"], emoji: "👄" },
      { word: "BATAI", syllables: ["BA", "TAI"], emoji: "👟" },
      { word: "ŽĄSIS", syllables: ["ŽĄ", "SIS"], emoji: "🪿" },
      { word: "UOGA", syllables: ["UO", "GA"], emoji: "🫐" },
      { word: "BEŽDŽIONĖ", syllables: ["BEŽ", "DŽIO", "NĖ"], emoji: "🐒" },
      { word: "VAIKAS", syllables: ["VAI", "KAS"], emoji: "👶" },
      { word: "VARLĖ", syllables: ["VAR", "LĖ"], emoji: "🐸" },
      { word: "NAMAS", syllables: ["NA", "MAS"], emoji: "🏠" },
      { word: "SAULĖ", syllables: ["SAU", "LĖ"], emoji: "☀️" },
      { word: "SŪRIS", syllables: ["SŪ", "RIS"], emoji: "🧀" },
      { word: "LEDAI", syllables: ["LE", "DAI"], emoji: "🍦" },
      { word: "LĖKTUVAS", syllables: ["LĖK", "TU", "VAS"], emoji: "✈️" },
      { word: "ŽVAIGŽDĖ", syllables: ["ŽVAIGŽ", "DĖ"], emoji: "⭐" },
      { word: "DUONA", syllables: ["DUO", "NA"], emoji: "🍞" },
      { word: "KĖDĖ", syllables: ["KĖ", "DĖ"], emoji: "🪑" },
      { word: "PIENAS", syllables: ["PIE", "NAS"], emoji: "🥛" },
      { word: "MUSĖ", syllables: ["MU", "SĖ"], emoji: "🪰" },
      { word: "ROŽĖ", syllables: ["RO", "ŽĖ"], emoji: "🌹" },
      { word: "ORAS", syllables: ["O", "RAS"], emoji: "💨" },
      { word: "BITĖ", syllables: ["BI", "TĖ"], emoji: "🐝" },
      { word: "JŪRA", syllables: ["JŪ", "RA"], emoji: "🌊" },
      { word: "ŽUVIS", syllables: ["ŽU", "VIS"], emoji: "🐟" },
      { word: "LOVA", syllables: ["LO", "VA"], emoji: "🛌" },
      { word: "NOSIS", syllables: ["NO", "SIS"], emoji: "👃" },
      { word: "LAMA", syllables: ["LA", "MA"], emoji: "🦙" },
      { word: "ŠOKOLADAS", syllables: ["ŠO", "KO", "LA", "DAS"], emoji: "🍫" },
      { word: "VILKAS", syllables: ["VIL", "KAS"], emoji: "🐺" },
      { word: "DVIRATIS", syllables: ["DVI", "RA", "TIS"], emoji: "🚲" },
      { word: "MORKA", syllables: ["MOR", "KA"], emoji: "🥕" },
      { word: "UPĖ", syllables: ["U", "PĖ"], emoji: "🏞️" },
      { word: "MAMA", syllables: ["MA", "MA"], emoji: "👩" },
      { word: "LĖLĖ", syllables: ["LĖ", "LĖ"], emoji: "🎎" },
      { word: "DURYS", syllables: ["DU", "RYS"], emoji: "🚪" },
      { word: "BANANAS", syllables: ["BA", "NA", "NAS"], emoji: "🍌" },
      { word: "CITRINA", syllables: ["CIT", "RI", "NA"], emoji: "🍋" },
      { word: "OBUOLYS", syllables: ["O", "BUO", "LYS"], emoji: "🍎" },
      { word: "KROKODILAS", syllables: ["KRO", "KO", "DI", "LAS"], emoji: "🐊" },
      { word: "DRAMBLYS", syllables: ["DRAM", "BLYS"], emoji: "🐘" },
      { word: "RAKETA", syllables: ["RA", "KE", "TA"], emoji: "🚀" },
      { word: "BRAŠKĖ", syllables: ["BRAŠ", "KĖ"], emoji: "🍓" },
      { word: "TIGRAS", syllables: ["TIG", "RAS"], emoji: "🐅" },
      { word: "ZEBRAS", syllables: ["ZEB", "RAS"], emoji: "🦓" }
    ];

    const PRAISE_WORDS = ["Puiku!", "Šaunuolis!", "Teisingai!", "Nuostabu!", "Labai gerai!"];

    function App() {
      const [gameState, setGameState] = useState('start');
      const [score, setScore] = useState(0);
      const [streak, setStreak] = useState(0);
      const [currentWord, setCurrentWord] = useState(null);
      const [options, setOptions] = useState([]);
      const [selectedEmoji, setSelectedEmoji] = useState(null);
      const [feedback, setFeedback] = useState(null);
      const [wrongAnswers, setWrongAnswers] = useState(new Set());
      const [hasExtraChance, setHasExtraChance] = useState(true);
      const [hintUsed, setHintUsed] = useState(false);
      
      const [wordPool, setWordPool] = useState([]);

      const playIncorrectSound = playWrongSound;
      const isInIframe = typeof window !== 'undefined' && window.self !== window.top;

      const getNextWord = useCallback(() => {
        let currentPool = [...wordPool];
        
        if (currentPool.length === 0) {
          currentPool = shuffleArray(WORDS_DATA);
        }
        
        const nextItem = currentPool.pop();
        setWordPool(currentPool);
        
        return nextItem;
      }, [wordPool]);

      const generateRound = useCallback(() => {
        const correctItem = getNextWord();
        
        const otherItems = WORDS_DATA.filter(item => item.word !== correctItem.word);
        const shuffledOthers = shuffleArray(otherItems);
        const wrongOptions = shuffledOthers.slice(0, 9).map(item => item.emoji);
        
        const allOptions = shuffleArray([correctItem.emoji, ...wrongOptions]);
        
        setCurrentWord(correctItem);
        setOptions(allOptions);
        setSelectedEmoji(null);
        setFeedback(null);
        setWrongAnswers(new Set());
        setHasExtraChance(true); 
        setHintUsed(false);

      }, [getNextWord]);

      const startGame = () => {
        initAudio();
        setScore(0);
        setStreak(0);
        setWordPool(shuffleArray(WORDS_DATA));
        setGameState('playing');
      };

      useEffect(() => {
        if (gameState === 'playing' && currentWord === null) {
          generateRound();
        }
      }, [gameState, currentWord, generateRound]);

      const handleEmojiClick = (emoji) => {
        if (feedback?.type === 'success' || wrongAnswers.has(emoji)) return;
        playSelectSound();
        setSelectedEmoji(emoji);
      };

      const handleUseHint = () => {
        if (hintUsed || !currentWord || feedback?.type === 'success') return;
        if (typeof playHintSound === 'function') playHintSound();
        setHintUsed(true);
        const candidates = options.filter(em => em !== currentWord.emoji && !wrongAnswers.has(em));
        const toRemove = shuffleArray(candidates).slice(0, 5);
        setWrongAnswers(prev => new Set([...prev, ...toRemove]));
        if (toRemove.includes(selectedEmoji)) {
          setSelectedEmoji(null);
        }
      };

      const handleConfirmGuess = () => {
        if (!selectedEmoji) return;

        if (selectedEmoji === currentWord.emoji) {
          playCorrectSound();
          
          const newStreak = streak + 1;
          const pointsEarned = 10 + (Math.floor(newStreak / 5) * 5);
          
          setScore(prev => prev + pointsEarned);
          setStreak(newStreak);
          
          const praise = PRAISE_WORDS[Math.floor(Math.random() * PRAISE_WORDS.length)];
          setFeedback({ text: `${praise} +${pointsEarned}`, type: 'success' });
          
          setTimeout(() => {
            generateRound();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }, 1500);

        } else {
          playIncorrectSound();
          
          if (hasExtraChance) {
            setHasExtraChance(false);
            setFeedback({ text: "Ne tas! Bandyk dar kartą (Serija išsaugota)", type: 'error' });
          } else {
            setStreak(0); 
            setFeedback({ text: "Suklydai! Serija nutrūko.", type: 'error' });
          }

          setWrongAnswers(prev => new Set([...prev, selectedEmoji]));
          setSelectedEmoji(null);
          
          setTimeout(() => {
            setFeedback(prev => prev?.type === 'error' ? null : prev);
          }, 2000);
        }
      };

      if (gameState === 'start') {
        return (
          <div className="min-h-screen bg-blue-100 flex flex-col items-center justify-center p-4 font-sans text-center select-none">
            <h1 className="text-4xl md:text-6xl font-extrabold text-blue-600 mb-6 drop-shadow-sm">
              Skaitymo Žaidimas
            </h1>
            
            <div className="text-7xl md:text-8xl mb-8 animate-bounce">
              🐶🐱🚗
            </div>

            <button 
              onClick={startGame}
              className="bg-green-500 hover:bg-green-600 text-white text-2xl md:text-3xl font-black py-4 md:py-5 px-10 rounded-full shadow-[0_8px_0_rgb(21,128,61)] active:shadow-[0_0px_0_rgb(21,128,61)] active:translate-y-2 transition-all cursor-pointer flex items-center gap-2"
            >
              <span>Žaisti</span> <span>➔</span>
            </button>
          </div>
        );
      }

      return (
        <div className="h-screen max-h-screen overflow-hidden bg-yellow-50 flex flex-col items-center justify-between p-2.5 sm:p-5 font-sans selection:bg-transparent select-none">
          
          {/* Informacinė juosta */}
          <div className="w-full max-w-4xl flex justify-between items-center bg-white px-3 sm:px-4 py-2 rounded-2xl sm:rounded-3xl shadow-md border-2 sm:border-4 border-yellow-200 shrink-0">
            <div className="flex items-center gap-2">
              <button onClick={() => setGameState('start')} className="p-1.5 sm:p-2 bg-slate-100 hover:bg-slate-200 active:scale-95 rounded-xl sm:rounded-2xl text-lg sm:text-xl transition-all" title="Atgal">{isInIframe ? '🔙' : '🏠'}</button>
              <span className="text-lg sm:text-2xl font-black text-blue-600 flex items-center gap-1">⭐ {score}</span>
            </div>
            
            {/* Papildomas šansas */}
            <div className="flex items-center justify-center gap-2">
              <span className={`text-2xl sm:text-3xl transition-all duration-300 ${hasExtraChance ? 'opacity-100 scale-100' : 'opacity-20 scale-75 grayscale'}`} title="Šansas">
                ❤️
              </span>
              {!hintUsed && (
                <button onClick={handleUseHint} className="hint-btn">
                  <span>💡</span> <span>Užuomina</span>
                </button>
              )}
            </div>

            <div className="text-lg sm:text-2xl font-black text-orange-500 flex items-center gap-1">
              🔥 {streak}
            </div>
          </div>

          {/* Žodis (suskirstytas spalvotais skiemenimis) */}
          <div className="w-full max-w-4xl flex flex-col items-center justify-center my-1">
            <h2 className="text-4xl sm:text-6xl lg:text-7xl font-black tracking-wide text-center uppercase break-all flex flex-wrap justify-center drop-shadow-sm leading-tight">
              {currentWord?.syllables.map((syl, index) => (
                <span key={index} style={{ color: SYLLABLE_COLORS[index % SYLLABLE_COLORS.length] }}>
                  {syl}
                </span>
              ))}
            </h2>
            
            {/* Pasirinktas emoji ir pranešimai */}
            <div className="mt-2 flex flex-col items-center justify-center w-full">
              {/* Pasirinkto emoji rodymas */}
              <div className="h-16 sm:h-24 flex items-center justify-center w-full">
                {selectedEmoji ? (
                  <div className="text-5xl sm:text-7xl drop-shadow-md transition-all scale-110 animate-[bounce_0.3s_ease-out_1]">
                    {selectedEmoji}
                  </div>
                ) : (
                  <div className="w-14 h-14 sm:w-20 sm:h-20 border-4 border-dashed border-gray-300 rounded-2xl sm:rounded-3xl flex items-center justify-center text-gray-300 text-2xl sm:text-4xl opacity-50">
                    ?
                  </div>
                )}
              </div>

              {/* Klaidos/Sėkmės pranešimas */}
              <div className="h-8 mt-1 flex items-center justify-center w-full">
                {feedback && (
                  <div className={`text-sm sm:text-xl font-bold px-4 py-1 rounded-full text-center ${
                    feedback.type === 'success' 
                      ? 'bg-green-100 text-green-600 border-2 border-green-400 animate-bounce' 
                      : 'bg-red-100 text-red-600 border-2 border-red-400'
                  }`}>
                    {feedback.text}
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* Patvirtinimo mygtukas */}
          <div className="w-full flex items-center justify-center my-1 shrink-0">
              <button
                onClick={handleConfirmGuess}
                disabled={!selectedEmoji || feedback?.type === 'success'}
                className={`
                  text-lg sm:text-2xl font-black py-2.5 sm:py-3.5 px-8 rounded-full transition-all w-full max-w-sm flex items-center justify-center gap-2
                  ${selectedEmoji && feedback?.type !== 'success'
                    ? 'bg-blue-500 hover:bg-blue-600 text-white shadow-[0_5px_0_rgb(29,78,216)] active:shadow-[0_0px_0_rgb(29,78,216)] active:translate-y-[5px] animate-pulse cursor-pointer' 
                    : 'bg-gray-300 text-gray-500 cursor-not-allowed opacity-70'}
                `}
              >
                <span>✅</span> <span>Patvirtinti</span>
              </button>
          </div>

          {/* Tinklelis: 5 stulpeliai x 2 eilutės mažuose ekranuose, kad nereikėtų slinkti */}
          <div className="w-full max-w-3xl grid grid-cols-5 gap-2 sm:gap-4 pb-1 shrink-0">
            {options.map((emoji, index) => {
              const isWrong = wrongAnswers.has(emoji);
              const isSelected = selectedEmoji === emoji;
              const isCorrectAndFound = feedback?.type === 'success' && emoji === currentWord?.emoji;
              
              return (
                <button
                  key={index}
                  onClick={() => handleEmojiClick(emoji)}
                  disabled={isWrong || feedback?.type === 'success'}
                  className={`
                    aspect-square flex items-center justify-center text-3xl min-[380px]:text-4xl sm:text-6xl bg-white rounded-2xl sm:rounded-3xl shadow-md
                    border-2 sm:border-4 transition-all duration-200 cursor-pointer
                    ${isWrong ? 'opacity-25 grayscale cursor-not-allowed scale-95 border-gray-200' : 'border-gray-100 hover:border-blue-200 hover:scale-[1.02]'}
                    ${isSelected && !isCorrectAndFound ? 'border-blue-500 bg-blue-50 scale-105 shadow-lg shadow-blue-200 ring-2 sm:ring-4 ring-blue-300 ring-opacity-50' : ''}
                    ${isCorrectAndFound ? 'scale-110 border-green-500 bg-green-50 shadow-green-200 shadow-xl z-10' : ''}
                  `}
                  style={{
                    animation: isWrong && feedback?.type === 'error' ? 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both' : 'none'
                  }}
                >
                  {emoji}
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    // Aplikacijos paleidimas
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
