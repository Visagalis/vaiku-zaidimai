<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atminties Žaidimas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            touch-action: manipulation;
            user-select: none;
            background-color: #f0fdf4;
            background-image: radial-gradient(#86efac 2px, transparent 2px);
            background-size: 30px 30px;
        }

        :root {
            --card-emoji-size: 2.5rem;
            --card-word-size: 1rem;
            --card-radius: 1rem;
        }

        /* 3D Flip Card Styles */
        .card-container {
            perspective: 1000px;
            width: 100%;
            height: 100%;
            aspect-ratio: 1;
            user-select: none;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            cursor: pointer;
        }

        .card-container.flipped .card-inner,
        .card-container.matched .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: var(--card-radius, 1rem);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 3px solid white;
        }

        .card-back {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            font-size: var(--card-emoji-size, 2.5rem);
            font-weight: 900;
        }

        .card-front {
            background: #fffbeb;
            transform: rotateY(180deg);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3px;
            overflow: hidden;
        }

        .card-emoji {
            font-size: var(--card-emoji-size, 2.5rem);
            line-height: 1;
            display: block;
        }

        .card-word {
            font-size: var(--card-word-size, 1rem);
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.15;
            color: #1e293b;
            word-break: break-word;
            padding: 0 2px;
        }

        .card-container.matched .card-front {
            border-color: #22c55e;
            background: #f0fdf4;
            box-shadow: 0 0 12px #22c55e;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        .feedback-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: #4ade80;
            color: white;
            padding: 0.75rem 1.75rem;
            border-radius: 2rem;
            font-size: 1.75rem;
            font-weight: 900;
            z-index: 50;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        
        .feedback-popup.show {
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body class="h-screen max-h-screen text-slate-800 flex flex-col relative overflow-hidden p-2 sm:p-3">
    
    <!-- Audio Context & Synthesis -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, vol) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playFlip() { playTone(400, 'sine', 0.1, 0.3); }
        function playMatch() { 
            playTone(600, 'sine', 0.1, 0.3); 
            setTimeout(() => playTone(800, 'sine', 0.2, 0.3), 100); 
        }
        function playMismatch() { 
            playTone(300, 'sawtooth', 0.2, 0.3); 
            setTimeout(() => playTone(250, 'sawtooth', 0.2, 0.3), 150);
        }
        function playWin() {
            [400, 500, 600, 800, 1000].forEach((freq, i) => {
                setTimeout(() => playTone(freq, 'sine', 0.2, 0.3), i * 150);
            });
        }
    </script>

    <!-- UI Containers -->
    <div id="start-screen" class="flex flex-col items-center justify-center h-full w-full p-4 absolute inset-0 z-10 bg-white/95 backdrop-blur-sm overflow-y-auto">
        <h1 class="text-3xl sm:text-5xl md:text-6xl font-black text-center text-indigo-600 mb-2 drop-shadow-sm">🃏 Atminties Žaidimas</h1>
        <p class="text-base sm:text-xl md:text-2xl text-center text-slate-600 mb-4 sm:mb-6 font-bold">Surask poras: paveikslėlį ir žodį!</p>
        
        <div class="flex gap-3 sm:gap-4 mb-4 sm:mb-6 text-4xl sm:text-6xl animate-bounce">
            🐱 🍎 🚀
        </div>

        <div class="flex flex-col gap-3 sm:gap-4 w-full max-w-sm">
            <button onclick="startGame(6)" class="py-3 sm:py-4 px-6 bg-green-500 hover:bg-green-600 text-white rounded-2xl text-xl sm:text-2xl font-black shadow-[0_6px_0_#166534] active:translate-y-2 active:shadow-[0_0px_0_#166534] transition-all">Lengva (12 kortelių)</button>
            <button onclick="startGame(8)" class="py-3 sm:py-4 px-6 bg-orange-500 hover:bg-orange-600 text-white rounded-2xl text-xl sm:text-2xl font-black shadow-[0_6px_0_#9a3412] active:translate-y-2 active:shadow-[0_0px_0_#9a3412] transition-all">Vidutinis (16 kortelių)</button>
            <button onclick="startGame(10)" class="py-3 sm:py-4 px-6 bg-red-500 hover:bg-red-600 text-white rounded-2xl text-xl sm:text-2xl font-black shadow-[0_6px_0_#991b1b] active:translate-y-2 active:shadow-[0_0px_0_#991b1b] transition-all">Sunku (20 kortelių)</button>
        </div>
    </div>

    <div id="game-screen" class="hidden flex-col h-full w-full max-w-5xl mx-auto p-2 sm:p-3 absolute inset-0 overflow-hidden">
        <div class="flex justify-between items-center bg-white px-3 py-2 sm:px-4 sm:py-2.5 rounded-2xl shadow-sm mb-2 shrink-0 font-bold text-sm sm:text-base md:text-lg border border-slate-100">
            <div id="score-pairs" class="text-indigo-600">🏆 Poros: 0/6</div>
            <div id="score-attempts" class="text-orange-500">🔄 Bandymai: 0</div>
            <div id="score-time" class="text-emerald-600">⏱ Laikas: 00:00</div>
            <button onclick="showStartScreen()" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-600 rounded-xl text-xs sm:text-sm font-bold ml-1 transition-colors">↩ Meniu</button>
        </div>

        <div id="grid-container" class="flex-1 min-h-0 w-full flex items-center justify-center overflow-hidden p-1">
            <div id="grid"></div>
        </div>
    </div>

    <div id="end-screen" class="hidden flex-col items-center justify-center h-full w-full p-4 absolute inset-0 z-20 bg-white/95 backdrop-blur-md overflow-y-auto">
        <div class="text-6xl sm:text-8xl mb-2 sm:mb-4">🎉</div>
        <h2 class="text-3xl sm:text-4xl md:text-5xl font-black text-center text-green-600 mb-4 sm:mb-6 drop-shadow-sm">Šaunuolis! Visos poros surastos!</h2>
        
        <div id="stars" class="text-5xl sm:text-6xl mb-4 sm:mb-6 flex gap-2"></div>
        
        <div class="bg-indigo-50 p-4 sm:p-6 rounded-3xl shadow-inner w-full max-w-md text-center mb-6 sm:mb-8">
            <p class="text-xl sm:text-2xl font-bold text-slate-700 mb-2">Bandymai: <span id="final-attempts" class="text-indigo-600">0</span></p>
            <p class="text-xl sm:text-2xl font-bold text-slate-700">Laikas: <span id="final-time" class="text-emerald-600">00:00</span></p>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 w-full max-w-md">
            <button onclick="replayGame()" class="flex-1 py-3 sm:py-4 px-6 bg-indigo-500 hover:bg-indigo-600 text-white rounded-2xl text-lg sm:text-xl font-black shadow-[0_6px_0_#3730a3] active:translate-y-2 active:shadow-[0_0px_0_#3730a3] transition-all">Žaisti dar kartą</button>
            <button onclick="showStartScreen()" class="flex-1 py-3 sm:py-4 px-6 bg-slate-400 hover:bg-slate-500 text-white rounded-2xl text-lg sm:text-xl font-black shadow-[0_6px_0_#334155] active:translate-y-2 active:shadow-[0_0px_0_#334155] transition-all">Iš pradžių</button>
        </div>
    </div>

    <div id="feedback" class="feedback-popup">Puiku!</div>

    <script>
        const ALL_PAIRS = [
            { emoji: "🐱", word: "KATĖ" }, { emoji: "🐶", word: "ŠUO" }, { emoji: "🐸", word: "VARLĖ" },
            { emoji: "🌞", word: "SAULĖ" }, { emoji: "🌳", word: "MEDIS" }, { emoji: "🌸", word: "GĖLĖ" },
            { emoji: "🏠", word: "NAMAS" }, { emoji: "🐭", word: "PELĖ" }, { emoji: "🐝", word: "BITĖ" },
            { emoji: "📖", word: "KNYGA" }, { emoji: "☕", word: "ARBATA" }, { emoji: "🍎", word: "OBUOLYS" },
            { emoji: "🚗", word: "MAŠINA" }, { emoji: "🚀", word: "RAKETA" }, { emoji: "⭐", word: "ŽVAIGŽDĖ" },
            { emoji: "🍓", word: "BRAŠKĖ" }, { emoji: "🧀", word: "SŪRIS" }, { emoji: "🍞", word: "DUONA" },
            { emoji: "🥛", word: "PIENAS" }, { emoji: "🚢", word: "LAIVAS" }
        ];

        let currentPairs = 0;
        let pairsFound = 0;
        let attempts = 0;
        let timeElapsed = 0;
        let timer = null;
        let flippedCards = [];
        let canFlip = true;
        
        const screens = {
            start: document.getElementById('start-screen'),
            game: document.getElementById('game-screen'),
            end: document.getElementById('end-screen')
        };
        const grid = document.getElementById('grid');
        const feedback = document.getElementById('feedback');

        function resizeGrid() {
            const container = document.getElementById('grid-container');
            if (!container || !currentPairs || screens.game.classList.contains('hidden')) return;
            
            const w = container.clientWidth;
            const h = container.clientHeight;
            if (w <= 0 || h <= 0) return;
            
            const isLandscape = w >= h;
            let cols, rows;
            if (currentPairs === 6) {
                cols = isLandscape ? 4 : 3;
                rows = isLandscape ? 3 : 4;
            } else if (currentPairs === 8) {
                cols = 4;
                rows = 4;
            } else { // 10 pairs = 20 cards
                cols = isLandscape ? 5 : 4;
                rows = isLandscape ? 4 : 5;
            }
            
            const gap = Math.max(4, Math.min(10, Math.floor(Math.min(w, h) * 0.015)));
            const availW = w - 4;
            const availH = h - 4;
            
            const cardW = Math.floor((availW - (cols - 1) * gap) / cols);
            const cardH = Math.floor((availH - (rows - 1) * gap) / rows);
            const cardSize = Math.max(34, Math.min(cardW, cardH));
            
            grid.style.display = 'grid';
            grid.style.gridTemplateColumns = `repeat(${cols}, ${cardSize}px)`;
            grid.style.gridTemplateRows = `repeat(${rows}, ${cardSize}px)`;
            grid.style.gap = `${gap}px`;
            grid.style.width = 'auto';
            grid.style.height = 'auto';
            grid.style.margin = 'auto';
            
            const emojiSize = Math.max(20, Math.floor(cardSize * 0.48));
            const wordSize = Math.max(10, Math.min(22, Math.floor(cardSize * 0.16)));
            const radius = Math.max(6, Math.floor(cardSize * 0.12));
            
            document.documentElement.style.setProperty('--card-emoji-size', `${emojiSize}px`);
            document.documentElement.style.setProperty('--card-word-size', `${wordSize}px`);
            document.documentElement.style.setProperty('--card-radius', `${radius}px`);
        }

        window.addEventListener('resize', resizeGrid);
        if (window.ResizeObserver) {
            const ro = new ResizeObserver(() => {
                if (!screens.game.classList.contains('hidden')) {
                    resizeGrid();
                }
            });
            const cont = document.getElementById('grid-container');
            if (cont) ro.observe(cont);
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function formatTime(secs) {
            const m = Math.floor(secs / 60).toString().padStart(2, '0');
            const s = (secs % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateUI() {
            document.getElementById('score-pairs').textContent = `🏆 Poros: ${pairsFound}/${currentPairs}`;
            document.getElementById('score-attempts').textContent = `🔄 Bandymai: ${attempts}`;
            document.getElementById('score-time').textContent = `⏱ Laikas: ${formatTime(timeElapsed)}`;
        }

        function startTimer() {
            if (timer) clearInterval(timer);
            timer = setInterval(() => {
                timeElapsed++;
                updateUI();
            }, 1000);
        }

        function stopTimer() {
            if (timer) clearInterval(timer);
            timer = null;
        }

        function showScreen(name) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            Object.values(screens).forEach(s => s.classList.remove('flex'));
            screens[name].classList.remove('hidden');
            screens[name].classList.add('flex');
        }

        function showStartScreen() {
            stopTimer();
            showScreen('start');
        }

        function replayGame() {
            startGame(currentPairs);
        }

        function startGame(pairsCount) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            currentPairs = pairsCount;
            pairsFound = 0;
            attempts = 0;
            timeElapsed = 0;
            flippedCards = [];
            canFlip = true;
            
            updateUI();

            // Generate cards
            const selectedPairs = shuffle([...ALL_PAIRS]).slice(0, pairsCount);
            let deck = [];
            
            selectedPairs.forEach((pair, index) => {
                deck.push({ id: index, type: 'emoji', content: pair.emoji });
                deck.push({ id: index, type: 'word', content: pair.word });
            });
            
            deck = shuffle(deck);
            grid.innerHTML = '';
            
            deck.forEach((card) => {
                const el = document.createElement('div');
                el.className = 'card-container';
                el.dataset.id = card.id;
                
                const contentClass = card.type === 'emoji' ? 'card-emoji' : 'card-word';
                
                el.innerHTML = `
                    <div class="card-inner">
                        <div class="card-back">?</div>
                        <div class="card-front">
                            <span class="${contentClass}">${card.content}</span>
                        </div>
                    </div>
                `;
                
                el.addEventListener('click', () => handleCardClick(el));
                grid.appendChild(el);
            });
            
            showScreen('game');
            requestAnimationFrame(() => {
                resizeGrid();
                setTimeout(resizeGrid, 60);
            });
        }

        function showFeedback(text) {
            feedback.textContent = text;
            feedback.classList.add('show');
            setTimeout(() => feedback.classList.remove('show'), 1000);
        }

        function handleCardClick(card) {
            if (!canFlip || flippedCards.includes(card) || card.classList.contains('matched')) return;
            
            if (attempts === 0 && flippedCards.length === 0) {
                startTimer();
            }

            playFlip();
            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                attempts++;
                updateUI();
                canFlip = false;
                
                const match = flippedCards[0].dataset.id === flippedCards[1].dataset.id;
                
                if (match) {
                    setTimeout(() => {
                        playMatch();
                        flippedCards.forEach(c => c.classList.add('matched'));
                        showFeedback("Puiku!");
                        pairsFound++;
                        updateUI();
                        flippedCards = [];
                        canFlip = true;
                        
                        if (pairsFound === currentPairs) {
                            setTimeout(endGame, 1000);
                        }
                    }, 500);
                } else {
                    setTimeout(() => {
                        playMismatch();
                        flippedCards.forEach(c => c.classList.add('shake'));
                        
                        setTimeout(() => {
                            flippedCards.forEach(c => {
                                c.classList.remove('shake');
                                c.classList.remove('flipped');
                            });
                            flippedCards = [];
                            canFlip = true;
                        }, 500);
                    }, 800);
                }
            }
        }

        function endGame() {
            stopTimer();
            playWin();
            
            document.getElementById('final-attempts').textContent = attempts;
            document.getElementById('final-time').textContent = formatTime(timeElapsed);
            
            let starsStr = "⭐";
            if (attempts <= currentPairs + 2) starsStr = "⭐⭐⭐";
            else if (attempts <= currentPairs * 2) starsStr = "⭐⭐";
            
            document.getElementById('stars').textContent = starsStr;
            
            showScreen('end');
        }
    </script>
</body>
</html>
