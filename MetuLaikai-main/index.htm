        body {
            font-family: 'Nunito', sans-serif;
            background-color: #ecfeff;
            background-image: radial-gradient(#a5f3fc 20%, transparent 20%);
            background-size: 20px 20px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .btn-3d {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-3d:active {
            transform: translateY(4px);
        }

        @keyframes bounce-scale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .bounce-anim {
            animation: bounce-scale 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .shake-anim {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes chug {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(6px); }
        }
        .train-go {
            animation: chug 0.35s ease-in-out infinite;
        }

        .bg-green-500 span {
            color: #ffffff !important;
        }

        /* Tamsioji tema */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0b1120 !important;
                background-image: radial-gradient(#1e293b 20%, transparent 20%) !important;
                color: #f1f5f9 !important;
            }
            #app {
                background-color: #0f172a !important;
                border-color: #334155 !important;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6) !important;
            }
            h2, h1 {
                color: #f8fafc !important;
            }
            .btn-3d {
                background-color: #1e293b !important;
                border-color: #334155 !important;
                color: #f8fafc !important;
                box-shadow: 0 5px 0 #0f172a !important;
            }
            .btn-3d:hover {
                background-color: #273549 !important;
            }
            .bg-cyan-50\/80, .train-box {
                background-color: rgba(30, 41, 59, 0.75) !important;
                border-color: #334155 !important;
            }
            .wagon-empty {
                background-color: #1e293b !important;
                border-color: #475569 !important;
                color: #94a3b8 !important;
            }
            .wagon-active {
                background-color: #1e293b !important;
                border-color: #f59e0b !important;
                color: #fde68a !important;
            }
            .wagon-filled {
                background-color: #0f172a !important;
                border-color: #22c55e !important;
            }
            .text-cyan-900 {
                color: #67e8f9 !important;
            }

    <!-- Apsauga nuo priartinimo gestais (pinch to zoom) -->
    <script>
        document.addEventListener("gesturestart", function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("gesturechange", function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("gestureend", function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("touchstart", function(e) {
            if (e.touches && e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });
        document.addEventListener("touchmove", function(e) {
            if (e.touches && e.touches.length > 1) {

            }

        document.addEventListener("wheel", function(e) {
            if (e.ctrlKey) {
                e.preventDefault();

    <script>
        // Web Audio API
        let audioCtx;
        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playTone(freq, type, duration, startTime=0) {
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);
            gain.gain.setValueAtTime(0.15, ctx.currentTime + startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + startTime);
            osc.stop(ctx.currentTime + startTime + duration);
        }

        function playStepSound(stepIdx) {
            const notes = [440, 493.88, 523.25, 587.33, 659.25];
            playTone(notes[stepIdx % notes.length], 'sine', 0.14, 0);
        }

        function playCorrectSound() {
            playTone(440, 'sine', 0.15, 0);
            playTone(554.37, 'sine', 0.15, 0.08);
            playTone(659.25, 'sine', 0.25, 0.16);
        }

        function playWrongSound() {
            playTone(280, 'sawtooth', 0.2, 0);
            playTone(200, 'sawtooth', 0.25, 0.1);
        }

        function playWinSound() {
            [440, 554, 659, 880].forEach((freq, idx) => {
                playTone(freq, 'sine', 0.25, idx * 0.12);
            });
        }

        // === SKIEMENŲ SPALVINIMAS ===
        const _V = 'aeėęiįyouųūąAEĖĘIĮYOUŲŪĄ';
        const _D = ['ai','au','ei','eu','ie','uo','ui','oi','ia','io','iu'];
        const _L = /[a-ząčęėįšųūžA-ZĄČĘĖĮŠŲŪŽ]/;
        const _O = new Set(['bl','br','dr','dv','fl','fr','gl','gr','gn','kl','kr','kn','kv','pl','pr','sk','sl','sm','sn','sp','sr','st','sv','šl','šv','šn','tr','tv','vr','žl','žv','str','skr','spr']);
        const _SC = ['#dc2626','#2563eb','#16a34a','#ea580c','#9333ea','#db2777'];

        function _syl(word) {
            if (!word || word.length <= 1) return [word || ''];
            const r = []; let s = '', i = 0, n = word.length;
            while (i < n) {
                const c = word[i];
                if (!_L.test(c)) { s += c; i++; continue; }
                if (!_V.includes(c)) { s += c; i++; }
                else {
                    s += c; i++;
                    if (i < n && _V.includes(word[i]) && _D.includes((c + word[i]).toLowerCase())) { s += word[i]; i++; }
                    let j = i, u = [];
                    while (j < n && !_V.includes(word[j])) {
                        if (!_L.test(word[j])) break;
                        if (j+1 < n) { const p = (word[j]+word[j+1]).toLowerCase(); if (p==='ch'||p==='dz'||p==='dž') { u.push(word[j]+word[j+1]); j+=2; continue; } }
                        u.push(word[j]); j++;
                    }
                    if (j >= n || (j < n && !_V.includes(word[j]) && !_L.test(word[j]))) {
                        s += u.join(''); while (j < n && !_L.test(word[j])) { s += word[j]; j++; } i = j;
                        if (i >= n) { r.push(s); s = ''; }
                    } else if (u.length === 0) { r.push(s); s = ''; }
                    else if (u.length === 1) { r.push(s); s = u[0]; i = j; }
                    else {
                        let sp = u.length - 1;
                        if (u.length >= 3) { const l2 = (u[u.length-2]+u[u.length-1]).toLowerCase(); if (_O.has(l2)) sp = u.length - 2; }
                        if (u.length >= 4) { const l3 = (u[u.length-3]+u[u.length-2]+u[u.length-1]).toLowerCase(); if (_O.has(l3)) sp = u.length - 3; }
                        s += u.slice(0, sp).join(''); r.push(s); s = u.slice(sp).join(''); i = j;
                    }
                }
            }
            if (s) r.push(s);
            return r.filter(x => x.length > 0);
        }

        function _col(text) {
            if (!text) return '';
            return text.split(/(\s+)/).map(token => {
                if (!token.trim() || !/[a-ząčęėįšųūžA-ZĄČĘĖĮŠŲŪŽ]/.test(token)) return token;
                const syls = _syl(token);
                return syls.map((s, i) => '<span style="color:' + _SC[i % _SC.length] + '">' + s + '</span>').join('');
            }).join('');
        }

        let state = {
            mode: 'seasons',
            questions: [],
            currentIndex: 0,
            totalPossible: 10,
            score: 0,
            streak: 0,
            firstTry: true,
            waiting: false,
            // Mode 3 train state
            trainStep: 0,
            shuffledCards: [],
            usedCardIndices: []
        };

        const appEl = document.getElementById('app');

        function shuffle(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function renderStartScreen() {
            appEl.innerHTML = `
                <div class="p-5 sm:p-8 flex flex-col items-center justify-center text-center">

                        <button onclick="startGame('seasons')" class="btn-3d py-3 sm:py-3.5 px-5 bg-cyan-100 hover:bg-cyan-200 border-2 border-cyan-400 rounded-2xl text-lg sm:text-xl font-black shadow-[0_5px_0_#0891b2] active:shadow-[0_0px_0_#0891b2] transition-all">

        function startGame(mode) {
            getAudioCtx();
            state.mode = mode;
            state.score = 0;
            state.streak = 0;
            state.currentIndex = 0;

            if (mode === 'train') {
                state.questions = shuffle(TRAIN_SEQUENCES);
                state.totalPossible = state.questions.length;
                prepareTrainQuestion();
            } else {
                const pool = mode === 'seasons' ? SEASONS_DATA : CALENDAR_DATA;
                state.questions = shuffle(pool).slice(0, 10);
                state.totalPossible = 10;
                renderQuestion();
            }
        }

        function prepareTrainQuestion() {
            if (state.currentIndex >= state.questions.length) {
                renderEndScreen();
                return;
            }
            const q = state.questions[state.currentIndex];
            state.trainStep = 0;
            state.usedCardIndices = [];
            state.firstTry = true;
            state.waiting = false;

            let cards = shuffle([...q.items]);
            if (cards.every((w, idx) => w === q.items[idx])) {
                cards.push(cards.shift());
            }
            state.shuffledCards = cards;
            renderTrainQuestion();
        }

        function renderTrainQuestion() {
            const q = state.questions[state.currentIndex];
            const isComplete = state.trainStep >= q.items.length;

            const wagonsHtml = q.items.map((item, idx) => {
                const isFilled = idx < state.trainStep;
                const isCurrent = idx === state.trainStep;
                if (isFilled) {
                    return `
                        <div class="wagon-filled flex flex-col items-center justify-center px-2.5 py-2 rounded-2xl bg-green-50 border-2 border-green-500 shadow-sm min-w-[78px] sm:min-w-[100px] bounce-anim">

                            <span class="text-xs leading-none mt-0.5">🛞 🛞</span>
                        </div>
                    `;
                } else if (isCurrent) {
                    return `
                        <div class="wagon-active flex flex-col items-center justify-center px-2.5 py-2 rounded-2xl bg-amber-50 border-2 border-amber-400 ring-2 ring-amber-300 min-w-[78px] sm:min-w-[100px]">
                            <span class="text-[10px] sm:text-xs font-extrabold text-amber-700">${idx + 1} vagonas</span>
                            <span class="text-base sm:text-xl font-black text-amber-600">❓</span>
                            <span class="text-xs leading-none mt-0.5">🛞 🛞</span>
                        </div>
                    `;
                } else {
                    return `
                        <div class="wagon-empty flex flex-col items-center justify-center px-2.5 py-2 rounded-2xl bg-slate-50 border-2 border-dashed border-slate-300 min-w-[78px] sm:min-w-[100px] opacity-75">
                            <span class="text-[10px] sm:text-xs font-extrabold text-slate-400">${idx + 1} vagonas</span>
                            <span class="text-sm sm:text-lg font-black text-slate-300">•••</span>
                            <span class="text-xs leading-none mt-0.5">🛞 🛞</span>
                        </div>
                    `;
                }
            }).join('<span class="text-slate-400 font-black text-xs sm:text-sm">🔗</span>');

            const cardsHtml = state.shuffledCards.map((word, idx) => {
                const isUsed = state.usedCardIndices.includes(idx);
                return `
                    <button id="card-${idx}" onclick="handleTrainCard(${idx})" ${isUsed ? 'disabled' : ''}
                        class="btn-3d py-2.5 sm:py-3.5 px-3 bg-cyan-50 hover:bg-cyan-100 border-2 border-cyan-300 rounded-2xl text-sm sm:text-lg font-black shadow-[0_4px_0_#67e8f9] active:shadow-[0_0px_0_#67e8f9] transition-all flex items-center justify-center text-center ${isUsed ? 'opacity-25 scale-95 pointer-events-none' : ''}">
                        ${_col(word)}
                    </button>
                `;
            }).join('');

            const gridCols = q.items.length === 3 ? 'grid-cols-3' : (q.items.length === 5 ? 'grid-cols-2 sm:grid-cols-3' : 'grid-cols-2');

            appEl.innerHTML = `
                <!-- Top Status Bar -->
                <div class="bg-cyan-500 text-white px-3 sm:px-4 py-2 sm:py-2.5 flex justify-between items-center font-bold text-xs sm:text-base shadow">
                    <div class="flex items-center gap-2">
                        <button onclick="renderStartScreen()" class="bg-cyan-600 hover:bg-cyan-700 px-2.5 py-1 rounded-xl text-sm" title="Į pradžią">🏠</button>
                        <span>⭐ Taškai: <span class="text-yellow-200">${state.score}</span></span>
                    </div>
                    <div class="bg-cyan-600 px-2.5 py-1 rounded-xl">Traukinukas: ${state.currentIndex + 1} / ${state.questions.length}</div>
                    <div>🔥 Serija: <span class="text-orange-200">${state.streak}</span></div>
                </div>

                <div class="p-3 sm:p-5 flex-1 flex flex-col justify-between items-center">
                    <div class="text-center">
                        <h2 class="text-base sm:text-xl font-black text-slate-800">${_col(q.prompt)}</h2>
                        <p class="text-xs sm:text-sm font-bold text-cyan-700 mt-0.5">${_col(q.subtitle)}</p>
                    </div>

                    <!-- Traukinuko vagonėliai -->
                    <div id="train-container" class="train-box w-full my-auto py-3 px-2 sm:px-3 bg-cyan-50/80 rounded-3xl border-2 border-cyan-200 shadow-inner flex flex-wrap items-center justify-center gap-1 sm:gap-1.5 ${isComplete ? 'train-go' : ''}">
                        <div class="text-3xl sm:text-5xl mr-1">🚂</div>
                        ${wagonsHtml}
                    </div>

                    <div id="feedback" class="h-6 sm:h-8 flex items-center justify-center text-sm sm:text-lg font-black my-1 opacity-0 transition-opacity">
                        Pranešimas
                    </div>

                    <div class="grid ${gridCols} gap-2 sm:gap-3 w-full">
                        ${cardsHtml}
                    </div>
                </div>
            `;
        }

        function handleTrainCard(cardIdx) {
            if (state.waiting || state.usedCardIndices.includes(cardIdx)) return;

            const q = state.questions[state.currentIndex];
            const chosenWord = state.shuffledCards[cardIdx];
            const expectedWord = q.items[state.trainStep];

            if (chosenWord === expectedWord) {
                state.usedCardIndices.push(cardIdx);
                state.trainStep++;

                if (state.trainStep >= q.items.length) {
                    state.waiting = true;
                    playCorrectSound();
                    if (state.firstTry) {
                        state.score++;
                        state.streak++;
                    }
                    renderTrainQuestion();
                    const feedback = document.getElementById('feedback');
                    if (feedback) {
                        feedback.innerHTML = _col("Šaunu! Traukinukas pajuda!") + " 🚂💨";
                        feedback.className = "h-6 sm:h-8 flex items-center justify-center text-sm sm:text-lg font-black my-1 text-green-600 opacity-100";
                    }
                    setTimeout(() => {
                        state.currentIndex++;
                        prepareTrainQuestion();
                    }, 1250);
                } else {
                    playStepSound(state.trainStep - 1);
                    renderTrainQuestion();
                    const feedback = document.getElementById('feedback');
                    if (feedback) {
                        feedback.innerHTML = _col("Puiku! Kas eina toliau?") + " 👍";
                        feedback.className = "h-6 sm:h-8 flex items-center justify-center text-sm sm:text-lg font-black my-1 text-green-600 opacity-100";
                    }
                }
            } else {
                state.firstTry = false;
                state.streak = 0;
                playWrongSound();
                const btn = document.getElementById(`card-${cardIdx}`);
                const feedback = document.getElementById('feedback');
                if (btn) {
                    btn.classList.add('shake-anim', 'border-red-400', 'bg-red-50');
                    setTimeout(() => {
                        btn.classList.remove('shake-anim', 'border-red-400', 'bg-red-50');
                    }, 450);
                }
                if (feedback) {
                    feedback.innerHTML = _col("Šis vagonėlis eina vėliau! Bandyk kitą!") + " 🤔";
                    feedback.className = "h-6 sm:h-8 flex items-center justify-center text-sm sm:text-lg font-black my-1 text-red-500 opacity-100";
                }
            }
        }

        function renderQuestion() {
            if (state.currentIndex >= state.questions.length) {
                renderEndScreen();
                return;
            }

            state.firstTry = true;
            state.waiting = false;
            const q = state.questions[state.currentIndex];
            const options = shuffle([...q.options]);

            const optionsHtml = options.map((opt, idx) => `
                <button id="btn-${idx}" onclick="handleAnswer('${opt.replace(/'/g, "\\'")}', this)" 
                    class="btn-3d py-3 sm:py-4 px-3 bg-cyan-50 hover:bg-cyan-100 text-cyan-950 border-2 border-cyan-300 rounded-2xl text-base sm:text-xl font-black shadow-[0_5px_0_#a5f3fc] active:shadow-[0_0px_0_#a5f3fc] transition-all flex items-center justify-center text-center">
                    ${_col(opt)}
                </button>
            `).join('');

            appEl.innerHTML = `
                <!-- Top Status Bar -->
                <div class="bg-cyan-500 text-white px-3 sm:px-4 py-2 sm:py-2.5 flex justify-between items-center font-bold text-xs sm:text-base shadow">
                    <div class="flex items-center gap-2">
                        <button onclick="renderStartScreen()" class="bg-cyan-600 hover:bg-cyan-700 px-2.5 py-1 rounded-xl text-sm" title="Į pradžią">🏠</button>
                        <span>⭐ Taškai: <span class="text-yellow-200">${state.score}</span></span>
                    </div>
                    <div class="bg-cyan-600 px-3 py-1 rounded-xl">Klausimas: ${state.currentIndex + 1} / 10</div>
                    <div>🔥 Serija: <span class="text-orange-200">${state.streak}</span></div>
                </div>

                <div class="p-3 sm:p-5 flex-1 flex flex-col justify-between items-center">
                    <h2 class="text-xl sm:text-2xl font-black text-slate-800 text-center mb-1">${_col(q.prompt)}</h2>

                    <div class="my-auto py-3 px-6 flex flex-col items-center justify-center bg-cyan-50/80 rounded-3xl border-2 border-cyan-200 min-h-[110px] sm:min-h-[130px] shadow-inner text-center">
                        <div class="text-5xl sm:text-6xl mb-1">${q.emoji}</div>
                        <p class="text-base sm:text-lg font-bold text-cyan-900">${_col(q.desc)}</p>
                    </div>

                    <div id="feedback" class="h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 opacity-0 transition-opacity">
                        Pranešimas
                    </div>

                    <div class="grid grid-cols-2 gap-2.5 sm:gap-3.5 w-full mt-1">
                        ${optionsHtml}
                    </div>
                </div>
            `;
        }

        function handleAnswer(selected, btn) {
            if (state.waiting) return;

            const q = state.questions[state.currentIndex];
            const feedback = document.getElementById('feedback');

            if (selected === q.correct) {
                state.waiting = true;
                playCorrectSound();
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }

                btn.classList.remove('bg-cyan-50', 'text-cyan-950', 'border-cyan-300');
                btn.classList.add('bg-green-500', 'text-white', 'border-green-600', 'shadow-[0_5px_0_#15803d]', 'bounce-anim');

                feedback.innerHTML = _col("Puiku! Teisingai!") + " 🎉";
                feedback.className = "h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 text-green-600 opacity-100";

                setTimeout(() => {
                    state.currentIndex++;
                    renderQuestion();
                }, 1200);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playWrongSound();

                btn.classList.remove('bg-cyan-50', 'text-cyan-950');
                btn.classList.add('bg-red-100', 'text-red-400', 'line-through', 'border-red-300', 'opacity-60', 'shake-anim');
                btn.disabled = true;

                feedback.innerHTML = _col("Bandyk dar kartą!") + " 🤔";
                feedback.className = "h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 text-red-500 opacity-100";

                setTimeout(() => {
                    btn.classList.remove('shake-anim');
                }, 400);
            }
        }

        function renderEndScreen() {
            playWinSound();
            const ratio = state.score / state.totalPossible;
            let stars = "⭐";
            if (ratio >= 0.8) stars = "⭐⭐⭐";
            else if (ratio >= 0.5) stars = "⭐⭐";

            appEl.innerHTML = `
                <div class="p-6 sm:p-8 flex flex-col items-center justify-center text-center">
                    <div class="text-7xl mb-2">🎉</div>
                    <h2 class="text-3xl sm:text-4xl font-black text-green-600 mb-2">${_col('Šaunuolis!')}</h2>
                    <div class="text-5xl mb-4 tracking-wider">${stars}</div>
                    <p class="text-xl font-bold text-slate-700 mb-1">${_col('Surinkai taškų:')}</p>
                    <p class="text-4xl font-black text-cyan-600 mb-6">${state.score} / ${state.totalPossible}</p>
                    
                    <div class="flex flex-col sm:flex-row gap-3 w-full max-w-sm">
                        <button onclick="startGame(state.mode)" class="btn-3d flex-1 py-3.5 bg-cyan-100 hover:bg-cyan-200 border-2 border-cyan-400 rounded-2xl text-lg font-black shadow-[0_5px_0_#0891b2] active:shadow-[0_0px_0_#0891b2] transition-all">
                            🔄 ${_col('Dar kartą')}
                        </button>
                        <button onclick="renderStartScreen()" class="btn-3d flex-1 py-3.5 bg-slate-100 hover:bg-slate-200 border-2 border-slate-300 rounded-2xl text-lg font-black shadow-[0_5px_0_#94a3b8] active:shadow-[0_0px_0_#94a3b8] transition-all">
                            🏠 ${_col('Iš pradžių')}
                        </button>
                    </div>
                </div>
            `;
        }

        renderStartScreen();
    </script>
</body>
</html>
