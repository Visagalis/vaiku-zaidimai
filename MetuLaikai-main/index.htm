<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>🗓️ Metų Laikai ir Kalendorius</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/common.css">
    <script src="../shared/common.js"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #ecfeff;
            background-image: radial-gradient(#a5f3fc 20%, transparent 20%);
            background-size: 20px 20px;
        }

        

        @keyframes chug {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(6px); }
        }
        .train-go {
            animation: chug 0.35s ease-in-out infinite;
        }

        /* Tamsioji tema */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0b1120 !important;
                background-image: radial-gradient(#1e293b 20%, transparent 20%) !important;
                color: #f1f5f9 !important;
            }
            #app {
                background-color: #0f172a !important;
                border-color: #334155 !important;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6) !important;
            }
            h2, h1 {
                color: #f8fafc !important;
            }
            .btn-3d {
                background-color: #1e293b !important;
                border-color: #334155 !important;
                color: #f8fafc !important;
                box-shadow: 0 5px 0 #0f172a !important;
            }
            .btn-3d:hover {
                background-color: #273549 !important;
            }
            .bg-cyan-50\/80, .train-box {
                background-color: rgba(30, 41, 59, 0.75) !important;
                border-color: #334155 !important;
            }
            .wagon-empty {
                background-color: #1e293b !important;
                border-color: #475569 !important;
                color: #94a3b8 !important;
            }
            .wagon-active {
                background-color: #1e293b !important;
                border-color: #f59e0b !important;
                color: #fde68a !important;
            }
            .wagon-filled {
                background-color: #0f172a !important;
                border-color: #22c55e !important;
            }
            .text-cyan-900 {
                color: #67e8f9 !important;
            }
        }
    </style>
</head>
<body class="h-screen max-h-screen flex items-center justify-center p-2 sm:p-4 overflow-hidden transition-colors duration-200">

    <div id="app" class="w-full max-w-2xl bg-white/95 backdrop-blur-md rounded-3xl shadow-xl flex flex-col relative border-4 border-cyan-300 overflow-hidden max-h-full">
        <!-- Turinis bus atvaizduotas dinamiškai per JS -->
    </div>

    <script>
        // Duomenų bazė: 1 režimas (Metų laikai)
        const SEASONS_DATA = [
            {
                prompt: "Koks tai metų laikas? ⛄",
                desc: "Lipdomas sniego senis, čiuožiama rogutėmis 🛷",
                emoji: "⛄ ❄️ 🛷",
                correct: "Žiema",
                options: ["Žiema", "Pavasaris", "Vasara", "Ruduo"]
            },
            {
                prompt: "Koks tai metų laikas? 🏖️",
                desc: "Labai karšta, vaikai maudosi jūroje ir valgo ledus 🍦",
                emoji: "🏖️ ☀️ 🍦",
                correct: "Vasara",
                options: ["Vasara", "Žiema", "Ruduo", "Pavasaris"]
            },
            {
                prompt: "Koks tai metų laikas? 🍁",
                desc: "Gelsta ir krenta medžių lapai, grybaujama miške 🍄",
                emoji: "🍁 🍂 🍄",
                correct: "Ruduo",
                options: ["Ruduo", "Pavasaris", "Vasara", "Žiema"]
            },
            {
                prompt: "Koks tai metų laikas? 🌸",
                desc: "Tirpsta sniegas, parskrenda paukščiai, žydi snieguolės 🌱",
                emoji: "🌸 🌱 🐦",
                correct: "Pavasaris",
                options: ["Pavasaris", "Vasara", "Ruduo", "Žiema"]
            },
            {
                prompt: "Kada švenčiamos Kalėdos ir puošiama eglutė? 🎄",
                desc: "Eglutė, šaltukas, dovanėlės ir fejerverkai 🎁",
                emoji: "🎄 🎁 ❄️",
                correct: "Žiemą",
                options: ["Žiemą", "Vasarą", "Rudenį", "Pavasarį"]
            },
            {
                prompt: "Kada prinoksta saldžios braškės? 🍓",
                desc: "Šilta saulytė, atostogos ir saldžios uogos 🍓",
                emoji: "🍓 🍉 ☀️",
                correct: "Vasarą",
                options: ["Vasarą", "Žiemą", "Rudenį", "Pavasarį"]
            },
            {
                prompt: "Kada vaikai eina į mokyklą Rugsėjo 1-ąją? 🎒",
                desc: "Nauji mokslo metai, kardeliai ir gelstantys medžiai 📚",
                emoji: "🎒 📚 🍁",
                correct: "Rudenį",
                options: ["Rudenį", "Vasarą", "Pavasarį", "Žiemą"]
            },
            {
                prompt: "Kada dažomi margučiai ir švenčiamos Velykos? 🐣",
                desc: "Pabunda gamta, švenčiamas pavasario atgimimas 🥚",
                emoji: "🐣 🥚 🌸",
                correct: "Pavasarį",
                options: ["Pavasarį", "Rudenį", "Žiemą", "Vasarą"]
            },
            {
                prompt: "Kada reikia šiltos kepurės, pirštinių ir šaliko? 🧤",
                desc: "Spaudžia šaltukas, krenta snaigės ❄️",
                emoji: "🧤 🧣 ❄️",
                correct: "Žiemą",
                options: ["Žiemą", "Vasarą", "Pavasarį", "Rudenį"]
            },
            {
                prompt: "Kada noksta didelės saulėgrąžos ir šviečia karščiausia saulė? 🌻",
                desc: "Ilgiausios dienos ir trumpiausios naktys 🌞",
                emoji: "🌻 🌞 🍉",
                correct: "Vasarą",
                options: ["Vasarą", "Žiemą", "Rudenį", "Pavasarį"]
            }
        ];

        // Duomenų bazė: 2 režimas (Kalendorius ir savaitė)
        const CALENDAR_DATA = [
            {
                prompt: "Kokia diena eina po ANTRADIENIO? 📅",
                desc: "Pirmadienis ➔ Antradienis ➔ ...",
                emoji: "📅 ➡️",
                correct: "Trečiadienis",
                options: ["Trečiadienis", "Ketvirtadienis", "Pirmadienis", "Penktadienis"]
            },
            {
                prompt: "Kokia diena eina po KETVIRTADIENIO? 📅",
                desc: "Ketvirtadienis ➔ ...",
                emoji: "📅 ➡️",
                correct: "Penktadienis",
                options: ["Penktadienis", "Šeštadienis", "Trečiadienis", "Sekmadienis"]
            },
            {
                prompt: "Kokia diena eina prieš SEKMADIENĮ? 📅",
                desc: "... ➔ Sekmadienis",
                emoji: "⬅️ 📅",
                correct: "Šeštadienis",
                options: ["Šeštadienis", "Penktadienis", "Pirmadienis", "Ketvirtadienis"]
            },
            {
                prompt: "Kokia diena pradeda savaitę? 🗓️",
                desc: "Pirmoji savaitės diena yra...",
                emoji: "1️⃣ 🗓️",
                correct: "Pirmadienis",
                options: ["Pirmadienis", "Sekmadienis", "Antradienis", "Šeštadienis"]
            },
            {
                prompt: "Kuri iš šių dienų yra SAVAITGALIS? 🎈",
                desc: "Diena, kai ilsimės nuo mokyklos:",
                emoji: "🎈 🏡",
                correct: "Sekmadienis",
                options: ["Sekmadienis", "Trečiadienis", "Pirmadienis", "Ketvirtadienis"]
            },
            {
                prompt: "Kuris mėnuo pradeda naujus metus? 🎆",
                desc: "Pirmasis metų mėnuo:",
                emoji: "🎆 ❄️",
                correct: "Sausis",
                options: ["Sausis", "Gruodis", "Kovas", "Rugsėjis"]
            },
            {
                prompt: "Kuris mėnuo pradeda vasaros atostogas? ☀️",
                desc: "Pirmasis vasaros mėnuo:",
                emoji: "🏖️ ☀️",
                correct: "Birželis",
                options: ["Birželis", "Gegužė", "Liepa", "Rugpjūtis"]
            },
            {
                prompt: "Kurį mėnesį prasideda mokslo metai? 🔔",
                desc: "Rugsėjo 1-osios mėnuo:",
                emoji: "🔔 🎒",
                correct: "Rugsėjis",
                options: ["Rugsėjis", "Spalis", "Rugpjūtis", "Birželis"]
            },
            {
                prompt: "Kiek dienų turi viena savaitė? 🗓️",
                desc: "Suskaičiuok: Pirm, Antr, Treč, Ketv, Penkt, Šešt, Sekm",
                emoji: "7️⃣ 🗓️",
                correct: "7 dienas",
                options: ["7 dienas", "5 dienas", "10 dienų", "12 dienų"]
            },
            {
                prompt: "Kiek metų laikų yra gamtoje? 🌍",
                desc: "Pavasaris, Vasara, Ruduo, Žiema",
                emoji: "🌍 🌸☀️🍁❄️",
                correct: "4 metų laikai",
                options: ["4 metų laikai", "3 metų laikai", "5 metų laikai", "12 metų laikų"]
            }
        ];

        // Duomenų bazė: 3 režimas (Savaitės ir metų traukinukas)
        const TRAIN_SEQUENCES = [
            {
                prompt: "Sudėliok savaitės dienas iš eilės (nuo Pirmadienio iki Penktadienio)!",
                subtitle: "Darbo dienų traukinukas 📅",
                items: ["Pirmadienis", "Antradienis", "Trečiadienis", "Ketvirtadienis", "Penktadienis"]
            },
            {
                prompt: "Sudėliok savaitgalio ir kitas dienas iš eilės!",
                subtitle: "Nuo Ketvirtadienio iki Sekmadienio 🎈",
                items: ["Ketvirtadienis", "Penktadienis", "Šeštadienis", "Sekmadienis"]
            },
            {
                prompt: "Sudėliok 4 metų laikus iš eilės (pradėk nuo Žiemos)!",
                subtitle: "Metų laikų ratas ❄️🌸☀️🍁",
                items: ["Žiema", "Pavasaris", "Vasara", "Ruduo"]
            },
            {
                prompt: "Sudėliok pavasario mėnesius iš eilės (Kovas, Balandis, Gegužė)!",
                subtitle: "Pavasario traukinukas 🌸",
                items: ["Kovas", "Balandis", "Gegužė"]
            },
            {
                prompt: "Sudėliok vasaros mėnesius iš eilės (Birželis, Liepa, Rugpjūtis)!",
                subtitle: "Vasaros traukinukas ☀️",
                items: ["Birželis", "Liepa", "Rugpjūtis"]
            },
            {
                prompt: "Sudėliok rudens mėnesius iš eilės (Rugsėjis, Spalis, Lapkritis)!",
                subtitle: "Rudens traukinukas 🍁",
                items: ["Rugsėjis", "Spalis", "Lapkritis"]
            },
            {
                prompt: "Sudėliok žiemos mėnesius iš eilės (Gruodis, Sausis, Vasaris)!",
                subtitle: "Žiemos traukinukas ⛄",
                items: ["Gruodis", "Sausis", "Vasaris"]
            },
            {
                prompt: "Sudėliok 4 metų laikus iš eilės (pradėk nuo Pavasario)!",
                subtitle: "Nuo Pavasario iki Žiemos 🌍",
                items: ["Pavasaris", "Vasara", "Ruduo", "Žiema"]
            }
        ];

        let state = {
            mode: 'seasons',
            questions: [],
            currentIndex: 0,
            totalPossible: 10,
            score: 0,
            streak: 0,
            firstTry: true,
            waiting: false,
            hintUsed: false,
            // Mode 3 train state
            trainStep: 0,
            shuffledCards: [],
            usedCardIndices: []
        };

        const appEl = document.getElementById('app');

        function renderStartScreen() {
            appEl.innerHTML = `
                <div class="p-5 sm:p-8 flex flex-col items-center justify-center text-center">
                    <div class="text-5xl sm:text-7xl mb-2 animate-bounce">🗓️</div>
                    <h1 class="text-2xl sm:text-4xl font-black text-cyan-800 mb-4 sm:mb-5">${_col('Metų Laikai ir Kalendorius')}</h1>
                    
                    <div class="flex flex-col gap-3 w-full max-w-sm">
                        <button onclick="startGame('seasons')" class="btn-3d py-3 sm:py-3.5 px-5 bg-cyan-100 hover:bg-cyan-200 border-2 border-cyan-400 rounded-2xl text-lg sm:text-xl font-black shadow-[0_5px_0_#0891b2] active:shadow-[0_0px_0_#0891b2] transition-all flex items-center justify-center gap-2">
                            <span>🌸</span>
                            <span>${_col('Metų laikai')}</span>
                            <span>❄️</span>
                        </button>
                        <button onclick="startGame('calendar')" class="btn-3d py-3 sm:py-3.5 px-5 bg-teal-100 hover:bg-teal-200 border-2 border-teal-400 rounded-2xl text-lg sm:text-xl font-black shadow-[0_5px_0_#0d9488] active:shadow-[0_0px_0_#0d9488] transition-all flex items-center justify-center gap-2">
                            <span>📅</span>
                            <span>${_col('Kalendorius')}</span>
                        </button>
                        <button onclick="startGame('train')" class="btn-3d py-3 sm:py-3.5 px-5 bg-amber-100 hover:bg-amber-200 border-2 border-amber-400 rounded-2xl text-lg sm:text-xl font-black shadow-[0_5px_0_#d97706] active:shadow-[0_0px_0_#d97706] transition-all flex items-center justify-center gap-2">
                            <span>🚂</span>
                            <span>${_col('Traukinukas')}</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function startGame(mode) {
            getAudioCtx();
            state.mode = mode;
            state.score = 0;
            state.streak = 0;
            state.currentIndex = 0;

            if (mode === 'train') {
                state.questions = shuffle(TRAIN_SEQUENCES);
                state.totalPossible = state.questions.length;
                prepareTrainQuestion();
            } else {
                const pool = mode === 'seasons' ? SEASONS_DATA : CALENDAR_DATA;
                state.questions = shuffle(pool).slice(0, 10);
                state.totalPossible = 10;
                renderQuestion();
            }
        }

        function prepareTrainQuestion() {
            if (state.currentIndex >= state.questions.length) {
                renderEndScreen();
                return;
            }
            const q = state.questions[state.currentIndex];
            state.trainStep = 0;
            state.usedCardIndices = [];
            state.firstTry = true;
            state.waiting = false;
            state.hintUsed = false;

            let cards = shuffle([...q.items]);
            if (cards.every((w, idx) => w === q.items[idx])) {
                cards.push(cards.shift());
            }
            state.shuffledCards = cards;
            renderTrainQuestion();
        }

        function renderTrainQuestion() {
            const q = state.questions[state.currentIndex];
            const isComplete = state.trainStep >= q.items.length;

            const wagonsHtml = q.items.map((item, idx) => {
                const isFilled = idx < state.trainStep;
                const isCurrent = idx === state.trainStep;
                if (isFilled) {
                    return `
                        <div class="wagon-filled flex flex-col items-center justify-center px-2.5 py-2 rounded-2xl bg-green-50 border-2 border-green-500 shadow-sm min-w-[78px] sm:min-w-[100px] bounce-anim">
                            <span class="text-[10px] sm:text-xs font-extrabold text-green-700">${idx + 1} vagonas</span>
                            <span class="text-xs sm:text-base font-black text-center">${_col(item)}</span>
                            <span class="text-xs leading-none mt-0.5">🛞 🛞</span>
                        </div>
                    `;
                } else if (isCurrent) {
                    return `
                        <div class="wagon-active flex flex-col items-center justify-center px-2.5 py-2 rounded-2xl bg-amber-50 border-2 border-amber-400 ring-2 ring-amber-300 min-w-[78px] sm:min-w-[100px]">
                            <span class="text-[10px] sm:text-xs font-extrabold text-amber-700">${idx + 1} vagonas</span>
                            <span class="text-base sm:text-xl font-black text-amber-600">❓</span>
                            <span class="text-xs leading-none mt-0.5">🛞 🛞</span>
                        </div>
                    `;
                } else {
                    return `
                        <div class="wagon-empty flex flex-col items-center justify-center px-2.5 py-2 rounded-2xl bg-slate-50 border-2 border-dashed border-slate-300 min-w-[78px] sm:min-w-[100px] opacity-75">
                            <span class="text-[10px] sm:text-xs font-extrabold text-slate-400">${idx + 1} vagonas</span>
                            <span class="text-sm sm:text-lg font-black text-slate-300">•••</span>
                            <span class="text-xs leading-none mt-0.5">🛞 🛞</span>
                        </div>
                    `;
                }
            }).join('<span class="text-slate-400 font-black text-xs sm:text-sm">🔗</span>');

            const cardsHtml = state.shuffledCards.map((word, idx) => {
                const isUsed = state.usedCardIndices.includes(idx);
                return `
                    <button id="card-${idx}" onclick="handleTrainCard(${idx})" ${isUsed ? 'disabled' : ''}
                        class="btn-3d py-2.5 sm:py-3.5 px-3 bg-cyan-50 hover:bg-cyan-100 border-2 border-cyan-300 rounded-2xl text-sm sm:text-lg font-black shadow-[0_4px_0_#67e8f9] active:shadow-[0_0px_0_#67e8f9] transition-all flex items-center justify-center text-center ${isUsed ? 'opacity-25 scale-95 pointer-events-none' : ''}">
                        <span>${_col(word)}</span>
                    </button>
                `;
            }).join('');

            const gridCols = q.items.length === 3 ? 'grid-cols-3' : (q.items.length === 5 ? 'grid-cols-2 sm:grid-cols-3' : 'grid-cols-2');

            appEl.innerHTML = `
                ${renderTopBar({ score: state.score, current: state.currentIndex + 1, total: state.questions.length, streak: state.streak, theme: 'cyan' })}

                <div class="p-3 sm:p-5 flex-1 flex flex-col justify-evenly items-center gap-2">
                    <div class="text-center flex flex-col items-center gap-1.5">
                        <h2 class="text-xl sm:text-2xl font-black text-slate-800">🚂 ${_col(q.prompt || 'Kas toliau?')}</h2>
                        <button id="hint-btn" onclick="showTrainHint()" class="hint-btn ${state.hintUsed ? 'hidden' : ''}">
                            <span>💡</span> <span>${_col('Užuomina')}</span>
                        </button>
                        <div id="hint-box" class="${state.hintUsed ? '' : 'hidden'} hint-box text-center text-sm sm:text-base font-extrabold text-amber-800 max-w-md">
                            💡 ${_col(q.subtitle || '')} — ${_col('toliau:')} <span class="underline">${_col(q.items[state.trainStep] || '')}</span>
                        </div>
                    </div>

                    <!-- Traukinuko vagonėliai -->
                    <div id="train-container" class="train-box w-full py-3 px-2 sm:px-3 bg-cyan-50/80 rounded-3xl border-2 border-cyan-200 shadow-inner flex flex-wrap items-center justify-center content-center gap-1 sm:gap-1.5 ${isComplete ? 'train-go' : ''}">
                        <div class="text-3xl sm:text-5xl mr-1">🚂</div>
                        ${wagonsHtml}
                    </div>

                    <div id="feedback" class="h-6 sm:h-8 flex items-center justify-center text-sm sm:text-lg font-black opacity-0 transition-opacity">
                        Pranešimas
                    </div>

                    <div class="grid ${gridCols} gap-2 sm:gap-3 w-full">
                        ${cardsHtml}
                    </div>
                </div>
            `;
        }

        function showTrainHint() {
            if (state.waiting) return;
            state.hintUsed = true;
            playHintSound();
            const q = state.questions[state.currentIndex];
            const expectedWord = q.items[state.trainStep];
            const hintBtn = document.getElementById('hint-btn');
            const hintBox = document.getElementById('hint-box');
            if (hintBtn) hintBtn.classList.add('hidden');
            if (hintBox) {
                hintBox.innerHTML = `💡 ${_col(q.subtitle || '')} — ${_col('toliau:')} <span class="underline">${_col(expectedWord || '')}</span>`;
                hintBox.classList.remove('hidden');
            }
            const cardIdx = state.shuffledCards.findIndex((w, i) => w === expectedWord && !state.usedCardIndices.includes(i));
            if (cardIdx !== -1) {
                const btn = document.getElementById(`card-${cardIdx}`);
                if (btn) btn.classList.add('ring-4', 'ring-amber-400', 'bounce-anim');
            }
        }

        function handleTrainCard(cardIdx) {
            if (state.waiting || state.usedCardIndices.includes(cardIdx)) return;

            const q = state.questions[state.currentIndex];
            const chosenWord = state.shuffledCards[cardIdx];
            const expectedWord = q.items[state.trainStep];

            if (chosenWord === expectedWord) {
                state.usedCardIndices.push(cardIdx);
                state.trainStep++;

                if (state.trainStep >= q.items.length) {
                    state.waiting = true;
                    playCorrectSound();
                    if (state.firstTry) {
                        state.score++;
                        state.streak++;
                    }
                    renderTrainQuestion();
                    const feedback = document.getElementById('feedback');
                    if (feedback) {
                        feedback.innerHTML = `<span>${_col("Šaunu! Traukinukas pajuda!")} 🚂💨</span>`;
                        feedback.className = "h-6 sm:h-8 flex items-center justify-center text-sm sm:text-lg font-black my-1 text-green-600 opacity-100";
                    }
                    setTimeout(() => {
                        state.currentIndex++;
                        prepareTrainQuestion();
                    }, 1250);
                } else {
                    playStepSound(state.trainStep - 1);
                    renderTrainQuestion();
                    const feedback = document.getElementById('feedback');
                    if (feedback) {
                        feedback.innerHTML = `<span>${_col("Puiku! Kas eina toliau?")} 👍</span>`;
                        feedback.className = "h-6 sm:h-8 flex items-center justify-center text-sm sm:text-lg font-black my-1 text-green-600 opacity-100";
                    }
                }
            } else {
                state.firstTry = false;
                state.streak = 0;
                playWrongSound();
                const btn = document.getElementById(`card-${cardIdx}`);
                const feedback = document.getElementById('feedback');
                if (btn) {
                    btn.classList.add('shake-anim', 'border-red-400', 'bg-red-50');
                    setTimeout(() => {
                        btn.classList.remove('shake-anim', 'border-red-400', 'bg-red-50');
                    }, 450);
                }
                if (feedback) {
                    feedback.innerHTML = `<span>${_col("Šis vagonėlis eina vėliau! Bandyk kitą!")} 🤔</span>`;
                    feedback.className = "h-6 sm:h-8 flex items-center justify-center text-sm sm:text-lg font-black my-1 text-red-500 opacity-100";
                }
                const hintBtn = document.getElementById('hint-btn');
                if (hintBtn && !state.hintUsed) hintBtn.classList.add('hint-btn-pulse');
            }
        }

        function renderQuestion() {
            if (state.currentIndex >= state.questions.length) {
                renderEndScreen();
                return;
            }

            state.firstTry = true;
            state.waiting = false;
            state.hintUsed = false;
            const q = state.questions[state.currentIndex];
            const options = shuffle([...q.options]);

            const optionsHtml = options.map((opt, idx) => `
                <button id="btn-${idx}" onclick="handleAnswer('${opt.replace(/'/g, "\\'")}', this)" 
                    class="btn-3d py-3.5 sm:py-4 px-3 bg-cyan-50 hover:bg-cyan-100 text-cyan-950 border-2 border-cyan-300 rounded-2xl text-lg sm:text-xl font-black shadow-[0_5px_0_#a5f3fc] active:shadow-[0_0px_0_#a5f3fc] transition-all flex items-center justify-center text-center min-h-[56px]">
                    <span>${_col(opt)}</span>
                </button>
            `).join('');

            appEl.innerHTML = `
                ${renderTopBar({ score: state.score, current: state.currentIndex + 1, total: 10, streak: state.streak, theme: 'cyan' })}

                <div class="p-3 sm:p-5 flex-1 flex flex-col justify-evenly items-center gap-2">
                    <h2 class="text-xl sm:text-2xl font-black text-slate-800 text-center">${_col(q.prompt)}</h2>

                    <div class="py-3.5 px-6 flex flex-col items-center justify-center bg-cyan-50/80 rounded-3xl border-2 border-cyan-200 min-h-[110px] sm:min-h-[130px] shadow-inner text-center gap-2 w-full max-w-md">
                        <div class="text-6xl sm:text-7xl">${q.emoji}</div>
                        <button id="hint-btn" onclick="showHint()" class="hint-btn">
                            <span>💡</span> <span>${_col('Užuomina')}</span>
                        </button>
                        <div id="hint-box" class="hidden hint-box text-sm sm:text-base font-extrabold text-amber-800">
                            💡 ${_col(q.desc || '')}
                        </div>
                    </div>

                    <div id="feedback" class="h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black opacity-0 transition-opacity">
                        Pranešimas
                    </div>

                    <div class="grid grid-cols-2 gap-2.5 sm:gap-3.5 w-full">
                        ${optionsHtml}
                    </div>
                </div>
            `;
        }

        function showHint() {
            if (state.waiting || state.hintUsed) return;
            state.hintUsed = true;
            playHintSound();
            const hintBtn = document.getElementById('hint-btn');
            const hintBox = document.getElementById('hint-box');
            if (hintBtn) hintBtn.classList.add('hidden');
            if (hintBox) hintBox.classList.remove('hidden');
        }

        function handleAnswer(selected, btn) {
            if (state.waiting) return;

            const q = state.questions[state.currentIndex];
            const feedback = document.getElementById('feedback');

            if (selected === q.correct) {
                state.waiting = true;
                playCorrectSound();
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }

                btn.classList.remove('bg-cyan-50', 'text-cyan-950', 'border-cyan-300');
                btn.classList.add('bg-green-500', 'text-white', 'border-green-600', 'shadow-[0_5px_0_#15803d]', 'bounce-anim');

                feedback.innerHTML = `<span>${_col("Puiku! Teisingai!")} 🎉</span>`;
                feedback.className = "h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 text-green-600 opacity-100";

                setTimeout(() => {
                    state.currentIndex++;
                    renderQuestion();
                }, 1200);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playWrongSound();

                btn.classList.remove('bg-cyan-50', 'text-cyan-950');
                btn.classList.add('bg-red-100', 'text-red-400', 'line-through', 'border-red-300', 'opacity-60', 'shake-anim');
                btn.disabled = true;

                feedback.innerHTML = `<span>${_col("Bandyk dar kartą!")} 🤔</span>`;
                feedback.className = "h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 text-red-500 opacity-100";

                const hintBtn = document.getElementById('hint-btn');
                if (hintBtn && !state.hintUsed) hintBtn.classList.add('hint-btn-pulse');

                setTimeout(() => {
                    btn.classList.remove('shake-anim');
                }, 400);
            }
        }

        function renderEndScreen() {
            appEl.innerHTML = renderEndScreenHelper({
                score: state.score,
                total: state.totalPossible,
                restartFn: "startGame(state.mode)"
            });
        }

        renderStartScreen();
    </script>
</body>
</html>
