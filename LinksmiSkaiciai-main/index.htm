<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>🔢 Linksmoji Matematika</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/common.css?v=2">
    <script src="../shared/common.js?v=2"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #e0f2fe;
            background-image: radial-gradient(#7dd3fc 20%, transparent 20%);
            background-size: 24px 24px;
            color: #1e293b;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .float-anim { animation: floatSlow 2.8s ease-in-out infinite; }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        /* Tikroviška baliono forma 3-iam režimui */
        .balloon-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .balloon-body {
            width: 122px;
            height: 136px;
            border-radius: 50% 50% 46% 46% / 54% 54% 46% 46%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset -8px -10px 18px rgba(0, 0, 0, 0.18), 0 8px 16px -4px rgba(15, 23, 42, 0.25);
            transition: transform 0.15s ease, opacity 0.2s ease, box-shadow 0.15s ease;
        }
        .balloon-body::before {
            content: '';
            position: absolute;
            top: 14%;
            left: 18%;
            width: 22px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            transform: rotate(28deg);
            pointer-events: none;
        }
        .balloon-knot {
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-bottom: 9px solid currentColor;
            margin-top: -2px;
        }
        .balloon-string {
            width: 2px;
            height: 16px;
            background: rgba(100, 116, 139, 0.55);
            border-radius: 999px;
        }
        .balloon-popped {
            width: 122px;
            height: 136px;
            border-radius: 50% 50% 46% 46% / 54% 54% 46% 46%;
        }
        @media (min-width: 640px) {
            .balloon-body,
            .balloon-popped {
                width: 146px;
                height: 162px;
            }
            .balloon-body::before {
                width: 26px;
                height: 44px;
            }
            .balloon-string {
                height: 20px;
            }
        }
        @media (max-height: 680px) and (max-width: 639px) {
            .balloon-body,
            .balloon-popped {
                width: 108px;
                height: 118px;
            }
            .balloon-string {
                height: 10px;
            }
        }

        /* Šviesios temos kortelės ir panelės */
        .app-card {
            background-color: rgba(255, 255, 255, 0.97);
            border-color: #7dd3fc;
        }
        .panel-box {
            background-color: #f0f9ff;
            border: 2px dashed #38bdf8;
        }
        .sub-panel {
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
        }
        .opt-btn {
            background-color: #e0f2fe;
            color: #0369a1;
            border-color: #7dd3fc;
        }
        .opt-btn:hover {
            background-color: #bae6fd;
        }
        .token-btn {
            background-color: #ffffff;
            border: 2px solid #bae6fd;
            transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
        }
        .token-btn.counted {
            background-color: #fef08a;
            border-color: #eab308;
            transform: scale(1.1);
        }
        .scale-beam {
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center center;
        }
        .scale-pan {
            background-color: #ffffff;
            border: 3px solid #38bdf8;
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s ease;
        }

        /* Automatinė tamsioji tema (Dark Mode) */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0b1120 !important;
                background-image: radial-gradient(#1e293b 25%, transparent 25%) !important;
                color: #f8fafc !important;
            }
            .app-card {
                background-color: #0f172a !important;
                border-color: #334155 !important;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7) !important;
            }
            #scale-status, #problem-box, #guess-box, #pop-progress {
                background-color: #0f172a !important;
                color: #f8fafc !important;
                border-color: #475569 !important;
            }
            .panel-box {
                background-color: #1e293b !important;
                border: 2px dashed #475569 !important;
            }
            .sub-panel {
                background-color: #1e293b !important;
                border-color: #334155 !important;
            }
            .opt-btn {
                background-color: #1e293b !important;
                color: #f8fafc !important;
                border-color: #334155 !important;
            }
            .opt-btn:hover {
                background-color: #334155 !important;
            }
            .token-btn {
                background-color: #1e293b !important;
                border-color: #475569 !important;
                color: #f8fafc !important;
            }
            .token-btn.counted {
                background-color: #422006 !important;
                border-color: #eab308 !important;
            }
            .scale-pan {
                background-color: #1e293b !important;
                border-color: #475569 !important;
                color: #f8fafc !important;
            }
            .text-main-title {
                color: #f8fafc !important;
            }
            .text-sub-title {
                color: #cbd5e1 !important;
            }
        }
    </style>
</head>
<body class="h-screen max-h-screen overflow-hidden flex items-center justify-center p-2 sm:p-4">
    <canvas id="confetti-canvas" class="pointer-events-none fixed inset-0 w-full h-full z-50" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50;"></canvas>

    <div id="app" class="app-card w-full max-w-2xl rounded-3xl shadow-2xl flex flex-col relative fade-in border-4 overflow-hidden max-h-full">
        <!-- Turinys generuojamas per JS -->
    </div>

    <script>
        const app = document.getElementById('app');

        const EMOJIS = ['🍎', '🍓', '⭐', '🚗', '🎈', '🦆', '🦋', '🍐', '🍊'];
        const PRAISE_WORDS = ['Šaunuolis!', 'Puiku!', 'Teisingai!', 'Nuostabu!', 'Super!'];

        const state = {
            mode: 'objects', // 'objects' | 'scale' | 'balloons'
            score: 0,
            streak: 0,
            question: 1,
            maxQuestions: 10,
            waiting: false,
            firstTry: true,
            hintUsed: false,

            // Mode 1: Skaičiuok su daiktais
            num1: 0,
            num2: 0,
            isAddition: true,
            correctAnswer: 0,
            emoji: '🍎',
            countedMap: {},
            countOrder: 0,
            options: [],

            // Mode 2: Matematinės svarstyklės
            leftA: 0,
            leftB: 0,
            leftHasSum: false,
            leftTotal: 0,
            rightBase: 0,
            rightGuess: 1,
            missingTarget: 0,

            // Mode 3: Balionų sprogdinimas
            balloonTarget: 6,
            balloons: [],
            poppedCount: 0
        };

        let confettiInstance = null;

        function getConfetti() {
            if (!confettiInstance && typeof confetti === 'function') {
                const canvas = document.getElementById('confetti-canvas');
                if (canvas) {
                    // Naudojame useWorker: false, kad išvengtume Web Worker strigimo iframe aplinkoje
                    confettiInstance = confetti.create(canvas, {
                        resize: true,
                        useWorker: false
                    });
                }
            }
            return confettiInstance;
        }

        function clearConfetti() {
            if (confettiInstance) {
                try {
                    confettiInstance.reset();
                } catch (e) {}
            }
            const canvas = document.getElementById('confetti-canvas');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function fireConfetti(customOpts) {
            const conf = getConfetti();
            if (!conf) return;
            try {
                conf(Object.assign({
                    particleCount: 30,
                    spread: 65,
                    origin: { y: 0.65 },
                    ticks: 60,
                    disableForReducedMotion: true
                }, customOpts || {}));
            } catch (e) {}
        }

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function getRandomElement(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function renderGameTopBar() {
            return window.renderTopBar({
                score: state.score,
                current: state.question,
                total: state.maxQuestions,
                streak: state.streak,
                theme: 'sky'
            });
        }

        function renderStartScreen() {
            clearConfetti();
            app.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-5 sm:p-8 text-center fade-in">
                    <div class="text-5xl sm:text-6xl mb-2 bounce">🔢</div>
                    <h1 class="text-main-title text-3xl sm:text-5xl font-black text-slate-800 mb-4 tracking-tight">${_col('Linksmoji Matematika')}</h1>
                    
                    <div class="flex flex-col gap-3 w-full max-w-md">
                        <button onclick="startGame('objects')" class="btn-tinted w-full py-3.5 sm:py-4 px-4 rounded-2xl bg-emerald-100 hover:bg-emerald-200 text-slate-800 font-black text-base sm:text-xl shadow-lg transition transform active:scale-95 border-2 border-b-4 border-emerald-400 flex items-center justify-center gap-2.5">
                            <span class="text-3xl">🍎</span>
                            <span>${_col('Daiktai (1–20)')}</span>
                        </button>
                        <button onclick="startGame('scale')" class="btn-tinted w-full py-3.5 sm:py-4 px-4 rounded-2xl bg-amber-100 hover:bg-amber-200 text-slate-800 font-black text-base sm:text-xl shadow-lg transition transform active:scale-95 border-2 border-b-4 border-amber-400 flex items-center justify-center gap-2.5">
                            <span class="text-3xl">⚖️</span>
                            <span>${_col('Svarstyklės')}</span>
                        </button>
                        <button onclick="startGame('balloons')" class="btn-tinted w-full py-3.5 sm:py-4 px-4 rounded-2xl bg-rose-100 hover:bg-rose-200 text-slate-800 font-black text-base sm:text-xl shadow-lg transition transform active:scale-95 border-2 border-b-4 border-rose-400 flex items-center justify-center gap-2.5">
                            <span class="text-3xl">🎈</span>
                            <span>${_col('Balionai')}</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function startGame(mode) {
            clearConfetti();
            initAudio();
            playSound('click');
            state.mode = mode;
            state.score = 0;
            state.streak = 0;
            state.question = 1;
            generateQuestion();
        }

        function restartCurrentMode() {
            clearConfetti();
            startGame(state.mode);
        }

        function generateQuestion() {
            clearConfetti();
            state.waiting = false;
            state.firstTry = true;
            state.hintUsed = false;

            if (state.mode === 'objects') {
                generateObjectsQuestion();
            } else if (state.mode === 'scale') {
                generateScaleQuestion();
            } else {
                generateBalloonsQuestion();
            }
        }

        function advanceQuestion() {
            if (state.question >= state.maxQuestions) {
                renderEndScreen();
            } else {
                state.question++;
                generateQuestion();
            }
        }

        // ==========================================
        // 1 REŽIMAS: SKAIČIUOK SU DAIKTAIS (IKI 10 IR 20)
        // ==========================================
        function generateObjectsQuestion() {
            state.emoji = getRandomElement(EMOJIS);
            state.countedMap = {};
            state.countOrder = 0;
            state.isAddition = Math.random() > 0.42;

            // Pirmieji 6 klausimai iki 10, toliau iki 20
            const maxLimit = state.question <= 6 ? 10 : 20;
            const minTotal = state.question <= 6 ? 2 : 8;

            if (state.isAddition) {
                let a, b;
                do {
                    a = randomInt(1, maxLimit - 1);
                    b = randomInt(1, maxLimit - a);
                } while (a + b < minTotal || a + b > maxLimit);
                state.num1 = a;
                state.num2 = b;
                state.correctAnswer = a + b;
            } else {
                let a, b;
                do {
                    a = randomInt(minTotal, maxLimit);
                    b = randomInt(1, a - 1);
                } while (a - b < 0);
                state.num1 = a;
                state.num2 = b;
                state.correctAnswer = a - b;
            }

            const opts = new Set([state.correctAnswer]);
            while (opts.size < 4) {
                let diff = randomInt(-4, 4);
                if (diff === 0) diff = 2;
                let wrong = state.correctAnswer + diff;
                if (wrong < 0) wrong = state.correctAnswer + randomInt(1, 5);
                if (wrong !== state.correctAnswer) opts.add(wrong);
            }
            state.options = Array.from(opts).sort(() => Math.random() - 0.5);
            renderObjectsScreen();
        }

        function toggleToken(idx) {
            if (state.waiting) return;
            playSound('click');
            if (state.countedMap[idx]) {
                delete state.countedMap[idx];
            } else {
                state.countOrder = Object.keys(state.countedMap).length + 1;
                state.countedMap[idx] = true;
            }
            // Perskaičiuojame eilės numerius, kad būtų 1, 2, 3...
            const keys = Object.keys(state.countedMap);
            keys.forEach((k, i) => {
                state.countedMap[k] = i + 1;
            });
            updateTokensUI();
        }

        function buildTokenButton(idx, crossedOut) {
            const badgeNum = state.countedMap[idx];
            const isCounted = Boolean(badgeNum);
            return `
                <button onclick="toggleToken(${idx})" id="tok-${idx}" class="token-btn ${isCounted ? 'counted bounce' : ''} relative w-9 h-9 sm:w-11 sm:h-11 rounded-xl flex items-center justify-center text-xl sm:text-2xl shadow-sm active:scale-90">
                    <span class="${crossedOut ? 'opacity-40' : ''}">${state.emoji}</span>
                    ${crossedOut ? '<span class="absolute inset-0 flex items-center justify-center text-red-500 font-black text-lg sm:text-xl pointer-events-none">✕</span>' : ''}
                    ${isCounted ? `<span class="absolute -top-1.5 -right-1.5 bg-amber-500 text-white text-[10px] sm:text-xs font-black w-4 h-4 sm:w-5 sm:h-5 rounded-full flex items-center justify-center shadow">${badgeNum}</span>` : ''}
                </button>
            `;
        }

        function renderTokensMarkup() {
            if (state.isAddition) {
                let leftHtml = '';
                for (let i = 0; i < state.num1; i++) {
                    leftHtml += buildTokenButton(i, false);
                }
                let rightHtml = '';
                for (let i = 0; i < state.num2; i++) {
                    rightHtml += buildTokenButton(state.num1 + i, false);
                }
                return `
                    <div class="flex flex-wrap items-center justify-center gap-1 sm:gap-1.5">${leftHtml}</div>
                    <div class="text-2xl sm:text-3xl font-black text-sky-500 px-1">+</div>
                    <div class="flex flex-wrap items-center justify-center gap-1 sm:gap-1.5">${rightHtml}</div>
                `;
            } else {
                let allHtml = '';
                const keepCount = state.num1 - state.num2;
                for (let i = 0; i < state.num1; i++) {
                    const isCrossed = state.hintUsed && (i >= keepCount);
                    allHtml += buildTokenButton(i, isCrossed);
                }
                return `
                    <div class="flex flex-wrap items-center justify-center gap-1.5 sm:gap-2">${allHtml}</div>
                `;
            }
        }

        function showObjectsHint() {
            if (state.waiting || state.hintUsed) return;
            state.hintUsed = true;
            playHintSound();
            if (state.isAddition) {
                state.countedMap = {};
                for (let i = 0; i < state.num1; i++) {
                    state.countedMap[i] = i + 1;
                }
            } else {
                state.countedMap = {};
            }
            const hBtn = document.getElementById('hint-btn');
            if (hBtn) hBtn.classList.add('hidden');
            updateTokensUI();
        }

        function updateTokensUI() {
            const box = document.getElementById('tokens-container');
            const counterEl = document.getElementById('tap-counter');
            if (box) box.innerHTML = renderTokensMarkup();
            if (counterEl) {
                const c = Object.keys(state.countedMap).length;
                counterEl.innerHTML = `👆 ${_col('Suskaičiuota:')} <strong class="text-amber-500 font-black">${c}</strong>`;
            }
        }

        function renderObjectsScreen() {
            const sign = state.isAddition ? '+' : '-';
            const optionsHtml = state.options.map((opt, idx) => `
                <button id="opt-btn-${idx}" onclick="checkObjectsAnswer(${idx}, ${opt})" class="opt-btn py-3.5 sm:py-4 rounded-2xl font-black text-3xl sm:text-4xl shadow-md border-b-4 transition transform active:scale-95">
                    ${opt}
                </button>
            `).join('');

            app.innerHTML = `
                ${renderGameTopBar()}
                <div class="flex-1 flex flex-col p-3 sm:p-5 justify-evenly gap-2 overflow-hidden fade-in">
                    <div class="text-center flex flex-col items-center gap-2">
                        <div id="problem-box" class="inline-block px-6 py-2.5 rounded-2xl bg-sky-100 border-2 border-sky-300 font-black text-3xl sm:text-5xl text-slate-800 text-main-title tracking-wider shadow-sm">
                            ${state.num1} ${sign} ${state.num2} = <span id="ans-slot" class="text-sky-600 dark:text-sky-400">?</span>
                        </div>
                    </div>

                    <div class="flex flex-col min-h-0">
                        <div class="flex justify-between items-center px-1 mb-1.5 text-sm font-bold shrink-0">
                            <span id="tap-counter" class="text-sub-title text-xs sm:text-sm font-extrabold">👆 ${_col('Suskaičiuota:')} <strong class="text-amber-500 font-black">0</strong></span>
                            <div class="flex items-center gap-2">
                                <button id="hint-btn" onclick="showObjectsHint()" class="hint-btn py-1 px-3 text-xs sm:text-sm min-h-[34px]">
                                    <span>💡</span>
                                    <span>${_col('Užuomina')}</span>
                                </button>
                                <button onclick="state.countedMap={}; playSound('click'); updateTokensUI();" class="px-2.5 py-1 rounded-xl bg-sky-100 dark:bg-slate-800 text-sky-700 dark:text-sky-300 border border-sky-300 dark:border-slate-600 font-extrabold text-xs sm:text-sm active:scale-95" title="Iš naujo">🔄 ${_col('Nulis')}</button>
                            </div>
                        </div>
                        <div id="tokens-container" class="panel-box rounded-2xl p-3 sm:p-4 min-h-[105px] sm:min-h-[135px] flex flex-wrap items-center justify-center content-center gap-1.5 sm:gap-2">
                            ${renderTokensMarkup()}
                        </div>
                    </div>

                    <div id="feedback" class="h-6 sm:h-7 flex items-center justify-center font-black text-sm sm:text-lg opacity-0 transition-opacity"></div>

                    <div class="grid grid-cols-2 gap-3 sm:gap-3.5">
                        ${optionsHtml}
                    </div>
                </div>
            `;
        }

        function checkObjectsAnswer(idx, val) {
            if (state.waiting) return;
            const btn = document.getElementById(`opt-btn-${idx}`);
            const feedback = document.getElementById('feedback');
            const problemBox = document.getElementById('problem-box');
            const ansSlot = document.getElementById('ans-slot');

            if (val === state.correctAnswer) {
                state.waiting = true;
                playSound('correct');
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }
                if (ansSlot) ansSlot.textContent = val;
                if (problemBox) problemBox.classList.add('bounce');
                if (btn) {
                    btn.className = "py-3.5 sm:py-4 bg-green-500 text-white rounded-2xl font-black text-3xl sm:text-4xl shadow-md border-b-4 border-green-700 transform scale-105 bounce";
                }
                const praise = getRandomElement(PRAISE_WORDS);
                feedback.innerHTML = `<span>${_col(praise)} 🌟</span>`;
                feedback.className = "h-6 sm:h-7 flex items-center justify-center font-black text-base sm:text-xl text-emerald-500 opacity-100";
                fireConfetti();
                setTimeout(advanceQuestion, 1200);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playSound('wrong');
                if (btn) {
                    btn.disabled = true;
                    btn.className = "py-3.5 sm:py-4 bg-red-100 dark:bg-red-950 text-red-400 border-red-300 border-2 rounded-2xl font-bold text-3xl sm:text-4xl line-through opacity-50 shake cursor-not-allowed";
                }
                feedback.innerHTML = `<span>${_col('Bandyk dar kartą! Paspausk daiktus ir suskaičiuok.')} 🤔</span>`;
                feedback.className = "h-6 sm:h-7 flex items-center justify-center font-black text-xs sm:text-base text-rose-500 opacity-100";
                const hBtn = document.getElementById('hint-btn');
                if (hBtn) hBtn.classList.add('hint-btn-pulse');
            }
        }

        // ==========================================
        // 2 REŽIMAS: MATEMATINĖS SVARSTYKLĖS
        // ==========================================
        function generateScaleQuestion() {
            const maxSum = state.question <= 5 ? 10 : 15;
            state.missingTarget = randomInt(1, 9);
            state.rightBase = randomInt(1, Math.max(2, maxSum - state.missingTarget));
            state.leftTotal = state.rightBase + state.missingTarget;

            state.leftHasSum = state.question > 3 && Math.random() > 0.4;
            if (state.leftHasSum) {
                state.leftA = randomInt(1, state.leftTotal - 1);
                state.leftB = state.leftTotal - state.leftA;
            } else {
                state.leftA = state.leftTotal;
                state.leftB = 0;
            }

            // Pradedame su netinkamu svoriu, kad svarstyklės būtų pasvirusios
            state.rightGuess = state.missingTarget === 1 ? 3 : 1;
            renderScaleScreen();
        }

        function setScaleGuess(val) {
            if (state.waiting) return;
            const clamped = Math.max(0, Math.min(12, val));
            state.rightGuess = clamped;
            playSound('click');
            updateScaleUI();
        }

        function adjustScaleGuess(delta) {
            setScaleGuess(state.rightGuess + delta);
        }

        function showScaleHint() {
            if (state.waiting || state.hintUsed) return;
            state.hintUsed = true;
            playHintSound();
            const hBtn = document.getElementById('hint-btn');
            if (hBtn) hBtn.classList.add('hidden');
            updateScaleUI();
        }

        function renderScaleScreen() {
            const leftLabel = state.leftHasSum ? `${state.leftA} + ${state.leftB}` : `${state.leftTotal}`;
            const numButtons = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `
                <button id="num-blk-${n}" onclick="setScaleGuess(${n})" class="opt-btn py-2 sm:py-3 px-2 sm:px-3.5 rounded-xl font-black text-lg sm:text-xl border-b-4 shadow-sm transition transform active:scale-90">
                    ${n}
                </button>
            `).join('');

            app.innerHTML = `
                ${renderGameTopBar()}
                <div class="flex-1 flex flex-col p-3 sm:p-5 justify-evenly gap-1.5 overflow-hidden fade-in">
                    <div class="text-center flex flex-col items-center gap-1.5">
                        <h2 class="text-base sm:text-xl font-black text-slate-800 text-main-title">
                            ⚖️ ${_col('Išlygink svarstykles! Surask trūkstamą skaičių:')}
                        </h2>
                        <button id="hint-btn" onclick="showScaleHint()" class="hint-btn py-1 px-3.5 text-xs sm:text-sm min-h-[34px]">
                            <span>💡</span>
                            <span>${_col('Užuomina')}</span>
                        </button>
                    </div>

                    <!-- Svarstyklių vizualizacija -->
                    <div id="scale-area" class="panel-box rounded-2xl p-3 sm:p-4 flex flex-col items-center justify-center min-h-[140px] sm:min-h-[175px] relative overflow-hidden">
                        <div id="scale-status" class="text-xs sm:text-sm font-black mb-2 px-3 py-0.5 rounded-full bg-amber-100 text-amber-800 border border-amber-300 ${state.hintUsed ? '' : 'hidden'}">
                        </div>

                        <!-- Svarstyklių sija -->
                        <div id="scale-beam" class="scale-beam w-full max-w-md flex items-center justify-between px-2 sm:px-6 relative my-2">
                            <!-- Kairė lėkštė -->
                            <div class="scale-pan rounded-2xl px-3 sm:px-4 py-2 sm:py-3 shadow-md flex flex-col items-center min-w-[105px] sm:min-w-[135px]">
                                <span class="text-[11px] sm:text-xs font-bold text-slate-400">${_col('Kairė pusė')}</span>
                                <span class="text-xl sm:text-3xl font-black text-sky-600 dark:text-sky-400">${leftLabel}</span>
                                <span id="left-sum-label" class="text-xs font-extrabold text-slate-500 ${state.hintUsed ? '' : 'hidden'}">(${_col('Svoris:')} ${state.leftTotal})</span>
                            </div>

                            <!-- Centrinis ženklas -->
                            <div id="scale-op" class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-amber-500 text-white font-black text-xl sm:text-2xl flex items-center justify-center shadow-md shrink-0 mx-1">
                                ?
                            </div>

                            <!-- Dešinė lėkštė -->
                            <div class="scale-pan rounded-2xl px-3 sm:px-4 py-2 sm:py-3 shadow-md flex flex-col items-center min-w-[105px] sm:min-w-[135px]">
                                <span class="text-[11px] sm:text-xs font-bold text-slate-400">${_col('Dešinė pusė')}</span>
                                <div class="text-xl sm:text-3xl font-black text-amber-600 dark:text-amber-400 flex items-center gap-1">
                                    <span>${state.rightBase} +</span>
                                    <span id="guess-box" class="inline-block px-2 py-0.5 rounded-lg bg-amber-100 border-2 border-amber-400 text-amber-700">${state.rightGuess}</span>
                                </div>
                                <span id="right-sum-label" class="text-xs font-extrabold text-slate-500 ${state.hintUsed ? '' : 'hidden'}"></span>
                            </div>
                        </div>

                        <!-- Svarstyklių stovas -->
                        <div class="w-full max-w-md h-2 bg-slate-400 dark:bg-slate-500 rounded-full mt-1"></div>
                        <div class="w-0 h-0 border-l-[18px] border-l-transparent border-r-[18px] border-r-transparent border-b-[22px] border-b-slate-500 dark:border-b-slate-400"></div>
                    </div>

                    <div id="feedback" class="h-6 flex items-center justify-center font-black text-sm sm:text-lg opacity-0 transition-opacity"></div>

                    <!-- Valdymo mygtukai: -1 / +1 ir skaičių kaladėlės 1..9 -->
                    <div class="sub-panel rounded-2xl p-2 sm:p-3 flex flex-col gap-2">
                        <div class="flex items-center justify-center gap-3">
                            <button onclick="adjustScaleGuess(-1)" class="px-4 py-1.5 rounded-xl bg-rose-500 text-white font-black text-base sm:text-lg shadow border-b-4 border-rose-700 active:scale-95">
                                -1
                            </button>
                            <span class="text-xs sm:text-sm font-extrabold text-sub-title">${_col('Pasirink skaičių:')}</span>
                            <button onclick="adjustScaleGuess(1)" class="px-4 py-1.5 rounded-xl bg-emerald-500 text-white font-black text-base sm:text-lg shadow border-b-4 border-emerald-700 active:scale-95">
                                +1
                            </button>
                        </div>
                        <div class="grid grid-cols-5 sm:grid-cols-9 gap-1.5 sm:gap-2">
                            ${numButtons}
                        </div>
                    </div>

                    <button onclick="checkScaleAnswer()" class="btn-tinted w-full py-3 sm:py-3.5 rounded-2xl bg-green-100 text-slate-800 font-black text-lg sm:text-2xl shadow-md border-2 border-b-4 border-green-400 transition transform active:scale-95 flex items-center justify-center gap-2">
                        <span>✅</span>
                        <span>${_col('Patikrinti')}</span>
                    </button>
                </div>
            `;
            updateScaleUI();
        }

        function updateScaleUI() {
            const beam = document.getElementById('scale-beam');
            const guessBox = document.getElementById('guess-box');
            const leftSumLabel = document.getElementById('left-sum-label');
            const rightSumLabel = document.getElementById('right-sum-label');
            const scaleOp = document.getElementById('scale-op');
            const scaleStatus = document.getElementById('scale-status');

            if (!beam || !guessBox) return;

            const rightTotal = state.rightBase + state.rightGuess;
            guessBox.textContent = state.rightGuess;
            if (leftSumLabel) {
                leftSumLabel.classList.toggle('hidden', !state.hintUsed);
            }
            if (rightSumLabel) {
                rightSumLabel.innerHTML = `(${_col('Svoris:')} ${rightTotal})`;
                rightSumLabel.classList.toggle('hidden', !state.hintUsed);
            }
            if (scaleStatus) {
                scaleStatus.classList.toggle('hidden', !state.hintUsed);
            }

            // Paryškiname pasirinktą kaladėlę
            for (let n = 1; n <= 9; n++) {
                const b = document.getElementById(`num-blk-${n}`);
                if (b) {
                    if (n === state.rightGuess) {
                        b.className = "py-2 sm:py-2.5 px-2 sm:px-3.5 rounded-xl font-black text-lg sm:text-xl border-b-4 bg-amber-400 text-slate-900 border-amber-600 shadow-md scale-105 transition";
                    } else {
                        b.className = "opt-btn py-2 sm:py-2.5 px-2 sm:px-3.5 rounded-xl font-black text-lg sm:text-xl border-b-4 shadow-sm transition transform active:scale-90";
                    }
                }
            }

            if (rightTotal < state.leftTotal) {
                beam.style.transform = 'rotate(-8deg)';
                scaleOp.textContent = '>';
                scaleOp.className = 'w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-amber-500 text-white font-black text-xl sm:text-2xl flex items-center justify-center shadow-md shrink-0 mx-1';
                scaleStatus.innerHTML = `⬅️ ➕`;
                scaleStatus.className = 'text-xs sm:text-sm font-black mb-2 px-3 py-0.5 rounded-full bg-amber-100 text-amber-800 border border-amber-300';
            } else if (rightTotal > state.leftTotal) {
                beam.style.transform = 'rotate(8deg)';
                scaleOp.textContent = '<';
                scaleOp.className = 'w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-rose-500 text-white font-black text-xl sm:text-2xl flex items-center justify-center shadow-md shrink-0 mx-1';
                scaleStatus.innerHTML = `➡️ ➖`;
                scaleStatus.className = 'text-xs sm:text-sm font-black mb-2 px-3 py-0.5 rounded-full bg-rose-100 text-rose-800 border border-rose-300';
            } else {
                beam.style.transform = 'rotate(0deg)';
                scaleOp.textContent = '=';
                scaleOp.className = 'w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-emerald-500 text-white font-black text-xl sm:text-2xl flex items-center justify-center shadow-md shrink-0 mx-1';
                scaleStatus.innerHTML = `⚖️ ✅`;
                scaleStatus.className = 'text-xs sm:text-sm font-black mb-2 px-3 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300';
            }
        }

        function checkScaleAnswer() {
            if (state.waiting) return;
            const rightTotal = state.rightBase + state.rightGuess;
            const feedback = document.getElementById('feedback');
            const scaleArea = document.getElementById('scale-area');

            if (rightTotal === state.leftTotal) {
                state.waiting = true;
                playSound('correct');
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }
                feedback.innerHTML = `<span>${_col('Puiku! Svarstyklės išlygintos!')} 🎉</span>`;
                feedback.className = "h-6 flex items-center justify-center font-black text-base sm:text-xl text-emerald-500 opacity-100";
                if (scaleArea) scaleArea.classList.add('bounce');
                fireConfetti();
                setTimeout(advanceQuestion, 1200);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playSound('wrong');
                const hint = rightTotal < state.leftTotal
                    ? 'Dešinėje pusėje dar trūksta svorio!'
                    : 'Dešinėje pusėje per daug svorio!';
                feedback.innerHTML = `<span>${_col(hint)} 🤔</span>`;
                feedback.className = "h-6 flex items-center justify-center font-black text-xs sm:text-base text-rose-500 opacity-100";
                const hBtn = document.getElementById('hint-btn');
                if (hBtn) hBtn.classList.add('hint-btn-pulse');
                if (scaleArea) {
                    scaleArea.classList.remove('shake');
                    void scaleArea.offsetWidth;
                    scaleArea.classList.add('shake');
                }
            }
        }

        // ==========================================
        // 3 REŽIMAS: BALIONŲ SPROGDINIMAS
        // ==========================================
        const BALLOON_STYLES = [
            { body: 'bg-gradient-to-br from-rose-400 to-rose-600 border-rose-700', knot: 'text-rose-600' },
            { body: 'bg-gradient-to-br from-sky-400 to-blue-600 border-blue-700', knot: 'text-blue-600' },
            { body: 'bg-gradient-to-br from-amber-400 to-orange-500 border-orange-700', knot: 'text-orange-500' },
            { body: 'bg-gradient-to-br from-emerald-400 to-green-600 border-green-700', knot: 'text-green-600' },
            { body: 'bg-gradient-to-br from-purple-400 to-indigo-600 border-indigo-700', knot: 'text-indigo-600' },
            { body: 'bg-gradient-to-br from-pink-400 to-fuchsia-600 border-fuchsia-700', knot: 'text-fuchsia-600' }
        ];

        function makeExprWithValue(targetVal) {
            const isEarly = state.question <= 5;
            const maxMinuend = isEarly ? 12 : 18;
            const maxSub = Math.max(1, Math.min(isEarly ? 4 : 6, maxMinuend - targetVal));
            const canSub = targetVal + 1 <= maxMinuend;
            const useAdd = !canSub || Math.random() > 0.42;

            if (useAdd && targetVal >= 1) {
                const a = randomInt(0, targetVal);
                const b = targetVal - a;
                return { label: `${a} + ${b}`, value: targetVal };
            } else {
                const sub = randomInt(1, maxSub);
                const a = targetVal + sub;
                return { label: `${a} - ${sub}`, value: targetVal };
            }
        }

        function generateBalloonsQuestion() {
            const maxTarget = state.question <= 5 ? 10 : 15;
            state.balloonTarget = randomInt(4, maxTarget);
            state.poppedCount = 0;

            const usedLabels = new Set();
            const list = [];

            // 3 teisingi balionai
            let guard = 0;
            while (list.length < 3 && guard < 60) {
                guard++;
                const expr = makeExprWithValue(state.balloonTarget);
                if (!usedLabels.has(expr.label)) {
                    usedLabels.add(expr.label);
                    list.push({ ...expr, isTarget: true, popped: false, wrongTried: false });
                }
            }

            // 3 neteisingi balionai
            while (list.length < 6 && guard < 120) {
                guard++;
                let wrongVal = state.balloonTarget + randomInt(-4, 4);
                if (wrongVal < 1 || wrongVal === state.balloonTarget) {
                    wrongVal = state.balloonTarget + randomInt(1, 3);
                }
                const expr = makeExprWithValue(wrongVal);
                if (!usedLabels.has(expr.label)) {
                    usedLabels.add(expr.label);
                    list.push({ ...expr, isTarget: false, popped: false, wrongTried: false });
                }
            }

            list.sort(() => Math.random() - 0.5);
            list.forEach((b, i) => {
                const st = BALLOON_STYLES[i % BALLOON_STYLES.length];
                b.colorClass = st.body;
                b.knotClass = st.knot;
            });
            state.balloons = list;
            renderBalloonsScreen();
        }

        function showBalloonsHint() {
            if (state.waiting || state.hintUsed) return;
            state.hintUsed = true;
            playHintSound();
            let revealed = 0;
            state.balloons.forEach(b => {
                if (!b.isTarget && !b.wrongTried && revealed < 2) {
                    b.wrongTried = true;
                    revealed++;
                }
            });
            renderBalloonsScreen();
        }

        function renderBalloonsScreen() {
            const balloonsHtml = state.balloons.map((b, idx) => {
                if (b.popped) {
                    return `
                        <div class="balloon-wrap pop-in">
                            <div class="balloon-popped border-3 border-dashed border-emerald-400 bg-emerald-50 dark:bg-emerald-950/50 flex flex-col items-center justify-center p-2 shadow-inner">
                                <span class="text-2xl sm:text-3xl leading-none">💥</span>
                                <span class="text-sm sm:text-base font-black text-emerald-700 dark:text-emerald-300 mt-1">${b.label} = ${b.value}</span>
                                <span class="text-[11px] font-extrabold text-emerald-600 dark:text-emerald-400">✅ ${_col('Puiku!')}</span>
                            </div>
                        </div>
                    `;
                }
                return `
                    <button id="bal-${idx}" onclick="tapBalloon(${idx})" class="balloon-wrap float-anim group focus:outline-none ${b.wrongTried ? 'opacity-45' : ''}" style="animation-delay: ${idx * 0.18}s">
                        <div class="balloon-body ${b.colorClass} text-white border-b-4 px-2 text-center group-active:scale-90">
                            <span class="text-xl sm:text-2xl font-black tracking-wide drop-shadow-md leading-tight">${b.label}</span>
                            ${b.wrongTried ? `<span class="mt-1 px-2 py-0.5 rounded-full bg-black/35 text-[11px] sm:text-xs font-extrabold leading-none">= ${b.value} ❌</span>` : ''}
                        </div>
                        <div class="balloon-knot ${b.knotClass}"></div>
                        <div class="balloon-string"></div>
                    </button>
                `;
            }).join('');

            app.innerHTML = `
                ${renderGameTopBar()}
                <div class="flex-1 flex flex-col px-3 py-2 sm:p-5 justify-between overflow-hidden fade-in min-h-0">
                    <div class="text-center shrink-0 flex flex-col items-center gap-1.5">
                        <h2 class="text-sm sm:text-xl font-black text-slate-800 text-main-title leading-snug">
                            🎈 ${_col('Susprogdink 3 balionus su atsakymu')} <span class="text-rose-500 dark:text-rose-400 font-black text-lg sm:text-2xl">${state.balloonTarget}</span>!
                        </h2>
                        <div class="flex items-center justify-center gap-2 flex-wrap">
                            <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-2xl bg-rose-100 dark:bg-rose-950 border-2 border-rose-400 text-rose-700 dark:text-rose-200 font-black text-lg sm:text-2xl shadow-sm">
                                <span>🎯 ${state.balloonTarget}</span>
                                <span id="pop-progress" class="text-xs sm:text-sm px-2 py-0.5 rounded-xl bg-white text-slate-700 font-extrabold shadow-inner">
                                    💥 ${state.poppedCount} / 3
                                </span>
                            </div>
                            <button id="hint-btn" onclick="showBalloonsHint()" class="hint-btn py-1 px-3 text-xs sm:text-sm min-h-[34px] ${state.hintUsed ? 'hidden' : ''}">
                                <span>💡</span>
                                <span>${_col('Užuomina')}</span>
                            </button>
                        </div>
                    </div>

                    <div id="balloons-grid" class="flex-1 grid grid-cols-2 sm:grid-cols-3 gap-x-5 gap-y-2.5 sm:gap-6 my-auto place-items-center content-center min-h-0">
                        ${balloonsHtml}
                    </div>

                    <div id="feedback" class="min-h-[2.4rem] sm:min-h-[3rem] flex flex-col items-center justify-center font-black text-center opacity-0 transition-opacity shrink-0"></div>
                </div>
            `;
        }

        function tapBalloon(idx) {
            if (state.waiting) return;
            const b = state.balloons[idx];
            if (!b || b.popped) return;

            if (b.isTarget) {
                b.popped = true;
                state.poppedCount++;
                playSound('pop');
                renderBalloonsScreen();

                const newFeedback = document.getElementById('feedback');
                if (state.poppedCount >= 3) {
                    state.waiting = true;
                    playSound('correct');
                    if (state.firstTry) {
                        state.score++;
                        state.streak++;
                    }
                    if (newFeedback) {
                        newFeedback.innerHTML = `
                            <span class="text-sm sm:text-lg font-black leading-tight">🎉 ${_col('Valio! Susprogdinai visus 3 teisingus balionus!')}</span>
                        `;
                        newFeedback.className = "min-h-[2.4rem] sm:min-h-[3rem] flex flex-col items-center justify-center font-black text-center text-emerald-500 opacity-100 shrink-0";
                    }
                    fireConfetti();
                    setTimeout(advanceQuestion, 1250);
                } else {
                    if (newFeedback) {
                        newFeedback.innerHTML = `
                            <span class="text-sm sm:text-lg font-black leading-tight">💥 ${_col('Puiku! Ieškok dar!')} (${state.poppedCount} / 3)</span>
                        `;
                        newFeedback.className = "min-h-[2.4rem] sm:min-h-[3rem] flex flex-col items-center justify-center font-black text-center text-emerald-500 opacity-100 shrink-0";
                    }
                }
            } else {
                state.firstTry = false;
                state.streak = 0;
                b.wrongTried = true;
                playSound('wrong');
                renderBalloonsScreen();

                const btn = document.getElementById(`bal-${idx}`);
                if (btn) {
                    btn.classList.remove('shake');
                    void btn.offsetWidth;
                    btn.classList.add('shake');
                }
                const hBtn = document.getElementById('hint-btn');
                if (hBtn) hBtn.classList.add('hint-btn-pulse');

                const newFeedback = document.getElementById('feedback');
                if (newFeedback) {
                    newFeedback.innerHTML = `
                        <span class="text-xs sm:text-base font-black leading-tight">🤔 ${b.label} = ${b.value}. ${_col('Ieškok skaičiaus')} ${state.balloonTarget}!</span>
                    `;
                    newFeedback.className = "min-h-[2.4rem] sm:min-h-[3rem] flex flex-col items-center justify-center font-black text-center text-rose-500 opacity-100 shrink-0";
                }
            }
        }

        function renderEndScreen() {
            clearConfetti();
            app.innerHTML = renderEndScreenHelper({
                score: state.score,
                total: state.maxQuestions,
                restartFn: "restartCurrentMode()",
                menuFn: "renderStartScreen()"
            });
        }

        // Paleidžiame pradinį ekraną
        renderStartScreen();
    </script>
</body>
</html>
