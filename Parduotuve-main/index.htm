<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>🛒 Mažoji Parduotuvė</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/common.css">
    <script src="../shared/common.js"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fff7ed;
            background-image: radial-gradient(#fdba74 20%, transparent 20%);
            background-size: 20px 20px;
            color: #1e293b;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .app-card {
            background-color: rgba(255, 255, 255, 0.97);
            border-color: #fb923c;
        }
        .shop-shelf {
            background-color: #fffbeb;
            border: 2px solid #fde68a;
        }
        .counter-tray {
            background-color: #f0fdf4;
            border: 2px dashed #4ade80;
        }
        .wallet-box {
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
        }
        .item-card {
            background-color: #ffffff;
            border: 2px solid #fed7aa;
        }
        .item-card:hover {
            background-color: #ffedd5;
        }
        .basket-item {
            background-color: #ffffff;
            border: 2px solid #fed7aa;
        }

        /* Tamsioji Tema (Dark Mode) */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0b1120 !important;
                background-image: radial-gradient(#1e293b 25%, transparent 25%) !important;
                color: #f1f5f9 !important;
            }
            .app-card {
                background-color: #0f172a !important;
                border-color: #334155 !important;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6) !important;
            }
            .shop-shelf {
                background-color: #1e293b !important;
                border-color: #475569 !important;
            }
            .basket-item {
                background-color: #1e293b !important;
                border-color: #334155 !important;
                color: #f8fafc !important;
            }
            .counter-tray {
                background-color: #1e293b !important;
                border-color: #475569 !important;
                box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5) !important;
            }
            .wallet-box {
                background-color: #0f172a !important;
                border-color: #334155 !important;
            }
            .item-card {
                background-color: #1e293b !important;
                border-color: #334155 !important;
                color: #f8fafc !important;
            }
            .item-card:hover {
                background-color: #334155 !important;
            }
            .price-tag {
                background-color: #0f172a !important;
                color: #fde047 !important;
                border-color: #eab308 !important;
            }
            .text-main-title {
                color: #f8fafc !important;
            }
            .text-sub-title {
                color: #94a3b8 !important;
            }
        }
    </style>
</head>
<body class="h-screen max-h-screen flex items-center justify-center p-2 sm:p-4 overflow-hidden">

    <div id="app" class="app-card w-full max-w-2xl rounded-3xl shadow-xl flex flex-col relative fade-in border-4 overflow-hidden max-h-full">
    </div>

    <script>
        const MONEY = {
            centCoins: [
                { cents: 1, label: '1c', class: 'coin coin-copper coin-1c' },
                { cents: 2, label: '2c', class: 'coin coin-copper coin-2c' },
                { cents: 5, label: '5c', class: 'coin coin-copper coin-5c' },
                { cents: 10, label: '10c', class: 'coin coin-gold coin-10c' },
                { cents: 20, label: '20c', class: 'coin coin-gold coin-20c' },
                { cents: 50, label: '50c', class: 'coin coin-gold coin-50c' }
            ],
            euroCoins: [
                { cents: 100, label: '1€', class: 'coin coin-1e' },
                { cents: 200, label: '2€', class: 'coin coin-2e' }
            ],
            bills: [
                { cents: 500, label: '5€', class: 'bill bill-5e' },
                { cents: 1000, label: '10€', class: 'bill bill-10e' },
                { cents: 2000, label: '20€', class: 'bill bill-20e' }
            ]
        };

        const ALL_COINS = [...MONEY.centCoins, ...MONEY.euroCoins];
        const EURO_POOL = [...MONEY.euroCoins, ...MONEY.bills];

        // Parduotuvės prekės (centais ir eurais)
        const SHOP_ITEMS = [
            { name: 'Saldainis', emoji: '🍬', cents: 15, pool: MONEY.centCoins },
            { name: 'Obuolys', emoji: '🍎', cents: 25, pool: MONEY.centCoins },
            { name: 'Bananas', emoji: '🍌', cents: 30, pool: MONEY.centCoins },
            { name: 'Bandelė', emoji: '🥐', cents: 40, pool: MONEY.centCoins },
            { name: 'Spurga', emoji: '🍩', cents: 55, pool: MONEY.centCoins },
            { name: 'Ledai', emoji: '🍦', cents: 70, pool: MONEY.centCoins },
            { name: 'Sultys', emoji: '🧃', cents: 80, pool: MONEY.centCoins },
            { name: 'Šokoladas', emoji: '🍫', cents: 90, pool: MONEY.centCoins },
            { name: 'Pieštukas', emoji: '✏️', cents: 100, pool: ALL_COINS },
            { name: 'Sąsiuvinis', emoji: '📓', cents: 150, pool: ALL_COINS },
            { name: 'Pienas', emoji: '🥛', cents: 200, pool: ALL_COINS },
            { name: 'Dažai', emoji: '🎨', cents: 300, pool: EURO_POOL },
            { name: 'Knygelė', emoji: '📖', cents: 600, pool: EURO_POOL },
            { name: 'Meškiukas', emoji: '🧸', cents: 800, pool: EURO_POOL },
            { name: 'Kamuolys', emoji: '⚽', cents: 900, pool: EURO_POOL },
            { name: 'Mašinėlė', emoji: '🚗', cents: 1200, pool: EURO_POOL },
            { name: 'Lėktuvėlis', emoji: '✈️', cents: 1500, pool: EURO_POOL },
            { name: 'Kuprinė', emoji: '🎒', cents: 1700, pool: EURO_POOL }
        ];

        const BASKET_PAIRS = [
            { item1: { name: 'Saldainis', emoji: '🍬', cents: 10 }, item2: { name: 'Obuolys', emoji: '🍎', cents: 20 }, pool: MONEY.centCoins },
            { item1: { name: 'Bananas', emoji: '🍌', cents: 30 }, item2: { name: 'Bandelė', emoji: '🥐', cents: 20 }, pool: MONEY.centCoins },
            { item1: { name: 'Spurga', emoji: '🍩', cents: 50 }, item2: { name: 'Saldainis', emoji: '🍬', cents: 15 }, pool: MONEY.centCoins },
            { item1: { name: 'Ledai', emoji: '🍦', cents: 60 }, item2: { name: 'Obuolys', emoji: '🍎', cents: 20 }, pool: MONEY.centCoins },
            { item1: { name: 'Sausainis', emoji: '🍪', cents: 25 }, item2: { name: 'Sultys', emoji: '🧃', cents: 50 }, pool: MONEY.centCoins },
            { item1: { name: 'Pieštukas', emoji: '✏️', cents: 100 }, item2: { name: 'Trintukas', emoji: '🧽', cents: 50 }, pool: ALL_COINS },
            { item1: { name: 'Duona', emoji: '🍞', cents: 200 }, item2: { name: 'Pienas', emoji: '🥛', cents: 100 }, pool: EURO_POOL },
            { item1: { name: 'Dažai', emoji: '🎨', cents: 300 }, item2: { name: 'Sąsiuvinis', emoji: '📓', cents: 200 }, pool: EURO_POOL },
            { item1: { name: 'Knygelė', emoji: '📖', cents: 500 }, item2: { name: 'Pieštukas', emoji: '✏️', cents: 200 }, pool: EURO_POOL },
            { item1: { name: 'Meškiukas', emoji: '🧸', cents: 600 }, item2: { name: 'Balionas', emoji: '🎈', cents: 200 }, pool: EURO_POOL },
            { item1: { name: 'Kamuolys', emoji: '⚽', cents: 1000 }, item2: { name: 'Švilpukas', emoji: '🪈', cents: 200 }, pool: EURO_POOL },
            { item1: { name: 'Mašinėlė', emoji: '🚗', cents: 1000 }, item2: { name: 'Knygelė', emoji: '📖', cents: 500 }, pool: EURO_POOL }
        ];

        const AFFORD_TASKS = [
            {
                wallet: [MONEY.centCoins[5], MONEY.centCoins[3]], // 50c + 10c = 60c
                correct: { name: 'Ledai', emoji: '🍦', cents: 60 },
                wrong: [
                    { name: 'Spurga', emoji: '🍩', cents: 40 },
                    { name: 'Šokoladas', emoji: '🍫', cents: 80 },
                    { name: 'Pieštukas', emoji: '✏️', cents: 100 }
                ]
            },
            {
                wallet: [MONEY.centCoins[4], MONEY.centCoins[4], MONEY.centCoins[2]], // 20c + 20c + 5c = 45c
                correct: { name: 'Bandelė', emoji: '🥐', cents: 45 },
                wrong: [
                    { name: 'Saldainis', emoji: '🍬', cents: 25 },
                    { name: 'Ledai', emoji: '🍦', cents: 65 },
                    { name: 'Sultys', emoji: '🧃', cents: 75 }
                ]
            },
            {
                wallet: [MONEY.centCoins[5], MONEY.centCoins[4], MONEY.centCoins[3]], // 50c + 20c + 10c = 80c
                correct: { name: 'Sultys', emoji: '🧃', cents: 80 },
                wrong: [
                    { name: 'Obuolys', emoji: '🍎', cents: 30 },
                    { name: 'Bananas', emoji: '🍌', cents: 50 },
                    { name: 'Sūris', emoji: '🧀', cents: 90 }
                ]
            },
            {
                wallet: [MONEY.euroCoins[1], MONEY.euroCoins[0]], // 2€ + 1€ = 3€
                correct: { name: 'Dažai', emoji: '🎨', cents: 300 },
                wrong: [
                    { name: 'Pieštukas', emoji: '✏️', cents: 100 },
                    { name: 'Sąsiuvinis', emoji: '📓', cents: 200 },
                    { name: 'Knygelė', emoji: '📖', cents: 500 }
                ]
            },
            {
                wallet: [MONEY.bills[0], MONEY.euroCoins[1]], // 5€ + 2€ = 7€
                correct: { name: 'Meškiukas', emoji: '🧸', cents: 700 },
                wrong: [
                    { name: 'Balionas', emoji: '🎈', cents: 400 },
                    { name: 'Kamuolys', emoji: '⚽', cents: 900 },
                    { name: 'Mašinėlė', emoji: '🚗', cents: 1200 }
                ]
            },
            {
                wallet: [MONEY.bills[0], MONEY.euroCoins[1], MONEY.euroCoins[1]], // 5€ + 2€ + 2€ = 9€
                correct: { name: 'Kamuolys', emoji: '⚽', cents: 900 },
                wrong: [
                    { name: 'Dažai', emoji: '🎨', cents: 500 },
                    { name: 'Knygelė', emoji: '📖', cents: 700 },
                    { name: 'Lėktuvėlis', emoji: '✈️', cents: 1100 }
                ]
            },
            {
                wallet: [MONEY.bills[1], MONEY.euroCoins[1]], // 10€ + 2€ = 12€
                correct: { name: 'Mašinėlė', emoji: '🚗', cents: 1200 },
                wrong: [
                    { name: 'Meškiukas', emoji: '🧸', cents: 800 },
                    { name: 'Kamuolys', emoji: '⚽', cents: 1000 },
                    { name: 'Kuprinė', emoji: '🎒', cents: 1500 }
                ]
            },
            {
                wallet: [MONEY.bills[1], MONEY.bills[0]], // 10€ + 5€ = 15€
                correct: { name: 'Kuprinė', emoji: '🎒', cents: 1500 },
                wrong: [
                    { name: 'Knygelė', emoji: '📖', cents: 600 },
                    { name: 'Kamuolys', emoji: '⚽', cents: 1000 },
                    { name: 'Dviratis', emoji: '🚲', cents: 2000 }
                ]
            },
            {
                wallet: [MONEY.euroCoins[0], MONEY.centCoins[5]], // 1€ + 50c = 1,50€
                correct: { name: 'Sąsiuvinis', emoji: '📓', cents: 150 },
                wrong: [
                    { name: 'Ledai', emoji: '🍦', cents: 80 },
                    { name: 'Pieštukas', emoji: '✏️', cents: 100 },
                    { name: 'Dažai', emoji: '🎨', cents: 250 }
                ]
            },
            {
                wallet: [MONEY.centCoins[4], MONEY.centCoins[3], MONEY.centCoins[2]], // 20c + 10c + 5c = 35c
                correct: { name: 'Obuolys', emoji: '🍎', cents: 35 },
                wrong: [
                    { name: 'Saldainis', emoji: '🍬', cents: 15 },
                    { name: 'Bandelė', emoji: '🥐', cents: 50 },
                    { name: 'Spurga', emoji: '🍩', cents: 65 }
                ]
            }
        ];

        const state = {
            mode: 'single', // 'single' | 'basket' | 'afford'
            score: 0,
            streak: 0,
            question: 1,
            maxQuestions: 10,
            targetCents: 0,
            currentTask: null,
            collectedItems: [],
            walletPool: [],
            waiting: false,
            firstTry: true,
            hintUsed: false
        };

        const app = document.getElementById('app');

        function getRandomElement(arr) {
            return pickRandom(arr);
        }

        function showShopHint() {
            if (state.waiting || state.hintUsed) return;
            state.hintUsed = true;
            playHintSound();
            const slot = document.getElementById('shop-hint-slot');
            if (slot) {
                const rem = Math.max(0, state.targetCents - getCollectedSum());
                const text = state.mode === 'basket'
                    ? `${_col('Iš viso:')} ${formatMoneyCents(state.targetCents)}`
                    : `${_col('Dar trūksta:')} ${formatMoneyCents(rem)}`;
                slot.innerHTML = `<span class="hint-box py-1 px-2.5 text-xs sm:text-sm">💡 ${text}</span>`;
            }
        }

        function showAffordHint() {
            if (state.waiting || state.hintUsed) return;
            state.hintUsed = true;
            playHintSound();
            const slot = document.getElementById('afford-hint-slot');
            if (slot) {
                slot.innerHTML = `<div class="hint-box inline-flex items-center gap-1.5 py-1 px-3 text-xs sm:text-sm"><span>💡</span><span>${_col('Piniginėje yra:')} ${formatMoneyCents(state.targetCents)}</span></div>`;
            }
        }

        function renderStartScreen() {
            app.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-5 sm:p-8 text-center fade-in">
                    <div class="text-5xl sm:text-6xl mb-2 bounce">🛒</div>
                    <h1 class="text-main-title text-3xl sm:text-5xl font-black text-orange-700 mb-4 tracking-tight">${_col('Mažoji Parduotuvė')}</h1>
                    
                    <div class="flex flex-col gap-3 w-full max-w-sm">
                        <button onclick="startGame('single')" class="btn-tinted w-full py-3.5 sm:py-4 px-4 rounded-2xl bg-orange-100 hover:bg-orange-200 text-slate-800 font-black text-lg sm:text-2xl shadow-lg transition transform active:scale-95 border-2 border-b-4 border-orange-400 flex items-center justify-center gap-2.5">
                            <span class="text-3xl">🍭</span>
                            <span>${_col('1 prekė')}</span>
                        </button>
                        <button onclick="startGame('basket')" class="btn-tinted w-full py-3.5 sm:py-4 px-4 rounded-2xl bg-emerald-100 hover:bg-emerald-200 text-slate-800 font-black text-lg sm:text-2xl shadow-lg transition transform active:scale-95 border-2 border-b-4 border-emerald-400 flex items-center justify-center gap-2.5">
                            <span class="text-3xl">🧺</span>
                            <span>${_col('Krepšelis')}</span>
                        </button>
                        <button onclick="startGame('afford')" class="btn-tinted w-full py-3.5 sm:py-4 px-4 rounded-2xl bg-sky-100 hover:bg-sky-200 text-slate-800 font-black text-lg sm:text-2xl shadow-lg transition transform active:scale-95 border-2 border-b-4 border-sky-400 flex items-center justify-center gap-2.5">
                            <span class="text-3xl">🛍️</span>
                            <span>${_col('Ką nupirkti?')}</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function startGame(mode) {
            initAudio();
            state.mode = mode;
            state.score = 0;
            state.streak = 0;
            state.question = 1;
            generateQuestion();
        }

        function renderTopBar() {
            return window.renderTopBar({
                score: state.score,
                current: state.question,
                total: state.maxQuestions,
                streak: state.streak,
                theme: 'orange'
            });
        }

        function generateQuestion() {
            state.waiting = false;
            state.firstTry = true;
            state.hintUsed = false;
            state.collectedItems = [];

            if (state.mode === 'single') {
                let nextItem;
                do {
                    nextItem = getRandomElement(SHOP_ITEMS);
                } while (state.currentTask && nextItem.name === state.currentTask.name);
                state.currentTask = nextItem;
                state.targetCents = nextItem.cents;
                state.walletPool = nextItem.pool;
                renderPayScreen();
            } else if (state.mode === 'basket') {
                let nextPair;
                do {
                    nextPair = getRandomElement(BASKET_PAIRS);
                } while (state.currentTask && nextPair.item1.name === state.currentTask.item1?.name && nextPair.item2.name === state.currentTask.item2?.name);
                state.currentTask = nextPair;
                state.targetCents = nextPair.item1.cents + nextPair.item2.cents;
                state.walletPool = nextPair.pool;
                renderPayScreen();
            } else {
                let nextAfford;
                do {
                    nextAfford = getRandomElement(AFFORD_TASKS);
                } while (state.currentTask && nextAfford.correct.name === state.currentTask.correct?.name);
                state.currentTask = nextAfford;
                state.targetCents = nextAfford.correct.cents;
                renderAffordScreen();
            }
        }

        function getCollectedSum() {
            return state.collectedItems.reduce((acc, item) => acc + item.cents, 0);
        }

        function addCoin(idx) {
            if (state.waiting) return;
            if (state.collectedItems.length >= 10) return;
            state.collectedItems.push(state.walletPool[idx]);
            playSound('coin');
            updateCounterUI();
        }

        function removeCoin(idx) {
            if (state.waiting) return;
            state.collectedItems.splice(idx, 1);
            playSound('remove');
            updateCounterUI();
        }

        function clearCounter() {
            if (state.waiting) return;
            state.collectedItems = [];
            playSound('remove');
            updateCounterUI();
        }

        function renderPayScreen() {
            let shelfHtml = '';
            if (state.mode === 'single') {
                const it = state.currentTask;
                shelfHtml = `
                    <div class="shop-shelf p-2.5 sm:p-3.5 rounded-2xl flex items-center justify-center gap-3 sm:gap-5 shadow-sm shrink-0 w-full">
                        <div class="text-4xl sm:text-6xl drop-shadow">${it.emoji}</div>
                        <div class="text-left">
                            <div class="text-xl sm:text-2xl font-black text-slate-800 text-main-title">${_col(it.name)}</div>
                        </div>
                        <div class="price-tag bg-amber-300 border-2 border-amber-500 text-amber-950 font-black text-xl sm:text-3xl px-3 sm:px-4 py-1 sm:py-1.5 rounded-2xl shadow-sm">
                            🏷️ ${formatMoneyCents(it.cents)}
                        </div>
                    </div>
                `;
            } else {
                const { item1, item2 } = state.currentTask;
                shelfHtml = `
                    <div class="shop-shelf p-2.5 sm:p-3.5 rounded-2xl flex items-center justify-between gap-2 sm:gap-3 shadow-sm shrink-0 w-full">
                        <div class="basket-item flex-1 min-w-0 flex items-center justify-between gap-1.5 sm:gap-2 px-2 sm:px-3 py-1.5 sm:py-2 rounded-xl shadow-sm">
                            <div class="flex items-center gap-1.5 sm:gap-2 min-w-0">
                                <span class="text-3xl sm:text-4xl shrink-0">${item1.emoji}</span>
                                <span class="font-black text-sm sm:text-lg truncate">${_col(item1.name)}</span>
                            </div>
                            <span class="price-tag bg-amber-200 text-amber-900 font-black px-2 sm:px-2.5 py-0.5 sm:py-1 rounded-lg text-sm sm:text-base shrink-0">${formatMoneyCents(item1.cents)}</span>
                        </div>
                        <span class="font-black text-2xl sm:text-3xl text-orange-500 shrink-0 px-0.5">+</span>
                        <div class="basket-item flex-1 min-w-0 flex items-center justify-between gap-1.5 sm:gap-2 px-2 sm:px-3 py-1.5 sm:py-2 rounded-xl shadow-sm">
                            <div class="flex items-center gap-1.5 sm:gap-2 min-w-0">
                                <span class="text-3xl sm:text-4xl shrink-0">${item2.emoji}</span>
                                <span class="font-black text-sm sm:text-lg truncate">${_col(item2.name)}</span>
                            </div>
                            <span class="price-tag bg-amber-200 text-amber-900 font-black px-2 sm:px-2.5 py-0.5 sm:py-1 rounded-lg text-sm sm:text-base shrink-0">${formatMoneyCents(item2.cents)}</span>
                        </div>
                    </div>
                `;
            }

            const walletHtml = state.walletPool.map((item, idx) => `
                <button onclick="addCoin(${idx})" class="${item.class} cursor-pointer hover:scale-105 active:scale-95">
                    ${item.label}
                </button>
            `).join('');

            app.innerHTML = `
                ${renderTopBar()}
                <div class="flex-1 flex flex-col p-2.5 sm:p-4 fade-in justify-between overflow-hidden">
                    ${shelfHtml}

                    <!-- Prekystalis -->
                    <div class="flex flex-col my-1 sm:my-2 shrink-0">
                        <div class="flex justify-between items-center px-1 mb-1.5 text-base sm:text-lg font-black shrink-0">
                            <span class="text-sub-title flex items-center gap-2">💰 Prekystalis: <strong id="counter-sum" class="text-emerald-500 font-black text-xl sm:text-3xl">0 c</strong></span>
                            <div class="flex items-center gap-2">
                                <span id="shop-hint-slot">
                                    <button id="hint-btn" onclick="showShopHint()" class="hint-btn py-1 px-3 text-xs sm:text-sm min-h-[34px]">
                                        <span>💡</span>
                                        <span>${_col('Užuomina')}</span>
                                    </button>
                                </span>
                                <button onclick="clearCounter()" class="text-rose-500 hover:scale-110 active:scale-95 text-2xl p-1.5 rounded-xl hover:bg-rose-50 dark:hover:bg-rose-950/30 transition" title="Išvalyti">🗑️</button>
                            </div>
                        </div>
                        <div id="counter-tray" class="counter-tray flex flex-wrap items-center justify-center content-center gap-2 sm:gap-3 p-3 sm:p-4 rounded-2xl h-28 sm:h-36">
                        </div>
                    </div>

                    <div id="feedback" class="h-6 sm:h-7 flex items-center justify-center font-black text-sm sm:text-lg opacity-0 transition-opacity shrink-0"></div>

                    <!-- Piniginė -->
                    <div class="wallet-box p-2.5 sm:p-3.5 rounded-2xl flex flex-col items-center gap-1.5 shrink-0">
                        <div class="text-sm sm:text-base font-extrabold text-slate-600 dark:text-slate-300 flex items-center gap-1.5">
                            <span>👛</span> <span>${_col('Piniginė (spausk monetą):')}</span>
                        </div>
                        <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-3 max-w-lg">
                            ${walletHtml}
                        </div>
                    </div>

                    <button onclick="checkPayAnswer()" class="w-full py-3.5 sm:py-4 rounded-2xl bg-green-500 hover:bg-green-600 text-white font-black text-xl sm:text-2xl shadow-lg border-2 border-b-4 border-green-700 transition transform active:scale-95 flex items-center justify-center gap-2 shrink-0 mt-1">
                        <span>🛒</span>
                        <span>${_col('Mokėti')}</span>
                    </button>
                </div>
            `;
            updateCounterUI();
        }

        function updateCounterUI() {
            const tray = document.getElementById('counter-tray');
            const sumEl = document.getElementById('counter-sum');
            if (!tray || !sumEl) return;

            sumEl.textContent = formatMoneyCents(getCollectedSum());

            if (state.collectedItems.length === 0) {
                tray.innerHTML = `
                    <div class="flex items-center justify-center gap-2 text-slate-400 dark:text-slate-500 select-none pointer-events-none">
                        <span class="text-2xl animate-bounce">🪙</span>
                        <span class="font-black text-base sm:text-lg text-slate-500 dark:text-slate-400">Padėk pinigėlius čia</span>
                    </div>
                `;
            } else {
                tray.innerHTML = state.collectedItems.map((item, idx) => `
                    <button onclick="removeCoin(${idx})" class="${item.class} pop-in cursor-pointer hover:opacity-80" title="Nuimti">
                        ${item.label}
                    </button>
                `).join('');
            }
        }

        function checkPayAnswer() {
            if (state.waiting) return;
            const currentSum = getCollectedSum();
            const feedback = document.getElementById('feedback');
            const tray = document.getElementById('counter-tray');

            if (currentSum === state.targetCents) {
                state.waiting = true;
                playSound('correct');
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }
                feedback.innerHTML = `<span>${_col('Puikus pirkinys! Sumokėjai tiksliai!')} 🎉</span>`;
                feedback.className = "h-6 sm:h-7 flex items-center justify-center font-black text-sm sm:text-lg text-green-500 opacity-100";
                tray.classList.add('bounce');

                setTimeout(() => {
                    if (state.question >= state.maxQuestions) {
                        renderEndScreen();
                    } else {
                        state.question++;
                        generateQuestion();
                    }
                }, 1200);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playSound('wrong');
                let msg = currentSum < state.targetCents
                    ? 'Dar trūksta pinigėlių!'
                    : 'Padėjai per daug! Paspausk ant monetos, kad nuimtum.';
                feedback.innerHTML = `<span>${_col(msg)} 🤔</span>`;
                feedback.className = "h-6 sm:h-7 flex items-center justify-center font-black text-sm sm:text-lg text-red-500 opacity-100";
                const hBtn = document.getElementById('hint-btn');
                if (hBtn) hBtn.classList.add('hint-btn-pulse');
                tray.classList.remove('shake');
                void tray.offsetWidth;
                tray.classList.add('shake');
            }
        }

        function renderAffordScreen() {
            const task = state.currentTask;
            const walletCoinsHtml = task.wallet.map(item => `
                <div class="${item.class} pop-in">${item.label}</div>
            `).join('');

            const allOptions = shuffle([task.correct, ...task.wrong]);
            const optionsHtml = allOptions.map((opt, idx) => `
                <button id="afford-btn-${idx}" onclick="checkAffordAnswer(${idx}, ${opt.cents})" class="item-card p-3 sm:p-4 rounded-2xl shadow-sm border-b-4 transition transform active:scale-95 flex flex-col items-center justify-center gap-1.5">
                    <span class="text-4xl sm:text-5xl">${opt.emoji}</span>
                    <span class="font-black text-lg sm:text-xl">${_col(opt.name)}</span>
                    <span class="price-tag bg-amber-100 border border-amber-400 text-amber-900 font-black text-base sm:text-xl px-3 py-1 rounded-xl">${formatMoneyCents(opt.cents)}</span>
                </button>
            `).join('');

            app.innerHTML = `
                ${renderTopBar()}
                <div class="flex-1 flex flex-col p-3 sm:p-5 fade-in justify-evenly gap-2 overflow-hidden">
                    <div class="text-center flex flex-col items-center gap-1.5 min-h-0">
                        <div class="flex items-center justify-center gap-2.5 flex-wrap">
                            <h2 class="text-xl sm:text-2xl font-black text-slate-700 text-main-title flex items-center justify-center gap-2 shrink-0">
                                <span>🛍️</span>
                                <span>${_col('Ką gali nupirkti?')}</span>
                            </h2>
                            <span id="afford-hint-slot">
                                <button id="hint-btn" onclick="showAffordHint()" class="hint-btn py-1 px-3 text-xs sm:text-sm min-h-[34px]">
                                    <span>💡</span>
                                    <span>${_col('Užuomina')}</span>
                                </button>
                            </span>
                        </div>
                        <div id="afford-wallet" class="counter-tray flex flex-wrap items-center justify-center content-center gap-2 sm:gap-3 p-3 sm:p-4 rounded-2xl min-h-[100px] sm:min-h-[130px] w-full">
                            ${walletCoinsHtml}
                        </div>
                    </div>

                    <div id="feedback" class="h-6 sm:h-7 flex items-center justify-center font-black text-sm sm:text-lg opacity-0 transition-opacity shrink-0"></div>

                    <div class="grid grid-cols-2 gap-3 sm:gap-4 shrink-0">
                        ${optionsHtml}
                    </div>
                </div>
            `;
        }

        function checkAffordAnswer(idx, cents) {
            if (state.waiting) return;
            const btn = document.getElementById(`afford-btn-${idx}`);
            const feedback = document.getElementById('feedback');
            const walletEl = document.getElementById('afford-wallet');

            if (cents === state.targetCents) {
                state.waiting = true;
                playSound('correct');
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }
                btn.className = "p-2.5 sm:p-3.5 rounded-2xl bg-green-500 text-white border-b-4 border-green-700 flex flex-col items-center justify-center gap-1 bounce";
                feedback.innerHTML = `<span>${_col('Teisingai! Pinigų užtenka lygiai šiai prekei!')} 🎉</span>`;
                feedback.className = "h-6 sm:h-7 flex items-center justify-center font-black text-sm sm:text-lg text-green-500 opacity-100";

                setTimeout(() => {
                    if (state.question >= state.maxQuestions) {
                        renderEndScreen();
                    } else {
                        state.question++;
                        generateQuestion();
                    }
                }, 1200);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playSound('wrong');
                btn.disabled = true;
                btn.classList.add('opacity-40', 'cursor-not-allowed', 'shake');
                feedback.innerHTML = `<span>${_col('Suskaičiuok pinigus dar kartą!')} 🤔</span>`;
                feedback.className = "h-6 sm:h-7 flex items-center justify-center font-black text-sm sm:text-lg text-red-500 opacity-100";
                const hBtn = document.getElementById('hint-btn');
                if (hBtn) hBtn.classList.add('hint-btn-pulse');
                walletEl.classList.remove('shake');
                void walletEl.offsetWidth;
                walletEl.classList.add('shake');
            }
        }

        function renderEndScreen() {
            playSound('win');
            let stars = 1;
            if (state.score >= 8) stars = 3;
            else if (state.score >= 5) stars = 2;

            const starHtml = Array(3).fill(0).map((_, i) => 
                `<span class="text-5xl sm:text-6xl ${i < stars ? 'text-yellow-400 bounce' : 'text-gray-400 opacity-40'} drop-shadow-md" style="animation-delay: ${i * 0.2}s">⭐</span>`
            ).join('');

            let message = "Šaunus pirkėjas!";
            if (stars === 3) message = "Nuostabu! Tikras parduotuvės ekspertas!";
            else if (stars === 2) message = "Puikiai apsipirkai!";

            app.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-6 sm:p-8 text-center fade-in">
                    <h2 class="text-main-title text-3xl sm:text-4xl font-black text-gray-800 mb-4">${_col('Apsipirkimas baigtas!')}</h2>
                    <div class="flex justify-center gap-2 mb-4">${starHtml}</div>
                    <p class="text-sub-title text-xl sm:text-2xl font-bold text-gray-700 mb-2">${_col(message)} 🛍️</p>
                    <p class="text-sub-title text-lg sm:text-xl text-gray-600 mb-8">${_col('Taškai:')} <span class="font-black text-green-500">${state.score} / ${state.maxQuestions}</span></p>
                    <button onclick="renderStartScreen()" class="btn-tinted w-full max-w-xs py-4 rounded-2xl bg-orange-100 hover:bg-orange-200 text-slate-800 font-black text-xl sm:text-2xl shadow-lg transition transform active:scale-95 border-2 border-b-4 border-orange-400">
                        🔄 ${_col('Dar kartą')}
                    </button>
                </div>
            `;
        }

        renderStartScreen();
    </script>
</body>
</html>
