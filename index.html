    <style>
        body {
            font-family: 'Nunito', sans-serif;
            touch-action: manipulation;
            /* Gentle polka dot pattern */
            background-color: #f0fdf4;
            background-image: radial-gradient(#4ade80 2px, transparent 2px);
            background-size: 30px 30px;
        }
        
        .card-3d {
            transition: all 0.15s ease;
        }
        .card-3d:active {
            transform: translateY(6px);
            border-bottom-width: 2px !important;
            margin-bottom: 6px;
        }
        
        .back-btn-3d {
            transition: all 0.1s ease;
        }
        .back-btn-3d:active {
            transform: translateY(3px);
            border-bottom-width: 2px !important;
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        
        .fade-out {
            animation: fadeOut 0.2s ease-in forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.95); }
        }

        /* Tamsioji tema (Dark mode) */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0b1120 !important;
                background-image: radial-gradient(#1e293b 2px, transparent 2px) !important;
                color: #f1f5f9 !important;
            }
            .card-3d {
                background-color: #1e293b !important;
                border-color: #334155 !important;
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5) !important;
            }
            .card-3d:hover {
                background-color: #273549 !important;
            }
            .card-3d h2 {
                color: #f8fafc !important;
            }
            .card-3d p {
                color: #94a3b8 !important;
            }
        }
    </style>
</head>

    <!-- Game Container with Top Navigation Bar -->
    <div id="game-container" class="hidden fixed inset-0 z-40 flex flex-col bg-slate-900 overflow-hidden" style="position:fixed;top:0;left:0;right:0;bottom:0;">
        <header class="h-14 sm:h-16 bg-slate-800/95 backdrop-blur border-b border-slate-700 px-3 sm:px-6 flex items-center justify-between shrink-0 shadow-lg z-50 text-white select-none">
            <button onclick="goBack()" class="flex items-center gap-1.5 sm:gap-2 bg-slate-700 hover:bg-slate-600 active:bg-slate-900 text-white font-extrabold text-sm sm:text-base py-2 px-3 sm:px-4 rounded-xl border border-slate-600 shadow-sm transition-all transform active:scale-95">
                <span class="text-lg sm:text-xl leading-none">🏠</span>
                <span>Visi žaidimai</span>
            </button>

            <div id="current-game-title" class="text-sm sm:text-lg font-black tracking-wide text-amber-300 truncate max-w-[45%] text-center">
                Žaidimas
            </div>

            <button onclick="reloadGame()" title="Pradėti iš naujo" class="flex items-center gap-1.5 bg-slate-700 hover:bg-slate-600 active:bg-slate-900 text-slate-200 font-bold text-xs sm:text-sm py-2 px-3 rounded-xl border border-slate-600 shadow-sm transition-all transform active:scale-95">
                <span class="text-base leading-none">🔄</span>
                <span class="hidden sm:inline">Iš naujo</span>
            </button>
        </header>

        <div class="flex-1 w-full h-full relative overflow-hidden bg-white">
            <iframe id="game-frame" src="" allow="autoplay" class="w-full h-full border-none block" style="width:100%;height:100%;border:none;"></iframe>
        </div>
    </div>

    <script>
        const menu = document.getElementById('menu');
        const gameContainer = document.getElementById('game-container');
        const gameFrame = document.getElementById('game-frame');
        const currentGameTitle = document.getElementById('current-game-title');

        // Apsauga nuo priartinimo gestais (pinch to zoom ir double tap zoom)
        function preventZoom(doc) {
            if (!doc) return;
            try {
                doc.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
                doc.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
                doc.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });
                doc.addEventListener('touchstart', function(e) {
                    if (e.touches && e.touches.length > 1) {
                        e.preventDefault();
                    }
                }, { passive: false });
                doc.addEventListener('touchmove', function(e) {
                    if (e.touches && e.touches.length > 1) {
                        e.preventDefault();
                    }
                }, { passive: false });
                doc.addEventListener('wheel', function(e) {
                    if (e.ctrlKey) {
                        e.preventDefault();
                    }
                }, { passive: false });
            } catch (err) {}
        }
        preventZoom(document);

        // Apsaugome ir įkeliamą žaidimo iframe
        gameFrame.addEventListener('load', function() {
            try {
                const fDoc = gameFrame.contentDocument || (gameFrame.contentWindow && gameFrame.contentWindow.document);
                if (fDoc) {
                    preventZoom(fDoc);
                }
            } catch (err) {}
        });

        function getCacheBustedUrl(url) {
            const sep = url.includes('?') ? '&' : '?';
            return `${url}${sep}_t=${Date.now()}`;
        }

        function showGame(path, title) {
            currentGamePath = path;
            if (title) currentGameTitle.textContent = title;
            
            menu.classList.add('fade-out');
            
            setTimeout(() => {
                menu.classList.add('hidden');
                menu.style.display = 'none';
                menu.classList.remove('fade-out');
                
                gameFrame.src = getCacheBustedUrl(path);
                
                gameContainer.classList.remove('hidden');
                gameContainer.style.display = 'flex';
                gameContainer.classList.add('fade-in');
                
                setTimeout(() => {
                    gameContainer.classList.remove('fade-in');
                }, 300);
            }, 200);
        }

        function reloadGame() {
            if (currentGamePath) {
                gameFrame.src = 'about:blank';
                setTimeout(() => {
                    gameFrame.src = getCacheBustedUrl(currentGamePath);
                }, 60);
            }
        }

        function goBack() {
            gameContainer.classList.add('fade-out');
            
            setTimeout(() => {
                gameContainer.classList.add('hidden');
                gameContainer.style.display = 'none';
                gameContainer.classList.remove('fade-out');
                gameFrame.src = 'about:blank'; // Clear iframe to stop game/audio
                currentGamePath = '';
                
                menu.classList.remove('hidden');
                menu.style.display = '';
                menu.classList.add('fade-in');
                
                setTimeout(() => {
                    menu.classList.remove('fade-in');
                }, 300);
            }, 200);
        }
    </script>
