<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Žaidimai Vaikams</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            touch-action: manipulation;
            /* Gentle polka dot pattern */
            background-color: #f0fdf4;
            background-image: radial-gradient(#4ade80 2px, transparent 2px);
            background-size: 30px 30px;
        }
        
        .card-3d {
            transition: all 0.15s ease;
        }
        .card-3d:active {
            transform: translateY(6px);
            border-bottom-width: 2px !important;
            margin-bottom: 6px;
        }
        
        .back-btn-3d {
            transition: all 0.1s ease;
        }
        .back-btn-3d:active {
            transform: translateY(3px);
            border-bottom-width: 2px !important;
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        
        .fade-out {
            animation: fadeOut 0.2s ease-in forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.95); }
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col items-center">

    <!-- Menu Screen -->
    <div id="menu" class="w-full max-w-4xl px-4 py-8 flex flex-col items-center">
        <h1 class="text-4xl md:text-5xl font-black text-center mt-4 mb-10 text-white drop-shadow-md" 
            style="text-shadow: 3px 3px 0 #22c55e, -2px -2px 0 #22c55e, 2px -2px 0 #22c55e, -2px 2px 0 #22c55e;">
            🦉 Žaidimai Vaikams 🦉
        </h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
            <!-- Card 1 -->
            <button onclick="showGame('LinksmiSkaiciai-main/index.htm')" class="card-3d bg-sky-100 hover:bg-sky-50 border-sky-400 border-2 border-b-[8px] rounded-3xl p-6 flex items-center shadow-xl transform hover:-translate-y-1 text-left w-full group">
                <div class="text-6xl mr-4 flex-shrink-0 group-hover:scale-110 transition-transform">🔢</div>
                <div>
                    <h2 class="text-2xl md:text-3xl font-extrabold text-sky-800 mb-1">Linksmoji Matematika</h2>
                    <p class="text-sky-700 font-bold text-lg md:text-xl leading-tight">Sudėk ir atimk skaičius!</p>
                </div>
            </button>

            <!-- Card 2 -->
            <button onclick="showGame('MokomesRasyti-main/index.htm')" class="card-3d bg-green-100 hover:bg-green-50 border-green-500 border-2 border-b-[8px] rounded-3xl p-6 flex items-center shadow-xl transform hover:-translate-y-1 text-left w-full group">
                <div class="text-6xl mr-4 flex-shrink-0 group-hover:scale-110 transition-transform">✍️</div>
                <div>
                    <h2 class="text-2xl md:text-3xl font-extrabold text-green-800 mb-1">Mokomės Rašyti</h2>
                    <p class="text-green-700 font-bold text-lg md:text-xl leading-tight">Rašyk žodžius ir sakinius!</p>
                </div>
            </button>

            <!-- Card 3 -->
            <button onclick="showGame('RaidziuDelione-main/Index.htm')" class="card-3d bg-indigo-100 hover:bg-indigo-50 border-indigo-400 border-2 border-b-[8px] rounded-3xl p-6 flex items-center shadow-xl transform hover:-translate-y-1 text-left w-full group">
                <div class="text-6xl mr-4 flex-shrink-0 group-hover:scale-110 transition-transform">🧩</div>
                <div>
                    <h2 class="text-2xl md:text-3xl font-extrabold text-indigo-800 mb-1">Raidžių Dėlionė</h2>
                    <p class="text-indigo-700 font-bold text-lg md:text-xl leading-tight">Sudėliok žodį iš raidžių!</p>
                </div>
            </button>

            <!-- Card 4 -->
            <button onclick="showGame('SkaitymoZaidimas-main/index.htm')" class="card-3d bg-amber-100 hover:bg-amber-50 border-amber-400 border-2 border-b-[8px] rounded-3xl p-6 flex items-center shadow-xl transform hover:-translate-y-1 text-left w-full group">
                <div class="text-6xl mr-4 flex-shrink-0 group-hover:scale-110 transition-transform">📖</div>
                <div>
                    <h2 class="text-2xl md:text-3xl font-extrabold text-amber-800 mb-1">Skaitymo Žaidimas</h2>
                    <p class="text-amber-700 font-bold text-lg md:text-xl leading-tight">Perskaityk ir surask paveikslėlį!</p>
                </div>
            </button>
        </div>
    </div>

    <!-- Game Container -->
    <div id="game-container" class="hidden fixed inset-0 z-40" style="position:fixed;top:0;left:0;right:0;bottom:0;">
        <button id="back-btn" onclick="goBack()" class="back-btn-3d fixed top-4 left-4 z-50 bg-white/80 backdrop-blur-md border-2 border-slate-300 border-b-[6px] text-slate-700 font-extrabold py-3 px-6 rounded-full shadow-lg hover:bg-white text-xl flex items-center">
            <span class="mr-2 text-2xl leading-none">⬅</span> Grįžti
        </button>
        <iframe id="game-frame" src="" allow="autoplay" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;"></iframe>
    </div>

    <script>
        const menu = document.getElementById('menu');
        const gameContainer = document.getElementById('game-container');
        const gameFrame = document.getElementById('game-frame');

        function showGame(path) {
            menu.classList.add('fade-out');
            
            setTimeout(() => {
                menu.classList.add('hidden');
                menu.style.display = 'none';
                menu.classList.remove('fade-out');
                
                gameFrame.src = path;
                
                gameContainer.classList.remove('hidden');
                gameContainer.style.display = 'block';
                gameContainer.classList.add('fade-in');
                
                setTimeout(() => {
                    gameContainer.classList.remove('fade-in');
                }, 300);
            }, 200);
        }

        function goBack() {
            gameContainer.classList.add('fade-out');
            
            setTimeout(() => {
                gameContainer.classList.add('hidden');
                gameContainer.style.display = 'none';
                gameContainer.classList.remove('fade-out');
                gameFrame.src = ''; // Clear iframe to stop game/audio
                
                menu.classList.remove('hidden');
                menu.style.display = '';
                menu.classList.add('fade-in');
                
                setTimeout(() => {
                    menu.classList.remove('fade-in');
                }, 300);
            }, 200);
        }
    </script>
</body>
</html>
