<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>🏧 Kasininkas ir Grąža</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/common.css">
    <script src="../shared/common.js"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdfa;
            background-image: radial-gradient(#5eead4 20%, transparent 20%);
            background-size: 20px 20px;
            color: #1e293b;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .app-card {
            background-color: rgba(255, 255, 255, 0.97);
            border-color: #2dd4bf;
        }
        .receipt-box {
            background-color: #f0fdfa;
            border: 2px solid #99f6e4;
        }
        .change-tray {
            background-color: #fefce8;
            border: 2px dashed #facc15;
        }
        .drawer-box {
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
        }
        .opt-btn {
            background-color: #ccfbf1;
            color: #115e59;
            border-color: #5eead4;
        }
        .opt-btn:hover {
            background-color: #99f6e4;
        }

        /* Tamsioji Tema (Dark Mode) */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0b1120 !important;
                background-image: radial-gradient(#1e293b 25%, transparent 25%) !important;
                color: #f1f5f9 !important;
            }
            .app-card {
                background-color: #0f172a !important;
                border-color: #334155 !important;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6) !important;
            }
            .receipt-box {
                background-color: #1e293b !important;
                border-color: #475569 !important;
            }
            .change-tray {
                background-color: #1e293b !important;
                border-color: #475569 !important;
                box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5) !important;
            }
            .drawer-box {
                background-color: #0f172a !important;
                border-color: #334155 !important;
            }
            .opt-btn {
                background-color: #1e293b !important;
                color: #5eead4 !important;
                border-color: #334155 !important;
            }
            .opt-btn:hover {
                background-color: #334155 !important;
            }
            .text-main-title {
                color: #f8fafc !important;
            }
            .text-sub-title {
                color: #94a3b8 !important;
            }
        }
    </style>
</head>
<body class="h-screen max-h-screen flex items-center justify-center p-2 sm:p-4 overflow-hidden">

    <div id="app" class="app-card w-full max-w-2xl rounded-3xl shadow-xl flex flex-col relative fade-in border-4 overflow-hidden max-h-full">
    </div>

    <script>
        const MONEY = {
            c1:  { cents: 1, label: '1c', class: 'coin coin-copper coin-1c' },
            c2:  { cents: 2, label: '2c', class: 'coin coin-copper coin-2c' },
            c5:  { cents: 5, label: '5c', class: 'coin coin-copper coin-5c' },
            c10: { cents: 10, label: '10c', class: 'coin coin-gold coin-10c' },
            c20: { cents: 20, label: '20c', class: 'coin coin-gold coin-20c' },
            c50: { cents: 50, label: '50c', class: 'coin coin-gold coin-50c' },
            e1:  { cents: 100, label: '1€', class: 'coin coin-1e' },
            e2:  { cents: 200, label: '2€', class: 'coin coin-2e' },
            e5:  { cents: 500, label: '5€', class: 'bill bill-5e' },
            e10: { cents: 1000, label: '10€', class: 'bill bill-10e' },
            e20: { cents: 2000, label: '20€', class: 'bill bill-20e' }
        };

        const CENT_DRAWER = [MONEY.c1, MONEY.c2, MONEY.c5, MONEY.c10, MONEY.c20, MONEY.c50];
        const EURO_DRAWER = [MONEY.e1, MONEY.e2, MONEY.e5, MONEY.e10];

        const CUSTOMERS = [
            { name: 'Laputė', emoji: '🦊' },
            { name: 'Meškutis', emoji: '🐻' },
            { name: 'Kiškutis', emoji: '🐰' },
            { name: 'Pandutė', emoji: '🐼' },
            { name: 'Kačiukas', emoji: '🐱' },
            { name: 'Šuniukas', emoji: '🐶' }
        ];

        const CENT_SCENARIOS = [
            { item: 'Saldainis', emoji: '🍬', price: 5, paid: MONEY.c10 },
            { item: 'Riešutas', emoji: '🌰', price: 7, paid: MONEY.c10 },
            { item: 'Obuolys', emoji: '🍎', price: 15, paid: MONEY.c20 },
            { item: 'Sausainis', emoji: '🍪', price: 12, paid: MONEY.c20 },
            { item: 'Bananas', emoji: '🍌', price: 30, paid: MONEY.c50 },
            { item: 'Bandelė', emoji: '🥐', price: 35, paid: MONEY.c50 },
            { item: 'Spurga', emoji: '🍩', price: 40, paid: MONEY.c50 },
            { item: 'Ledai', emoji: '🍦', price: 60, paid: MONEY.e1 },
            { item: 'Sultys', emoji: '🧃', price: 70, paid: MONEY.e1 },
            { item: 'Šokoladas', emoji: '🍫', price: 80, paid: MONEY.e1 },
            { item: 'Jogurtas', emoji: '🥛', price: 75, paid: MONEY.e1 },
            { item: 'Kriaušė', emoji: '🍐', price: 25, paid: MONEY.c50 }
        ];

        const EURO_SCENARIOS = [
            { item: 'Pieštukas', emoji: '✏️', price: 100, paid: MONEY.e2 },
            { item: 'Sąsiuvinis', emoji: '📓', price: 200, paid: MONEY.e5 },
            { item: 'Balionas', emoji: '🎈', price: 300, paid: MONEY.e5 },
            { item: 'Dažai', emoji: '🎨', price: 400, paid: MONEY.e5 },
            { item: 'Knygelė', emoji: '📖', price: 600, paid: MONEY.e10 },
            { item: 'Meškiukas', emoji: '🧸', price: 700, paid: MONEY.e10 },
            { item: 'Kamuolys', emoji: '⚽', price: 800, paid: MONEY.e10 },
            { item: 'Lėlė', emoji: '🎎', price: 1200, paid: MONEY.e20 },
            { item: 'Mašinėlė', emoji: '🚗', price: 1400, paid: MONEY.e20 },
            { item: 'Kuprinė', emoji: '🎒', price: 1500, paid: MONEY.e20 },
            { item: 'Dėlionė', emoji: '🧩', price: 1100, paid: MONEY.e20 },
            { item: 'Robotas', emoji: '🤖', price: 1300, paid: MONEY.e20 }
        ];

        const state = {
            mode: 'cents', // 'cents' | 'euros' | 'quiz'
            score: 0,
            streak: 0,
            question: 1,
            maxQuestions: 10,
            scenario: null,
            customer: null,
            targetChange: 0,
            collectedChange: [],
            drawerPool: [],
            options: [],
            waiting: false,
            firstTry: true
        };

        const app = document.getElementById('app');

        function formatMoneyCents(cents) {
            if (cents < 100) return cents + ' c';
            if (cents % 100 === 0) return (cents / 100) + ' €';
            return (cents / 100).toFixed(2).replace('.', ',') + ' €';
        }

        function getRandomElement(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function renderStartScreen() {
            app.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-5 sm:p-8 text-center fade-in">
                    <div class="text-5xl sm:text-6xl mb-2 bounce">🏧</div>
                    <h1 class="text-main-title text-3xl sm:text-5xl font-black text-teal-700 mb-4 tracking-tight">${_col('Kasininkas ir Grąža')}</h1>
                    
                    <div class="flex flex-col gap-3 w-full max-w-sm">
                        <button onclick="startGame('cents')" class="btn-tinted w-full py-3.5 sm:py-4 px-4 rounded-2xl bg-teal-100 hover:bg-teal-200 text-slate-800 font-black text-lg sm:text-2xl shadow-lg transition transform active:scale-95 border-2 border-b-4 border-teal-400 flex items-center justify-center gap-2.5">
                            <span class="text-3xl">🪙</span>
                            <span>${_col('Centai')}</span>
                        </button>
                        <button onclick="startGame('euros')" class="btn-tinted w-full py-3.5 sm:py-4 px-4 rounded-2xl bg-emerald-100 hover:bg-emerald-200 text-slate-800 font-black text-lg sm:text-2xl shadow-lg transition transform active:scale-95 border-2 border-b-4 border-emerald-400 flex items-center justify-center gap-2.5">
                            <span class="text-3xl">💶</span>
                            <span>${_col('Eurai')}</span>
                        </button>
                        <button onclick="startGame('quiz')" class="btn-tinted w-full py-3.5 sm:py-4 px-4 rounded-2xl bg-indigo-100 hover:bg-indigo-200 text-slate-800 font-black text-lg sm:text-2xl shadow-lg transition transform active:scale-95 border-2 border-b-4 border-indigo-400 flex items-center justify-center gap-2.5">
                            <span class="text-3xl">🎯</span>
                            <span>${_col('Viktorina')}</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function startGame(mode) {
            initAudio();
            state.mode = mode;
            state.score = 0;
            state.streak = 0;
            state.question = 1;
            generateQuestion();
        }

        function renderTopBar() {
            return `
                <div class="top-bar bg-teal-100 border-b-2 border-teal-300 text-slate-800 px-3 sm:px-5 py-2 sm:py-2.5 flex justify-between items-center font-black text-base sm:text-lg shadow-sm shrink-0">
                    <div class="flex items-center gap-2 sm:gap-3">
                        <button onclick="renderStartScreen()" class="top-badge bg-white/90 hover:bg-teal-200 border border-teal-300 px-2.5 py-1 rounded-xl text-base sm:text-xl transition active:scale-95" title="Pradžia">🏠</button>
                        <span class="flex items-center gap-1.5 text-base sm:text-lg">⭐ <span class="text-teal-700 dark:text-amber-300 font-black text-lg sm:text-xl">${state.score}</span></span>
                    </div>
                    <div class="top-badge bg-white/90 border border-teal-300 px-3 py-1 rounded-xl font-black text-teal-700 dark:text-amber-300 text-base sm:text-lg">🎯 ${state.question} / ${state.maxQuestions}</div>
                    <div class="flex items-center gap-1.5 text-base sm:text-lg">🔥 <span class="text-teal-700 dark:text-amber-300 font-black text-lg sm:text-xl">${state.streak}</span></div>
                </div>
            `;
        }

        function generateQuestion() {
            state.waiting = false;
            state.firstTry = true;
            state.collectedChange = [];
            state.customer = getRandomElement(CUSTOMERS);

            const pool = state.mode === 'cents'
                ? CENT_SCENARIOS
                : state.mode === 'euros'
                ? EURO_SCENARIOS
                : [...CENT_SCENARIOS, ...EURO_SCENARIOS];

            let nextScen;
            do {
                nextScen = getRandomElement(pool);
            } while (state.scenario && nextScen.item === state.scenario.item && nextScen.price === state.scenario.price);

            state.scenario = nextScen;
            state.targetChange = nextScen.paid.cents - nextScen.price;
            state.drawerPool = nextScen.paid.cents <= 100 ? CENT_DRAWER : EURO_DRAWER;

            if (state.mode === 'quiz') {
                const opts = new Set([state.targetChange]);
                const stepList = state.targetChange < 100 ? [5, 10, 15, 20] : [100, 200, 300, 500];
                while (opts.size < 4) {
                    const diff = getRandomElement(stepList) * (Math.random() > 0.5 ? 1 : -1);
                    const cand = state.targetChange + diff;
                    if (cand > 0 && cand < nextScen.paid.cents && cand !== state.targetChange) {
                        opts.add(cand);
                    }
                }
                state.options = Array.from(opts).sort(() => Math.random() - 0.5);
                renderQuizScreen();
            } else {
                renderCashierScreen();
            }
        }

        function renderScenarioHeader() {
            const sc = state.scenario;
            const cust = state.customer;
            return `
                <div class="receipt-box p-2.5 sm:p-3.5 rounded-2xl flex items-center justify-between gap-2 shadow-sm shrink-0">
                    <div class="flex items-center gap-2 sm:gap-3 min-w-0">
                        <div class="text-4xl sm:text-5xl shrink-0">${cust.emoji}</div>
                        <div class="text-left min-w-0">
                            <div class="text-xs sm:text-sm font-extrabold text-slate-500 text-sub-title truncate">${_col(cust.name + ' perka:')}</div>
                            <div class="font-black text-sm sm:text-lg flex items-center gap-1 mt-0.5">
                                <span class="shrink-0">${sc.emoji}</span>
                                <span class="truncate">${_col(sc.item)}</span>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                        <div class="text-center bg-amber-100 dark:bg-slate-800 border-2 border-amber-400 px-2.5 sm:px-3 py-1 rounded-xl shadow-sm">
                            <div class="text-xs sm:text-sm font-extrabold text-amber-800 dark:text-amber-300">${_col('Kaina')}</div>
                            <div class="font-black text-sm sm:text-lg text-amber-950 dark:text-amber-200">${formatMoneyCents(sc.price)}</div>
                        </div>

                        <div class="flex flex-col items-center">
                            <span class="text-xs sm:text-sm font-extrabold text-slate-500 text-sub-title mb-0.5">${_col('Davė:')}</span>
                            <div class="${sc.paid.class}" style="transform: scale(0.9); margin: -2px;">${sc.paid.label}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function getChangeSum() {
            return state.collectedChange.reduce((acc, item) => acc + item.cents, 0);
        }

        function addChangeCoin(idx) {
            if (state.waiting) return;
            if (state.collectedChange.length >= 10) return;
            state.collectedChange.push(state.drawerPool[idx]);
            playSound('coin');
            updateCashierUI();
        }

        function removeChangeCoin(idx) {
            if (state.waiting) return;
            state.collectedChange.splice(idx, 1);
            playSound('remove');
            updateCashierUI();
        }

        function clearChange() {
            if (state.waiting) return;
            state.collectedChange = [];
            playSound('remove');
            updateCashierUI();
        }

        function renderCashierScreen() {
            const drawerHtml = state.drawerPool.map((item, idx) => `
                <button onclick="addChangeCoin(${idx})" class="${item.class} cursor-pointer hover:scale-105">
                    ${item.label}
                </button>
            `).join('');

            app.innerHTML = `
                ${renderTopBar()}
                <div class="flex-1 flex flex-col p-2.5 sm:p-4 fade-in justify-between overflow-hidden">
                    ${renderScenarioHeader()}

                    <!-- Grąžos padėklas -->
                    <div class="flex flex-col my-1 sm:my-2 shrink-0">
                        <div class="flex justify-between items-center px-1 mb-1.5 text-base sm:text-lg font-black shrink-0">
                            <span class="text-sub-title flex items-center gap-2">🪙 Grąža: <strong id="change-sum" class="text-emerald-500 font-black text-xl sm:text-3xl">0 c</strong></span>
                            <button onclick="clearChange()" class="text-rose-500 hover:scale-110 active:scale-95 text-xl p-1.5 rounded-xl hover:bg-rose-50 dark:hover:bg-rose-950/30 transition" title="Išvalyti">🗑️</button>
                        </div>
                        <div id="change-tray" class="change-tray flex flex-wrap items-center justify-center content-center gap-2 sm:gap-3 p-3 sm:p-4 rounded-2xl h-28 sm:h-36">
                        </div>
                    </div>

                    <div id="feedback" class="h-6 sm:h-7 flex items-center justify-center font-black text-sm sm:text-lg opacity-0 transition-opacity shrink-0"></div>

                    <!-- Kasos stalčius -->
                    <div class="drawer-box p-2.5 sm:p-3.5 rounded-2xl flex flex-col items-center gap-1.5 shrink-0">
                        <div class="text-xs sm:text-sm font-extrabold text-slate-500 dark:text-slate-400 flex items-center gap-1">
                            <span>🏧</span> <span>${_col('Kasos stalčius (spausk monetą):')}</span>
                        </div>
                        <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-3 max-w-lg">
                            ${drawerHtml}
                        </div>
                    </div>

                    <button onclick="checkCashierAnswer()" class="w-full py-3.5 sm:py-4 rounded-2xl bg-green-500 hover:bg-green-600 text-white font-black text-xl sm:text-2xl shadow-lg border-2 border-b-4 border-green-700 transition transform active:scale-95 flex items-center justify-center gap-2 shrink-0 mt-1">
                        <span>✅</span>
                        <span>${_col('Patvirtinti')}</span>
                    </button>
                </div>
            `;
            updateCashierUI();
        }

        function updateCashierUI() {
            const tray = document.getElementById('change-tray');
            const sumEl = document.getElementById('change-sum');
            if (!tray || !sumEl) return;

            sumEl.textContent = formatMoneyCents(getChangeSum());

            if (state.collectedChange.length === 0) {
                tray.innerHTML = `
                    <div class="flex items-center justify-center gap-2 text-slate-400 dark:text-slate-500 select-none pointer-events-none">
                        <span class="text-2xl animate-bounce">🪙</span>
                        <span class="font-black text-sm sm:text-base text-slate-500 dark:text-slate-400">Atiduok grąžą čia</span>
                    </div>
                `;
            } else {
                tray.innerHTML = state.collectedChange.map((item, idx) => `
                    <button onclick="removeChangeCoin(${idx})" class="${item.class} pop-in cursor-pointer hover:opacity-80" title="Nuimti">
                        ${item.label}
                    </button>
                `).join('');
            }
        }

        function checkCashierAnswer() {
            if (state.waiting) return;
            const currentSum = getChangeSum();
            const feedback = document.getElementById('feedback');
            const tray = document.getElementById('change-tray');

            if (currentSum === state.targetChange) {
                state.waiting = true;
                playSound('correct');
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }
                feedback.innerHTML = `<span>${_col('Puiku! Grąža atiduota teisingai!')} 🎉</span>`;
                feedback.className = "h-6 sm:h-7 flex items-center justify-center font-black text-sm sm:text-lg text-green-500 opacity-100";
                tray.classList.add('bounce');

                setTimeout(() => {
                    if (state.question >= state.maxQuestions) {
                        renderEndScreen();
                    } else {
                        state.question++;
                        generateQuestion();
                    }
                }, 1200);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playSound('wrong');
                let msg = currentSum < state.targetChange
                    ? 'Pirkėjui dar trūksta grąžos!'
                    : 'Per daug grąžos! Paspausk ant monetos, kad nuimtum.';
                feedback.innerHTML = `<span>${_col(msg)} 🤔</span>`;
                feedback.className = "h-6 sm:h-7 flex items-center justify-center font-black text-sm sm:text-lg text-red-500 opacity-100";
                tray.classList.remove('shake');
                void tray.offsetWidth;
                tray.classList.add('shake');
            }
        }

        function renderQuizScreen() {
            const sc = state.scenario;
            const optionsHtml = state.options.map((opt, idx) => `
                <button id="quiz-btn-${idx}" onclick="checkQuizAnswer(${idx}, ${opt})" class="opt-btn py-3.5 sm:py-4 rounded-2xl font-black text-xl sm:text-2xl shadow-md border-b-4 transition transform active:scale-95">
                    ${formatMoneyCents(opt)}
                </button>
            `).join('');

            app.innerHTML = `
                ${renderTopBar()}
                <div class="flex-1 flex flex-col p-3 sm:p-5 fade-in justify-between overflow-hidden">
                    ${renderScenarioHeader()}

                    <div id="quiz-box" class="change-tray p-4 sm:p-6 rounded-2xl text-center flex flex-col items-center justify-center gap-2">
                        <div class="text-2xl sm:text-4xl font-black text-teal-600 bg-white/80 dark:bg-slate-800 px-5 py-2 rounded-2xl border border-teal-300">
                            ${formatMoneyCents(sc.paid.cents)} − ${formatMoneyCents(sc.price)} = ❓
                        </div>
                    </div>

                    <div id="feedback" class="h-7 flex items-center justify-center font-black text-sm sm:text-lg opacity-0 transition-opacity"></div>

                    <div class="grid grid-cols-2 gap-2.5 sm:gap-3.5">
                        ${optionsHtml}
                    </div>
                </div>
            `;
        }

        function checkQuizAnswer(idx, val) {
            if (state.waiting) return;
            const btn = document.getElementById(`quiz-btn-${idx}`);
            const feedback = document.getElementById('feedback');
            const box = document.getElementById('quiz-box');

            if (val === state.targetChange) {
                state.waiting = true;
                playSound('correct');
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }
                btn.className = "py-3.5 sm:py-4 bg-green-500 text-white rounded-2xl font-black text-xl sm:text-2xl shadow-md border-b-4 border-green-700 bounce";
                feedback.innerHTML = `<span>${_col('Teisingai! Puikiai suskaičiavai grąžą!')} 🎉</span>`;
                feedback.className = "h-7 flex items-center justify-center font-black text-sm sm:text-lg text-green-500 opacity-100";

                setTimeout(() => {
                    if (state.question >= state.maxQuestions) {
                        renderEndScreen();
                    } else {
                        state.question++;
                        generateQuestion();
                    }
                }, 1200);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playSound('wrong');
                btn.disabled = true;
                btn.className = "py-3.5 sm:py-4 bg-red-100 text-red-400 border-red-200 border-2 rounded-2xl font-bold text-xl sm:text-2xl line-through opacity-50 shake";
                feedback.innerHTML = `<span>${_col('Bandyk dar kartą!')} 🤔</span>`;
                feedback.className = "h-7 flex items-center justify-center font-black text-sm sm:text-lg text-red-500 opacity-100";
                box.classList.remove('shake');
                void box.offsetWidth;
                box.classList.add('shake');
            }
        }

        function renderEndScreen() {
            playSound('win');
            let stars = 1;
            if (state.score >= 8) stars = 3;
            else if (state.score >= 5) stars = 2;

            const starHtml = Array(3).fill(0).map((_, i) => 
                `<span class="text-5xl sm:text-6xl ${i < stars ? 'text-yellow-400 bounce' : 'text-gray-400 opacity-40'} drop-shadow-md" style="animation-delay: ${i * 0.2}s">⭐</span>`
            ).join('');

            let message = "Šaunus kasininkas!";
            if (stars === 3) message = "Nuostabu! Grąžą skaičiuoji be klaidų!";
            else if (stars === 2) message = "Puikus darbas kasoje!";

            app.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-6 sm:p-8 text-center fade-in">
