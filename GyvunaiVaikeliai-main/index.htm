<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>🐾 Gyvūnai ir Vaikeliai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/common.css">
    <script src="../shared/common.js"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fffbeb;
            background-image: radial-gradient(#fde68a 20%, transparent 20%);
            background-size: 20px 20px;
        }

        .btn-3d {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-3d:active {
            transform: translateY(4px);
        }

        /* Tamsioji tema */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0b1120 !important;
                background-image: radial-gradient(#1e293b 20%, transparent 20%) !important;
                color: #f1f5f9 !important;
            }
            #app {
                background-color: #0f172a !important;
                border-color: #334155 !important;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6) !important;
            }
            h2, h1 {
                color: #f8fafc !important;
            }
            .btn-3d {
                background-color: #1e293b !important;
                border-color: #334155 !important;
                color: #f8fafc !important;
                box-shadow: 0 5px 0 #0f172a !important;
            }
            .btn-3d:hover {
                background-color: #273549 !important;
            }
            .btn-3d.selected-card {
                background-color: #451a03 !important;
                border-color: #f59e0b !important;
                box-shadow: 0 0 0 3px #f59e0b !important;
            }
            .btn-3d.matched-card {
                background-color: #16a34a !important;
                border-color: #15803d !important;
                color: #ffffff !important;
            }
            .bg-amber-100\/60 {
                background-color: rgba(30, 41, 59, 0.7) !important;
                border-color: #334155 !important;
            }
            .text-amber-900 {
                color: #fde68a !important;
            }
        }
    </style>
</head>
<body class="h-screen max-h-screen flex items-center justify-center p-2 sm:p-4 overflow-hidden transition-colors duration-200">

    <div id="app" class="w-full max-w-2xl bg-white/95 backdrop-blur-md rounded-3xl shadow-xl flex flex-col relative border-4 border-amber-300 overflow-hidden max-h-full">
        <!-- Turinis bus atvaizduotas dinamiškai per JS -->
    </div>

    <script>
        // Duomenų bazė: 1 režimas (Mamos ir Mažyliai)
        const BABIES_DATA = [
            { parent: "Karvė 🐄", prompt: "Kaip vadinasi karvės vaikelis?", correct: "Veršiukas", options: ["Veršiukas", "Kumeliukas", "Paršiukas", "Ėriukas"] },
            { parent: "Arklys 🐎", prompt: "Kaip vadinasi arklio vaikelis?", correct: "Kumeliukas", options: ["Kumeliukas", "Veršiukas", "Šuniukas", "Ožiukas"] },
            { parent: "Avis 🐑", prompt: "Kaip vadinasi avies vaikelis?", correct: "Ėriukas", options: ["Ėriukas", "Paršiukas", "Kačiukas", "Veršiukas"] },
            { parent: "Kiaulė 🐖", prompt: "Kaip vadinasi kiaulės vaikelis?", correct: "Paršiukas", options: ["Paršiukas", "Veršiukas", "Ėriukas", "Kumeliukas"] },
            { parent: "Šuo 🐕", prompt: "Kaip vadinasi šuns vaikelis?", correct: "Šuniukas", options: ["Šuniukas", "Kačiukas", "Lapiukas", "Meškiukas"] },
            { parent: "Katė 🐈", prompt: "Kaip vadinasi katės vaikelis?", correct: "Kačiukas", options: ["Kačiukas", "Šuniukas", "Kiškiukas", "Peliukas"] },
            { parent: "Višta 🐔", prompt: "Kaip vadinasi vištos vaikelis?", correct: "Viščiukas", options: ["Viščiukas", "Ančiukas", "Žąsiukas", "Pelėdžiukas"] },
            { parent: "Antis 🦆", prompt: "Kaip vadinasi anties vaikelis?", correct: "Ančiukas", options: ["Ančiukas", "Viščiukas", "Žąsiukas", "Paukščiukas"] },
            { parent: "Vilkas 🐺", prompt: "Kaip vadinasi vilko vaikelis?", correct: "Vilkiukas", options: ["Vilkiukas", "Lapiukas", "Meškiukas", "Šuniukas"] },
            { parent: "Lapė 🦊", prompt: "Kaip vadinasi lapės vaikelis?", correct: "Lapiukas", options: ["Lapiukas", "Vilkiukas", "Kiškiukas", "Kačiukas"] },
            { parent: "Meška 🐻", prompt: "Kaip vadinasi meškos vaikelis?", correct: "Meškiukas", options: ["Meškiukas", "Vilkiukas", "Ežiukas", "Lapiukas"] },
            { parent: "Kiškis 🐇", prompt: "Kaip vadinasi kiškio vaikelis?", correct: "Kiškiukas", options: ["Kiškiukas", "Peliukas", "Kačiukas", "Voveriukas"] },
            { parent: "Ožka 🐐", prompt: "Kaip vadinasi ožkos vaikelis?", correct: "Ožiukas", options: ["Ožiukas", "Ėriukas", "Veršiukas", "Kumeliukas"] },
            { parent: "Žąsis 🪿", prompt: "Kaip vadinasi žąsies vaikelis?", correct: "Žąsiukas", options: ["Žąsiukas", "Viščiukas", "Ančiukas", "Paukščiukas"] }
        ];

        // Duomenų bazė: 2 režimas (Kas kur gyvena?)
        const HOMES_DATA = [
            { parent: "Šuo 🐕", prompt: "Kur gyvena šuo?", correct: "Būdoje", options: ["Būdoje", "Lizde", "Avilyje", "Tvarte"] },
            { parent: "Bitė 🐝", prompt: "Kur gyvena bitės?", correct: "Avilyje", options: ["Avilyje", "Būdoje", "Lizde", "Oloje"] },
            { parent: "Paukštis 🐦", prompt: "Kur gyvena paukštelis?", correct: "Lizde", options: ["Lizde", "Avilyje", "Būdoje", "Užtvankoje"] },
            { parent: "Voverė 🐿️", prompt: "Kur gyvena voveraitė?", correct: "Drevėje", options: ["Drevėje", "Būdoje", "Upėje", "Avilyje"] },
            { parent: "Karvė 🐄", prompt: "Kur gyvena karvė?", correct: "Tvarte", options: ["Tvarte", "Oloje", "Būdoje", "Lizde"] },
            { parent: "Arklys 🐎", prompt: "Kur gyvena arklys?", correct: "Arklidėje", options: ["Arklidėje", "Lizde", "Avilyje", "Būdoje"] },
            { parent: "Bebras 🦫", prompt: "Kur gyvena bebras?", correct: "Užtvankoje", options: ["Užtvankoje", "Drevėje", "Būdoje", "Arklidėje"] },
            { parent: "Meška 🐻", prompt: "Kur žiemą miega meška?", correct: "Guolyje", options: ["Guolyje", "Lizde", "Avilyje", "Būdoje"] },
            { parent: "Žuvis 🐟", prompt: "Kur gyvena žuvelė?", correct: "Vandenyje", options: ["Vandenyje", "Medyje", "Tvarte", "Būdoje"] },
            { parent: "Kregždė 🐦", prompt: "Kur kregždė lipdo namelį?", correct: "Po stogu", options: ["Po stogu", "Vandenyje", "Avilyje", "Tvarte"] }
        ];

        // Duomenų bazė: 3 režimas (Ką mėgsta gyvūnai? & Porų sujungimas)
        const FOODS_PAIRS = [
            { id: "kiskis", animal: "Kiškis", emoji: "🐇", match: "Morkas" },
            { id: "meska", animal: "Meška", emoji: "🐻", match: "Medų" },
            { id: "vovere", animal: "Voverė", emoji: "🐿️", match: "Riešutus" },
            { id: "karve", animal: "Karvė", emoji: "🐄", match: "Žolę" },
            { id: "suo", animal: "Šuo", emoji: "🐕", match: "Kaulą" },
            { id: "kate", animal: "Katė", emoji: "🐈", match: "Pieną" },
            { id: "bezdz", animal: "Beždžionė", emoji: "🐒", match: "Bananus" },
            { id: "varle", animal: "Varlė", emoji: "🐸", match: "Uodus" },
            { id: "paukstis", animal: "Paukštis", emoji: "🐦", match: "Grūdus" },
            { id: "ezys", animal: "Ežys", emoji: "🦔", match: "Obuolius" },
            { id: "pele", animal: "Pelė", emoji: "🐁", match: "Sūrį" },
            { id: "arklys", animal: "Arklys", emoji: "🐎", match: "Avižas" }
        ];

        const BABIES_PAIRS = [
            { id: "b_karve", animal: "Karvė", emoji: "🐄", match: "Veršiukas" },
            { id: "b_arklys", animal: "Arklys", emoji: "🐎", match: "Kumeliukas" },
            { id: "b_avis", animal: "Avis", emoji: "🐑", match: "Ėriukas" },
            { id: "b_kiaule", animal: "Kiaulė", emoji: "🐖", match: "Paršiukas" },
            { id: "b_vista", animal: "Višta", emoji: "🐔", match: "Viščiukas" },
            { id: "b_ozka", animal: "Ožka", emoji: "🐐", match: "Ožiukas" }
        ];

        const HOMES_PAIRS = [
            { id: "h_vovere", animal: "Voverė", emoji: "🐿️", match: "Drevėje" },
            { id: "h_bite", animal: "Bitė", emoji: "🐝", match: "Avilyje" },
            { id: "h_bebras", animal: "Bebras", emoji: "🦫", match: "Užtvankoje" },
            { id: "h_suo", animal: "Šuo", emoji: "🐕", match: "Būdoje" },
            { id: "h_paukstis", animal: "Paukštis", emoji: "🐦", match: "Lizde" },
            { id: "h_meska", animal: "Meška", emoji: "🐻", match: "Guolyje" }
        ];

        let state = {
            mode: 'babies',
            questions: [],
            currentIndex: 0,
            totalPossible: 10,
            score: 0,
            streak: 0,
            firstTry: true,
            waiting: false,
            // Mode 3 matching state
            boards: [],
            selectedLeft: null,
            selectedRight: null,
            matchedIds: []
        };

        const appEl = document.getElementById('app');

        function renderStartScreen() {
            appEl.innerHTML = `
                <div class="p-5 sm:p-8 flex flex-col items-center justify-center text-center">
                    <div class="text-5xl sm:text-7xl mb-2 animate-bounce">🐾</div>
                    <h1 class="text-2xl sm:text-4xl font-black text-amber-800 mb-4 sm:mb-5">${_col('Gyvūnai ir Vaikeliai')}</h1>
                    
                    <div class="flex flex-col gap-3 w-full max-w-sm">
                        <button onclick="startGame('babies')" class="btn-3d py-3 sm:py-3.5 px-5 bg-amber-100 hover:bg-amber-200 border-2 border-amber-400 rounded-2xl text-lg sm:text-xl font-black shadow-[0_5px_0_#d97706] active:shadow-[0_0px_0_#d97706] transition-all flex items-center justify-center gap-2.5">
                            <span class="text-2xl">🐮</span>
                            <span>${_col('Mažyliai')}</span>
                        </button>
                        <button onclick="startGame('homes')" class="btn-3d py-3 sm:py-3.5 px-5 bg-emerald-100 hover:bg-emerald-200 border-2 border-emerald-400 rounded-2xl text-lg sm:text-xl font-black shadow-[0_5px_0_#059669] active:shadow-[0_0px_0_#059669] transition-all flex items-center justify-center gap-2.5">
                            <span class="text-2xl">🏡</span>
                            <span>${_col('Namai')}</span>
                        </button>
                        <button onclick="startGame('matching')" class="btn-3d py-3 sm:py-3.5 px-5 bg-orange-100 hover:bg-orange-200 border-2 border-orange-400 rounded-2xl text-lg sm:text-xl font-black shadow-[0_5px_0_#ea580c] active:shadow-[0_0px_0_#ea580c] transition-all flex items-center justify-center gap-2.5">
                            <span class="text-2xl">🥕</span>
                            <span>${_col('Ką valgo?')}</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function startGame(mode) {
            getAudioCtx();
            state.mode = mode;
            state.score = 0;
            state.streak = 0;
            state.currentIndex = 0;

            if (mode === 'matching') {
                const shuffledFoods = shuffle(FOODS_PAIRS);
                const shuffledBabies = shuffle(BABIES_PAIRS);
                const shuffledHomes = shuffle(HOMES_PAIRS);

                state.boards = [
                    { prompt: "🥕 Ką valgo?", pairs: shuffledFoods.slice(0, 3) },
                    { prompt: "🥕 Ką valgo?", pairs: shuffledFoods.slice(3, 6) },
                    { prompt: "🥕 Ką valgo?", pairs: shuffledFoods.slice(6, 9) },
                    { prompt: "🥕 Ką valgo?", pairs: shuffledFoods.slice(9, 12) },
                    { prompt: "🐾 Kieno mažylis?", pairs: shuffledBabies.slice(0, 3) },
                    { prompt: "🏡 Kur gyvena?", pairs: shuffledHomes.slice(0, 3) }
                ];
                state.totalPossible = state.boards.length * 3;
                prepareMatchingBoard();
            } else {
                const pool = mode === 'babies' ? BABIES_DATA : HOMES_DATA;
                state.questions = shuffle(pool).slice(0, 10);
                state.totalPossible = 10;
                renderQuestion();
            }
        }

        function prepareMatchingBoard() {
            if (state.currentIndex >= state.boards.length) {
                renderEndScreen();
                return;
            }
            const board = state.boards[state.currentIndex];
            board.leftItems = shuffle([...board.pairs]);
            board.rightItems = shuffle([...board.pairs]);
            // Ensure right column isn't identical order to left column
            if (board.rightItems.every((it, idx) => it.id === board.leftItems[idx].id)) {
                board.rightItems.push(board.rightItems.shift());
            }
            state.selectedLeft = null;
            state.selectedRight = null;
            state.matchedIds = [];
            state.firstTry = true;
            state.waiting = false;
            renderMatchingBoard();
        }

        function renderMatchingBoard() {
            const board = state.boards[state.currentIndex];

            const leftHtml = board.leftItems.map(item => {
                const isMatched = state.matchedIds.includes(item.id);
                const isSelected = state.selectedLeft === item.id;
                let cls = "bg-amber-50 hover:bg-amber-100 border-amber-300 shadow-[0_4px_0_#fcd34d]";
                if (isMatched) {
                    cls = "matched-card bg-green-500 text-white border-green-600 shadow-[0_3px_0_#15803d] opacity-90";
                } else if (isSelected) {
                    cls = "selected-card bg-yellow-100 border-amber-500 ring-4 ring-amber-400 shadow-[0_4px_0_#f59e0b] scale-[1.02]";
                }
                return `
                    <button id="left-${item.id}" onclick="selectLeft('${item.id}')" ${isMatched ? 'disabled' : ''}
                        class="btn-3d py-2.5 sm:py-3.5 px-3 border-2 rounded-2xl text-base sm:text-xl font-black transition-all flex items-center justify-start gap-2.5 sm:gap-3 w-full ${cls}">
                        <span class="text-3xl sm:text-4xl">${item.emoji}</span>
                        <span class="truncate">${_col(item.animal)}</span>
                        ${isMatched ? '<span class="ml-auto text-lg">✅</span>' : ''}
                    </button>
                `;
            }).join('');

            const rightHtml = board.rightItems.map(item => {
                const isMatched = state.matchedIds.includes(item.id);
                const isSelected = state.selectedRight === item.id;
                let cls = "bg-orange-50 hover:bg-orange-100 border-orange-300 shadow-[0_4px_0_#fdba74]";
                if (isMatched) {
                    cls = "matched-card bg-green-500 text-white border-green-600 shadow-[0_3px_0_#15803d] opacity-90";
                } else if (isSelected) {
                    cls = "selected-card bg-yellow-100 border-amber-500 ring-4 ring-amber-400 shadow-[0_4px_0_#f59e0b] scale-[1.02]";
                }
                return `
                    <button id="right-${item.id}" onclick="selectRight('${item.id}')" ${isMatched ? 'disabled' : ''}
                        class="btn-3d py-2.5 sm:py-3.5 px-3 border-2 rounded-2xl text-base sm:text-xl font-black transition-all flex items-center justify-center text-center w-full min-h-[56px] sm:min-h-[68px] ${cls}">
                        <span>${_col(item.match)}</span>
                        ${isMatched ? '<span class="ml-2 text-lg">✅</span>' : ''}
                    </button>
                `;
            }).join('');

            appEl.innerHTML = `
                <!-- Top Status Bar -->
                <div class="bg-amber-500 text-white px-3 sm:px-5 py-2 sm:py-2.5 flex justify-between items-center font-bold text-xs sm:text-base shadow">
                    <div class="flex items-center gap-2">
                        <button onclick="renderStartScreen()" class="bg-amber-600 hover:bg-amber-700 px-2 py-0.5 rounded-lg text-sm" title="Pradžia">🏠</button>
                        <span>⭐ <span class="text-yellow-200 font-black">${state.score}</span></span>
                    </div>
                    <div class="bg-amber-600 px-2.5 py-0.5 rounded-xl font-black">🎯 ${state.currentIndex + 1} / ${state.boards.length}</div>
                    <div>🔥 <span class="text-orange-200 font-black">${state.streak}</span></div>
                </div>

                <div class="p-3 sm:p-5 flex-1 flex flex-col justify-between items-center">
                    <h2 class="text-xl sm:text-2xl font-black text-slate-800 text-center mb-2">${_col(board.prompt)}</h2>

                    <div class="grid grid-cols-2 gap-3 sm:gap-5 w-full my-auto">
                        <div class="flex flex-col gap-2.5 sm:gap-3.5">
                            ${leftHtml}
                        </div>
                        <div class="flex flex-col gap-2.5 sm:gap-3.5">
                            ${rightHtml}
                        </div>
                    </div>

                    <div id="feedback" class="h-7 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black mt-2 opacity-0 transition-opacity">
                        Pranešimas
                    </div>
                </div>
            `;
        }

        function selectLeft(id) {
            if (state.waiting || state.matchedIds.includes(id)) return;
            playSelectSound();
            state.selectedLeft = (state.selectedLeft === id) ? null : id;
            if (state.selectedLeft && state.selectedRight) {
                checkPairMatch();
            } else {
                renderMatchingBoard();
            }
        }

        function selectRight(id) {
            if (state.waiting || state.matchedIds.includes(id)) return;
            playSelectSound();
            state.selectedRight = (state.selectedRight === id) ? null : id;
            if (state.selectedLeft && state.selectedRight) {
                checkPairMatch();
            } else {
                renderMatchingBoard();
            }
        }

        function checkPairMatch() {
            const leftId = state.selectedLeft;
            const rightId = state.selectedRight;

            if (leftId === rightId) {
                playCorrectSound();
                state.matchedIds.push(leftId);
                if (state.firstTry) {
                    state.score++;
                }
                state.streak++;
                state.firstTry = true;
                state.selectedLeft = null;
                state.selectedRight = null;
                renderMatchingBoard();

                const feedback = document.getElementById('feedback');
                if (state.matchedIds.length === 3) {
                    state.waiting = true;
                    feedback.innerHTML = `<span>${_col("Puiku! Visos poros sujungtos!")} 🎉</span>`;
                    feedback.className = "h-7 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black mt-2 text-green-600 opacity-100";
                    setTimeout(() => {
                        state.currentIndex++;
                        prepareMatchingBoard();
                    }, 1100);
                } else {
                    feedback.innerHTML = `<span>${_col("Teisinga pora!")} 👍</span>`;
                    feedback.className = "h-7 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black mt-2 text-green-600 opacity-100";
                }
            } else {
                state.waiting = true;
                state.firstTry = false;
                state.streak = 0;
                playWrongSound();
                renderMatchingBoard();

                const leftBtn = document.getElementById(`left-${leftId}`);
                const rightBtn = document.getElementById(`right-${rightId}`);
                if (leftBtn) leftBtn.classList.add('shake-anim', 'border-red-400', 'bg-red-50');
                if (rightBtn) rightBtn.classList.add('shake-anim', 'border-red-400', 'bg-red-50');

                const feedback = document.getElementById('feedback');
                if (feedback) {
                    feedback.innerHTML = `<span>${_col("Ši pora netinka, bandyk dar kartą!")} 🤔</span>`;
                    feedback.className = "h-7 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black mt-2 text-red-500 opacity-100";
                }

                setTimeout(() => {
                    state.selectedLeft = null;
                    state.selectedRight = null;
                    state.waiting = false;
                    renderMatchingBoard();
                }, 650);
            }
        }

        function renderQuestion() {
            if (state.currentIndex >= state.questions.length) {
                renderEndScreen();
                return;
            }

            state.firstTry = true;
            state.waiting = false;
            const q = state.questions[state.currentIndex];
            const options = shuffle([...q.options]);

            const optionsHtml = options.map((opt, idx) => `
                <button id="btn-${idx}" onclick="handleAnswer('${opt.replace(/'/g, "\\'")}', this)" 
                    class="btn-3d py-3 sm:py-4 px-3 bg-amber-50 hover:bg-amber-100 text-amber-950 border-2 border-amber-300 rounded-2xl text-base sm:text-xl font-black shadow-[0_5px_0_#fcd34d] active:shadow-[0_0px_0_#fcd34d] transition-all flex items-center justify-center text-center">
                    ${_col(opt)}
                </button>
            `).join('');

            appEl.innerHTML = `
                <!-- Top Status Bar -->
                <div class="bg-amber-500 text-white px-3 sm:px-5 py-2 sm:py-2.5 flex justify-between items-center font-bold text-xs sm:text-base shadow">
                    <div class="flex items-center gap-2">
                        <button onclick="renderStartScreen()" class="bg-amber-600 hover:bg-amber-700 px-2 py-0.5 rounded-lg text-sm" title="Pradžia">🏠</button>
                        <span>⭐ <span class="text-yellow-200 font-black">${state.score}</span></span>
                    </div>
                    <div class="bg-amber-600 px-2.5 py-0.5 rounded-xl font-black">🎯 ${state.currentIndex + 1} / 10</div>
                    <div>🔥 <span class="text-orange-200 font-black">${state.streak}</span></div>
                </div>

                <div class="p-3 sm:p-5 flex-1 flex flex-col justify-between items-center">
                    <h2 class="text-xl sm:text-2xl font-black text-slate-800 text-center mb-2 sm:mb-3">
                        ${state.mode === 'babies' ? '🐾 ' + _col('Kieno mažylis?') : '🏡 ' + _col('Kur gyvena?')}
                    </h2>

                    <div class="my-auto py-3 px-6 flex flex-col items-center justify-center bg-amber-100/60 rounded-3xl border-3 border-amber-200 min-h-[120px] sm:min-h-[140px] shadow-inner">
                        <div class="text-6xl sm:text-8xl mb-1">${q.parent.split(' ').pop()}</div>
                        <div class="text-2xl sm:text-3xl font-black text-amber-900">${_col(q.parent.split(' ')[0])}</div>
                    </div>

                    <div id="feedback" class="h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 opacity-0 transition-opacity">
                        Pranešimas
                    </div>

                    <div class="grid grid-cols-2 gap-2.5 sm:gap-3.5 w-full mt-1">
                        ${optionsHtml}
                    </div>
                </div>
            `;
        }

        function handleAnswer(selected, btn) {
            if (state.waiting) return;

            const q = state.questions[state.currentIndex];
            const feedback = document.getElementById('feedback');

            if (selected === q.correct) {
                state.waiting = true;
                playCorrectSound();
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }

                btn.classList.remove('bg-amber-50', 'text-amber-950', 'border-amber-300');
                btn.classList.add('bg-green-500', 'text-white', 'border-green-600', 'shadow-[0_5px_0_#15803d]', 'bounce-anim');

                feedback.innerHTML = `<span>${_col("Teisingai! Puiku!")} 🎉</span>`;
                feedback.className = "h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 text-green-600 opacity-100";

                setTimeout(() => {
                    state.currentIndex++;
                    renderQuestion();
                }, 1200);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playWrongSound();

                btn.classList.remove('bg-amber-50', 'text-amber-950');
                btn.classList.add('bg-red-100', 'text-red-400', 'line-through', 'border-red-300', 'opacity-60', 'shake-anim');
                btn.disabled = true;

                feedback.innerHTML = `<span>${_col("Bandyk dar kartą!")} 🤔</span>`;
                feedback.className = "h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 text-red-500 opacity-100";

                setTimeout(() => {
                    btn.classList.remove('shake-anim');
                }, 400);
            }
        }

        function renderEndScreen() {
            playWinSound();
            const ratio = state.score / state.totalPossible;
            let stars = "⭐";
            if (ratio >= 0.8) stars = "⭐⭐⭐";
            else if (ratio >= 0.5) stars = "⭐⭐";

            appEl.innerHTML = `
                <div class="p-6 sm:p-8 flex flex-col items-center justify-center text-center">
                    <div class="text-7xl mb-2">🎉</div>
                    <h2 class="text-3xl sm:text-4xl font-black text-green-600 mb-2">${_col('Šaunuolis!')}</h2>
                    <div class="text-5xl mb-4 tracking-wider">${stars}</div>
                    <p class="text-3xl font-black text-amber-600 mb-6">⭐ ${state.score} / ${state.totalPossible}</p>
                    
                    <div class="flex flex-col sm:flex-row gap-3 w-full max-w-sm">
                        <button onclick="startGame(state.mode)" class="btn-3d flex-1 py-3.5 bg-amber-100 hover:bg-amber-200 border-2 border-amber-400 rounded-2xl text-lg font-black shadow-[0_5px_0_#b45309] active:shadow-[0_0px_0_#b45309] transition-all">
                            🔄 ${_col('Dar kartą')}
                        </button>
                    </div>
                </div>
            `;
        }

        renderStartScreen();
    </script>
</body>
</html>
