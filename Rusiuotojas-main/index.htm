<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>♻️ Šiukšlių Rūšiuotojas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4;
            background-image: radial-gradient(#86efac 20%, transparent 20%);
            background-size: 20px 20px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .btn-3d {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-3d:active {
            transform: translateY(4px);
        }

        @keyframes drop-in {
            0% { transform: translateY(-30px) scale(0.8); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .drop-anim {
            animation: drop-in 0.3s ease-out;
        }

        @keyframes bounce-scale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .bounce-anim {
            animation: bounce-scale 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .shake-anim {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="h-screen max-h-screen flex items-center justify-center p-2 sm:p-4 overflow-hidden">

    <div id="app" class="w-full max-w-2xl bg-white/95 backdrop-blur-md rounded-3xl shadow-xl flex flex-col relative border-4 border-emerald-300 overflow-hidden max-h-full">
        <!-- Turinis bus atvaizduotas dinamiškai per JS -->
    </div>

    <script>
        // Web Audio API
        let audioCtx;
        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playTone(freq, type, duration, startTime=0) {
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);
            gain.gain.setValueAtTime(0.15, ctx.currentTime + startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + startTime);
            osc.stop(ctx.currentTime + startTime + duration);
        }

        function playCorrectSound() {
            playTone(440, 'sine', 0.15, 0);
            playTone(554.37, 'sine', 0.15, 0.08);
            playTone(659.25, 'sine', 0.25, 0.16);
        }

        function playWrongSound() {
            playTone(280, 'sawtooth', 0.2, 0);
            playTone(200, 'sawtooth', 0.25, 0.1);
        }

        function playWinSound() {
            [440, 554, 659, 880].forEach((freq, idx) => {
                playTone(freq, 'sine', 0.25, idx * 0.12);
            });
        }

        // === SKIEMENŲ SPALVINIMAS ===
        const _V = 'aeėęiįyouųūąAEĖĘIĮYOUŲŪĄ';
        const _D = ['ai','au','ei','eu','ie','uo','ui','oi','ia','io','iu'];
        const _L = /[a-ząčęėįšųūžA-ZĄČĘĖĮŠŲŪŽ]/;
        const _O = new Set(['bl','br','dr','dv','fl','fr','gl','gr','gn','kl','kr','kn','kv','pl','pr','sk','sl','sm','sn','sp','sr','st','sv','šl','šv','šn','tr','tv','vr','žl','žv','str','skr','spr']);
        const _SC = ['#dc2626','#2563eb','#16a34a','#ea580c','#9333ea','#db2777'];

        function _syl(word) {
            if (!word || word.length <= 1) return [word || ''];
            const r = []; let s = '', i = 0, n = word.length;
            while (i < n) {
                const c = word[i];
                if (!_L.test(c)) { s += c; i++; continue; }
                if (!_V.includes(c)) { s += c; i++; }
                else {
                    s += c; i++;
                    if (i < n && _V.includes(word[i]) && _D.includes((c + word[i]).toLowerCase())) { s += word[i]; i++; }
                    let j = i, u = [];
                    while (j < n && !_V.includes(word[j])) {
                        if (!_L.test(word[j])) break;
                        if (j+1 < n) { const p = (word[j]+word[j+1]).toLowerCase(); if (p==='ch'||p==='dz'||p==='dž') { u.push(word[j]+word[j+1]); j+=2; continue; } }
                        u.push(word[j]); j++;
                    }
                    if (j >= n || (j < n && !_V.includes(word[j]) && !_L.test(word[j]))) {
                        s += u.join(''); while (j < n && !_L.test(word[j])) { s += word[j]; j++; } i = j;
                        if (i >= n) { r.push(s); s = ''; }
                    } else if (u.length === 0) { r.push(s); s = ''; }
                    else if (u.length === 1) { r.push(s); s = u[0]; i = j; }
                    else {
                        let sp = u.length - 1;
                        if (u.length >= 3) { const l2 = (u[u.length-2]+u[u.length-1]).toLowerCase(); if (_O.has(l2)) sp = u.length - 2; }
                        if (u.length >= 4) { const l3 = (u[u.length-3]+u[u.length-2]+u[u.length-1]).toLowerCase(); if (_O.has(l3)) sp = u.length - 3; }
                        s += u.slice(0, sp).join(''); r.push(s); s = u.slice(sp).join(''); i = j;
                    }
                }
            }
            if (s) r.push(s);
            return r.filter(x => x.length > 0);
        }

        function _col(text) {
            if (!text) return '';
            return text.split(/(\s+)/).map(token => {
                if (!token.trim() || !/[a-ząčęėįšųūžA-ZĄČĘĖĮŠŲŪŽ]/.test(token)) return token;
                const syls = _syl(token);
                return syls.map((s, i) => '<span style="color:' + _SC[i % _SC.length] + '">' + s + '</span>').join('');
            }).join('');
        }
        // === /SKIEMENŲ SPALVINIMAS ===

        // Šiukšlių duomenų bazė
        const ITEMS_DATA = [
            { name: "Laikraštis", emoji: "📰", category: "paper" },
            { name: "Plastikinis butelis", emoji: "🧴", category: "plastic" },
            { name: "Stiklainis", emoji: "🫙", category: "glass" },
            { name: "Kartoninė dėžutė", emoji: "📦", category: "paper" },
            { name: "Gėrimo skardinė", emoji: "🥤", category: "plastic" },
            { name: "Stiklinis butelis", emoji: "🍾", category: "glass" },
            { name: "Popierinis maišelis", emoji: "🛍️", category: "paper" },
            { name: "Plastikinis maišelis", emoji: "🛍️", category: "plastic" },
            { name: "Sąsiuvinis", emoji: "📒", category: "paper" },
            { name: "Konservų dėžutė", emoji: "🥫", category: "plastic" },
            { name: "Stiklinė vaza", emoji: "🏺", category: "glass" },
            { name: "Jogurto indelis", emoji: "🥛", category: "plastic" },
            { name: "Sena knygelė", emoji: "📖", category: "paper" },
            { name: "Stiklinė taurė", emoji: "🍷", category: "glass" },
            // Bio items
            { name: "Obuolio graužtukas", emoji: "🍏", category: "bio" },
            { name: "Banano žievė", emoji: "🍌", category: "bio" }
        ];

        const BINS = {
            paper: { name: "Popierius", color: "bg-blue-500", border: "border-blue-600", shadow: "shadow-[0_6px_0_#1d4ed8]", icon: "🔵" },
            plastic: { name: "Plastikas ir Metalas", color: "bg-yellow-400", border: "border-yellow-500", shadow: "shadow-[0_6px_0_#ca8a04]", icon: "🟡", textColor: "text-yellow-950" },
            glass: { name: "Stiklas", color: "bg-green-600", border: "border-green-700", shadow: "shadow-[0_6px_0_#15803d]", icon: "🟢" },
            bio: { name: "Biologinės atliekos", color: "bg-amber-700", border: "border-amber-800", shadow: "shadow-[0_6px_0_#78350f]", icon: "🟤" }
        };

        let state = {
            mode: '3bins',
            questions: [],
            currentIndex: 0,
            score: 0,
            streak: 0,
            firstTry: true,
            waiting: false
        };

        const appEl = document.getElementById('app');

        function shuffle(arr) {
            return [...arr].sort(() => Math.random() - 0.5);
        }

        function renderStartScreen() {
            appEl.innerHTML = `
                <div class="p-6 sm:p-8 flex flex-col items-center justify-center text-center">
                    <div class="text-6xl sm:text-7xl mb-2 animate-bounce">♻️</div>
                    <h1 class="text-3xl sm:text-5xl font-black text-emerald-800 mb-2">Šiukšlių Rūšiuotojas</h1>
                    <p class="text-lg sm:text-xl font-bold text-slate-600 mb-6 sm:mb-8">Mokykis saugoti gamtą ir rūšiuoti atliekas!</p>
                    
                    <div class="flex flex-col gap-3.5 sm:gap-4 w-full max-w-sm">
                        <button onclick="startGame('3bins')" class="btn-3d py-3.5 sm:py-4 px-6 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl text-xl sm:text-2xl font-black shadow-[0_6px_0_#059669] active:shadow-[0_0px_0_#059669] transition-all">
                            🟡 Popierius, Plastikas, Stiklas 🟢
                        </button>
                        <button onclick="startGame('4bins')" class="btn-3d py-3.5 sm:py-4 px-6 bg-teal-600 hover:bg-teal-700 text-white rounded-2xl text-xl sm:text-2xl font-black shadow-[0_6px_0_#0f766e] active:shadow-[0_0px_0_#0f766e] transition-all">
                            🍎 Su Maisto / Bio atliekomis
                        </button>
                    </div>
                </div>
            `;
        }

        function startGame(mode) {
            getAudioCtx();
            state.mode = mode;
            state.score = 0;
            state.streak = 0;
            state.currentIndex = 0;
            
            const pool = mode === '3bins' 
                ? ITEMS_DATA.filter(it => it.category !== 'bio')
                : ITEMS_DATA;

            state.questions = shuffle(pool).slice(0, 10);
            renderQuestion();
        }

        function renderQuestion() {
            if (state.currentIndex >= state.questions.length) {
                renderEndScreen();
                return;
            }

            state.firstTry = true;
            state.waiting = false;
            const item = state.questions[state.currentIndex];

            const activeBinKeys = state.mode === '3bins' 
                ? ['paper', 'plastic', 'glass'] 
                : ['paper', 'plastic', 'glass', 'bio'];

            const gridClass = state.mode === '3bins' ? 'grid-cols-3' : 'grid-cols-2 sm:grid-cols-4';

            const binsHtml = activeBinKeys.map(key => {
                const bin = BINS[key];
                const textCls = bin.textColor || 'text-white';
                return `
                    <button id="bin-${key}" onclick="handleChoice('${key}')" 
                        class="btn-3d flex flex-col items-center justify-between p-2.5 sm:p-3 rounded-2xl ${bin.color} ${textCls} border-2 ${bin.border} ${bin.shadow} active:shadow-[0_0px_0] transition-all h-24 sm:h-32">
                        <div class="text-3xl sm:text-4xl">${bin.icon}</div>
                        <div class="text-xs sm:text-sm font-black text-center leading-tight mt-1">${_col(bin.name)}</div>
                    </button>
                `;
            }).join('');

            appEl.innerHTML = `
                <!-- Top Status Bar -->
                <div class="bg-emerald-600 text-white px-4 py-2 sm:py-2.5 flex justify-between items-center font-bold text-sm sm:text-base shadow">
                    <div>⭐ Taškai: <span class="text-yellow-200">${state.score}</span></div>
                    <div class="bg-emerald-700 px-3 py-1 rounded-xl">Atlieka: ${state.currentIndex + 1} / 10</div>
                    <div>🔥 Serija: <span class="text-orange-200">${state.streak}</span></div>
                </div>

                <div class="p-3 sm:p-5 flex-1 flex flex-col justify-between items-center">
                    <h2 class="text-lg sm:text-2xl font-black text-slate-800 text-center mb-1">Į kurį konteinerį mesti šią atlieką?</h2>

                    <!-- Daikto kortelė -->
                    <div id="item-card" class="my-auto py-3 px-8 flex flex-col items-center justify-center bg-white rounded-3xl border-3 border-emerald-200 shadow-md drop-anim min-h-[120px] sm:min-h-[140px]">
                        <div class="text-6xl sm:text-8xl mb-1">${item.emoji}</div>
                        <div class="text-xl sm:text-2xl font-black text-emerald-950">${_col(item.name)}</div>
                    </div>

                    <div id="feedback" class="h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 opacity-0 transition-opacity">
                        Pranešimas
                    </div>

                    <!-- Konteineriai -->
                    <div class="grid ${gridClass} gap-2 sm:gap-3 w-full mt-1">
                        ${binsHtml}
                    </div>
                </div>
            `;
        }

        function handleChoice(chosenKey) {
            if (state.waiting) return;

            const item = state.questions[state.currentIndex];
            const feedback = document.getElementById('feedback');
            const binBtn = document.getElementById(`bin-${chosenKey}`);
            const itemCard = document.getElementById('item-card');

            if (chosenKey === item.category) {
                state.waiting = true;
                playCorrectSound();
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }

                binBtn.classList.add('bounce-anim');
                itemCard.classList.add('scale-75', 'opacity-0', 'transition-all', 'duration-300');

                feedback.textContent = `Puiku! Švaru ir teisinga! 🌍`;
                feedback.className = "h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 text-green-600 opacity-100";

                setTimeout(() => {
                    state.currentIndex++;
                    renderQuestion();
                }, 1100);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playWrongSound();

                binBtn.classList.add('shake-anim', 'opacity-40');
                binBtn.disabled = true;

                feedback.textContent = "Bandyk kitą konteinerį! 🤔";
                feedback.className = "h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 text-red-500 opacity-100";

                setTimeout(() => {
                    binBtn.classList.remove('shake-anim');
                }, 400);
            }
        }

        function renderEndScreen() {
            playWinSound();
            let stars = "⭐";
            if (state.score >= 8) stars = "⭐⭐⭐";
            else if (state.score >= 5) stars = "⭐⭐";

            appEl.innerHTML = `
                <div class="p-6 sm:p-8 flex flex-col items-center justify-center text-center">
                    <div class="text-7xl mb-2">🎉</div>
                    <h2 class="text-3xl sm:text-4xl font-black text-green-600 mb-2">Šaunuolis!</h2>
                    <div class="text-5xl mb-4 tracking-wider">${stars}</div>
                    <p class="text-xl font-bold text-slate-700 mb-1">Surinkai taškų:</p>
                    <p class="text-4xl font-black text-emerald-600 mb-6">${state.score} / 10</p>
                    
                    <div class="flex flex-col sm:flex-row gap-3 w-full max-w-sm">
                        <button onclick="startGame(state.mode)" class="btn-3d flex-1 py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl text-lg font-black shadow-[0_5px_0_#059669] active:shadow-[0_0px_0_#059669] transition-all">
                            Dar kartą
                        </button>
                        <button onclick="renderStartScreen()" class="btn-3d flex-1 py-3.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-2xl text-lg font-black shadow-[0_5px_0_#94a3b8] active:shadow-[0_0px_0_#94a3b8] transition-all">
                            Iš pradžių
                        </button>
                    </div>
                </div>
            `;
        }

        renderStartScreen();
    </script>
</body>
</html>
