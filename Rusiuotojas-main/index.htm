<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>♻️ Šiukšlių Rūšiuotojas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/common.css">
    <script src="../shared/common.js"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4;
            background-image: radial-gradient(#86efac 20%, transparent 20%);
            background-size: 20px 20px;
        }

        .btn-3d {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-3d:active {
            transform: translateY(4px);
        }

        @keyframes drop-in {
            0% { transform: translateY(-30px) scale(0.8); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .drop-anim {
            animation: drop-in 0.3s ease-out;
        }

        /* Tamsioji tema */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0b1120 !important;
                background-image: radial-gradient(#1e293b 20%, transparent 20%) !important;
                color: #f1f5f9 !important;
            }
            #app {
                background-color: #0f172a !important;
                border-color: #334155 !important;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6) !important;
            }
            h2, h1, .text-slate-800 {
                color: #f8fafc !important;
            }
            .text-slate-600 {
                color: #94a3b8 !important;
            }
            .btn-3d:not([id^="bin-"]) {
                background-color: #1e293b !important;
                border-color: #334155 !important;
                color: #f8fafc !important;
            }
            .btn-3d:not([id^="bin-"]):hover {
                background-color: #273549 !important;
            }
            .meadow-scene {
                background: linear-gradient(to bottom, #0f172a, #064e3b, #14532d) !important;
                border-color: #047857 !important;
            }
            .item-card-box, .picked-banner {
                background-color: #1e293b !important;
                border-color: #334155 !important;
            }
            .bin-label-pill {
                background-color: rgba(15, 23, 42, 0.92) !important;
            }
        }
    </style>
</head>
<body class="h-screen max-h-screen flex items-center justify-center p-2 sm:p-4 overflow-hidden transition-colors duration-200">

    <div id="app" class="w-full max-w-2xl bg-white/95 backdrop-blur-md rounded-3xl shadow-xl flex flex-col relative border-4 border-emerald-300 overflow-hidden max-h-full">
        <!-- Turinis bus atvaizduotas dinamiškai per JS -->
    </div>

    <script>
        // Šiukšlių duomenų bazė
        const ITEMS_DATA = [
            { name: "Laikraštis", emoji: "📰", category: "paper" },
            { name: "Plastikinis butelis", emoji: "🧴", category: "plastic" },
            { name: "Stiklainis", emoji: "🫙", category: "glass" },
            { name: "Kartoninė dėžutė", emoji: "📦", category: "paper" },
            { name: "Gėrimo skardinė", emoji: "🥤", category: "plastic" },
            { name: "Stiklinis butelis", emoji: "🍾", category: "glass" },
            { name: "Popierinis maišelis", emoji: "🛍️", category: "paper" },
            { name: "Plastikinis maišelis", emoji: "🛍️", category: "plastic" },
            { name: "Sąsiuvinis", emoji: "📒", category: "paper" },
            { name: "Konservų dėžutė", emoji: "🥫", category: "plastic" },
            { name: "Stiklinė vaza", emoji: "🏺", category: "glass" },
            { name: "Jogurto indelis", emoji: "🥛", category: "plastic" },
            { name: "Sena knygelė", emoji: "📖", category: "paper" },
            { name: "Stiklinė taurė", emoji: "🍷", category: "glass" },
            // Bio items
            { name: "Obuolio graužtukas", emoji: "🍏", category: "bio" },
            { name: "Banano žievė", emoji: "🍌", category: "bio" },
            { name: "Kiaušinio lukštas", emoji: "🥚", category: "bio" },
            { name: "Arbūzo žievė", emoji: "🍉", category: "bio" },
            { name: "Kriaušės graužtukas", emoji: "🍐", category: "bio" }
        ];

        const NATURE_REWARDS = ["🌸", "🐰", "🦋", "🐿️", "🌻", "🦔", "🌷", "🐞", "🐦"];

        const BINS = {
            paper: { name: "Popierius", color: "bg-blue-500", border: "border-blue-600", shadow: "shadow-[0_5px_0_#1d4ed8]", icon: "🔵" },
            plastic: { name: "Plastikas ir Metalas", color: "bg-yellow-400", border: "border-yellow-500", shadow: "shadow-[0_5px_0_#ca8a04]", icon: "🟡" },
            glass: { name: "Stiklas", color: "bg-green-600", border: "border-green-700", shadow: "shadow-[0_5px_0_#15803d]", icon: "🟢" },
            bio: { name: "Biologinės atliekos", color: "bg-amber-700", border: "border-amber-800", shadow: "shadow-[0_5px_0_#78350f]", icon: "🟤" }
        };

        let state = {
            mode: '3bins',
            questions: [],
            currentIndex: 0,
            totalPossible: 10,
            score: 0,
            streak: 0,
            firstTry: true,
            waiting: false,
            // Mode 'meadow' state
            meadowRounds: 3,
            meadowSpots: [],
            selectedSpotIdx: 0
        };

        const appEl = document.getElementById('app');

        function renderStartScreen() {
            appEl.innerHTML = `
                <div class="p-5 sm:p-8 flex flex-col items-center justify-center text-center">
                    <div class="text-5xl sm:text-7xl mb-2 animate-bounce">♻️</div>
                    <h1 class="text-2xl sm:text-4xl font-black text-emerald-800 mb-4 sm:mb-5">${_col('Šiukšlių Rūšiuotojas')}</h1>
                    
                    <div class="flex flex-col gap-3 w-full max-w-sm">
                        <button onclick="startGame('3bins')" class="btn-3d py-3 sm:py-3.5 px-5 bg-emerald-100 hover:bg-emerald-200 border-2 border-emerald-400 rounded-2xl text-lg sm:text-xl font-black shadow-[0_5px_0_#059669] active:shadow-[0_0px_0_#059669] transition-all flex items-center justify-center gap-2.5">
                            <span class="text-2xl">♻️</span>
                            <span>${_col('3 konteineriai')}</span>
                        </button>
                        <button onclick="startGame('4bins')" class="btn-3d py-3 sm:py-3.5 px-5 bg-teal-100 hover:bg-teal-200 border-2 border-teal-400 rounded-2xl text-lg sm:text-xl font-black shadow-[0_5px_0_#0f766e] active:shadow-[0_0px_0_#0f766e] transition-all flex items-center justify-center gap-2.5">
                            <span class="text-2xl">🍎</span>
                            <span>${_col('4 konteineriai')}</span>
                        </button>
                        <button onclick="startGame('meadow')" class="btn-3d py-3 sm:py-3.5 px-5 bg-lime-100 hover:bg-lime-200 border-2 border-lime-500 rounded-2xl text-lg sm:text-xl font-black shadow-[0_5px_0_#65a30d] active:shadow-[0_0px_0_#65a30d] transition-all flex items-center justify-center gap-2.5">
                            <span class="text-2xl">🌳</span>
                            <span>${_col('Pievelė')}</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function startGame(mode) {
            getAudioCtx();
            state.mode = mode;
            state.score = 0;
            state.streak = 0;
            state.currentIndex = 0;

            if (mode === 'meadow') {
                const shuffledItems = shuffle(ITEMS_DATA);
                state.questions = [
                    shuffledItems.slice(0, 5),
                    shuffledItems.slice(5, 10),
                    shuffledItems.slice(10, 15)
                ];
                state.totalPossible = 15;
                prepareMeadowRound();
            } else {
                const pool = mode === '3bins' 
                    ? ITEMS_DATA.filter(it => it.category !== 'bio')
                    : ITEMS_DATA;

                state.questions = shuffle(pool).slice(0, 10);
                state.totalPossible = 10;
                renderQuestion();
            }
        }

        function prepareMeadowRound() {
            if (state.currentIndex >= state.questions.length) {
                renderEndScreen();
                return;
            }
            const roundItems = state.questions[state.currentIndex];
            const rewards = shuffle(NATURE_REWARDS);
            state.meadowSpots = roundItems.map((item, idx) => ({
                item,
                sorted: false,
                firstTry: true,
                reward: rewards[idx % rewards.length]
            }));
            state.selectedSpotIdx = 0;
            state.waiting = false;
            renderMeadow();
        }

        function renderMeadow() {
            const activeSpot = state.meadowSpots[state.selectedSpotIdx];
            const allSorted = state.meadowSpots.every(s => s.sorted);

            const spotsHtml = state.meadowSpots.map((spot, idx) => {
                if (spot.sorted) {
                    return `
                        <div class="flex flex-col items-center justify-center p-2 rounded-2xl bg-white/60 border-2 border-green-300 shadow-sm bounce-anim min-h-[70px] sm:min-h-[82px]">
                            <div class="text-3xl sm:text-5xl">${spot.reward}</div>
                            <span class="text-[10px] sm:text-xs font-extrabold text-green-800">${_col('Švaru!')}</span>
                        </div>
                    `;
                }
                const isSelected = idx === state.selectedSpotIdx;
                const selClass = isSelected
                    ? "bg-amber-50 border-amber-500 ring-4 ring-amber-400 scale-105 shadow-md"
                    : "bg-white/90 hover:bg-white border-emerald-300 opacity-90";
                return `
                    <button onclick="selectMeadowSpot(${idx})"
                        class="btn-3d flex flex-col items-center justify-center p-1.5 sm:p-2 rounded-2xl border-2 transition-all min-h-[70px] sm:min-h-[82px] ${selClass}">
                        <div class="text-3xl sm:text-4xl">${spot.item.emoji}</div>
                        <span class="text-[10px] sm:text-xs font-black text-center leading-tight line-clamp-1 mt-0.5">${_col(spot.item.name)}</span>
                    </button>
                `;
            }).join('');

            const activeBinKeys = ['paper', 'plastic', 'glass', 'bio'];
            const binsHtml = activeBinKeys.map(key => {
                const bin = BINS[key];
                return `
                    <button id="bin-${key}" onclick="handleMeadowBin('${key}')" 
                        class="btn-3d flex flex-col items-center justify-between p-2 sm:p-2.5 rounded-2xl ${bin.color} border-2 ${bin.border} ${bin.shadow} active:shadow-[0_0px_0] transition-all h-20 sm:h-28">
                        <div class="text-2xl sm:text-3xl">${bin.icon}</div>
                        <div class="bin-label-pill bg-white/95 px-1.5 py-0.5 rounded-lg text-[11px] sm:text-xs font-black text-center leading-tight shadow-sm w-full">${_col(bin.name)}</div>
                    </button>
                `;
            }).join('');

            const pickedInfoHtml = (!allSorted && activeSpot && !activeSpot.sorted)
                ? `<div class="picked-banner w-full py-1.5 px-3 bg-amber-50 border-2 border-amber-300 rounded-2xl flex items-center justify-center gap-2 shadow-sm">
                       <span class="text-2xl sm:text-3xl">${activeSpot.item.emoji}</span>
                       <span class="text-sm sm:text-lg font-black">${_col(activeSpot.item.name)}</span>
                   </div>`
                : `<div class="picked-banner w-full py-1.5 px-3 bg-green-100 border-2 border-green-400 rounded-2xl flex items-center justify-center gap-2 shadow-sm">
                       <span class="text-sm sm:text-lg font-black">${_col('Pievelė švari! Gyvūnėliai džiaugiasi!')} 🐰🦋🐿️</span>
                   </div>`;

            appEl.innerHTML = `
                <!-- Top Status Bar -->
                <div class="bg-emerald-600 text-white px-3 sm:px-5 py-2 sm:py-2.5 flex justify-between items-center font-bold text-xs sm:text-base shadow">
                    <div class="flex items-center gap-2">
                        <button onclick="renderStartScreen()" class="bg-emerald-700 hover:bg-emerald-800 px-2 py-0.5 rounded-lg text-sm" title="Pradžia">🏠</button>
                        <span>⭐ <span class="text-yellow-200 font-black">${state.score}</span></span>
                    </div>
                    <div class="bg-emerald-700 px-2.5 py-0.5 rounded-xl font-black">🎯 ${state.currentIndex + 1} / ${state.questions.length}</div>
                    <div>🔥 <span class="text-orange-200 font-black">${state.streak}</span></div>
                </div>

                <div class="p-2.5 sm:p-4 flex-1 flex flex-col justify-between items-center gap-1.5">
                    <h2 class="text-lg sm:text-2xl font-black text-slate-800 text-center">♻️ ${_col('Rūšiuok!')}</h2>

                    <!-- Miško pievelė -->
                    <div class="meadow-scene w-full rounded-3xl border-3 border-emerald-300 bg-gradient-to-b from-sky-100 via-emerald-100 to-green-200 p-2.5 sm:p-3.5 shadow-inner flex flex-col gap-2">
                        <div class="flex justify-between items-center text-xl sm:text-2xl px-2 opacity-90">
                            <span>🌲🌳🌿</span>
                            <span>☀️☁️</span>
                            <span>🌿🌳🌲</span>
                        </div>
                        <div class="grid grid-cols-5 gap-1.5 sm:gap-2.5">
                            ${spotsHtml}
                        </div>
                    </div>

                    <!-- Pasirinktos šiukšlės juosta -->
                    ${pickedInfoHtml}

                    <div id="feedback" class="h-5 sm:h-7 flex items-center justify-center text-sm sm:text-base font-black opacity-0 transition-opacity">
                        Pranešimas
                    </div>

                    <!-- Konteineriai -->
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-2.5 w-full">
                        ${binsHtml}
                    </div>
                </div>
            `;
        }

        function selectMeadowSpot(idx) {
            if (state.waiting) return;
            const spot = state.meadowSpots[idx];
            if (!spot || spot.sorted) return;
            playPickSound();
            state.selectedSpotIdx = idx;
            renderMeadow();
        }

        function handleMeadowBin(chosenKey) {
            if (state.waiting) return;
            const spot = state.meadowSpots[state.selectedSpotIdx];
            if (!spot || spot.sorted) return;

            const feedback = document.getElementById('feedback');
            const binBtn = document.getElementById(`bin-${chosenKey}`);

            if (chosenKey === spot.item.category) {
                playCorrectSound();
                spot.sorted = true;
                if (spot.firstTry) {
                    state.score++;
                    state.streak++;
                }

                // Auto-select next unsorted trash item if any remain
                const nextIdx = state.meadowSpots.findIndex(s => !s.sorted);
                if (nextIdx !== -1) {
                    state.selectedSpotIdx = nextIdx;
                    renderMeadow();
                    const fb = document.getElementById('feedback');
                    if (fb) {
                        fb.innerHTML = `<span>${_col("Puiku! Dar viena vieta išvalyta!")} 🌸</span>`;
                        fb.className = "h-5 sm:h-7 flex items-center justify-center text-sm sm:text-base font-black text-green-600 opacity-100";
                    }
                } else {
                    state.waiting = true;
                    renderMeadow();
                    const fb = document.getElementById('feedback');
                    if (fb) {
                        fb.innerHTML = `<span>${_col("Valio! Visa miško pievelė švari!")} 🎉🌳</span>`;
                        fb.className = "h-5 sm:h-7 flex items-center justify-center text-sm sm:text-base font-black text-green-600 opacity-100";
                    }
                    setTimeout(() => {
                        state.currentIndex++;
                        prepareMeadowRound();
                    }, 1250);
                }
            } else {
                spot.firstTry = false;
                state.streak = 0;
                playWrongSound();
                if (binBtn) {
                    binBtn.classList.add('shake-anim', 'opacity-50');
                    setTimeout(() => {
                        binBtn.classList.remove('shake-anim', 'opacity-50');
                    }, 400);
                }
                if (feedback) {
                    feedback.innerHTML = `<span>${_col("Bandyk kitą konteinerį!")} 🤔</span>`;
                    feedback.className = "h-5 sm:h-7 flex items-center justify-center text-sm sm:text-base font-black text-red-500 opacity-100";
                }
            }
        }

        function renderQuestion() {
            if (state.currentIndex >= state.questions.length) {
                renderEndScreen();
                return;
            }

            state.firstTry = true;
            state.waiting = false;
            const item = state.questions[state.currentIndex];

            const activeBinKeys = state.mode === '3bins' 
                ? ['paper', 'plastic', 'glass'] 
                : ['paper', 'plastic', 'glass', 'bio'];

            const gridClass = state.mode === '3bins' ? 'grid-cols-3' : 'grid-cols-2 sm:grid-cols-4';

            const binsHtml = activeBinKeys.map(key => {
                const bin = BINS[key];
                return `
                    <button id="bin-${key}" onclick="handleChoice('${key}')" 
                        class="btn-3d flex flex-col items-center justify-between p-2.5 sm:p-3 rounded-2xl ${bin.color} border-2 ${bin.border} ${bin.shadow} active:shadow-[0_0px_0] transition-all h-24 sm:h-32">
                        <div class="text-3xl sm:text-4xl">${bin.icon}</div>
                        <div class="bin-label-pill bg-white/95 px-2 py-0.5 rounded-lg text-xs sm:text-sm font-black text-center leading-tight mt-1 shadow-sm w-full">${_col(bin.name)}</div>
                    </button>
                `;
            }).join('');

            appEl.innerHTML = `
                <!-- Top Status Bar -->
                <div class="bg-emerald-600 text-white px-3 sm:px-5 py-2 sm:py-2.5 flex justify-between items-center font-bold text-xs sm:text-base shadow">
                    <div class="flex items-center gap-2">
                        <button onclick="renderStartScreen()" class="bg-emerald-700 hover:bg-emerald-800 px-2 py-0.5 rounded-lg text-sm" title="Pradžia">🏠</button>
                        <span>⭐ <span class="text-yellow-200 font-black">${state.score}</span></span>
                    </div>
                    <div class="bg-emerald-700 px-2.5 py-0.5 rounded-xl font-black">🎯 ${state.currentIndex + 1} / 10</div>
                    <div>🔥 <span class="text-orange-200 font-black">${state.streak}</span></div>
                </div>

                <div class="p-3 sm:p-5 flex-1 flex flex-col justify-between items-center">
                    <h2 class="text-xl sm:text-2xl font-black text-slate-800 text-center mb-1">♻️ ❓</h2>

                    <!-- Daikto kortelė -->
                    <div id="item-card" class="item-card-box my-auto py-3 px-8 flex flex-col items-center justify-center bg-white rounded-3xl border-3 border-emerald-200 shadow-md drop-anim min-h-[120px] sm:min-h-[140px]">
                        <div class="text-6xl sm:text-8xl mb-1">${item.emoji}</div>
                        <div class="text-xl sm:text-2xl font-black text-emerald-950">${_col(item.name)}</div>
                    </div>

                    <div id="feedback" class="h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 opacity-0 transition-opacity">
                        Pranešimas
                    </div>

                    <!-- Konteineriai -->
                    <div class="grid ${gridClass} gap-2 sm:gap-3 w-full mt-1">
                        ${binsHtml}
                    </div>
                </div>
            `;
        }

        function handleChoice(chosenKey) {
            if (state.waiting) return;

            const item = state.questions[state.currentIndex];
            const feedback = document.getElementById('feedback');
            const binBtn = document.getElementById(`bin-${chosenKey}`);
            const itemCard = document.getElementById('item-card');

            if (chosenKey === item.category) {
                state.waiting = true;
                playCorrectSound();
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }

                binBtn.classList.add('bounce-anim');
                itemCard.classList.add('scale-75', 'opacity-0', 'transition-all', 'duration-300');

                feedback.innerHTML = `<span>${_col("Puiku! Švaru ir teisinga!")} 🌍</span>`;
                feedback.className = "h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 text-green-600 opacity-100";

                setTimeout(() => {
                    state.currentIndex++;
                    renderQuestion();
                }, 1100);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playWrongSound();

                binBtn.classList.add('shake-anim', 'opacity-40');
                binBtn.disabled = true;

                feedback.innerHTML = `<span>${_col("Bandyk kitą konteinerį!")} 🤔</span>`;
                feedback.className = "h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 text-red-500 opacity-100";

                setTimeout(() => {
                    binBtn.classList.remove('shake-anim');
                }, 400);
            }
        }

        function renderEndScreen() {
            playWinSound();
            const ratio = state.score / state.totalPossible;
            let stars = "⭐";
            if (ratio >= 0.8) stars = "⭐⭐⭐";
            else if (ratio >= 0.5) stars = "⭐⭐";

            appEl.innerHTML = `
                <div class="p-6 sm:p-8 flex flex-col items-center justify-center text-center">
                    <div class="text-7xl mb-2">🎉</div>
                    <h2 class="text-3xl sm:text-4xl font-black text-green-600 mb-2">${_col('Šaunuolis!')}</h2>
                    <div class="text-5xl mb-4 tracking-wider">${stars}</div>
                    <p class="text-3xl font-black text-emerald-600 mb-6">⭐ ${state.score} / ${state.totalPossible}</p>
                    
                    <div class="flex flex-col sm:flex-row gap-3 w-full max-w-sm">
                        <button onclick="startGame(state.mode)" class="btn-3d flex-1 py-3.5 bg-emerald-100 hover:bg-emerald-200 border-2 border-emerald-400 rounded-2xl text-lg font-black shadow-[0_5px_0_#059669] active:shadow-[0_0px_0_#059669] transition-all">
                            🔄 ${_col('Dar kartą')}
                        </button>
                    </div>
                </div>
            `;
        }

        renderStartScreen();
    </script>
</body>
</html>
