<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>💰 Pinigėliai</title>
    <link rel="stylesheet" href="../shared/tailwind.min.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/common.css?v=3">
    <link rel="stylesheet" href="../shared/money.css?v=3">
    <script src="../shared/common.js?v=3"></script>
    <script src="../shared/money.js?v=3"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #dcfce7;
            background-image: radial-gradient(#86efac 20%, transparent 20%);
            background-size: 20px 20px;
            color: #1e293b;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Default Light Tray & Card */
        .app-card {
            background-color: rgba(255, 255, 255, 0.96);
            border-color: #bbf7d0;
        }
        .money-tray {
            background-color: rgba(240, 253, 244, 0.9);
            border: 2px dashed #4ade80;
        }
        .wallet-box {
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
        }
        .opt-btn {
            background-color: #e0f2fe;
            color: #0369a1;
            border-color: #7dd3fc;
        }
        .opt-btn:hover {
            background-color: #bae6fd;
            color: #0284c7;
        }
        .locked-coin {
            box-shadow: 0 0 0 3px #f59e0b, 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            cursor: not-allowed !important;
        }

        /* Tamsioji Tema (Dark Mode) */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0b1120 !important;
                background-image: radial-gradient(#1e293b 25%, transparent 25%) !important;
                color: #f1f5f9 !important;
            }
            .app-card {
                background-color: #0f172a !important;
                border-color: #334155 !important;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6) !important;
            }
            .bg-amber-100 {
                background-color: #1e293b !important;
                color: #fde68a !important;
                border-color: #f59e0b !important;
            }
            .money-tray {
                background-color: #1e293b !important;
                border: 2px dashed #475569 !important;
                box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5) !important;
            }
            .locked-coin {
                box-shadow: 0 0 0 3px #fbbf24, 0 4px 6px -1px rgba(0, 0, 0, 0.5) !important;
            }
            .wallet-box {
                background-color: #0f172a !important;
                border-color: #334155 !important;
            }
            .opt-btn {
                background-color: #1e293b !important;
                color: #93c5fd !important;
                border-color: #334155 !important;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3) !important;
            }
            .opt-btn:hover {
                background-color: #334155 !important;
                color: #bfdbfe !important;
            }
            .text-main-title {
                color: #f8fafc !important;
            }
            .text-sub-title {
                color: #94a3b8 !important;
            }
        }
    </style>
</head>
<body class="h-screen max-h-screen flex items-center justify-center p-2 sm:p-4 overflow-hidden">

    <div id="app" class="app-card w-full max-w-2xl rounded-3xl shadow-xl flex flex-col relative fade-in border-4 overflow-hidden max-h-full">
        <!-- Content gets rendered here by JS -->
    </div>

    <script>
        // Visos monetos ir banknotai importuojami iš shared/money.js
        const ALL_COINS = MONEY.allCoins;
        const ALL_MONEY = MONEY.allMoney;

        const state = {
            mode: 'cents', // 'cents' | 'euros' | 'collect'
            score: 0,
            streak: 0,
            question: 1,
            maxQuestions: 10,
            targetCents: 0,
            options: [],
            currentItems: [],
            collectedItems: [],
            walletPool: [],
            waiting: false,
            firstTry: true,
            hintUsed: false,
            initialCoin: null
        };

        const app = document.getElementById('app');

        function touchLockedCoin(btn) {
            if (state.waiting) return;
            playSound('tap');
            if (btn) {
                btn.classList.remove('shake-anim');
                void btn.offsetWidth;
                btn.classList.add('shake-anim');
            }
            const feedback = document.getElementById('feedback');
            if (feedback) {
                feedback.innerHTML = `<span>${_col('Šis pinigėlis jau padėtas ant padėklo! 🔒')}</span>`;
                feedback.className = "h-6 sm:h-7 flex items-center justify-center font-black text-xs sm:text-sm text-amber-600 dark:text-amber-400 opacity-100 transition-opacity shrink-0";
                setGameTimeout(() => {
                    if (!state.waiting && feedback) {
                        feedback.classList.add('opacity-0');
                    }
                }, 1800);
            }
        }

        function pickInitialCoin() {
            const candidates = state.walletPool.filter(c => c.cents < state.targetCents);
            state.initialCoin = candidates.length > 0 ? getRandomElement(candidates) : null;
        }

        function showMoneyHint() {
            if (state.waiting || state.hintUsed) return;
            state.hintUsed = true;
            playHintSound();
            // Surūšiuojame monetas nuo didžiausios iki mažiausios, kad būtų lengviau skaičiuoti
            state.currentItems = [...state.currentItems].sort((a, b) => b.cents - a.cents);
            renderGameScreen();
        }

        function updateCollectHintUI() {
            if (!state.hintUsed) return;
            const slot = document.getElementById('collect-hint-slot');
            if (!slot) return;
            const currentSum = getCollectedSum();
            const hint = formatMoneyDiffHint(currentSum, state.targetCents);
            slot.innerHTML = hint.html;
        }

        function showCollectHint() {
            if (state.waiting || state.hintUsed) return;
            state.hintUsed = true;
            playHintSound();
            updateCollectHintUI();
        }

        function renderStartScreen() {
            clearGameTimers();
            app.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-5 sm:p-8 text-center fade-in">
                    <div class="text-5xl sm:text-6xl mb-2 bounce">💰</div>
                    <h1 class="text-main-title text-3xl sm:text-5xl font-black text-gray-800 mb-4 tracking-tight">${_col('Pinigėliai')}</h1>
                    
                    <div class="flex flex-col gap-3 w-full max-w-sm">
                        <button onclick="startGame('cents')" class="btn-tinted w-full py-3.5 sm:py-4 px-4 rounded-2xl bg-amber-100 hover:bg-amber-200 text-slate-800 font-black text-lg sm:text-2xl shadow-lg transition transform active:scale-95 border-2 border-b-4 border-amber-400 flex items-center justify-center gap-2.5">
                            <span class="text-3xl">🪙</span>
                            <span>${_col('Centai')}</span>
                        </button>
                        <button onclick="startGame('euros')" class="btn-tinted w-full py-3.5 sm:py-4 px-4 rounded-2xl bg-green-100 hover:bg-green-200 text-slate-800 font-black text-lg sm:text-2xl shadow-lg transition transform active:scale-95 border-2 border-b-4 border-green-400 flex items-center justify-center gap-2.5">
                            <span class="text-3xl">💶</span>
                            <span>${_col('Eurai')}</span>
                        </button>
                        <button onclick="startGame('collect')" class="btn-tinted w-full py-3.5 sm:py-4 px-4 rounded-2xl bg-indigo-100 hover:bg-indigo-200 text-slate-800 font-black text-lg sm:text-2xl shadow-lg transition transform active:scale-95 border-2 border-b-4 border-indigo-400 flex items-center justify-center gap-2.5">
                            <span class="text-3xl">🖐️</span>
                            <span>${_col('Surink pats')}</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function startGame(mode) {
            initAudio();
            state.mode = mode;
            state.score = 0;
            state.streak = 0;
            state.question = 1;
            generateQuestion();
        }

        const COLLECT_TARGETS = [
            { cents: 8, pool: MONEY.centCoins },
            { cents: 15, pool: MONEY.centCoins },
            { cents: 25, pool: MONEY.centCoins },
            { cents: 35, pool: MONEY.centCoins },
            { cents: 42, pool: MONEY.centCoins },
            { cents: 60, pool: MONEY.centCoins },
            { cents: 75, pool: MONEY.centCoins },
            { cents: 80, pool: MONEY.centCoins },
            { cents: 90, pool: MONEY.centCoins },
            { cents: 120, pool: ALL_COINS },
            { cents: 150, pool: ALL_COINS },
            { cents: 250, pool: ALL_COINS },
            { cents: 300, pool: ALL_COINS },
            { cents: 400, pool: ALL_COINS },
            { cents: 700, pool: [...MONEY.euroCoins, ...MONEY.bills] },
            { cents: 800, pool: [...MONEY.euroCoins, ...MONEY.bills] },
            { cents: 1200, pool: [...MONEY.euroCoins, ...MONEY.bills] },
            { cents: 1500, pool: [...MONEY.euroCoins, ...MONEY.bills] },
            { cents: 1700, pool: [...MONEY.euroCoins, ...MONEY.bills] }
        ];

        function generateQuestion() {
            state.waiting = false;
            state.firstTry = true;
            state.hintUsed = false;
            state.collectedItems = [];
            state.initialCoin = null;

            if (state.mode === 'collect') {
                let targetObj;
                do {
                    targetObj = getRandomElement(COLLECT_TARGETS);
                } while (targetObj.cents === state.targetCents);
                state.targetCents = targetObj.cents;
                state.walletPool = targetObj.pool;
                pickInitialCoin();
                renderCollectScreen();
                return;
            }

            let totalCents = 0;
            let currentItems = [];
            
            if (state.mode === 'cents') {
                const count = Math.floor(Math.random() * 3) + 2; // 2 to 4 cent coins
                for (let i = 0; i < count; i++) {
                    const coin = getRandomElement(MONEY.centCoins);
                    currentItems.push(coin);
                    totalCents += coin.cents;
                }
            } else {
                const billCount = Math.floor(Math.random() * 2) + 1; // 1 to 2 bills
                const coinCount = Math.floor(Math.random() * 3) + 1; // 1 to 3 coins
                
                for (let i = 0; i < billCount; i++) {
                    const bill = getRandomElement(MONEY.bills);
                    currentItems.push(bill);
                    totalCents += bill.cents;
                }
                for (let i = 0; i < coinCount; i++) {
                    const coin = getRandomElement(ALL_COINS);
                    currentItems.push(coin);
                    totalCents += coin.cents;
                }
            }
            
            state.targetCents = totalCents;
            state.currentItems = currentItems;
            
            const options = new Set([totalCents]);
            const steps = state.mode === 'cents' ? [1, 2, 5, 10, 20] : [10, 50, 100, 200, 500];
            while (options.size < 4) {
                const diff = (Math.floor(Math.random() * 3) + 1) * getRandomElement(steps);
                const sign = Math.random() > 0.5 ? 1 : -1;
                let wrongVal = totalCents + (diff * sign);
                if (wrongVal > 0 && wrongVal !== totalCents) {
                    options.add(wrongVal);
                }
            }
            
            state.options = Array.from(options).sort(() => Math.random() - 0.5);
            renderGameScreen();
        }

        function renderGameTopBar() {
            return window.renderTopBar({
                score: state.score,
                current: state.question,
                total: state.maxQuestions,
                streak: state.streak,
                theme: 'emerald'
            });
        }

        function renderGameScreen() {
            const itemsHtml = state.currentItems.map(item => `
                <div class="${item.class} pop-in">
                    ${item.label}
                </div>
            `).join('');

            const exprStr = state.currentItems.map(item => formatMoneyCents(item.cents)).join(' + ');
            const hintSection = state.hintUsed
                ? `<div class="hint-box inline-flex items-center gap-2 text-sm sm:text-base py-1 px-3">
                       <span>💡</span>
                       <span>${exprStr} = ❓</span>
                   </div>`
                : `<button id="hint-btn" onclick="showMoneyHint()" class="hint-btn py-1.5 px-4 text-sm">
                       <span>💡</span>
                       <span>${_col('Užuomina')}</span>
                   </button>`;
            
            const optionsHtml = state.options.map((opt, index) => `
                <button id="btn-${index}" onclick="checkAnswer(${index}, ${opt})" class="opt-btn py-4 sm:py-5 rounded-2xl font-black text-2xl sm:text-3xl shadow-md border-b-4 transition transform active:scale-95">
                    ${formatMoneyCents(opt)}
                </button>
            `).join('');

            app.innerHTML = `
                ${renderGameTopBar()}
                <div class="flex-1 flex flex-col p-3 sm:p-5 fade-in justify-evenly gap-2 overflow-hidden">
                    <div class="text-center flex flex-col items-center gap-2">
                        <h2 class="text-2xl sm:text-3xl font-black text-slate-700 text-main-title flex items-center justify-center gap-2">
                            <span>💰 = ❓</span>
                        </h2>
                        <div>${hintSection}</div>
                    </div>

                    <div id="money-container" class="money-tray flex flex-wrap items-center justify-center content-center gap-2.5 sm:gap-3.5 p-4 sm:p-6 rounded-3xl min-h-[115px] max-h-[12rem] sm:min-h-[150px] overflow-y-auto">
                        ${itemsHtml}
                    </div>
                    
                    <div id="feedback" class="h-7 sm:h-8 flex items-center justify-center font-black text-base sm:text-xl opacity-0 transition-opacity">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 sm:gap-4">
                        ${optionsHtml}
                    </div>
                </div>
            `;
        }

        function getCollectedSum() {
            const initial = state.initialCoin ? state.initialCoin.cents : 0;
            return initial + state.collectedItems.reduce((acc, item) => acc + item.cents, 0);
        }

        function addCoinToTray(idx) {
            if (state.waiting) return;
            if (state.collectedItems.length >= 10) return;
            const item = state.walletPool[idx];
            state.collectedItems.push(item);
            playSound('coin');
            updateCollectUI();
        }

        function removeCoinFromTray(idx) {
            if (state.waiting) return;
            state.collectedItems.splice(idx, 1);
            playSound('remove');
            updateCollectUI();
        }

        function clearTray() {
            if (state.waiting) return;
            if (state.collectedItems.length === 0) return;
            state.collectedItems = [];
            playSound('remove');
            updateCollectUI();
        }

        function renderCollectScreen() {
            const walletHtml = state.walletPool.map((item, idx) => `
                <button onclick="addCoinToTray(${idx})" class="${item.class} cursor-pointer hover:scale-105" title="Pridėti ${item.label}">
                    ${item.label}
                </button>
            `).join('');

            app.innerHTML = `
                ${renderGameTopBar()}
                <div class="flex-1 flex flex-col p-2.5 sm:p-4 fade-in justify-between overflow-hidden">
                    <div class="text-center shrink-0">
                        <div class="inline-block mt-0.5 px-6 py-2 rounded-2xl bg-amber-100 border-2 border-amber-400 text-amber-900 font-black text-2xl sm:text-4xl shadow-sm">
                            🎯 ${formatMoneyCents(state.targetCents)}
                        </div>
                    </div>

                    <!-- Padėklas su surinktais pinigais -->
                    <div class="flex flex-col my-1 sm:my-2 shrink-0">
                        <div class="flex justify-between items-center px-1 mb-1.5 text-base sm:text-lg font-black shrink-0">
                            <span class="text-sub-title flex items-center gap-2">💰 Padėklas: <strong id="current-sum-label" class="text-emerald-500 font-black text-xl sm:text-3xl">${formatMoneyCents(getCollectedSum())}</strong></span>
                            <div class="flex items-center gap-2">
                                <span id="collect-hint-slot">
                                    <button id="hint-btn" onclick="showCollectHint()" class="hint-btn py-1 px-3 text-xs sm:text-sm min-h-[34px]">
                                        <span>💡</span>
                                        <span>${_col('Užuomina')}</span>
                                    </button>
                                </span>
                                <button onclick="clearTray()" class="text-rose-500 hover:scale-110 active:scale-95 text-2xl p-1.5 rounded-xl hover:bg-rose-50 dark:hover:bg-rose-950/30 transition" title="Išvalyti">🗑️</button>
                            </div>
                        </div>
                        <div id="money-container" class="money-tray flex flex-wrap items-center justify-center content-center gap-1.5 sm:gap-2.5 p-2.5 pt-3 sm:p-4 rounded-2xl min-h-[7.25rem] max-h-[11rem] sm:min-h-[9rem] sm:max-h-[13rem] overflow-y-auto">
                        </div>
                    </div>

                    <div id="feedback" class="h-6 sm:h-7 flex items-center justify-center font-black text-sm sm:text-lg opacity-0 transition-opacity shrink-0"></div>

                    <!-- Piniginė su monetomis pasirinkimui -->
                    <div class="wallet-box p-2.5 sm:p-3.5 rounded-2xl flex flex-col items-center gap-1.5 shrink-0">
                        <div class="text-sm sm:text-base font-extrabold text-slate-600 dark:text-slate-300 flex items-center gap-1.5">
                            <span>👛</span> <span>${_col('Piniginė (spausk monetą):')}</span>
                        </div>
                        <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-3 max-w-lg">
                            ${walletHtml}
                        </div>
                    </div>

                    <button id="check-collect-btn" onclick="checkCollectAnswer()" class="w-full py-3.5 sm:py-4 rounded-2xl bg-green-500 hover:bg-green-600 text-white font-black text-xl sm:text-2xl shadow-lg border-2 border-b-4 border-green-700 transition transform active:scale-95 flex items-center justify-center gap-2 shrink-0 mt-1">
                        <span>✅</span>
                        <span>${_col('Patvirtinti')}</span>
                    </button>
                </div>
            `;
            updateCollectUI();
        }

        function updateCollectUI() {
            const tray = document.getElementById('money-container');
            const sumLabel = document.getElementById('current-sum-label');
            if (!tray || !sumLabel) return;

            const currentSum = getCollectedSum();
            sumLabel.textContent = formatMoneyCents(currentSum);
            updateCollectHintUI();

            let initialHtml = '';
            if (state.initialCoin) {
                const init = state.initialCoin;
                initialHtml = `
                    <div class="relative inline-flex items-center justify-center shrink-0 pop-in m-0.5">
                        <button type="button" onclick="touchLockedCoin(this)" class="${init.class} locked-coin select-none transition-transform active:scale-95" title="Jau padėtas pinigėlis (neliečiamas)">
                            ${init.label}
                        </button>
                        <span class="absolute -top-1.5 -right-1.5 bg-amber-400 text-amber-950 font-black text-[10px] sm:text-xs rounded-full w-4 h-4 sm:w-5 sm:h-5 flex items-center justify-center shadow pointer-events-none select-none z-10" title="Neliečiamas">🔒</span>
                    </div>
                `;
            }

            const userCoinsHtml = state.collectedItems.map((item, idx) => `
                <button type="button" onclick="removeCoinFromTray(${idx})" class="${item.class} pop-in cursor-pointer hover:opacity-80 transition transform active:scale-95 m-0.5" title="Nuimti">
                    ${item.label}
                </button>
            `).join('');

            if (!state.initialCoin && state.collectedItems.length === 0) {
                tray.innerHTML = `
                    <div class="flex items-center justify-center gap-2 text-slate-400 dark:text-slate-500 select-none pointer-events-none">
                        <span class="text-2xl animate-bounce">🪙</span>
                        <span class="font-black text-base sm:text-lg text-slate-500 dark:text-slate-400">${_col('Padėk pinigus čia')}</span>
                    </div>
                `;
            } else if (state.collectedItems.length === 0) {
                tray.innerHTML = `
                    ${initialHtml}
                    <div class="flex items-center gap-1.5 text-slate-400 dark:text-slate-500 select-none pointer-events-none text-xs sm:text-sm font-extrabold border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-xl px-2.5 py-1.5">
                        <span class="animate-bounce">➕</span>
                        <span>${_col('Pridėk trūkstamus')}</span>
                    </div>
                `;
            } else {
                tray.innerHTML = initialHtml + userCoinsHtml;
            }
        }

        function checkCollectAnswer() {
            if (state.waiting) return;
            const currentSum = getCollectedSum();
            const feedback = document.getElementById('feedback');
            const container = document.getElementById('money-container');

            if (currentSum === state.targetCents) {
                state.waiting = true;
                playSound('correct');
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }
                feedback.innerHTML = `<span>${_col('Puiku! Surinkai tiksliai!')} 🎉</span>`;
                feedback.className = "h-6 sm:h-7 flex items-center justify-center font-black text-base sm:text-xl text-green-500 opacity-100";
                container.classList.add('bounce');

                setGameTimeout(() => {
                    if (state.question >= state.maxQuestions) {
                        renderEndScreen();
                    } else {
                        state.question++;
                        generateQuestion();
                    }
                }, 1200);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playSound('wrong');
                const hint = currentSum < state.targetCents ? 'Dar trūksta pinigėlių!' : 'Padėjai per daug! Paspausk ant monetos, kad nuimtum.';
                feedback.innerHTML = `<span>${_col(hint)} 🤔</span>`;
                feedback.className = "h-6 sm:h-7 flex items-center justify-center font-black text-sm sm:text-lg text-red-500 opacity-100";
                const hBtn = document.getElementById('hint-btn');
                if (hBtn) hBtn.classList.add('hint-btn-pulse');
                container.classList.remove('shake');
                void container.offsetWidth;
                container.classList.add('shake');
            }
        }

        function checkAnswer(index, valueCents) {
            if (state.waiting) return;
            
            const isCorrect = valueCents === state.targetCents;
            const btn = document.getElementById(`btn-${index}`);
            const feedback = document.getElementById('feedback');
            const container = document.getElementById('money-container');
            
            if (isCorrect) {
                state.waiting = true;
                playSound('correct');
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }
                btn.className = "py-3 sm:py-4 bg-green-500 text-white rounded-xl font-black text-xl sm:text-2xl shadow-md border-b-4 border-green-700 transform scale-105 bounce";
                feedback.innerHTML = `<span>${_col('Teisingai!')} 🎉</span>`;
                feedback.className = "h-7 sm:h-8 flex items-center justify-center font-black text-lg sm:text-2xl my-1 text-green-500 opacity-100";
                
                setTimeout(() => {
                    if (state.question >= state.maxQuestions) {
                        renderEndScreen();
                    } else {
                        state.question++;
                        generateQuestion();
                    }
                }, 1100);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playSound('wrong');
                btn.disabled = true;
                btn.className = "py-3 sm:py-4 bg-red-100 text-red-400 border-red-200 border-2 rounded-xl font-bold text-xl sm:text-2xl shadow-sm line-through cursor-not-allowed opacity-60 shake";
                feedback.innerHTML = `<span>${_col('Bandyk dar kartą!')} 🤔</span>`;
                feedback.className = "h-7 sm:h-8 flex items-center justify-center font-black text-base sm:text-xl my-1 text-red-500 opacity-100 whitespace-nowrap";
                const hBtn = document.getElementById('hint-btn');
                if (hBtn) hBtn.classList.add('hint-btn-pulse');
                container.classList.remove('shake');
                void container.offsetWidth;
                container.classList.add('shake');
            }
        }

        function renderEndScreen() {
            app.innerHTML = renderEndScreenHelper({
                score: state.score,
                total: state.maxQuestions,
                mode: state.mode,
                restartFn: "startGame(state.mode)",
                menuFn: "renderStartScreen()"
            });
        }

        // Initialize
        renderStartScreen();
    </script>
</body>
</html>
