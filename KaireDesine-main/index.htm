        // === GARSO SISTEMA (Web Audio API) ===
        let audioCtx;
        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playTone(freq, type, duration, startTime = 0, vol = 0.15) {
            try {
                const ctx = getAudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);
                gain.gain.setValueAtTime(vol, ctx.currentTime + startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime + startTime);
                osc.stop(ctx.currentTime + startTime + duration);
            } catch (e) {
                console.warn('Audio klaida:', e);
            }
        }

        function playStepSound() {
            playTone(520, 'sine', 0.09, 0, 0.14);
            playTone(660, 'sine', 0.09, 0.05, 0.12);

            playTone(440, 'sine', 0.15, 0);
            playTone(554.37, 'sine', 0.15, 0.08);

        }

        function playWrongSound() {
            playTone(280, 'sawtooth', 0.2, 0);

        function playWinSound() {
            [440, 554, 659, 880].forEach((freq, idx) => {
                playTone(freq, 'sine', 0.25, idx * 0.12);

        // === SKIEMENŲ SPALVINIMAS ===
        const _V = 'aeėęiįyouųūąAEĖĘIĮYOUŲŪĄ';
        const _D = ['ai','au','ei','eu','ie','uo','ui','oi','ia','io','iu'];
        const _L = /[a-ząčęėįšųūžA-ZĄČĘĖĮŠŲŪŽ]/;
        const _O = new Set(['bl','br','dr','dv','fl','fr','gl','gr','gn','kl','kr','kn','kv','pl','pr','sk','sl','sm','sn','sp','sr','st','sv','šl','šv','šn','tr','tv','vr','žl','žv','str','skr','spr']);
        const _SC = ['#dc2626','#2563eb','#16a34a','#ea580c','#9333ea','#db2777'];

        function _syl(word) {
            if (!word || word.length <= 1) return [word || ''];
            const r = []; let s = '', i = 0, n = word.length;
            while (i < n) {
                const c = word[i];
                if (!_L.test(c)) { s += c; i++; continue; }
                if (!_V.includes(c)) { s += c; i++; }
                else {
                    s += c; i++;
                    if (i < n && _V.includes(word[i]) && _D.includes((c + word[i]).toLowerCase())) { s += word[i]; i++; }
                    let j = i, u = [];
                    while (j < n && !_V.includes(word[j])) {
                        if (!_L.test(word[j])) break;
                        if (j+1 < n) { const p = (word[j]+word[j+1]).toLowerCase(); if (p==='ch'||p==='dz'||p==='dž') { u.push(word[j]+word[j+1]); j+=2; continue; } }
                        u.push(word[j]); j++;
                    }
                    if (j >= n || (j < n && !_V.includes(word[j]) && !_L.test(word[j]))) {
                        s += u.join(''); while (j < n && !_L.test(word[j])) { s += word[j]; j++; } i = j;
                        if (i >= n) { r.push(s); s = ''; }
                    } else if (u.length === 0) { r.push(s); s = ''; }
                    else if (u.length === 1) { r.push(s); s = u[0]; i = j; }
                    else {
                        let sp = u.length - 1;
                        if (u.length >= 3) { const l2 = (u[u.length-2]+u[u.length-1]).toLowerCase(); if (_O.has(l2)) sp = u.length - 2; }
                        if (u.length >= 4) { const l3 = (u[u.length-3]+u[u.length-2]+u[u.length-1]).toLowerCase(); if (_O.has(l3)) sp = u.length - 3; }
                        s += u.slice(0, sp).join(''); r.push(s); s = u.slice(sp).join(''); i = j;
                    }
                }
            }
            if (s) r.push(s);
            return r.filter(x => x.length > 0);
        }

        function _col(text) {
            if (!text) return '';
            return text.split(/(\s+)/).map(token => {
                if (!token.trim() || !/[a-ząčęėįšųūžA-ZĄČĘĖĮŠŲŪŽ]/.test(token)) return token;
                const syls = _syl(token);
                return syls.map((s, i) => '<span style="color:' + _SC[i % _SC.length] + '">' + s + '</span>').join('');
            }).join('');
        }

                prompt: "Nuvesk šuniuką prie kauliuko! 🐶 ➔ 🦴",
                start: [2, 0],
                goal: [0, 2],
                goalEmoji: "🦴",
                obstacles: [{ pos: [1, 0], emoji: "🪨" }, { pos: [1, 2], emoji: "🌳" }]
            },
            {
                prompt: "Padėk šuniukui pasiekti kauliuką! 🐶 ➔ 🦴",
                start: [0, 0],
                goal: [2, 2],
                goalEmoji: "🦴",
                obstacles: [{ pos: [0, 1], emoji: "🌳" }, { pos: [2, 0], emoji: "🪨" }]
            },
            {
                prompt: "Nuvesk šuniuką į namelį! 🐶 ➔ 🏠",
                start: [1, 2],
                goal: [1, 0],
                goalEmoji: "🏠",
                obstacles: [{ pos: [1, 1], emoji: "🌳" }]
            },
            {
                prompt: "Nuvesk šuniuką prie kauliuko! 🐶 ➔ 🦴",
                start: [0, 1],
                goal: [2, 1],
                goalEmoji: "🦴",
                obstacles: [{ pos: [1, 1], emoji: "🪨" }]
            },
            {
                prompt: "Padėk šuniukui grįžti į namelį! 🐶 ➔ 🏠",
                start: [2, 1],
                goal: [0, 0],
                goalEmoji: "🏠",
                obstacles: [{ pos: [2, 0], emoji: "🪨" }, { pos: [0, 2], emoji: "🌳" }]
            },
            {
                prompt: "Nuvesk šuniuką prie kauliuko! 🐶 ➔ 🦴",
                start: [1, 0],
                goal: [1, 2],
                goalEmoji: "🦴",
                obstacles: [{ pos: [1, 1], emoji: "🌳" }, { pos: [2, 1], emoji: "🪨" }]
            },
            {
                prompt: "Nuvesk šuniuką prie kauliuko! 🐶 ➔ 🦴",
                start: [0, 2],
                goal: [2, 1],
                goalEmoji: "🦴",
                obstacles: [{ pos: [1, 2], emoji: "🪨" }, { pos: [0, 0], emoji: "🌳" }]
            },
            {
                prompt: "Padėk šuniukui pasiekti namelį! 🐶 ➔ 🏠",
                start: [2, 2],
                goal: [0, 0],
                goalEmoji: "🏠",
                obstacles: [{ pos: [1, 2], emoji: "🌳" }, { pos: [1, 0], emoji: "🪨" }]
            },
            {
                prompt: "Nuvesk šuniuką prie kauliuko! 🐶 ➔ 🦴",
                start: [0, 0],
                goal: [2, 0],
                goalEmoji: "🦴",
                obstacles: [{ pos: [1, 0], emoji: "🪨" }, { pos: [1, 2], emoji: "🌳" }]
            }
        ];

        let state = {
            mode: 'left-right',
            questions: [],
            currentIndex: 0,
            score: 0,
            streak: 0,
            firstTry: true,
            waiting: false,
            dogPos: [0, 0],
            visited: []
        };

        const appEl = document.getElementById('app');

        function shuffle(arr) {
            return [...arr].sort(() => Math.random() - 0.5);
        }

        function renderTopBar() {
            return `
                <div class="bg-fuchsia-500 text-white px-4 py-2 flex justify-between items-center font-bold text-sm sm:text-base shadow">
                    <div>⭐ ${_col('Taškai:')} <span class="text-yellow-200">${state.score}</span></div>
                    <div class="bg-fuchsia-600 px-3 py-0.5 rounded-xl">${_col('Klausimas:')} ${state.currentIndex + 1} / 10</div>
                    <div>🔥 ${_col('Serija:')} <span class="text-orange-200">${state.streak}</span></div>
                </div>
            `;
        }

        function renderStartScreen() {
            appEl.innerHTML = `
                <div class="p-5 sm:p-7 flex flex-col items-center justify-center text-center">
                    <div class="text-5xl sm:text-6xl mb-2 animate-bounce">🧭</div>
                    <h1 class="text-3xl sm:text-4xl font-black text-fuchsia-700 mb-1">${_col('Kairė ar Dešinė?')}</h1>
                    <p class="text-base sm:text-lg font-bold text-slate-600 dark-subtext mb-5">${_col('Mokykis krypčių ir erdvinių padėčių!')}</p>

                    <div class="flex flex-col gap-3 w-full max-w-md">
                        <button onclick="startGame('left-right')" class="btn-3d py-3.5 px-5 bg-purple-100 hover:bg-purple-200 border-2 border-purple-400 rounded-2xl text-lg sm:text-xl font-black shadow-[0_5px_0_#a855f7] active:shadow-[0_0px_0_#a855f7] transition-all flex items-center justify-center gap-2">
                            <span>👈</span>
                            <span>${_col('Kairė ir Dešinė')}</span>
                        </button>
                        <button onclick="startGame('spatial')" class="btn-3d py-3.5 px-5 bg-pink-100 hover:bg-pink-200 border-2 border-pink-400 rounded-2xl text-lg sm:text-xl font-black shadow-[0_5px_0_#ec4899] active:shadow-[0_0px_0_#ec4899] transition-all flex items-center justify-center gap-2">
                            <span>📦</span>
                            <span>${_col('Virš, Po, Tarp, Viduje')}</span>
                        </button>
                        <button onclick="startGame('puppy')" class="btn-3d py-3.5 px-5 bg-amber-100 hover:bg-amber-200 border-2 border-amber-400 rounded-2xl text-lg sm:text-xl font-black shadow-[0_5px_0_#f59e0b] active:shadow-[0_0px_0_#f59e0b] transition-all flex items-center justify-center gap-2">
                            <span>🐾</span>
                            <span>${_col('Nuvesk šuniuką! (Tinklelis)')}</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function startGame(mode) {
            getAudioCtx();
            state.mode = mode;
            state.score = 0;
            state.streak = 0;
            state.currentIndex = 0;

            if (mode === 'left-right') {
                state.questions = shuffle(LEFT_RIGHT_TASKS).slice(0, 10);
            } else if (mode === 'spatial') {
                state.questions = shuffle(SPATIAL_TASKS).slice(0, 10);
            } else {
                state.questions = shuffle(PUPPY_LEVELS).slice(0, 10);
            }

            loadQuestion();
        }

        function loadQuestion() {
            if (state.currentIndex >= state.questions.length) {
                renderEndScreen();
                return;
            }
            state.firstTry = true;
            state.waiting = false;

            if (state.mode === 'puppy') {
                const lvl = state.questions[state.currentIndex];
                state.dogPos = [lvl.start[0], lvl.start[1]];
                state.visited = [`${lvl.start[0]},${lvl.start[1]}`];
                renderPuppyQuestion();
            } else {
                renderQuizQuestion();
            }
        }

        // ==========================================
        // 1 IR 2 REŽIMAI: Viktorinos klausimai
        // ==========================================
        function renderQuizQuestion() {
            const q = state.questions[state.currentIndex];
            const options = state.mode === 'left-right' ? [...q.options] : shuffle([...q.options]);

            const optionsHtml = options.map((opt, idx) => `
                <button id="btn-${idx}" onclick="handleQuizAnswer('${opt.replace(/'/g, "\\'")}', this)"
                    class="btn-3d py-3 sm:py-4 px-4 bg-fuchsia-50 hover:bg-fuchsia-100 text-fuchsia-900 border-2 border-fuchsia-300 rounded-2xl text-lg sm:text-2xl font-black shadow-[0_5px_0_#d8b4fe] active:shadow-[0_0px_0_#d8b4fe] transition-all flex items-center justify-center text-center">
                    ${_col(opt)}
                </button>
            `).join('');

            appEl.innerHTML = `
                ${renderTopBar()}
                <div class="p-3 sm:p-5 flex-1 flex flex-col justify-between items-center">
                    <h2 class="text-xl sm:text-2xl font-black text-slate-800 text-center mb-1">${_col(q.prompt)}</h2>

                    <div class="my-auto py-2 w-full flex items-center justify-center bg-white/60 dark-panel rounded-2xl border-2 border-fuchsia-100 min-h-[120px] sm:min-h-[140px]">
                        ${q.visual}
                    </div>

                    <div id="feedback" class="h-6 sm:h-7 flex items-center justify-center text-base sm:text-lg font-black my-1 opacity-0 transition-opacity">
                        ${_col('Puiku!')}
                    </div>

                    <div class="grid grid-cols-2 gap-2.5 sm:gap-3.5 w-full mt-1">
                        ${optionsHtml}
                    </div>
                </div>
            `;
        }

        function handleQuizAnswer(selected, btn) {
            if (state.waiting) return;

            const q = state.questions[state.currentIndex];
            const feedback = document.getElementById('feedback');

            if (selected === q.correct) {
                state.waiting = true;
                playCorrectSound();
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }

                btn.classList.remove('bg-fuchsia-50', 'text-fuchsia-900', 'border-fuchsia-300');
                btn.classList.add('bg-green-500', 'text-white', 'border-green-600', 'shadow-[0_5px_0_#15803d]', 'bounce-anim');

                feedback.innerHTML = _col("Puiku! Teisingai! 🎉");
                feedback.className = "h-6 sm:h-7 flex items-center justify-center text-base sm:text-lg font-black my-1 text-green-600 opacity-100";

                setTimeout(() => {
                    state.currentIndex++;
                    loadQuestion();
                }, 1050);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playWrongSound();

                btn.classList.remove('bg-fuchsia-50', 'text-fuchsia-900');
                btn.classList.add('bg-red-100', 'text-red-400', 'line-through', 'border-red-300', 'opacity-60', 'shake-anim');
                btn.disabled = true;

                feedback.innerHTML = _col("Bandyk dar kartą! 🤔");
                feedback.className = "h-6 sm:h-7 flex items-center justify-center text-base sm:text-lg font-black my-1 text-red-500 opacity-100";

                setTimeout(() => {
                    btn.classList.remove('shake-anim');
                }, 400);
            }
        }

        // ==========================================
        // 3 REŽIMAS: 🐾 Nuvesk šuniuką! (3x3 tinklelis)
        // ==========================================
        function renderPuppyQuestion() {
            const lvl = state.questions[state.currentIndex];
            const [dr, dc] = state.dogPos;
            const [gr, gc] = lvl.goal;

            let cellsHtml = '';
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {
                    const isDog = r === dr && c === dc;
                    const isGoal = r === gr && c === gc;
                    const obs = lvl.obstacles.find(o => o.pos[0] === r && o.pos[1] === c);
                    const wasVisited = state.visited.includes(`${r},${c}`);

                    let cellClass = 'grid-cell bg-fuchsia-50/80 border-2 border-fuchsia-200';
                    let content = '';

                    if (isDog && isGoal) {
                        cellClass = 'grid-cell-goal bg-green-200 border-4 border-green-500 bounce-anim';
                        content = `<span class="text-3xl sm:text-4xl">🐶${lvl.goalEmoji}</span>`;
                    } else if (isDog) {
                        cellClass = 'grid-cell-dog bg-amber-100 border-4 border-amber-400 bounce-anim';
                        content = `<span class="text-4xl sm:text-5xl">🐶</span>`;
                    } else if (isGoal) {
                        cellClass = 'grid-cell-goal bg-emerald-100 border-2 border-emerald-400';
                        content = `<span class="text-3xl sm:text-4xl animate-pulse">${lvl.goalEmoji}</span>`;
                    } else if (obs) {
                        cellClass = 'grid-cell bg-slate-100 border-2 border-slate-300';
                        content = `<span class="text-3xl sm:text-4xl">${obs.emoji}</span>`;
                    } else if (wasVisited) {
                        content = `<span class="text-xl sm:text-2xl opacity-45">🐾</span>`;
                    }

                    cellsHtml += `
                        <div id="cell-${r}-${c}" class="h-16 sm:h-20 rounded-2xl ${cellClass} flex items-center justify-center shadow-sm transition-all">
                            ${content}
                        </div>
                    `;
                }
            }

            // 4 krypčių mygtukai BE rodyklių piktogramų – vaikas skaito skiemenuotus žodžius
            const controls = [
                { dir: 'left', label: 'Į kairę' },
                { dir: 'up', label: 'Į viršų' },
                { dir: 'down', label: 'Į apačią' },
                { dir: 'right', label: 'Į dešinę' }
            ];

            const controlsHtml = controls.map(ctrl => `
                <button onclick="movePuppy('${ctrl.dir}')"
                    class="btn-3d py-2.5 sm:py-3.5 px-3 bg-fuchsia-50 hover:bg-fuchsia-100 border-2 border-fuchsia-300 rounded-2xl text-lg sm:text-xl font-black shadow-[0_4px_0_#d8b4fe] active:shadow-[0_0px_0_#d8b4fe] transition-all flex items-center justify-center text-center">
                    ${_col(ctrl.label)}
                </button>
            `).join('');

            appEl.innerHTML = `
                ${renderTopBar()}
                <div class="p-3 sm:p-4 flex-1 flex flex-col justify-between items-center">
                    <h2 class="text-lg sm:text-2xl font-black text-slate-800 text-center">${_col(lvl.prompt)}</h2>

                    <div id="puppy-grid" class="grid grid-cols-3 gap-2 sm:gap-2.5 w-full max-w-xs my-1.5 p-2.5 bg-white/80 dark-panel rounded-3xl border-2 border-fuchsia-200 shadow-inner">
                        ${cellsHtml}
                    </div>

                    <div id="feedback" class="h-6 flex items-center justify-center text-sm sm:text-base font-black opacity-0 transition-opacity">
                        ${_col('Spausk krypties mygtuką!')}
                    </div>

                    <div class="grid grid-cols-2 gap-2.5 sm:gap-3 w-full max-w-md">
                        ${controlsHtml}
                    </div>
                </div>
            `;
        }

        function movePuppy(dir) {
            if (state.waiting) return;
            const lvl = state.questions[state.currentIndex];
            let [r, c] = state.dogPos;

            if (dir === 'up') r -= 1;
            else if (dir === 'down') r += 1;
            else if (dir === 'left') c -= 1;
            else if (dir === 'right') c += 1;

            const gridEl = document.getElementById('puppy-grid');
            const feedback = document.getElementById('feedback');

            // Patikriname ribas ir kliūtis
            const outOfBounds = r < 0 || r > 2 || c < 0 || c > 2;
            const hitObstacle = !outOfBounds && lvl.obstacles.some(o => o.pos[0] === r && o.pos[1] === c);

            if (outOfBounds || hitObstacle) {
                state.firstTry = false;
                state.streak = 0;
                playWrongSound();
                if (gridEl) {
                    gridEl.classList.remove('shake-anim');
                    void gridEl.offsetWidth;
                    gridEl.classList.add('shake-anim');
                }
                feedback.innerHTML = _col(hitObstacle ? 'Ten kliūtis! Pasirink kitą kryptį! 🌳' : 'Ten eiti negalima! Pasirink kitą kryptį! 🚧');
                feedback.className = 'h-6 flex items-center justify-center text-sm sm:text-base font-black text-red-500 opacity-100';
                return;
            }

            // Žingsnis tinkamas
            state.dogPos = [r, c];
            const posKey = `${r},${c}`;
            if (!state.visited.includes(posKey)) {
                state.visited.push(posKey);
            }

            const reachedGoal = r === lvl.goal[0] && c === lvl.goal[1];

            if (reachedGoal) {
                state.waiting = true;
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }
                playCorrectSound();
                renderPuppyQuestion();
                const fb = document.getElementById('feedback');
                fb.innerHTML = _col('Valio! Šuniukas pasiekė tikslą! 🎉');
                fb.className = 'h-6 flex items-center justify-center text-sm sm:text-base font-black text-green-600 opacity-100';

                setTimeout(() => {
                    state.currentIndex++;
                    loadQuestion();
                }, 1050);
            } else {
                playStepSound();
                renderPuppyQuestion();
                const fb = document.getElementById('feedback');
                fb.innerHTML = _col('Puiku! Eik toliau! 🐾');
                fb.className = 'h-6 flex items-center justify-center text-sm sm:text-base font-black text-fuchsia-600 opacity-100';
            }
        }

        // === PABAIGOS EKRANAS ===
        function renderEndScreen() {
            playWinSound();
            let stars = "⭐";
            if (state.score >= 8) stars = "⭐⭐⭐";
            else if (state.score >= 5) stars = "⭐⭐";

            appEl.innerHTML = `
                <div class="p-6 sm:p-8 flex flex-col items-center justify-center text-center">
                    <div class="text-6xl sm:text-7xl mb-2">🎉</div>
                    <h2 class="text-3xl sm:text-4xl font-black text-green-600 mb-2">${_col('Šaunuolis!')}</h2>
                    <div class="text-5xl mb-4 tracking-wider">${stars}</div>
                    <p class="text-xl font-bold text-slate-700 dark-subtext mb-1">${_col('Surinkai taškų:')}</p>
                    <p class="text-4xl font-black text-fuchsia-600 mb-6">${state.score} / 10</p>

                    <div class="flex flex-col sm:flex-row gap-3 w-full max-w-sm">
                        <button onclick="startGame(state.mode)" class="btn-3d flex-1 py-3.5 bg-fuchsia-200 hover:bg-fuchsia-300 border-2 border-fuchsia-400 rounded-2xl text-lg font-black shadow-[0_5px_0_#a21caf] active:shadow-[0_0px_0_#a21caf] transition-all">
                            ${_col('Dar kartą')}
                        </button>
                        <button onclick="renderStartScreen()" class="btn-3d flex-1 py-3.5 bg-slate-200 hover:bg-slate-300 border-2 border-slate-400 rounded-2xl text-lg font-black shadow-[0_5px_0_#94a3b8] active:shadow-[0_0px_0_#94a3b8] transition-all">
                            ${_col('Iš pradžių')}
                        </button>
                    </div>
                </div>
            `;
        }

        renderStartScreen();
    </script>
</body>
</html>
