<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>🧭 Kairė ar Dešinė?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fdf4ff;
            background-image: radial-gradient(#f0abfc 20%, transparent 20%);
            background-size: 20px 20px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .btn-3d {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-3d:active {
            transform: translateY(4px);
        }

        @keyframes bounce-scale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .bounce-anim {
            animation: bounce-scale 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .shake-anim {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="h-screen max-h-screen flex items-center justify-center p-2 sm:p-4 overflow-hidden">

    <div id="app" class="w-full max-w-2xl bg-white/95 backdrop-blur-md rounded-3xl shadow-xl flex flex-col relative border-4 border-fuchsia-300 overflow-hidden max-h-full">
        <!-- Turinis bus atvaizduotas dinamiškai per JS -->
    </div>

    <script>
        // Web Audio API
        let audioCtx;
        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playTone(freq, type, duration, startTime=0) {
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);
            gain.gain.setValueAtTime(0.15, ctx.currentTime + startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + startTime);
            osc.stop(ctx.currentTime + startTime + duration);
        }

        function playCorrectSound() {
            playTone(440, 'sine', 0.15, 0);
            playTone(554.37, 'sine', 0.15, 0.08);
            playTone(659.25, 'sine', 0.25, 0.16);
        }

        function playWrongSound() {
            playTone(280, 'sawtooth', 0.2, 0);
            playTone(200, 'sawtooth', 0.25, 0.1);
        }

        function playWinSound() {
            [440, 554, 659, 880].forEach((freq, idx) => {
                playTone(freq, 'sine', 0.25, idx * 0.12);
            });
        }

        // Užduočių bazė
        const LEFT_RIGHT_TASKS = [
            {
                prompt: "Kurioje pusėje yra dovanėlė? 🎁",
                visual: `<div class="flex justify-between items-center w-full px-8 py-2">
                    <div class="text-7xl p-3 bg-fuchsia-100 rounded-2xl border-4 border-dashed border-fuchsia-300">🎁</div>
                    <div class="text-6xl text-slate-300 font-black">↔️</div>
                    <div class="text-7xl p-3 bg-slate-50 rounded-2xl border-4 border-dashed border-slate-200 opacity-40">❓</div>
                </div>`,
                options: ["Kairėje", "Dešinėje"],
                correct: "Kairėje"
            },
            {
                prompt: "Kurioje pusėje yra obuolys? 🍏",
                visual: `<div class="flex justify-between items-center w-full px-8 py-2">
                    <div class="text-7xl p-3 bg-slate-50 rounded-2xl border-4 border-dashed border-slate-200 opacity-40">❓</div>
                    <div class="text-6xl text-slate-300 font-black">↔️</div>
                    <div class="text-7xl p-3 bg-fuchsia-100 rounded-2xl border-4 border-dashed border-fuchsia-300">🍏</div>
                </div>`,
                options: ["Kairėje", "Dešinėje"],
                correct: "Dešinėje"
            },
            {
                prompt: "Kurioje pusėje yra kamuolys? ⚽",
                visual: `<div class="flex justify-between items-center w-full px-8 py-2">
                    <div class="text-7xl p-3 bg-fuchsia-100 rounded-2xl border-4 border-dashed border-fuchsia-300">⚽</div>
                    <div class="text-6xl text-slate-300 font-black">↔️</div>
                    <div class="text-7xl p-3 bg-slate-50 rounded-2xl border-4 border-dashed border-slate-200 opacity-40">❓</div>
                </div>`,
                options: ["Kairėje", "Dešinėje"],
                correct: "Kairėje"
            },
            {
                prompt: "Kurioje pusėje yra žvaigždutė? ⭐",
                visual: `<div class="flex justify-between items-center w-full px-8 py-2">
                    <div class="text-7xl p-3 bg-slate-50 rounded-2xl border-4 border-dashed border-slate-200 opacity-40">❓</div>
                    <div class="text-6xl text-slate-300 font-black">↔️</div>
                    <div class="text-7xl p-3 bg-fuchsia-100 rounded-2xl border-4 border-dashed border-fuchsia-300">⭐</div>
                </div>`,
                options: ["Kairėje", "Dešinėje"],
                correct: "Dešinėje"
            },
            {
                prompt: "Kurioje pusėje yra balionas? 🎈",
                visual: `<div class="flex justify-between items-center w-full px-8 py-2">
                    <div class="text-7xl p-3 bg-fuchsia-100 rounded-2xl border-4 border-dashed border-fuchsia-300">🎈</div>
                    <div class="text-6xl text-slate-300 font-black">↔️</div>
                    <div class="text-7xl p-3 bg-slate-50 rounded-2xl border-4 border-dashed border-slate-200 opacity-40">❓</div>
                </div>`,
                options: ["Kairėje", "Dešinėje"],
                correct: "Kairėje"
            },
            {
                prompt: "Kurioje pusėje sėdi šuniukas? 🐶",
                visual: `<div class="flex justify-between items-center w-full px-8 py-2">
                    <div class="text-7xl p-3 bg-slate-50 rounded-2xl border-4 border-dashed border-slate-200 opacity-40">❓</div>
                    <div class="text-6xl text-slate-300 font-black">↔️</div>
                    <div class="text-7xl p-3 bg-fuchsia-100 rounded-2xl border-4 border-dashed border-fuchsia-300">🐶</div>
                </div>`,
                options: ["Kairėje", "Dešinėje"],
                correct: "Dešinėje"
            },
            {
                prompt: "Kurioje pusėje yra mašinėlė? 🚗",
                visual: `<div class="flex justify-between items-center w-full px-8 py-2">
                    <div class="text-7xl p-3 bg-fuchsia-100 rounded-2xl border-4 border-dashed border-fuchsia-300">🚗</div>
                    <div class="text-6xl text-slate-300 font-black">↔️</div>
                    <div class="text-7xl p-3 bg-slate-50 rounded-2xl border-4 border-dashed border-slate-200 opacity-40">❓</div>
                </div>`,
                options: ["Kairėje", "Dešinėje"],
                correct: "Kairėje"
            },
            {
                prompt: "Kurioje pusėje žydi gėlytė? 🌸",
                visual: `<div class="flex justify-between items-center w-full px-8 py-2">
                    <div class="text-7xl p-3 bg-slate-50 rounded-2xl border-4 border-dashed border-slate-200 opacity-40">❓</div>
                    <div class="text-6xl text-slate-300 font-black">↔️</div>
                    <div class="text-7xl p-3 bg-fuchsia-100 rounded-2xl border-4 border-dashed border-fuchsia-300">🌸</div>
                </div>`,
                options: ["Kairėje", "Dešinėje"],
                correct: "Dešinėje"
            },
            {
                prompt: "Kur rodo rodyklė? ➡️",
                visual: `<div class="text-8xl py-1 text-purple-600 font-black animate-pulse">➡️</div>`,
                options: ["Į kairę", "Į dešinę"],
                correct: "Į dešinę"
            },
            {
                prompt: "Kur rodo rodyklė? ⬅️",
                visual: `<div class="text-8xl py-1 text-purple-600 font-black animate-pulse">⬅️</div>`,
                options: ["Į kairę", "Į dešinę"],
                correct: "Į kairę"
            },
            {
                prompt: "Kur rodo pirštukas? 👉",
                visual: `<div class="text-8xl py-1 animate-pulse">👉</div>`,
                options: ["Į kairę", "Į dešinę"],
                correct: "Į dešinę"
            },
            {
                prompt: "Kur rodo pirštukas? 👈",
                visual: `<div class="text-8xl py-1 animate-pulse">👈</div>`,
                options: ["Į kairę", "Į dešinę"],
                correct: "Į kairę"
            },
            {
                prompt: "Kur skrenda raketa? 🚀",
                visual: `<div class="text-7xl py-1 flex items-center justify-center gap-3"><span>🚀</span><span class="text-6xl text-purple-600 font-black">➡️</span></div>`,
                options: ["Į kairę", "Į dešinę"],
                correct: "Į dešinę"
            },
            {
                prompt: "Kur skrenda raketa? 🚀",
                visual: `<div class="text-7xl py-1 flex items-center justify-center gap-3"><span class="text-6xl text-purple-600 font-black">⬅️</span><span>🚀</span></div>`,
                options: ["Į kairę", "Į dešinę"],
                correct: "Į kairę"
            },
            {
                prompt: "Kur važiuoja mašinėlė? 🚗",
                visual: `<div class="text-7xl py-1 flex items-center justify-center gap-3"><span>🚗</span><span class="text-6xl text-purple-600 font-black">➡️</span></div>`,
                options: ["Į kairę", "Į dešinę"],
                correct: "Į dešinę"
            },
            {
                prompt: "Kur važiuoja mašinėlė? 🚗",
                visual: `<div class="text-7xl py-1 flex items-center justify-center gap-3"><span class="text-6xl text-purple-600 font-black">⬅️</span><span>🚗</span></div>`,
                options: ["Į kairę", "Į dešinę"],
                correct: "Į kairę"
            }
        ];

        const SPATIAL_TASKS = [
            {
                prompt: "Kas yra VIRŠ stalo? 🪑",
                visual: `<div class="flex flex-col items-center">
                    <div class="text-6xl mb-1">🐱</div>
                    <div class="text-7xl">🪑</div>
                    <div class="text-5xl mt-1 opacity-50">⚽</div>
                </div>`,
                options: ["Katė", "Kamuolys", "Stalas", "Knyga"],
                correct: "Katė"
            },
            {
                prompt: "Kas yra PO stalu? 🪑",
                visual: `<div class="flex flex-col items-center">
                    <div class="text-5xl mb-1 opacity-50">🐱</div>
                    <div class="text-7xl">🪑</div>
                    <div class="text-6xl mt-1">🐶</div>
                </div>`,
                options: ["Šuo", "Katė", "Stalas", "Gėlė"],
                correct: "Šuo"
            },
            {
                prompt: "Kas yra TARP kačiuko ir šuniuko? 🐱 ... 🐶",
                visual: `<div class="flex items-center justify-center gap-4 text-6xl py-2">
                    <span>🐱</span>
                    <span class="p-2 bg-yellow-100 rounded-2xl border-2 border-yellow-300">⚽</span>
                    <span>🐶</span>
                </div>`,
                options: ["Kamuolys", "Katė", "Šuo", "Pelė"],
                correct: "Kamuolys"
            },
            {
                prompt: "Kas yra MEDYJE? 🌳",
                visual: `<div class="relative w-40 h-32 mx-auto flex items-center justify-center">
                    <div class="text-8xl">🌳</div>
                    <div class="absolute top-2 text-5xl animate-bounce">🦉</div>
                    <div class="absolute -bottom-2 text-5xl">🍄</div>
                </div>`,
                options: ["Pelėda", "Grybas", "Ežiukas", "Meška"],
                correct: "Pelėda"
            },
            {
                prompt: "Kas yra PO medžiu? 🌳",
                visual: `<div class="relative w-40 h-32 mx-auto flex items-center justify-center">
                    <div class="text-8xl">🌳</div>
                    <div class="absolute top-2 text-5xl opacity-40">🦉</div>
                    <div class="absolute -bottom-2 text-6xl">🍄</div>
                </div>`,
                options: ["Grybas", "Pelėda", "Paukštis", "Saulė"],
                correct: "Grybas"
            },
            {
                prompt: "Kas yra TARP obuolio ir banano? 🍎 ... 🍌",
                visual: `<div class="flex items-center justify-center gap-4 text-6xl py-2">
                    <span>🍎</span>
                    <span class="p-2 bg-purple-100 rounded-2xl border-2 border-purple-300">🍇</span>
                    <span>🍌</span>
                </div>`,
                options: ["Vynuogės", "Obuolys", "Bananas", "Kriaušė"],
                correct: "Vynuogės"
            },
            {
                prompt: "Kas yra DĖŽUTĖS VIDUJE? 📦",
                visual: `<div class="relative w-40 h-28 mx-auto flex items-center justify-center">
                    <div class="text-7xl">📦</div>
                    <div class="absolute top-4 text-5xl">🧸</div>
                </div>`,
                options: ["Meškiukas", "Kamuolys", "Mašina", "Lėlė"],
                correct: "Meškiukas"
            },
            {
                prompt: "Kas yra VIRŠ namo? 🏠",
                visual: `<div class="flex flex-col items-center">
                    <div class="text-6xl mb-1 animate-pulse">☀️</div>
                    <div class="text-7xl">🏠</div>
                    <div class="text-5xl mt-1 opacity-50">🌸</div>
                </div>`,
                options: ["Saulė", "Gėlė", "Namas", "Medis"],
                correct: "Saulė"
            },
            {
                prompt: "Kas yra KREPŠELYJE? 🧺",
                visual: `<div class="relative w-40 h-28 mx-auto flex items-center justify-center">
                    <div class="text-7xl">🧺</div>
                    <div class="absolute top-2 text-5xl">🍓</div>
                </div>`,
                options: ["Braškė", "Obuolys", "Gėlė", "Morka"],
                correct: "Braškė"
            }
        ];

        let state = {
            mode: 'left-right',
            questions: [],
            currentIndex: 0,
            score: 0,
            streak: 0,
            firstTry: true,
            waiting: false
        };

        const appEl = document.getElementById('app');

        function shuffle(arr) {
            return [...arr].sort(() => Math.random() - 0.5);
        }

        function renderStartScreen() {
            appEl.innerHTML = `
                <div class="p-6 sm:p-8 flex flex-col items-center justify-center text-center">
                    <div class="text-6xl sm:text-7xl mb-2 animate-bounce">🧭</div>
                    <h1 class="text-3xl sm:text-5xl font-black text-fuchsia-700 mb-2">Kairė ar Dešinė?</h1>
                    <p class="text-lg sm:text-xl font-bold text-slate-600 mb-6 sm:mb-8">Mokykis krypčių ir erdvinių padėčių!</p>
                    
                    <div class="flex flex-col gap-3.5 sm:gap-4 w-full max-w-sm">
                        <button onclick="startGame('left-right')" class="btn-3d py-3.5 sm:py-4 px-6 bg-purple-500 hover:bg-purple-600 text-white rounded-2xl text-xl sm:text-2xl font-black shadow-[0_6px_0_#7e22ce] active:shadow-[0_0px_0_#7e22ce] transition-all">
                            ⬅️ Kairė ar Dešinė? ➡️
                        </button>
                        <button onclick="startGame('spatial')" class="btn-3d py-3.5 sm:py-4 px-6 bg-pink-500 hover:bg-pink-600 text-white rounded-2xl text-xl sm:text-2xl font-black shadow-[0_6px_0_#be185d] active:shadow-[0_0px_0_#be185d] transition-all">
                            📦 Erdvinės Padėtys
                        </button>
                    </div>
                </div>
            `;
        }

        function startGame(mode) {
            getAudioCtx();
            state.mode = mode;
            state.score = 0;
            state.streak = 0;
            state.currentIndex = 0;
            const pool = mode === 'left-right' ? LEFT_RIGHT_TASKS : SPATIAL_TASKS;
            state.questions = shuffle(pool).slice(0, 10);
            renderQuestion();
        }

        function renderQuestion() {
            if (state.currentIndex >= state.questions.length) {
                renderEndScreen();
                return;
            }

            state.firstTry = true;
            state.waiting = false;
            const q = state.questions[state.currentIndex];
            const options = state.mode === 'left-right' ? [...q.options] : shuffle([...q.options]);

            const isTwoOptions = options.length === 2;
            const gridClass = isTwoOptions ? "grid-cols-2" : "grid-cols-2";

            const optionsHtml = options.map((opt, idx) => `
                <button id="btn-${idx}" onclick="handleAnswer('${opt.replace(/'/g, "\\'")}', this)" 
                    class="btn-3d py-3 sm:py-4 px-4 bg-fuchsia-50 hover:bg-fuchsia-100 text-fuchsia-900 border-2 border-fuchsia-300 rounded-2xl text-lg sm:text-2xl font-black shadow-[0_5px_0_#d8b4fe] active:shadow-[0_0px_0_#d8b4fe] transition-all flex items-center justify-center text-center">
                    ${opt}
                </button>
            `).join('');

            appEl.innerHTML = `
                <!-- Top Status Bar -->
                <div class="bg-fuchsia-500 text-white px-4 py-2 sm:py-2.5 flex justify-between items-center font-bold text-sm sm:text-base shadow">
                    <div>⭐ Taškai: <span class="text-yellow-200">${state.score}</span></div>
                    <div class="bg-fuchsia-600 px-3 py-1 rounded-xl">Klausimas: ${state.currentIndex + 1} / 10</div>
                    <div>🔥 Serija: <span class="text-orange-200">${state.streak}</span></div>
                </div>

                <div class="p-3 sm:p-5 flex-1 flex flex-col justify-between items-center">
                    <h2 class="text-xl sm:text-2xl font-black text-slate-800 text-center mb-2 sm:mb-3">${q.prompt}</h2>

                    <div class="my-auto py-2 w-full flex items-center justify-center bg-white/60 rounded-2xl border-2 border-fuchsia-100 min-h-[120px] sm:min-h-[140px]">
                        ${q.visual}
                    </div>

                    <div id="feedback" class="h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 opacity-0 transition-opacity">
                        Pranešimas
                    </div>

                    <div class="grid ${gridClass} gap-2.5 sm:gap-3.5 w-full mt-1">
                        ${optionsHtml}
                    </div>
                </div>
            `;
        }

        function handleAnswer(selected, btn) {
            if (state.waiting) return;

            const q = state.questions[state.currentIndex];
            const feedback = document.getElementById('feedback');

            if (selected === q.correct) {
                state.waiting = true;
                playCorrectSound();
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }

                btn.classList.remove('bg-fuchsia-50', 'text-fuchsia-900', 'border-fuchsia-300');
                btn.classList.add('bg-green-500', 'text-white', 'border-green-600', 'shadow-[0_5px_0_#15803d]', 'bounce-anim');

                feedback.textContent = "Puiku! Teisingai! 🎉";
                feedback.className = "h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 text-green-600 opacity-100";

                setTimeout(() => {
                    state.currentIndex++;
                    renderQuestion();
                }, 1200);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playWrongSound();

                btn.classList.remove('bg-fuchsia-50', 'text-fuchsia-900');
                btn.classList.add('bg-red-100', 'text-red-400', 'line-through', 'border-red-300', 'opacity-60', 'shake-anim');
                btn.disabled = true;

                feedback.textContent = "Bandyk dar kartą! 🤔";
                feedback.className = "h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 text-red-500 opacity-100";

                setTimeout(() => {
                    btn.classList.remove('shake-anim');
                }, 400);
            }
        }

        function renderEndScreen() {
            playWinSound();
            let stars = "⭐";
            if (state.score >= 8) stars = "⭐⭐⭐";
            else if (state.score >= 5) stars = "⭐⭐";

            appEl.innerHTML = `
                <div class="p-6 sm:p-8 flex flex-col items-center justify-center text-center">
                    <div class="text-7xl mb-2">🎉</div>
                    <h2 class="text-3xl sm:text-4xl font-black text-green-600 mb-2">Šaunuolis!</h2>
                    <div class="text-5xl mb-4 tracking-wider">${stars}</div>
                    <p class="text-xl font-bold text-slate-700 mb-1">Surinkai taškų:</p>
                    <p class="text-4xl font-black text-fuchsia-600 mb-6">${state.score} / 10</p>
                    
                    <div class="flex flex-col sm:flex-row gap-3 w-full max-w-sm">
                        <button onclick="startGame(state.mode)" class="btn-3d flex-1 py-3.5 bg-fuchsia-500 hover:bg-fuchsia-600 text-white rounded-2xl text-lg font-black shadow-[0_5px_0_#a21caf] active:shadow-[0_0px_0_#a21caf] transition-all">
                            Dar kartą
                        </button>
                        <button onclick="renderStartScreen()" class="btn-3d flex-1 py-3.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-2xl text-lg font-black shadow-[0_5px_0_#94a3b8] active:shadow-[0_0px_0_#94a3b8] transition-all">
                            Iš pradžių
                        </button>
                    </div>
                </div>
            `;
        }

        renderStartScreen();
    </script>
</body>
</html>
