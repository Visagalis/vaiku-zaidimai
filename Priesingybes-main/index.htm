<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>⚖️ Priešingybės</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/common.css">
    <script src="../shared/common.js"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #eff6ff;
            background-image: radial-gradient(#93c5fd 20%, transparent 20%);
            background-size: 20px 20px;
        }

        

        /* Tamsioji tema */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0b1120 !important;
                background-image: radial-gradient(#1e293b 20%, transparent 20%) !important;
                color: #f1f5f9 !important;
            }
            #app {
                background-color: #0f172a !important;
                border-color: #334155 !important;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6) !important;
            }
            h2, h1 {
                color: #f8fafc !important;
            }
            .btn-3d {
                background-color: #1e293b !important;
                border-color: #334155 !important;
                color: #f8fafc !important;
                box-shadow: 0 5px 0 #0f172a !important;
            }
            .btn-3d:hover {
                background-color: #273549 !important;
            }
            .btn-3d.selected-card {
                background-color: #1e3a8a !important;
                border-color: #3b82f6 !important;
                box-shadow: 0 0 0 3px #3b82f6 !important;
            }
            .btn-3d.matched-card {
                background-color: #16a34a !important;
                border-color: #15803d !important;
                color: #ffffff !important;
            }
            .bg-blue-100\/60 {
                background-color: rgba(30, 41, 59, 0.7) !important;
                border-color: #334155 !important;
            }
            .text-blue-900 {
                color: #93c5fd !important;
            }
        }
    </style>
</head>
<body class="h-screen max-h-screen flex items-center justify-center p-2 sm:p-4 overflow-hidden transition-colors duration-200">

    <div id="app" class="w-full max-w-2xl bg-white/95 backdrop-blur-md rounded-3xl shadow-xl flex flex-col relative border-4 border-blue-300 overflow-hidden max-h-full">
        <!-- Turinis bus atvaizduotas dinamiškai per JS -->
    </div>

    <script>
        // Priešingybių žodynas
        const EASY_ANTONYMS = [
            { word: "ŠALTAS", emoji: "🧊", correct: "KARŠTAS", wrong: ["MAŽAS", "LIŪDNAS", "NAKTIS"] },
            { word: "DIDELIS", emoji: "🐘", correct: "MAŽAS", wrong: ["KARŠTAS", "GREITAS", "ŠVARUS"] },
            { word: "DIENA", emoji: "☀️", correct: "NAKTIS", wrong: ["KARŠTAS", "LINKSMAS", "AUKŠTAS"] },
            { word: "LINKSMAS", emoji: "😃", correct: "LIŪDNAS", wrong: ["ŠALTAS", "MAŽAS", "NAKTIS"] },
            { word: "ŠVARUS", emoji: "🧼", correct: "PURVINAS", wrong: ["KARŠTAS", "AUKŠTAS", "GREITAS"] },
            { word: "LĖTAS", emoji: "🐢", correct: "GREITAS", wrong: ["MAŽAS", "ŠALTAS", "LIŪDNAS"] },
            { word: "AUKŠTAS", emoji: "🦒", correct: "ŽEMAS", wrong: ["KARŠTAS", "NAKTIS", "ŠVARUS"] },
            { word: "ŠVIESUS", emoji: "💡", correct: "TAMSUS", wrong: ["ŠALTAS", "LĖTAS", "DIDELIS"] },
            { word: "KARŠTAS", emoji: "🔥", correct: "ŠALTAS", wrong: ["ŽEMAS", "LIŪDNAS", "ŠVARUS"] },
            { word: "MAŽAS", emoji: "🐭", correct: "DIDELIS", wrong: ["GREITAS", "KARŠTAS", "NAKTIS"] }
        ];

        const HARD_ANTONYMS = [
            { word: "KIETAS", emoji: "🪨", correct: "MINKŠTAS", wrong: ["LENGVAS", "UŽDARYTAS", "SENAS"] },
            { word: "SUNKUS", emoji: "🏋️", correct: "LENGVAS", wrong: ["MINKŠTAS", "TUŠČIAS", "RŪGŠTUS"] },
            { word: "ATIDARYTAS", emoji: "🚪", correct: "UŽDARYTAS", wrong: ["LENGVAS", "MINKŠTAS", "TRUMPAS"] },
            { word: "PILNAS", emoji: "🥛", correct: "TUŠČIAS", wrong: ["SENAS", "RŪGŠTUS", "TRUMPAS"] },
            { word: "JAUNAS", emoji: "👶", correct: "SENAS", wrong: ["TUŠČIAS", "LENGVAS", "UŽDARYTAS"] },
            { word: "SALDUS", emoji: "🍭", correct: "RŪGŠTUS", wrong: ["TRUMPAS", "MINKŠTAS", "SENAS"] },
            { word: "ILGAS", emoji: "🧵", correct: "TRUMPAS", wrong: ["RŪGŠTUS", "TUŠČIAS", "UŽDARYTAS"] },
            { word: "VASARA", emoji: "🏖️", correct: "ŽIEMA", wrong: ["NAKTIS", "KIETAS", "LENGVAS"] },
            { word: "AUKŠTYN", emoji: "⬆️", correct: "ŽEMYN", wrong: ["KAIRĖN", "DEŠINĖN", "RATU"] },
            { word: "TIESUS", emoji: "🛣️", correct: "KREIVAS", wrong: ["TRUMPAS", "LENGVAS", "MINKŠTAS"] }
        ];

        // 20 unikalių porų 3-iajam režimui (5 lentos po 4 poras)
        const PAIR_ANTONYMS = [
            { id: "p1", left: "ŠALTAS", right: "KARŠTAS" },
            { id: "p2", left: "DIDELIS", right: "MAŽAS" },
            { id: "p3", left: "DIENA", right: "NAKTIS" },
            { id: "p4", left: "LINKSMAS", right: "LIŪDNAS" },
            { id: "p5", left: "ŠVARUS", right: "PURVINAS" },
            { id: "p6", left: "LĖTAS", right: "GREITAS" },
            { id: "p7", left: "AUKŠTAS", right: "ŽEMAS" },
            { id: "p8", left: "ŠVIESUS", right: "TAMSUS" },
            { id: "p9", left: "KIETAS", right: "MINKŠTAS" },
            { id: "p10", left: "SUNKUS", right: "LENGVAS" },
            { id: "p11", left: "ATIDARYTAS", right: "UŽDARYTAS" },
            { id: "p12", left: "PILNAS", right: "TUŠČIAS" },
            { id: "p13", left: "JAUNAS", right: "SENAS" },
            { id: "p14", left: "SALDUS", right: "RŪGŠTUS" },
            { id: "p15", left: "ILGAS", right: "TRUMPAS" },
            { id: "p16", left: "VASARA", right: "ŽIEMA" },
            { id: "p17", left: "AUKŠTYN", right: "ŽEMYN" },
            { id: "p18", left: "TIESUS", right: "KREIVAS" },
            { id: "p19", left: "STORAS", right: "PLONAS" },
            { id: "p20", left: "SAUSAS", right: "ŠLAPIAS" }
        ];

        let state = {
            mode: 'easy',
            questions: [],
            currentIndex: 0,
            totalPossible: 10,
            score: 0,
            streak: 0,
            firstTry: true,
            waiting: false,
            // Mode 3 matching state
            boards: [],
            selectedLeft: null,
            selectedRight: null,
            matchedIds: []
        };

        const appEl = document.getElementById('app');

        function renderStartScreen() {
            appEl.innerHTML = `
                <div class="p-5 sm:p-8 flex flex-col items-center justify-center text-center">
                    <div class="text-5xl sm:text-7xl mb-2 animate-bounce">⚖️</div>
                    <h1 class="text-3xl sm:text-5xl font-black text-blue-800 mb-4 sm:mb-5">${_col('Priešingybės')}</h1>
                    
                    <div class="flex flex-col gap-3 w-full max-w-sm">
                        <button onclick="startGame('easy')" class="btn-3d py-3 sm:py-3.5 px-5 bg-blue-100 hover:bg-blue-200 border-2 border-blue-400 rounded-2xl text-lg sm:text-xl font-black shadow-[0_5px_0_#1d4ed8] active:shadow-[0_0px_0_#1d4ed8] transition-all flex items-center justify-center gap-2.5">
                            <span class="text-2xl">🌟</span>
                            <span>${_col('Lengva')}</span>
                        </button>
                        <button onclick="startGame('hard')" class="btn-3d py-3 sm:py-3.5 px-5 bg-indigo-100 hover:bg-indigo-200 border-2 border-indigo-400 rounded-2xl text-lg sm:text-xl font-black shadow-[0_5px_0_#4338ca] active:shadow-[0_0px_0_#4338ca] transition-all flex items-center justify-center gap-2.5">
                            <span class="text-2xl">🚀</span>
                            <span>${_col('Sunkiau')}</span>
                        </button>
                        <button onclick="startGame('pairs')" class="btn-3d py-3 sm:py-3.5 px-5 bg-violet-100 hover:bg-violet-200 border-2 border-violet-400 rounded-2xl text-lg sm:text-xl font-black shadow-[0_5px_0_#6d28d9] active:shadow-[0_0px_0_#6d28d9] transition-all flex items-center justify-center gap-2.5">
                            <span class="text-2xl">🧩</span>
                            <span>${_col('Poros')}</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function startGame(mode) {
            getAudioCtx();
            state.mode = mode;
            state.score = 0;
            state.streak = 0;
            state.currentIndex = 0;

            if (mode === 'pairs') {
                const shuffledPool = shuffle(PAIR_ANTONYMS);
                state.boards = [];
                for (let b = 0; b < 5; b++) {
                    state.boards.push({
                        pairs: shuffledPool.slice(b * 4, (b + 1) * 4)
                    });
                }
                state.totalPossible = 20;
                preparePairsBoard();
            } else {
                const pool = mode === 'easy' ? EASY_ANTONYMS : HARD_ANTONYMS;
                state.questions = shuffle(pool).slice(0, 10);
                state.totalPossible = 10;
                renderQuestion();
            }
        }

        function preparePairsBoard() {
            if (state.currentIndex >= state.boards.length) {
                renderEndScreen();
                return;
            }
            const board = state.boards[state.currentIndex];
            board.leftItems = shuffle([...board.pairs]);
            board.rightItems = shuffle([...board.pairs]);
            if (board.rightItems.every((it, idx) => it.id === board.leftItems[idx].id)) {
                board.rightItems.push(board.rightItems.shift());
            }
            state.selectedLeft = null;
            state.selectedRight = null;
            state.matchedIds = [];
            state.firstTry = true;
            state.waiting = false;
            renderPairsBoard();
        }

        function renderPairsBoard() {
            const board = state.boards[state.currentIndex];

            const leftHtml = board.leftItems.map(item => {
                const isMatched = state.matchedIds.includes(item.id);
                const isSelected = state.selectedLeft === item.id;
                let cls = "bg-blue-50 hover:bg-blue-100 border-blue-300 shadow-[0_4px_0_#93c5fd]";
                if (isMatched) {
                    cls = "matched-card bg-green-500 text-white border-green-600 shadow-[0_3px_0_#15803d] opacity-90";
                } else if (isSelected) {
                    cls = "selected-card bg-yellow-100 border-blue-500 ring-4 ring-blue-400 shadow-[0_4px_0_#3b82f6] scale-[1.02]";
                }
                return `
                    <button id="left-${item.id}" onclick="selectLeft('${item.id}')" ${isMatched ? 'disabled' : ''}
                        class="btn-3d py-2.5 sm:py-3 px-2.5 border-2 rounded-2xl text-sm sm:text-xl font-black transition-all flex items-center justify-center text-center w-full min-h-[48px] sm:min-h-[58px] ${cls}">
                        <span>${_col(item.left)}</span>
                        ${isMatched ? '<span class="ml-1.5 text-base">✅</span>' : ''}
                    </button>
                `;
            }).join('');

            const rightHtml = board.rightItems.map(item => {
                const isMatched = state.matchedIds.includes(item.id);
                const isSelected = state.selectedRight === item.id;
                let cls = "bg-indigo-50 hover:bg-indigo-100 border-indigo-300 shadow-[0_4px_0_#a5b4fc]";
                if (isMatched) {
                    cls = "matched-card bg-green-500 text-white border-green-600 shadow-[0_3px_0_#15803d] opacity-90";
                } else if (isSelected) {
                    cls = "selected-card bg-yellow-100 border-blue-500 ring-4 ring-blue-400 shadow-[0_4px_0_#3b82f6] scale-[1.02]";
                }
                return `
                    <button id="right-${item.id}" onclick="selectRight('${item.id}')" ${isMatched ? 'disabled' : ''}
                        class="btn-3d py-2.5 sm:py-3 px-2.5 border-2 rounded-2xl text-sm sm:text-xl font-black transition-all flex items-center justify-center text-center w-full min-h-[48px] sm:min-h-[58px] ${cls}">
                        <span>${_col(item.right)}</span>
                        ${isMatched ? '<span class="ml-1.5 text-base">✅</span>' : ''}
                    </button>
                `;
            }).join('');

            appEl.innerHTML = `
                ${renderTopBar({ score: state.score, current: state.currentIndex + 1, total: state.boards.length, streak: state.streak, theme: 'blue' })}

                <div class="p-3 sm:p-5 flex-1 flex flex-col justify-evenly items-center gap-2">
                    <div class="flex flex-col items-center gap-1.5">
                        <h2 class="text-xl sm:text-2xl font-black text-slate-800 text-center">🧩 ${_col('Priešingybės')}</h2>
                        <button id="hint-btn" onclick="showPairHint()" class="hint-btn">
                            <span>💡</span> <span>${_col('Užuomina')}</span>
                        </button>
                    </div>

                    <div class="grid grid-cols-2 gap-2.5 sm:gap-4 w-full">
                        <div class="flex flex-col gap-2 sm:gap-2.5">
                            ${leftHtml}
                        </div>
                        <div class="flex flex-col gap-2 sm:gap-2.5">
                            ${rightHtml}
                        </div>
                    </div>

                    <div id="feedback" class="h-6 sm:h-8 flex items-center justify-center text-sm sm:text-lg font-black opacity-0 transition-opacity">
                        Pranešimas
                    </div>
                </div>
            `;
        }

        function showPairHint() {
            if (state.waiting) return;
            playHintSound();
            const board = state.boards[state.currentIndex];
            const targetId = state.selectedLeft || (board.leftItems.find(it => !state.matchedIds.includes(it.id)) || {}).id;
            if (!targetId) return;
            const leftBtn = document.getElementById(`left-${targetId}`);
            const rightBtn = document.getElementById(`right-${targetId}`);
            if (leftBtn) leftBtn.classList.add('ring-4', 'ring-amber-400', 'bounce-anim');
            if (rightBtn) rightBtn.classList.add('ring-4', 'ring-amber-400', 'bounce-anim');
        }

        function selectLeft(id) {
            if (state.waiting || state.matchedIds.includes(id)) return;
            playSelectSound();
            state.selectedLeft = (state.selectedLeft === id) ? null : id;
            if (state.selectedLeft && state.selectedRight) {
                checkPairMatch();
            } else {
                renderPairsBoard();
            }
        }

        function selectRight(id) {
            if (state.waiting || state.matchedIds.includes(id)) return;
            playSelectSound();
            state.selectedRight = (state.selectedRight === id) ? null : id;
            if (state.selectedLeft && state.selectedRight) {
                checkPairMatch();
            } else {
                renderPairsBoard();
            }
        }

        function checkPairMatch() {
            const leftId = state.selectedLeft;
            const rightId = state.selectedRight;

            if (leftId === rightId) {
                playCorrectSound();
                state.matchedIds.push(leftId);
                if (state.firstTry) {
                    state.score++;
                }
                state.streak++;
                state.firstTry = true;
                state.selectedLeft = null;
                state.selectedRight = null;
                renderPairsBoard();

                const feedback = document.getElementById('feedback');
                if (state.matchedIds.length === 4) {
                    state.waiting = true;
                    feedback.innerHTML = `<span>${_col("Puiku! Visos 4 poros surastos!")} 🎉</span>`;
                    feedback.className = "h-6 sm:h-8 flex items-center justify-center text-sm sm:text-lg font-black mt-1.5 text-green-600 opacity-100";
                    setTimeout(() => {
                        state.currentIndex++;
                        preparePairsBoard();
                    }, 1100);
                } else {
                    feedback.innerHTML = `<span>${_col("Teisinga priešingybė!")} 👍</span>`;
                    feedback.className = "h-6 sm:h-8 flex items-center justify-center text-sm sm:text-lg font-black mt-1.5 text-green-600 opacity-100";
                }
            } else {
                state.waiting = true;
                state.firstTry = false;
                state.streak = 0;
                playWrongSound();
                renderPairsBoard();

                const leftBtn = document.getElementById(`left-${leftId}`);
                const rightBtn = document.getElementById(`right-${rightId}`);
                if (leftBtn) leftBtn.classList.add('shake-anim', 'border-red-400', 'bg-red-50');
                if (rightBtn) rightBtn.classList.add('shake-anim', 'border-red-400', 'bg-red-50');

                const feedback = document.getElementById('feedback');
                if (feedback) {
                    feedback.innerHTML = `<span>${_col("Šie žodžiai nėra priešingybės!")} 🤔</span>`;
                    feedback.className = "h-6 sm:h-8 flex items-center justify-center text-sm sm:text-lg font-black mt-1.5 text-red-500 opacity-100";
                }

                setTimeout(() => {
                    state.selectedLeft = null;
                    state.selectedRight = null;
                    state.waiting = false;
                    renderPairsBoard();
                }, 650);
            }
        }

        function renderQuestion() {
            if (state.currentIndex >= state.questions.length) {
                renderEndScreen();
                return;
            }

            state.firstTry = true;
            state.waiting = false;
            state.hintUsed = false;
            const q = state.questions[state.currentIndex];
            const options = shuffle([q.correct, ...q.wrong]);
            state.currentOptions = options;

            const optionsHtml = options.map((opt, idx) => `
                <button id="btn-${idx}" onclick="handleAnswer('${opt.replace(/'/g, "\\'")}', this)" 
                    class="btn-3d py-3.5 sm:py-4 px-3 bg-blue-50 hover:bg-blue-100 text-blue-950 border-2 border-blue-300 rounded-2xl text-lg sm:text-xl font-black shadow-[0_5px_0_#93c5fd] active:shadow-[0_0px_0_#93c5fd] transition-all flex items-center justify-center text-center min-h-[56px]">
                    <span>${_col(opt)}</span>
                </button>
            `).join('');

            appEl.innerHTML = `
                ${renderTopBar({ score: state.score, current: state.currentIndex + 1, total: 10, streak: state.streak, theme: 'blue' })}

                <div class="p-3 sm:p-5 flex-1 flex flex-col justify-evenly items-center gap-2">
                    <h2 class="text-xl sm:text-2xl font-black text-slate-800 text-center">⚖️ ${_col('Priešingybė?')}</h2>

                    <div class="py-3.5 px-8 flex flex-col items-center justify-center bg-gradient-to-b from-blue-100/70 to-blue-50/70 rounded-3xl border-3 border-blue-200 min-h-[120px] sm:min-h-[140px] shadow-inner gap-1.5">
                        <div class="text-6xl sm:text-8xl">${q.emoji}</div>
                        <div class="text-2xl sm:text-4xl font-black tracking-wide text-blue-900">${_col(q.word)}</div>
                        <button id="hint-btn" onclick="showQuizHint()" class="hint-btn mt-1">
                            <span>💡</span> <span>${_col('Užuomina')}</span>
                        </button>
                    </div>

                    <div id="feedback" class="h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black opacity-0 transition-opacity">
                        Pranešimas
                    </div>

                    <div class="grid grid-cols-2 gap-2.5 sm:gap-3.5 w-full">
                        ${optionsHtml}
                    </div>
                </div>
            `;
        }

        function showQuizHint() {
            if (state.waiting || state.hintUsed) return;
            state.hintUsed = true;
            playHintSound();
            const hintBtn = document.getElementById('hint-btn');
            if (hintBtn) hintBtn.classList.add('hidden');
            const q = state.questions[state.currentIndex];
            const wrongIdxs = [];
            (state.currentOptions || []).forEach((opt, idx) => {
                const btn = document.getElementById(`btn-${idx}`);
                if (opt !== q.correct && btn && !btn.disabled) wrongIdxs.push(idx);
            });
            shuffle(wrongIdxs).slice(0, 2).forEach(idx => {
                const btn = document.getElementById(`btn-${idx}`);
                if (btn) {
                    btn.disabled = true;
                    btn.classList.add('opacity-35', 'line-through', 'pointer-events-none');
                }
            });
        }

        function handleAnswer(selected, btn) {
            if (state.waiting) return;

            const q = state.questions[state.currentIndex];
            const feedback = document.getElementById('feedback');

            if (selected === q.correct) {
                state.waiting = true;
                playCorrectSound();
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }

                btn.classList.remove('bg-blue-50', 'text-blue-950', 'border-blue-300');
                btn.classList.add('bg-green-500', 'text-white', 'border-green-600', 'shadow-[0_5px_0_#15803d]', 'bounce-anim');

                feedback.innerHTML = `<span>${_col('Puiku!')} ${_col(q.word)} ➔ ${_col(q.correct)}! 🎉</span>`;
                feedback.className = "h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 text-green-600 opacity-100";

                setTimeout(() => {
                    state.currentIndex++;
                    renderQuestion();
                }, 1200);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playWrongSound();

                btn.classList.remove('bg-blue-50', 'text-blue-950');
                btn.classList.add('bg-red-100', 'text-red-400', 'line-through', 'border-red-300', 'opacity-60', 'shake-anim');
                btn.disabled = true;

                feedback.innerHTML = `<span>${_col("Bandyk dar kartą!")} 🤔</span>`;
                feedback.className = "h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 text-red-500 opacity-100";

                const hintBtn = document.getElementById('hint-btn');
                if (hintBtn && !state.hintUsed) hintBtn.classList.add('hint-btn-pulse');

                setTimeout(() => {
                    btn.classList.remove('shake-anim');
                }, 400);
            }
        }

        function renderEndScreen() {
            appEl.innerHTML = renderEndScreenHelper({
                score: state.score,
                total: state.totalPossible,
                restartFn: "startGame(state.mode)"
            });
        }

        renderStartScreen();
    </script>
</body>
</html>
