<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>⚖️ Priešingybės</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --sc-0: #dc2626;
            --sc-1: #1d4ed8;
            --sc-2: #15803d;
            --sc-3: #c2410c;
            --sc-4: #7e22ce;
            --sc-5: #be185d;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #eff6ff;
            background-image: radial-gradient(#93c5fd 20%, transparent 20%);
            background-size: 20px 20px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .btn-3d {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-3d:active {
            transform: translateY(4px);
        }

        @keyframes bounce-scale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .bounce-anim {
            animation: bounce-scale 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .shake-anim {
            animation: shake 0.4s ease-in-out;
        }

        .bg-green-500 span {
            color: #ffffff !important;
        }

        /* Tamsioji tema */
        @media (prefers-color-scheme: dark) {
            :root {
                --sc-0: #ff6b6b;
                --sc-1: #38bdf8;
                --sc-2: #4ade80;
                --sc-3: #facc15;
                --sc-4: #c084fc;
                --sc-5: #f472b6;
            }
            body {
                background-color: #0b1120 !important;
                background-image: radial-gradient(#1e293b 20%, transparent 20%) !important;
                color: #f1f5f9 !important;
            }
            #app {
                background-color: #0f172a !important;
                border-color: #334155 !important;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6) !important;
            }
            h2, h1 {
                color: #f8fafc !important;
            }
            .btn-3d {
                background-color: #1e293b !important;
                border-color: #334155 !important;
                color: #f8fafc !important;
                box-shadow: 0 5px 0 #0f172a !important;
            }
            .btn-3d:hover {
                background-color: #273549 !important;
            }
            .btn-3d.selected-card {
                background-color: #1e3a8a !important;
                border-color: #3b82f6 !important;
                box-shadow: 0 0 0 3px #3b82f6 !important;
            }
            .btn-3d.matched-card {
                background-color: #16a34a !important;
                border-color: #15803d !important;
                color: #ffffff !important;
            }
            .bg-blue-100\/60 {
                background-color: rgba(30, 41, 59, 0.7) !important;
                border-color: #334155 !important;
            }
            .text-blue-900 {
                color: #93c5fd !important;
            }
        }
    </style>
    <!-- Apsauga nuo priartinimo gestais (pinch to zoom) -->
    <script>
        document.addEventListener("gesturestart", function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("gesturechange", function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("gestureend", function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("touchstart", function(e) {
            if (e.touches && e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });
        document.addEventListener("touchmove", function(e) {
            if (e.touches && e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });
        document.addEventListener("wheel", function(e) {
            if (e.ctrlKey) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</head>
<body class="h-screen max-h-screen flex items-center justify-center p-2 sm:p-4 overflow-hidden transition-colors duration-200">

    <div id="app" class="w-full max-w-2xl bg-white/95 backdrop-blur-md rounded-3xl shadow-xl flex flex-col relative border-4 border-blue-300 overflow-hidden max-h-full">
        <!-- Turinis bus atvaizduotas dinamiškai per JS -->
    </div>

    <script>
        // Web Audio API
        let audioCtx;
        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playTone(freq, type, duration, startTime=0) {
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);
            gain.gain.setValueAtTime(0.15, ctx.currentTime + startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + startTime);
            osc.stop(ctx.currentTime + startTime + duration);
        }

        function playSelectSound() {
            playTone(520, 'sine', 0.08, 0);
        }

        function playCorrectSound() {
            playTone(440, 'sine', 0.15, 0);
            playTone(554.37, 'sine', 0.15, 0.08);
            playTone(659.25, 'sine', 0.25, 0.16);
        }

        function playWrongSound() {
            playTone(280, 'sawtooth', 0.2, 0);
            playTone(200, 'sawtooth', 0.25, 0.1);
        }

        function playWinSound() {
            [440, 554, 659, 880].forEach((freq, idx) => {
                playTone(freq, 'sine', 0.25, idx * 0.12);
            });
        }

        // === SKIEMENŲ SPALVINIMAS ===
        const _V = 'aeėęiįyouųūąAEĖĘIĮYOUŲŪĄ';
        const _D = ['ai','au','ei','eu','ie','uo','ui','oi','ia','io','iu'];
        const _L = /[a-ząčęėįšųūžA-ZĄČĘĖĮŠŲŪŽ]/;
        const _O = new Set(['bl','br','dr','dv','fl','fr','gl','gr','gn','kl','kr','kn','kv','pl','pr','sk','sl','sm','sn','sp','sr','st','sv','šl','šv','šn','tr','tv','vr','žl','žv','str','skr','spr']);
        const _SC = ['var(--sc-0, #dc2626)','var(--sc-1, #1d4ed8)','var(--sc-2, #15803d)','var(--sc-3, #c2410c)','var(--sc-4, #7e22ce)','var(--sc-5, #be185d)'];

        function _syl(word) {
            if (!word || word.length <= 1) return [word || ''];
            const r = []; let s = '', i = 0, n = word.length;
            while (i < n) {
                const c = word[i];
                if (!_L.test(c)) { s += c; i++; continue; }
                if (!_V.includes(c)) { s += c; i++; }
                else {
                    s += c; i++;
                    if (i < n && _V.includes(word[i]) && _D.includes((c + word[i]).toLowerCase())) { s += word[i]; i++; }
                    let j = i, u = [];
                    while (j < n && !_V.includes(word[j])) {
                        if (!_L.test(word[j])) break;
                        if (j+1 < n) { const p = (word[j]+word[j+1]).toLowerCase(); if (p==='ch'||p==='dz'||p==='dž') { u.push(word[j]+word[j+1]); j+=2; continue; } }
                        u.push(word[j]); j++;
                    }
                    if (j >= n || (j < n && !_V.includes(word[j]) && !_L.test(word[j]))) {
                        s += u.join(''); while (j < n && !_L.test(word[j])) { s += word[j]; j++; } i = j;
                        if (i >= n) { r.push(s); s = ''; }
                    } else if (u.length === 0) { r.push(s); s = ''; }
                    else if (u.length === 1) { r.push(s); s = u[0]; i = j; }
                    else {
                        let sp = u.length - 1;
                        if (u.length >= 3) { const l2 = (u[u.length-2]+u[u.length-1]).toLowerCase(); if (_O.has(l2)) sp = u.length - 2; }
                        if (u.length >= 4) { const l3 = (u[u.length-3]+u[u.length-2]+u[u.length-1]).toLowerCase(); if (_O.has(l3)) sp = u.length - 3; }
                        s += u.slice(0, sp).join(''); r.push(s); s = u.slice(sp).join(''); i = j;
                    }
                }
            }
            if (s) r.push(s);
            return r.filter(x => x.length > 0);
        }

        function _col(text) {
            if (!text) return '';
            return text.split(/(\s+)/).map(token => {
                if (!token.trim() || !/[a-ząčęėįšųūžA-ZĄČĘĖĮŠŲŪŽ]/.test(token)) return token;
                const syls = _syl(token);
                return syls.map((s, i) => '<span style="color:' + _SC[i % _SC.length] + '">' + s + '</span>').join('');
            }).join('');
        }
        // === /SKIEMENŲ SPALVINIMAS ===

        // Priešingybių žodynas
        const EASY_ANTONYMS = [
            { word: "ŠALTAS", emoji: "🧊", correct: "KARŠTAS", wrong: ["MAŽAS", "LIŪDNAS", "NAKTIS"] },
            { word: "DIDELIS", emoji: "🐘", correct: "MAŽAS", wrong: ["KARŠTAS", "GREITAS", "ŠVARUS"] },
            { word: "DIENA", emoji: "☀️", correct: "NAKTIS", wrong: ["KARŠTAS", "LINKSMAS", "AUKŠTAS"] },
            { word: "LINKSMAS", emoji: "😃", correct: "LIŪDNAS", wrong: ["ŠALTAS", "MAŽAS", "NAKTIS"] },
            { word: "ŠVARUS", emoji: "🧼", correct: "PURVINAS", wrong: ["KARŠTAS", "AUKŠTAS", "GREITAS"] },
            { word: "LĖTAS", emoji: "🐢", correct: "GREITAS", wrong: ["MAŽAS", "ŠALTAS", "LIŪDNAS"] },
            { word: "AUKŠTAS", emoji: "🦒", correct: "ŽEMAS", wrong: ["KARŠTAS", "NAKTIS", "ŠVARUS"] },
            { word: "ŠVIESUS", emoji: "💡", correct: "TAMSUS", wrong: ["ŠALTAS", "LĖTAS", "DIDELIS"] },
            { word: "KARŠTAS", emoji: "🔥", correct: "ŠALTAS", wrong: ["ŽEMAS", "LIŪDNAS", "ŠVARUS"] },
            { word: "MAŽAS", emoji: "🐭", correct: "DIDELIS", wrong: ["GREITAS", "KARŠTAS", "NAKTIS"] }
        ];

        const HARD_ANTONYMS = [
            { word: "KIETAS", emoji: "🪨", correct: "MINKŠTAS", wrong: ["LENGVAS", "UŽDARYTAS", "SENAS"] },
            { word: "SUNKUS", emoji: "🏋️", correct: "LENGVAS", wrong: ["MINKŠTAS", "TUŠČIAS", "RŪGŠTUS"] },
            { word: "ATIDARYTAS", emoji: "🚪", correct: "UŽDARYTAS", wrong: ["LENGVAS", "MINKŠTAS", "TRUMPAS"] },
            { word: "PILNAS", emoji: "🥛", correct: "TUŠČIAS", wrong: ["SENAS", "RŪGŠTUS", "TRUMPAS"] },
            { word: "JAUNAS", emoji: "👶", correct: "SENAS", wrong: ["TUŠČIAS", "LENGVAS", "UŽDARYTAS"] },
            { word: "SALDUS", emoji: "🍭", correct: "RŪGŠTUS", wrong: ["TRUMPAS", "MINKŠTAS", "SENAS"] },
            { word: "ILGAS", emoji: "🧵", correct: "TRUMPAS", wrong: ["RŪGŠTUS", "TUŠČIAS", "UŽDARYTAS"] },
            { word: "VASARA", emoji: "🏖️", correct: "ŽIEMA", wrong: ["NAKTIS", "KIETAS", "LENGVAS"] },
            { word: "AUKŠTYN", emoji: "⬆️", correct: "ŽEMYN", wrong: ["KAIRĖN", "DEŠINĖN", "RATU"] },
            { word: "TIESUS", emoji: "🛣️", correct: "KREIVAS", wrong: ["TRUMPAS", "LENGVAS", "MINKŠTAS"] }
        ];

        // 20 unikalių porų 3-iajam režimui (5 lentos po 4 poras)
        const PAIR_ANTONYMS = [
            { id: "p1", left: "ŠALTAS", right: "KARŠTAS" },
            { id: "p2", left: "DIDELIS", right: "MAŽAS" },
            { id: "p3", left: "DIENA", right: "NAKTIS" },
            { id: "p4", left: "LINKSMAS", right: "LIŪDNAS" },
            { id: "p5", left: "ŠVARUS", right: "PURVINAS" },
            { id: "p6", left: "LĖTAS", right: "GREITAS" },
            { id: "p7", left: "AUKŠTAS", right: "ŽEMAS" },
            { id: "p8", left: "ŠVIESUS", right: "TAMSUS" },
            { id: "p9", left: "KIETAS", right: "MINKŠTAS" },
            { id: "p10", left: "SUNKUS", right: "LENGVAS" },
            { id: "p11", left: "ATIDARYTAS", right: "UŽDARYTAS" },
            { id: "p12", left: "PILNAS", right: "TUŠČIAS" },
            { id: "p13", left: "JAUNAS", right: "SENAS" },
            { id: "p14", left: "SALDUS", right: "RŪGŠTUS" },
            { id: "p15", left: "ILGAS", right: "TRUMPAS" },
            { id: "p16", left: "VASARA", right: "ŽIEMA" },
            { id: "p17", left: "AUKŠTYN", right: "ŽEMYN" },
            { id: "p18", left: "TIESUS", right: "KREIVAS" },
            { id: "p19", left: "STORAS", right: "PLONAS" },
            { id: "p20", left: "SAUSAS", right: "ŠLAPIAS" }
        ];

        let state = {
            mode: 'easy',
            questions: [],
            currentIndex: 0,
            totalPossible: 10,
            score: 0,
            streak: 0,
            firstTry: true,
            waiting: false,
            // Mode 3 matching state
            boards: [],
            selectedLeft: null,
            selectedRight: null,
            matchedIds: []
        };

        const appEl = document.getElementById('app');

        function shuffle(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function renderStartScreen() {
            appEl.innerHTML = `
                <div class="p-5 sm:p-8 flex flex-col items-center justify-center text-center">
                    <div class="text-5xl sm:text-7xl mb-2 animate-bounce">⚖️</div>
                    <h1 class="text-3xl sm:text-5xl font-black text-blue-800 mb-1 sm:mb-2">${_col('Priešingybės')}</h1>
                    <p class="text-base sm:text-xl font-bold text-slate-600 mb-5 sm:mb-6">${_col('Surask žodžiui priešingą reikšmę!')}</p>
                    
                    <div class="flex flex-col gap-3 w-full max-w-md">
                        <button onclick="startGame('easy')" class="btn-3d py-3 sm:py-3.5 px-5 bg-blue-100 hover:bg-blue-200 border-2 border-blue-400 rounded-2xl text-lg sm:text-xl font-black shadow-[0_5px_0_#1d4ed8] active:shadow-[0_0px_0_#1d4ed8] transition-all">
                            🌟 ${_col('Lengva (Diena – Naktis)')}
                        </button>
                        <button onclick="startGame('hard')" class="btn-3d py-3 sm:py-3.5 px-5 bg-indigo-100 hover:bg-indigo-200 border-2 border-indigo-400 rounded-2xl text-lg sm:text-xl font-black shadow-[0_5px_0_#4338ca] active:shadow-[0_0px_0_#4338ca] transition-all">
                            🚀 ${_col('Sunkiau (Sunkus – Lengvas)')}
                        </button>
                        <button onclick="startGame('pairs')" class="btn-3d py-3 sm:py-3.5 px-5 bg-violet-100 hover:bg-violet-200 border-2 border-violet-400 rounded-2xl text-lg sm:text-xl font-black shadow-[0_5px_0_#6d28d9] active:shadow-[0_0px_0_#6d28d9] transition-all">
                            🧩 ${_col('Sujunk priešingybių poras!')}
                        </button>
                    </div>
                </div>
            `;
        }

        function startGame(mode) {
            getAudioCtx();
            state.mode = mode;
            state.score = 0;
            state.streak = 0;
            state.currentIndex = 0;

            if (mode === 'pairs') {
                const shuffledPool = shuffle(PAIR_ANTONYMS);
                state.boards = [];
                for (let b = 0; b < 5; b++) {
                    state.boards.push({
                        pairs: shuffledPool.slice(b * 4, (b + 1) * 4)
                    });
                }
                state.totalPossible = 20;
                preparePairsBoard();
            } else {
                const pool = mode === 'easy' ? EASY_ANTONYMS : HARD_ANTONYMS;
                state.questions = shuffle(pool).slice(0, 10);
                state.totalPossible = 10;
                renderQuestion();
            }
        }

        function preparePairsBoard() {
            if (state.currentIndex >= state.boards.length) {
                renderEndScreen();
                return;
            }
            const board = state.boards[state.currentIndex];
            board.leftItems = shuffle([...board.pairs]);
            board.rightItems = shuffle([...board.pairs]);
            if (board.rightItems.every((it, idx) => it.id === board.leftItems[idx].id)) {
                board.rightItems.push(board.rightItems.shift());
            }
            state.selectedLeft = null;
            state.selectedRight = null;
            state.matchedIds = [];
            state.firstTry = true;
            state.waiting = false;
            renderPairsBoard();
        }

        function renderPairsBoard() {
            const board = state.boards[state.currentIndex];

            const leftHtml = board.leftItems.map(item => {
                const isMatched = state.matchedIds.includes(item.id);
                const isSelected = state.selectedLeft === item.id;
                let cls = "bg-blue-50 hover:bg-blue-100 border-blue-300 shadow-[0_4px_0_#93c5fd]";
                if (isMatched) {
                    cls = "matched-card bg-green-500 text-white border-green-600 shadow-[0_3px_0_#15803d] opacity-90";
                } else if (isSelected) {
                    cls = "selected-card bg-yellow-100 border-blue-500 ring-4 ring-blue-400 shadow-[0_4px_0_#3b82f6] scale-[1.02]";
                }
                return `
                    <button id="left-${item.id}" onclick="selectLeft('${item.id}')" ${isMatched ? 'disabled' : ''}
                        class="btn-3d py-2.5 sm:py-3 px-2.5 border-2 rounded-2xl text-sm sm:text-xl font-black transition-all flex items-center justify-center text-center w-full min-h-[48px] sm:min-h-[58px] ${cls}">
                        <span>${_col(item.left)}</span>
                        ${isMatched ? '<span class="ml-1.5 text-base">✅</span>' : ''}
                    </button>
                `;
            }).join('');

            const rightHtml = board.rightItems.map(item => {
                const isMatched = state.matchedIds.includes(item.id);
                const isSelected = state.selectedRight === item.id;
                let cls = "bg-indigo-50 hover:bg-indigo-100 border-indigo-300 shadow-[0_4px_0_#a5b4fc]";
                if (isMatched) {
                    cls = "matched-card bg-green-500 text-white border-green-600 shadow-[0_3px_0_#15803d] opacity-90";
                } else if (isSelected) {
                    cls = "selected-card bg-yellow-100 border-blue-500 ring-4 ring-blue-400 shadow-[0_4px_0_#3b82f6] scale-[1.02]";
                }
                return `
                    <button id="right-${item.id}" onclick="selectRight('${item.id}')" ${isMatched ? 'disabled' : ''}
                        class="btn-3d py-2.5 sm:py-3 px-2.5 border-2 rounded-2xl text-sm sm:text-xl font-black transition-all flex items-center justify-center text-center w-full min-h-[48px] sm:min-h-[58px] ${cls}">
                        <span>${_col(item.right)}</span>
                        ${isMatched ? '<span class="ml-1.5 text-base">✅</span>' : ''}
                    </button>
                `;
            }).join('');

            appEl.innerHTML = `
                <!-- Top Status Bar -->
                <div class="bg-blue-500 text-white px-3 sm:px-4 py-2 sm:py-2.5 flex justify-between items-center font-bold text-xs sm:text-base shadow">
                    <div class="flex items-center gap-2">
                        <button onclick="renderStartScreen()" class="bg-blue-600 hover:bg-blue-700 px-2.5 py-1 rounded-xl text-sm" title="Į pradžią">🏠</button>
                        <span>⭐ Taškai: <span class="text-yellow-200">${state.score}</span></span>
                    </div>
                    <div class="bg-blue-600 px-2.5 py-1 rounded-xl">Lenta: ${state.currentIndex + 1} / ${state.boards.length}</div>
                    <div>🔥 Serija: <span class="text-orange-200">${state.streak}</span></div>
                </div>

                <div class="p-3 sm:p-5 flex-1 flex flex-col justify-between items-center">
                    <h2 class="text-lg sm:text-2xl font-black text-slate-800 text-center">${_col('Sujunk priešingybių poras!')}</h2>
                    <p class="text-xs sm:text-sm font-bold text-slate-500 mb-1.5">${_col('Paspausk žodį kairėje ir jo priešingybę dešinėje!')}</p>

                    <div class="grid grid-cols-2 gap-2.5 sm:gap-4 w-full my-auto">
                        <div class="flex flex-col gap-2 sm:gap-2.5">
                            ${leftHtml}
                        </div>
                        <div class="flex flex-col gap-2 sm:gap-2.5">
                            ${rightHtml}
                        </div>
                    </div>

                    <div id="feedback" class="h-6 sm:h-8 flex items-center justify-center text-sm sm:text-lg font-black mt-1.5 opacity-0 transition-opacity">
                        Pranešimas
                    </div>
                </div>
            `;
        }

        function selectLeft(id) {
            if (state.waiting || state.matchedIds.includes(id)) return;
            playSelectSound();
            state.selectedLeft = (state.selectedLeft === id) ? null : id;
            if (state.selectedLeft && state.selectedRight) {
                checkPairMatch();
            } else {
                renderPairsBoard();
            }
        }

        function selectRight(id) {
            if (state.waiting || state.matchedIds.includes(id)) return;
            playSelectSound();
            state.selectedRight = (state.selectedRight === id) ? null : id;
            if (state.selectedLeft && state.selectedRight) {
                checkPairMatch();
            } else {
                renderPairsBoard();
            }
        }

        function checkPairMatch() {
            const leftId = state.selectedLeft;
            const rightId = state.selectedRight;

            if (leftId === rightId) {
                playCorrectSound();
                state.matchedIds.push(leftId);
                if (state.firstTry) {
                    state.score++;
                }
                state.streak++;
                state.firstTry = true;
                state.selectedLeft = null;
                state.selectedRight = null;
                renderPairsBoard();

                const feedback = document.getElementById('feedback');
                if (state.matchedIds.length === 4) {
                    state.waiting = true;
                    feedback.innerHTML = _col("Puiku! Visos 4 poros surastos!") + " 🎉";
                    feedback.className = "h-6 sm:h-8 flex items-center justify-center text-sm sm:text-lg font-black mt-1.5 text-green-600 opacity-100";
                    setTimeout(() => {
                        state.currentIndex++;
                        preparePairsBoard();
                    }, 1100);
                } else {
                    feedback.innerHTML = _col("Teisinga priešingybė!") + " 👍";
                    feedback.className = "h-6 sm:h-8 flex items-center justify-center text-sm sm:text-lg font-black mt-1.5 text-green-600 opacity-100";
                }
            } else {
                state.waiting = true;
                state.firstTry = false;
                state.streak = 0;
                playWrongSound();
                renderPairsBoard();

                const leftBtn = document.getElementById(`left-${leftId}`);
                const rightBtn = document.getElementById(`right-${rightId}`);
                if (leftBtn) leftBtn.classList.add('shake-anim', 'border-red-400', 'bg-red-50');
                if (rightBtn) rightBtn.classList.add('shake-anim', 'border-red-400', 'bg-red-50');

                const feedback = document.getElementById('feedback');
                if (feedback) {
                    feedback.innerHTML = _col("Šie žodžiai nėra priešingybės!") + " 🤔";
                    feedback.className = "h-6 sm:h-8 flex items-center justify-center text-sm sm:text-lg font-black mt-1.5 text-red-500 opacity-100";
                }

                setTimeout(() => {
                    state.selectedLeft = null;
                    state.selectedRight = null;
                    state.waiting = false;
                    renderPairsBoard();
                }, 650);
            }
        }

        function renderQuestion() {
            if (state.currentIndex >= state.questions.length) {
                renderEndScreen();
                return;
            }

            state.firstTry = true;
            state.waiting = false;
            const q = state.questions[state.currentIndex];
            const options = shuffle([q.correct, ...q.wrong]);

            const optionsHtml = options.map((opt, idx) => `
                <button id="btn-${idx}" onclick="handleAnswer('${opt.replace(/'/g, "\\'")}', this)" 
                    class="btn-3d py-3 sm:py-4 px-3 bg-blue-50 hover:bg-blue-100 text-blue-950 border-2 border-blue-300 rounded-2xl text-base sm:text-xl font-black shadow-[0_5px_0_#93c5fd] active:shadow-[0_0px_0_#93c5fd] transition-all flex items-center justify-center text-center">
                    ${_col(opt)}
                </button>
            `).join('');

            appEl.innerHTML = `
                <!-- Top Status Bar -->
                <div class="bg-blue-500 text-white px-3 sm:px-4 py-2 sm:py-2.5 flex justify-between items-center font-bold text-xs sm:text-base shadow">
                    <div class="flex items-center gap-2">
                        <button onclick="renderStartScreen()" class="bg-blue-600 hover:bg-blue-700 px-2.5 py-1 rounded-xl text-sm" title="Į pradžią">🏠</button>
                        <span>⭐ Taškai: <span class="text-yellow-200">${state.score}</span></span>
                    </div>
                    <div class="bg-blue-600 px-3 py-1 rounded-xl">Klausimas: ${state.currentIndex + 1} / 10</div>
                    <div>🔥 Serija: <span class="text-orange-200">${state.streak}</span></div>
                </div>

                <div class="p-3 sm:p-5 flex-1 flex flex-col justify-between items-center">
                    <h2 class="text-xl sm:text-2xl font-black text-slate-800 text-center mb-1 sm:mb-2">${_col('Kokia žodžio priešingybė?')}</h2>

                    <div class="my-auto py-3 px-8 flex flex-col items-center justify-center bg-gradient-to-b from-blue-100/70 to-blue-50/70 rounded-3xl border-3 border-blue-200 min-h-[120px] sm:min-h-[140px] shadow-inner">
                        <div class="text-6xl sm:text-8xl mb-1">${q.emoji}</div>
                        <div class="text-2xl sm:text-4xl font-black tracking-wide text-blue-900">${_col(q.word)}</div>
                    </div>

                    <div id="feedback" class="h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 opacity-0 transition-opacity">
                        Pranešimas
                    </div>

                    <div class="grid grid-cols-2 gap-2.5 sm:gap-3.5 w-full mt-1">
                        ${optionsHtml}
                    </div>
                </div>
            `;
        }

        function handleAnswer(selected, btn) {
            if (state.waiting) return;

            const q = state.questions[state.currentIndex];
            const feedback = document.getElementById('feedback');

            if (selected === q.correct) {
                state.waiting = true;
                playCorrectSound();
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }

                btn.classList.remove('bg-blue-50', 'text-blue-950', 'border-blue-300');
                btn.classList.add('bg-green-500', 'text-white', 'border-green-600', 'shadow-[0_5px_0_#15803d]', 'bounce-anim');

                feedback.innerHTML = `${_col('Puiku!')} ${_col(q.word)} ➔ ${_col(q.correct)}! 🎉`;
                feedback.className = "h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 text-green-600 opacity-100";

                setTimeout(() => {
                    state.currentIndex++;
                    renderQuestion();
                }, 1200);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playWrongSound();

                btn.classList.remove('bg-blue-50', 'text-blue-950');
                btn.classList.add('bg-red-100', 'text-red-400', 'line-through', 'border-red-300', 'opacity-60', 'shake-anim');
                btn.disabled = true;

                feedback.innerHTML = _col("Bandyk dar kartą!") + " 🤔";
                feedback.className = "h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 text-red-500 opacity-100";

                setTimeout(() => {
                    btn.classList.remove('shake-anim');
                }, 400);
            }
        }

        function renderEndScreen() {
            playWinSound();
            const ratio = state.score / state.totalPossible;
            let stars = "⭐";
            if (ratio >= 0.8) stars = "⭐⭐⭐";
            else if (ratio >= 0.5) stars = "⭐⭐";

            appEl.innerHTML = `
                <div class="p-6 sm:p-8 flex flex-col items-center justify-center text-center">
                    <div class="text-7xl mb-2">🎉</div>
                    <h2 class="text-3xl sm:text-4xl font-black text-green-600 mb-2">${_col('Šaunuolis!')}</h2>
                    <div class="text-5xl mb-4 tracking-wider">${stars}</div>
                    <p class="text-xl font-bold text-slate-700 mb-1">${_col('Surinkai taškų:')}</p>
                    <p class="text-4xl font-black text-blue-600 mb-6">${state.score} / ${state.totalPossible}</p>
                    
                    <div class="flex flex-col sm:flex-row gap-3 w-full max-w-sm">
                        <button onclick="startGame(state.mode)" class="btn-3d flex-1 py-3.5 bg-blue-100 hover:bg-blue-200 border-2 border-blue-400 rounded-2xl text-lg font-black shadow-[0_5px_0_#1d4ed8] active:shadow-[0_0px_0_#1d4ed8] transition-all">
                            🔄 ${_col('Dar kartą')}
                        </button>
                        <button onclick="renderStartScreen()" class="btn-3d flex-1 py-3.5 bg-slate-100 hover:bg-slate-200 border-2 border-slate-300 rounded-2xl text-lg font-black shadow-[0_5px_0_#94a3b8] active:shadow-[0_0px_0_#94a3b8] transition-all">
                            🏠 ${_col('Iš pradžių')}
                        </button>
                    </div>
                </div>
            `;
        }

        renderStartScreen();
    </script>
</body>
</html>
