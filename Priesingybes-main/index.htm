<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>⚖️ Priešingybės</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #eff6ff;
            background-image: radial-gradient(#93c5fd 20%, transparent 20%);
            background-size: 20px 20px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .btn-3d {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-3d:active {
            transform: translateY(4px);
        }

        @keyframes bounce-scale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .bounce-anim {
            animation: bounce-scale 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .shake-anim {
            animation: shake 0.4s ease-in-out;
        }

        /* Tamsioji tema */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0b1120 !important;
                background-image: radial-gradient(#1e293b 20%, transparent 20%) !important;
                color: #f1f5f9 !important;
            }
            #app {
                background-color: #0f172a !important;
                border-color: #334155 !important;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6) !important;
            }
            h2, h1 {
                color: #f8fafc !important;
            }
            .btn-3d {
                background-color: #1e293b !important;
                border-color: #334155 !important;
                color: #f8fafc !important;
                box-shadow: 0 5px 0 #0f172a !important;
            }
            .btn-3d:hover {
                background-color: #273549 !important;
            }
            .bg-blue-100\/60 {
                background-color: rgba(30, 41, 59, 0.7) !important;
                border-color: #334155 !important;
            }
            .text-blue-900 {
                color: #93c5fd !important;
            }
        }
    </style>
    <!-- Apsauga nuo priartinimo gestais (pinch to zoom) -->
    <script>
        document.addEventListener("gesturestart", function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("gesturechange", function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("gestureend", function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("touchstart", function(e) {
            if (e.touches && e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });
        document.addEventListener("touchmove", function(e) {
            if (e.touches && e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });
        document.addEventListener("wheel", function(e) {
            if (e.ctrlKey) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</head>
<body class="h-screen max-h-screen flex items-center justify-center p-2 sm:p-4 overflow-hidden transition-colors duration-200">

    <div id="app" class="w-full max-w-2xl bg-white/95 backdrop-blur-md rounded-3xl shadow-xl flex flex-col relative border-4 border-blue-300 overflow-hidden max-h-full">
        <!-- Turinis bus atvaizduotas dinamiškai per JS -->
    </div>

    <script>
        // Web Audio API
        let audioCtx;
        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playTone(freq, type, duration, startTime=0) {
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);
            gain.gain.setValueAtTime(0.15, ctx.currentTime + startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + startTime);
            osc.stop(ctx.currentTime + startTime + duration);
        }

        function playCorrectSound() {
            playTone(440, 'sine', 0.15, 0);
            playTone(554.37, 'sine', 0.15, 0.08);
            playTone(659.25, 'sine', 0.25, 0.16);
        }

        function playWrongSound() {
            playTone(280, 'sawtooth', 0.2, 0);
            playTone(200, 'sawtooth', 0.25, 0.1);
        }

        function playWinSound() {
            [440, 554, 659, 880].forEach((freq, idx) => {
                playTone(freq, 'sine', 0.25, idx * 0.12);
            });
        }

        // === SKIEMENŲ SPALVINIMAS ===
        const _V = 'aeėęiįyouųūąAEĖĘIĮYOUŲŪĄ';
        const _D = ['ai','au','ei','eu','ie','uo','ui','oi','ia','io','iu'];
        const _L = /[a-ząčęėįšųūžA-ZĄČĘĖĮŠŲŪŽ]/;
        const _O = new Set(['bl','br','dr','dv','fl','fr','gl','gr','gn','kl','kr','kn','kv','pl','pr','sk','sl','sm','sn','sp','sr','st','sv','šl','šv','šn','tr','tv','vr','žl','žv','str','skr','spr']);
        const _SC = ['#dc2626','#2563eb','#16a34a','#ea580c','#9333ea','#db2777'];

        function _syl(word) {
            if (!word || word.length <= 1) return [word || ''];
            const r = []; let s = '', i = 0, n = word.length;
            while (i < n) {
                const c = word[i];
                if (!_L.test(c)) { s += c; i++; continue; }
                if (!_V.includes(c)) { s += c; i++; }
                else {
                    s += c; i++;
                    if (i < n && _V.includes(word[i]) && _D.includes((c + word[i]).toLowerCase())) { s += word[i]; i++; }
                    let j = i, u = [];
                    while (j < n && !_V.includes(word[j])) {
                        if (!_L.test(word[j])) break;
                        if (j+1 < n) { const p = (word[j]+word[j+1]).toLowerCase(); if (p==='ch'||p==='dz'||p==='dž') { u.push(word[j]+word[j+1]); j+=2; continue; } }
                        u.push(word[j]); j++;
                    }
                    if (j >= n || (j < n && !_V.includes(word[j]) && !_L.test(word[j]))) {
                        s += u.join(''); while (j < n && !_L.test(word[j])) { s += word[j]; j++; } i = j;
                        if (i >= n) { r.push(s); s = ''; }
                    } else if (u.length === 0) { r.push(s); s = ''; }
                    else if (u.length === 1) { r.push(s); s = u[0]; i = j; }
                    else {
                        let sp = u.length - 1;
                        if (u.length >= 3) { const l2 = (u[u.length-2]+u[u.length-1]).toLowerCase(); if (_O.has(l2)) sp = u.length - 2; }
                        if (u.length >= 4) { const l3 = (u[u.length-3]+u[u.length-2]+u[u.length-1]).toLowerCase(); if (_O.has(l3)) sp = u.length - 3; }
                        s += u.slice(0, sp).join(''); r.push(s); s = u.slice(sp).join(''); i = j;
                    }
                }
            }
            if (s) r.push(s);
            return r.filter(x => x.length > 0);
        }

        function _col(text) {
            if (!text) return '';
            return text.split(/(\s+)/).map(token => {
                if (!token.trim() || !/[a-ząčęėįšųūžA-ZĄČĘĖĮŠŲŪŽ]/.test(token)) return token;
                const syls = _syl(token);
                return syls.map((s, i) => '<span style="color:' + _SC[i % _SC.length] + '">' + s + '</span>').join('');
            }).join('');
        }
        // === /SKIEMENŲ SPALVINIMAS ===

        // Priešingybių žodynas
        const EASY_ANTONYMS = [
            { word: "ŠALTAS", emoji: "🧊", correct: "KARŠTAS", wrong: ["MAŽAS", "LIŪDNAS", "NAKTIS"] },
            { word: "DIDELIS", emoji: "🐘", correct: "MAŽAS", wrong: ["KARŠTAS", "GREITAS", "ŠVARUS"] },
            { word: "DIENA", emoji: "☀️", correct: "NAKTIS", wrong: ["KARŠTAS", "LINKSMAS", "AUKŠTAS"] },
            { word: "LINKSMAS", emoji: "😃", correct: "LIŪDNAS", wrong: ["ŠALTAS", "MAŽAS", "NAKTIS"] },
            { word: "ŠVARUS", emoji: "🧼", correct: "PURVINAS", wrong: ["KARŠTAS", "AUKŠTAS", "GREITAS"] },
            { word: "LĖTAS", emoji: "🐢", correct: "GREITAS", wrong: ["MAŽAS", "ŠALTAS", "LIŪDNAS"] },
            { word: "AUKŠTAS", emoji: "🦒", correct: "ŽEMAS", wrong: ["KARŠTAS", "NAKTIS", "ŠVARUS"] },
            { word: "ŠVIESUS", emoji: "💡", correct: "TAMSUS", wrong: ["ŠALTAS", "LĖTAS", "DIDELIS"] },
            { word: "KARŠTAS", emoji: "🔥", correct: "ŠALTAS", wrong: ["ŽEMAS", "LIŪDNAS", "ŠVARUS"] },
            { word: "MAŽAS", emoji: "🐭", correct: "DIDELIS", wrong: ["GREITAS", "KARŠTAS", "NAKTIS"] }
        ];

        const HARD_ANTONYMS = [
            { word: "KIETAS", emoji: "🪨", correct: "MINKŠTAS", wrong: ["LENGVAS", "UŽDARYTAS", "SENAS"] },
            { word: "SUNKUS", emoji: "🏋️", correct: "LENGVAS", wrong: ["MINKŠTAS", "TUŠČIAS", "RŪGŠTUS"] },
            { word: "ATIDARYTAS", emoji: "🚪", correct: "UŽDARYTAS", wrong: ["LENGVAS", "MINKŠTAS", "TRUMPAS"] },
            { word: "PILNAS", emoji: "🥛", correct: "TUŠČIAS", wrong: ["SENAS", "RŪGŠTUS", "TRUMPAS"] },
            { word: "JAUNAS", emoji: "👶", correct: "SENAS", wrong: ["TUŠČIAS", "LENGVAS", "UŽDARYTAS"] },
            { word: "SALDUS", emoji: "🍭", correct: "RŪGŠTUS", wrong: ["TRUMPAS", "MINKŠTAS", "SENAS"] },
            { word: "ILGAS", emoji: "🧵", correct: "TRUMPAS", wrong: ["RŪGŠTUS", "TUŠČIAS", "UŽDARYTAS"] },
            { word: "VASARA", emoji: "🏖️", correct: "ŽIEMA", wrong: ["NAKTIS", "KIETAS", "LENGVAS"] },
            { word: "AUKŠTYN", emoji: "⬆️", correct: "ŽEMYN", wrong: ["KAIRĖN", "DEŠINĖN", "RATU"] },
            { word: "TIESUS", emoji: "🛣️", correct: "KREIVAS", wrong: ["TRUMPAS", "LENGVAS", "MINKŠTAS"] }
        ];

        let state = {
            mode: 'easy',
            questions: [],
            currentIndex: 0,
            score: 0,
            streak: 0,
            firstTry: true,
            waiting: false
        };

        const appEl = document.getElementById('app');

        function shuffle(arr) {
            return [...arr].sort(() => Math.random() - 0.5);
        }

        function renderStartScreen() {
            appEl.innerHTML = `
                <div class="p-6 sm:p-8 flex flex-col items-center justify-center text-center">
                    <div class="text-6xl sm:text-7xl mb-2 animate-bounce">⚖️</div>
                    <h1 class="text-3xl sm:text-5xl font-black text-blue-800 mb-2">Priešingybės</h1>
                    <p class="text-lg sm:text-xl font-bold text-slate-600 mb-6 sm:mb-8">Surask žodžiui priešingą reikšmę!</p>
                    
                    <div class="flex flex-col gap-3.5 sm:gap-4 w-full max-w-sm">
                        <button onclick="startGame('easy')" class="btn-3d py-3.5 sm:py-4 px-6 bg-blue-500 hover:bg-blue-600 text-white rounded-2xl text-xl sm:text-2xl font-black shadow-[0_6px_0_#1d4ed8] active:shadow-[0_0px_0_#1d4ed8] transition-all">
                            🧊 Lengva (Diena – Naktis)
                        </button>
                        <button onclick="startGame('hard')" class="btn-3d py-3.5 sm:py-4 px-6 bg-indigo-500 hover:bg-indigo-600 text-white rounded-2xl text-xl sm:text-2xl font-black shadow-[0_6px_0_#4338ca] active:shadow-[0_0px_0_#4338ca] transition-all">
                            🏋️ Sunkiau (Sunkus – Lengvas)
                        </button>
                    </div>
                </div>
            `;
        }

        function startGame(mode) {
            getAudioCtx();
            state.mode = mode;
            state.score = 0;
            state.streak = 0;
            state.currentIndex = 0;
            const pool = mode === 'easy' ? EASY_ANTONYMS : HARD_ANTONYMS;
            state.questions = shuffle(pool).slice(0, 10);
            renderQuestion();
        }

        function renderQuestion() {
            if (state.currentIndex >= state.questions.length) {
                renderEndScreen();
                return;
            }

            state.firstTry = true;
            state.waiting = false;
            const q = state.questions[state.currentIndex];
            const options = shuffle([q.correct, ...q.wrong]);

            const optionsHtml = options.map((opt, idx) => `
                <button id="btn-${idx}" onclick="handleAnswer('${opt.replace(/'/g, "\\'")}', this)" 
                    class="btn-3d py-3 sm:py-4 px-3 bg-blue-50 hover:bg-blue-100 text-blue-950 border-2 border-blue-300 rounded-2xl text-base sm:text-xl font-black shadow-[0_5px_0_#93c5fd] active:shadow-[0_0px_0_#93c5fd] transition-all flex items-center justify-center text-center">
                    ${_col(opt)}
                </button>
            `).join('');

            appEl.innerHTML = `
                <!-- Top Status Bar -->
                <div class="bg-blue-500 text-white px-4 py-2 sm:py-2.5 flex justify-between items-center font-bold text-sm sm:text-base shadow">
                    <div>⭐ Taškai: <span class="text-yellow-200">${state.score}</span></div>
                    <div class="bg-blue-600 px-3 py-1 rounded-xl">Klausimas: ${state.currentIndex + 1} / 10</div>
                    <div>🔥 Serija: <span class="text-orange-200">${state.streak}</span></div>
                </div>

                <div class="p-3 sm:p-5 flex-1 flex flex-col justify-between items-center">
                    <h2 class="text-xl sm:text-2xl font-black text-slate-800 text-center mb-1 sm:mb-2">Kokia žodžio priešingybė?</h2>

                    <div class="my-auto py-3 px-8 flex flex-col items-center justify-center bg-gradient-to-b from-blue-100/70 to-blue-50/70 rounded-3xl border-3 border-blue-200 min-h-[120px] sm:min-h-[140px] shadow-inner">
                        <div class="text-6xl sm:text-8xl mb-1">${q.emoji}</div>
                        <div class="text-2xl sm:text-4xl font-black tracking-wide text-blue-900">${_col(q.word)}</div>
                    </div>

                    <div id="feedback" class="h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 opacity-0 transition-opacity">
                        Pranešimas
                    </div>

                    <div class="grid grid-cols-2 gap-2.5 sm:gap-3.5 w-full mt-1">
                        ${optionsHtml}
                    </div>
                </div>
            `;
        }

        function handleAnswer(selected, btn) {
            if (state.waiting) return;

            const q = state.questions[state.currentIndex];
            const feedback = document.getElementById('feedback');

            if (selected === q.correct) {
                state.waiting = true;
                playCorrectSound();
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }

                btn.classList.remove('bg-blue-50', 'text-blue-950', 'border-blue-300');
                btn.classList.add('bg-green-500', 'text-white', 'border-green-600', 'shadow-[0_5px_0_#15803d]', 'bounce-anim');

                feedback.textContent = `Puiku! ${q.word} ➔ ${q.correct}! 🎉`;
                feedback.className = "h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 text-green-600 opacity-100";

                setTimeout(() => {
                    state.currentIndex++;
                    renderQuestion();
                }, 1200);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playWrongSound();

                btn.classList.remove('bg-blue-50', 'text-blue-950');
                btn.classList.add('bg-red-100', 'text-red-400', 'line-through', 'border-red-300', 'opacity-60', 'shake-anim');
                btn.disabled = true;

                feedback.textContent = "Bandyk dar kartą! 🤔";
                feedback.className = "h-6 sm:h-8 flex items-center justify-center text-base sm:text-xl font-black my-1 text-red-500 opacity-100";

                setTimeout(() => {
                    btn.classList.remove('shake-anim');
                }, 400);
            }
        }

        function renderEndScreen() {
            playWinSound();
            let stars = "⭐";
            if (state.score >= 8) stars = "⭐⭐⭐";
            else if (state.score >= 5) stars = "⭐⭐";

            appEl.innerHTML = `
                <div class="p-6 sm:p-8 flex flex-col items-center justify-center text-center">
                    <div class="text-7xl mb-2">🎉</div>
                    <h2 class="text-3xl sm:text-4xl font-black text-green-600 mb-2">Šaunuolis!</h2>
                    <div class="text-5xl mb-4 tracking-wider">${stars}</div>
                    <p class="text-xl font-bold text-slate-700 mb-1">Surinkai taškų:</p>
                    <p class="text-4xl font-black text-blue-600 mb-6">${state.score} / 10</p>
                    
                    <div class="flex flex-col sm:flex-row gap-3 w-full max-w-sm">
                        <button onclick="startGame(state.mode)" class="btn-3d flex-1 py-3.5 bg-blue-500 hover:bg-blue-600 text-white rounded-2xl text-lg font-black shadow-[0_5px_0_#1d4ed8] active:shadow-[0_0px_0_#1d4ed8] transition-all">
                            Dar kartą
                        </button>
                        <button onclick="renderStartScreen()" class="btn-3d flex-1 py-3.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-2xl text-lg font-black shadow-[0_5px_0_#94a3b8] active:shadow-[0_0px_0_#94a3b8] transition-all">
                            Iš pradžių
                        </button>
                    </div>
                </div>
            `;
        }

        renderStartScreen();
    </script>
</body>
</html>
