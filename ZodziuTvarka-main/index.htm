<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📐 Žodžių Tvarka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #ffecd2;
            background-image: radial-gradient(#ffb347 10%, transparent 11%), radial-gradient(#ffb347 10%, transparent 11%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .shake { animation: shake 0.5s ease-in-out; }

        @keyframes bounce-scale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .correct-anim { animation: bounce-scale 0.5s ease-in-out; }

        /* Buttons */
        .btn-3d {
            transition: all 0.1s ease;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
        }
        .btn-3d:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 rgba(0,0,0,0.2);
        }

        .word-btn {
            display: inline-block;
            background-color: white;
            color: #333;
            font-weight: 800;
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 1.25rem;
            box-shadow: 0 5px 0 #d1d5db;
            cursor: pointer;
            transition: all 0.1s;
            margin: 4px;
        }
        @media (min-width: 640px) {
            .word-btn {
                padding: 10px 20px;
                font-size: 1.45rem;
                margin: 5px;
            }
        }
        .word-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #d1d5db;
        }
        
        .slot {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-width: 90px;
            height: 48px;
            border: 3px dashed #f59e0b;
            border-radius: 9999px;
            margin: 3px;
            background: rgba(255, 255, 255, 0.5);
            transition: all 0.3s;
        }
        @media (min-width: 640px) {
            .slot {
                min-width: 115px;
                height: 56px;
                margin: 5px;
            }
        }
        
        .slot.filled {
            border-style: solid;
            background: transparent;
        }
        
        .slot-correct {
            border-color: #10b981 !important;
            background: #d1fae5 !important;
            color: #047857;
            box-shadow: 0 6px 0 #34d399;
        }

        .slot-wrong {
            border-color: #ef4444 !important;
            background: #fee2e2 !important;
            color: #b91c1c;
            box-shadow: 0 6px 0 #fca5a5;
        }
        
        .hidden-word {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.5);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-4 overflow-y-auto">

    <!-- Start Screen -->
    <div id="start-screen" class="bg-white rounded-3xl p-6 sm:p-8 max-w-lg w-full text-center shadow-2xl border-4 border-yellow-400">
        <h1 class="text-4xl sm:text-5xl font-black text-orange-500 mb-3 sm:mb-4 drop-shadow-sm">📐 Žodžių Tvarka</h1>
        <p class="text-xl sm:text-2xl text-gray-700 mb-6 sm:mb-8 font-bold">Sudėliok sakinį teisingai!</p>
        <button onclick="startGame()" class="btn-3d bg-green-500 text-white text-2xl sm:text-4xl font-black py-3.5 sm:py-4 px-8 sm:px-12 rounded-full w-full uppercase tracking-wider">
            Pradėti
        </button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden bg-white/95 backdrop-blur rounded-3xl p-4 sm:p-6 max-w-2xl w-full text-center shadow-2xl border-4 border-blue-400 flex flex-col my-auto">
        
        <div class="flex justify-between items-center mb-3 sm:mb-4 text-base sm:text-xl font-bold text-gray-600">
            <div class="bg-yellow-100 px-3 sm:px-4 py-1.5 sm:py-2 rounded-full border-2 border-yellow-300">🌟 Taškai: <span id="score-display" class="text-orange-500">0</span></div>
            <div class="bg-blue-100 px-3 sm:px-4 py-1.5 sm:py-2 rounded-full border-2 border-blue-300">📝 <span id="question-counter">1</span> / 10</div>
        </div>
        
        <div class="text-5xl sm:text-7xl mb-2 mt-1 drop-shadow-md" id="emoji-hint">🐱</div>
        
        <div id="message" class="text-xl sm:text-2xl font-bold h-7 sm:h-8 mb-2 text-blue-500 transition-all flex items-center justify-center"></div>

        <!-- Slots -->
        <div id="slots-container" class="flex flex-wrap justify-center mb-3 sm:mb-4 min-h-[50px] sm:min-h-[65px]">
            <!-- Slots injected by JS -->
        </div>

        <!-- Word Pool -->
        <div class="mt-auto">
            <div class="h-2 bg-gray-200 rounded-full mb-3 sm:mb-4 relative overflow-hidden">
                <div id="progress-bar" class="absolute left-0 top-0 h-full bg-blue-500 transition-all" style="width: 10%;"></div>
            </div>
            
            <div id="pool-container" class="flex flex-wrap justify-center min-h-[80px] sm:min-h-[110px]">
                <!-- Words injected by JS -->
            </div>
            
            <button id="next-btn" onclick="nextQuestion()" class="hidden btn-3d bg-blue-500 hover:bg-blue-600 text-white text-2xl sm:text-3xl font-black py-3 sm:py-4 px-8 rounded-full w-full mt-3 sm:mt-5 uppercase tracking-wider">
                Toliau ➔
            </button>
        </div>
    </div>

    <!-- End Screen -->
    <div id="end-screen" class="hidden bg-white rounded-3xl p-8 max-w-lg w-full text-center shadow-2xl border-4 border-purple-400">
        <h2 class="text-5xl font-black text-purple-600 mb-6">Pabaiga!</h2>
        
        <div id="stars-display" class="text-7xl mb-6 drop-shadow-md">
            ⭐⭐⭐
        </div>
        
        <p class="text-3xl text-gray-700 mb-8 font-bold">Tavo rezultatas:<br><span class="text-6xl text-orange-500" id="final-score">10</span> / 10</p>
        
        <button onclick="init()" class="btn-3d bg-green-500 hover:bg-green-600 text-white text-3xl font-black py-4 px-10 rounded-full w-full uppercase tracking-wider">
            Žaisti dar kartą 🔄
        </button>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, vol=0.1) {
            try {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) { console.warn('Audio play failed', e); }
        }

        function playTapSound() { playTone(400, 'sine', 0.1, 0.05); }
        function playReturnSound() { playTone(300, 'sine', 0.1, 0.05); }
        function playCorrectSound() {
            playTone(523.25, 'sine', 0.1, 0.1); // C5
            setTimeout(() => playTone(659.25, 'sine', 0.1, 0.1), 100); // E5
            setTimeout(() => playTone(783.99, 'sine', 0.2, 0.1), 200); // G5
        }
        function playWrongSound() {
            playTone(300, 'square', 0.15, 0.1);
            setTimeout(() => playTone(250, 'square', 0.3, 0.1), 150);
        }
        function playWinSound() {
            playTone(440, 'sine', 0.1, 0.1);
            setTimeout(() => playTone(554.37, 'sine', 0.1, 0.1), 100);
            setTimeout(() => playTone(659.25, 'sine', 0.1, 0.1), 200);
            setTimeout(() => playTone(880, 'sine', 0.3, 0.1), 300);
        }

        const sentencesData = [
            { text: "Katė geria pieną.", emoji: "🐱" },
            { text: "Šuo laksto kieme.", emoji: "🐶" },
            { text: "Mama kepa tortą.", emoji: "🎂" },
            { text: "Tėtis skaito knygą.", emoji: "📖" },
            { text: "Vaikas valgo obuolį.", emoji: "🍎" },
            { text: "Saulė šviečia danguje.", emoji: "☀️" },
            { text: "Paukštis gieda medyje.", emoji: "🐦" },
            { text: "Varlė šokinėja tvenkinyje.", emoji: "🐸" },
            { text: "Mergaitė piešia gėlę.", emoji: "🌸" },
            { text: "Berniukas žaidžia futbolą.", emoji: "⚽" },
            { text: "Lietus lyja lauke.", emoji: "🌧️" },
            { text: "Sniegas krenta iš dangaus.", emoji: "❄️" },
            { text: "Drugelis skraido sode.", emoji: "🦋" },
            { text: "Pelė graužia sūrį.", emoji: "🐭" },
            { text: "Žuvis plaukia upėje.", emoji: "🐟" },
            { text: "Bitė renka medų.", emoji: "🐝" },
            { text: "Kiškis bėga miške.", emoji: "🐰" },
            { text: "Vilkas staugia naktį.", emoji: "🐺" },
            { text: "Lapė slepiasi krūmuose.", emoji: "🦊" },
            { text: "Paukštis stato lizdą.", emoji: "🪹" }
        ];

        let currentRound = 0;
        const totalRounds = 10;
        let score = 0;
        let firstTry = true;
        let gameDeck = [];
        
        let currentWords = []; 
        let currentSlots = []; 
        let lockGame = false;

        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const endScreen = document.getElementById('end-screen');
        const scoreDisplay = document.getElementById('score-display');
        const questionCounter = document.getElementById('question-counter');
        const emojiHint = document.getElementById('emoji-hint');
        const slotsContainer = document.getElementById('slots-container');
        const poolContainer = document.getElementById('pool-container');
        const messageEl = document.getElementById('message');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function init() {
            gameDeck = shuffle([...sentencesData]).slice(0, totalRounds);
            currentRound = 0;
            score = 0;
            updateStats();
            
            startScreen.classList.remove('hidden');
            gameScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
        }

        function startGame() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            startScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            lockGame = false;
            firstTry = true;
            nextBtn.classList.add('hidden');
            messageEl.textContent = "Pasirinkite žodžius iš eilės";
            messageEl.className = "text-xl font-bold h-10 mb-4 text-gray-400 transition-all flex items-center justify-center";
            slotsContainer.classList.remove('shake', 'correct-anim');
            poolContainer.classList.remove('hidden');
            
            const item = gameDeck[currentRound];
            emojiHint.textContent = item.emoji;
            updateStats();

            currentWords = item.text.split(' ').map(w => w.trim()).filter(w => w.length > 0);
            currentSlots = new Array(currentWords.length).fill(null);
            
            slotsContainer.innerHTML = '';
            for(let i=0; i<currentWords.length; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.dataset.index = i;
                slot.onclick = () => returnWord(i);
                slotsContainer.appendChild(slot);
            }

            let scrambled = shuffle(currentWords.map((word, originalIndex) => ({word, originalIndex})));
            poolContainer.innerHTML = '';
            scrambled.forEach((obj, i) => {
                const btn = document.createElement('div');
                btn.className = 'word-btn';
                btn.textContent = obj.word;
                btn.dataset.originalIndex = obj.originalIndex;
                btn.onclick = () => pickWord(btn, obj.word, obj.originalIndex);
                poolContainer.appendChild(btn);
            });
        }

        function pickWord(btnElement, word, originalIndex) {
            if (lockGame || btnElement.classList.contains('hidden-word')) return;
            
            const emptyIndex = currentSlots.findIndex(s => s === null);
            if (emptyIndex === -1) return; // all full

            playTapSound();
            
            currentSlots[emptyIndex] = { word, originalIndex, el: btnElement };
            btnElement.classList.add('hidden-word');
            
            renderSlots();
            checkCompletion();
        }

        function returnWord(slotIndex) {
            if (lockGame) return;
            
            const item = currentSlots[slotIndex];
            if (!item) return;

            playReturnSound();
            
            item.el.classList.remove('hidden-word');
            currentSlots[slotIndex] = null;
            
            messageEl.textContent = "Taisykite sakinį";
            messageEl.className = "text-xl font-bold h-10 mb-4 text-orange-500 transition-all flex items-center justify-center";
            
            Array.from(slotsContainer.children).forEach(c => {
                c.classList.remove('slot-wrong', 'slot-correct');
            });
            
            renderSlots();
        }

        function renderSlots() {
            const children = slotsContainer.children;
            for(let i=0; i<children.length; i++) {
                const item = currentSlots[i];
                if (item) {
                    children[i].textContent = item.word;
                    children[i].className = 'word-btn filled';
                    children[i].style.margin = "5px";
                } else {
                    children[i].textContent = '';
                    children[i].className = 'slot';
                    children[i].style.margin = "5px";
                }
            }
        }

        function checkCompletion() {
            if (currentSlots.includes(null)) return; // not full

            let correct = true;
            for(let i=0; i<currentWords.length; i++) {
                if (currentSlots[i].originalIndex !== i) {
                    correct = false;
                    break;
                }
            }

            const children = slotsContainer.children;
            if (correct) {
                lockGame = true;
                playCorrectSound();
                messageEl.textContent = "Teisingai! 🎉";
                messageEl.className = "text-3xl font-black h-10 mb-4 text-green-500 transition-all flex items-center justify-center";
                
                for(let i=0; i<children.length; i++) {
                    children[i].classList.add('slot-correct', 'correct-anim');
                }
                
                poolContainer.classList.add('hidden');
                nextBtn.classList.remove('hidden');
                
                if (firstTry) {
                    score++;
                    updateStats();
                }
            } else {
                playWrongSound();
                firstTry = false;
                messageEl.textContent = "Bandyk dar kartą! 🤔";
                messageEl.className = "text-2xl font-bold h-10 mb-4 text-red-500 transition-all flex items-center justify-center";
                
                slotsContainer.classList.remove('shake');
                void slotsContainer.offsetWidth; // trigger reflow
                slotsContainer.classList.add('shake');
                
                for(let i=0; i<children.length; i++) {
                    children[i].classList.add('slot-wrong');
                }
            }
        }

        function nextQuestion() {
            currentRound++;
            if (currentRound < totalRounds) {
                loadQuestion();
            } else {
                endGame();
            }
        }

        function endGame() {
            playWinSound();
            gameScreen.classList.add('hidden');
            endScreen.classList.remove('hidden');
            
            document.getElementById('final-score').textContent = score;
            
            let stars = "⭐";
            if (score >= 8) stars = "⭐⭐⭐";
            else if (score >= 5) stars = "⭐⭐";
            
            document.getElementById('stars-display').textContent = stars;
        }

        function updateStats() {
            scoreDisplay.textContent = score;
            questionCounter.textContent = Math.min(currentRound + 1, totalRounds);
            progressBar.style.width = `${(Math.min(currentRound + 1, totalRounds) / totalRounds) * 100}%`;
        }

        init();
    </script>
</body>
</html>
