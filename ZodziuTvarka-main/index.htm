<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>📐 Žodžių Tvarka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/common.css?v=2">
    <script src="../shared/common.js?v=2"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #ffecd2;
            background-image: radial-gradient(#ffb347 15%, transparent 16%);
            background-size: 28px 28px;
            -webkit-tap-highlight-color: transparent;
        }

        .correct-anim { animation: bounce-scale 0.45s ease-in-out; }

        .btn-3d {
            transition: all 0.1s ease;
            box-shadow: 0 5px 0 rgba(0,0,0,0.2);
        }
        .btn-3d:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0 rgba(0,0,0,0.2);
        }

        .word-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            color: #1e293b;
            font-weight: 800;
            padding: 10px 18px;
            border-radius: 9999px;
            font-size: 1.25rem;
            min-height: 48px;
            box-shadow: 0 4px 0 #cbd5e1;
            border: 2px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.12s;
            margin: 2px;
        }
        @media (min-width: 640px) {
            .word-btn {
                padding: 12px 22px;
                font-size: 1.45rem;
                margin: 4px;
            }
        }
        .word-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #cbd5e1;
        }
        
        .slot {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-width: 92px;
            height: 48px;
            border: 3px dashed #f59e0b;
            border-radius: 9999px;
            margin: 2px;
            background: rgba(255, 255, 255, 0.75);
            transition: all 0.25s;
        }
        @media (min-width: 640px) {
            .slot {
                min-width: 112px;
                height: 54px;
                margin: 4px;
            }
        }
        
        .slot-correct {
            border-color: #10b981 !important;
            background: #d1fae5 !important;
            box-shadow: 0 4px 0 #34d399 !important;
        }

        .slot-wrong {
            border-color: #ef4444 !important;
            background: #fee2e2 !important;
            box-shadow: 0 4px 0 #fca5a5 !important;
        }
        
        .hidden-word {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.5);
        }

        /* Tamsioji tema */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0b1120 !important;
                background-image: radial-gradient(#1e293b 2px, transparent 2px) !important;
                color: #f1f5f9 !important;
            }
            #app {
                background-color: #0f172a !important;
                border-color: #334155 !important;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6) !important;
                color: #f8fafc !important;
            }
            .btn-3d {
                background-color: #1e293b !important;
                color: #f8fafc !important;
            }
            .btn-3d:hover {
                background-color: #334155 !important;
            }
            #fill-blank {
                background-color: #0f172a !important;
            }
            .word-btn {
                background-color: #1e293b !important;
                color: #f8fafc !important;
                box-shadow: 0 4px 0 #020617 !important;
                border-color: #334155 !important;
            }
            .slot {
                background: rgba(30, 41, 59, 0.6) !important;
                border-color: #f59e0b !important;
            }
            .slot-correct {
                border-color: #10b981 !important;
                background: rgba(6, 78, 59, 0.5) !important;
            }
            .sentence-card {
                background-color: #1e293b !important;
                border-color: #334155 !important;
            }
            .text-main-title {
                color: #f8fafc !important;
            }
            .text-sub-title {
                color: #94a3b8 !important;
            }
        }
    </style>
</head>
<body class="h-screen max-h-screen flex items-center justify-center p-2 sm:p-4 overflow-hidden transition-colors duration-200">

    <div id="app" class="bg-white/95 backdrop-blur rounded-3xl max-w-2xl w-full text-center shadow-2xl border-4 border-orange-400 flex flex-col overflow-hidden max-h-full">
    </div>

    <script>
        const SHORT_SENTENCES = [
            { text: "Katė geria pieną.", emoji: "🐱" },
            { text: "Šuo laksto kieme.", emoji: "🐶" },
            { text: "Mama kepa tortą.", emoji: "🎂" },
            { text: "Tėtis skaito knygą.", emoji: "📖" },
            { text: "Vaikas valgo obuolį.", emoji: "🍎" },
            { text: "Saulė šviečia danguje.", emoji: "☀️" },
            { text: "Paukštis gieda medyje.", emoji: "🐦" },
            { text: "Varlė šokinėja tvenkinyje.", emoji: "🐸" },
            { text: "Mergaitė piešia gėlę.", emoji: "🌸" },
            { text: "Berniukas žaidžia futbolą.", emoji: "⚽" },
            { text: "Lietus lyja lauke.", emoji: "🌧️" },
            { text: "Drugelis skraido sode.", emoji: "🦋" },
            { text: "Pelė graužia sūrį.", emoji: "🐭" },
            { text: "Žuvis plaukia upėje.", emoji: "🐟" },
            { text: "Bitė renka medų.", emoji: "🐝" },
            { text: "Kiškis bėga miške.", emoji: "🐰" }
        ];

        const LONG_SENTENCES = [
            { text: "Baltas sniegas krenta iš dangaus.", emoji: "❄️" },
            { text: "Maža mergaitė skaito įdomią knygą.", emoji: "📚" },
            { text: "Rudens vėjas pučia geltonus lapus.", emoji: "🍁" },
            { text: "Vikri voveraitė renka skanius riešutus.", emoji: "🐿️" },
            { text: "Močiutė sode pasodino gražias gėles.", emoji: "🌷" },
            { text: "Linksmas šuniukas bėgioja žaliame kieme.", emoji: "🐕" },
            { text: "Ryte vaikai skuba į mokyklą.", emoji: "🎒" },
            { text: "Žalia varlytė tupi ant lapo.", emoji: "🐸" },
            { text: "Didelis lėktuvas skrenda virš debesų.", emoji: "✈️" },
            { text: "Darbšti bitutė neša saldų medų.", emoji: "🍯" }
        ];

        const FILL_WORD_TASKS = [
            { before: "Katė dubenėlyje laka baltą", after: ".", correct: "pieną", options: ["pieną", "akmenį", "debesį", "pieštuką"], emoji: "🐱" },
            { before: "Danguje ryškiai šviečia geltona", after: ".", correct: "saulė", options: ["saulė", "kėdė", "pagalvė", "šakutė"], emoji: "☀️" },
            { before: "Darbšti bitutė iš gėlių renka", after: ".", correct: "medų", options: ["medų", "sniegą", "popierių", "smėlį"], emoji: "🐝" },
            { before: "Žiemą iš debesų krenta baltas", after: ".", correct: "sniegas", options: ["sniegas", "uodai", "braškės", "lapai"], emoji: "❄️" },
            { before: "Kiškutis darže graužia traškią", after: ".", correct: "morką", options: ["morką", "knygą", "lempą", "kepurę"], emoji: "🐰" },
            { before: "Mokinys ant nugaros neša", after: ".", correct: "kuprinę", options: ["kuprinę", "lovą", "šaldytuvą", "kėdę"], emoji: "🎒" },
            { before: "Upėje greitai plaukia maža", after: ".", correct: "žuvelė", options: ["žuvelė", "pelėda", "voverė", "karvė"], emoji: "🐟" },
            { before: "Mama virtuvėje kepa saldų", after: ".", correct: "tortą", options: ["tortą", "kamuolį", "dviratį", "batą"], emoji: "🎂" },
            { before: "Voveraitė medyje gliaudo kietą", after: ".", correct: "riešutą", options: ["riešutą", "muilą", "laikrodį", "stiklą"], emoji: "🐿️" },
            { before: "Naktį danguje žiba ryškios", after: ".", correct: "žvaigždės", options: ["žvaigždės", "morkos", "pirštinės", "durys"], emoji: "⭐" }
        ];

        const state = {
            mode: 'short', // 'short' | 'long' | 'fill'
            deck: [],
            missedQuestions: [],
            round: 0,
            totalRounds: 10,
            score: 0,
            streak: 0,
            firstTry: true,
            currentWords: [],
            currentSlots: [],
            poolButtons: [],
            hintUsed: false,
            lockGame: false
        };

        const app = document.getElementById('app');

        function renderStartScreen() {
            app.innerHTML = `
                <div class="flex-1 p-6 sm:p-8 flex flex-col items-center justify-center text-center">
                    <div class="text-5xl sm:text-6xl mb-2">📐</div>
                    <h1 class="text-main-title text-3xl sm:text-5xl font-black text-orange-600 mb-4">${_col('Žodžių Tvarka')}</h1>
                    
                    <div class="flex flex-col gap-3 w-full max-w-sm">
                        <button onclick="startGame('short')" class="btn-3d py-3.5 sm:py-4 px-5 rounded-2xl bg-orange-100 hover:bg-orange-200 text-slate-800 border-2 border-orange-400 font-black text-lg sm:text-2xl flex items-center justify-center gap-2">
                            <span>📝</span>
                            <span>${_col('Trumpi')}</span>
                        </button>
                        <button onclick="startGame('long')" class="btn-3d py-3.5 sm:py-4 px-5 rounded-2xl bg-amber-100 hover:bg-amber-200 text-slate-800 border-2 border-amber-400 font-black text-lg sm:text-2xl flex items-center justify-center gap-2">
                            <span>📖</span>
                            <span>${_col('Ilgi')}</span>
                        </button>
                        <button onclick="startGame('fill')" class="btn-3d py-3.5 sm:py-4 px-5 rounded-2xl bg-emerald-100 hover:bg-emerald-200 text-slate-800 border-2 border-emerald-400 font-black text-lg sm:text-2xl flex items-center justify-center gap-2">
                            <span>✏️</span>
                            <span>${_col('Užpildyk')}</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function startGame(mode) {
            playTapSound();
            state.mode = mode;
            state.round = 0;
            state.score = 0;
            state.streak = 0;
            state.missedQuestions = [];
            const pool = mode === 'short' ? SHORT_SENTENCES : mode === 'long' ? LONG_SENTENCES : FILL_WORD_TASKS;
            state.deck = shuffle(pool).slice(0, state.totalRounds);
            loadQuestion();
        }

        function retryMistakes() {
            if (!state.missedQuestions || state.missedQuestions.length === 0) {
                startGame(state.mode);
                return;
            }
            playTapSound();
            state.deck = shuffle(state.missedQuestions);
            state.missedQuestions = [];
            state.round = 0;
            state.score = 0;
            state.streak = 0;
            loadQuestion();
        }

        function renderGameTopBar() {
            return window.renderTopBar({
                score: state.score,
                current: state.round + 1,
                total: state.deck.length,
                streak: state.streak,
                theme: 'orange'
            });
        }

        function loadQuestion() {
            if (state.round >= state.deck.length) {
                renderEndScreen();
                return;
            }
            state.lockGame = false;
            state.firstTry = true;
            state.hintUsed = false;

            if (state.mode === 'fill') {
                renderFillQuestion();
            } else {
                renderOrderQuestion();
            }
        }

        function renderOrderQuestion() {
            const item = state.deck[state.round];
            state.currentWords = item.text.split(' ').map(w => w.trim()).filter(w => w.length > 0);
            state.currentSlots = new Array(state.currentWords.length).fill(null);
            state.poolButtons = [];

            const scrambled = shuffle(state.currentWords.map((word, originalIndex) => ({ word, originalIndex })));

            app.innerHTML = `
                ${renderGameTopBar()}
                <div class="p-3 sm:p-5 flex-1 flex flex-col justify-evenly gap-2 overflow-hidden">
                    <div class="flex flex-col items-center gap-1.5">
                        <div class="flex items-center gap-2">
                            <div class="text-5xl sm:text-6xl drop-shadow-md">${item.emoji}</div>
                            ${renderSpeakBtn(item.text)}
                        </div>
                        <div id="hint-area">
                            <button id="hint-btn" onclick="showOrderHint()" class="hint-btn">
                                <span>💡</span>
                                <span>${_col('Užuomina')}</span>
                            </button>
                        </div>
                    </div>

                    <div id="slots-container" class="sentence-card bg-amber-50/90 border-2 border-amber-300 rounded-3xl p-3.5 sm:p-5 flex flex-wrap justify-center content-center items-center gap-1.5 sm:gap-2.5 min-h-[82px] sm:min-h-[100px] shadow-inner"></div>

                    <div id="message" class="text-base sm:text-xl font-black min-h-[1.75rem] text-slate-500 text-sub-title flex items-center justify-center"></div>

                    <div id="pool-container" class="flex flex-wrap justify-center content-center items-center gap-1.5 sm:gap-2.5 py-2 min-h-[70px]"></div>
                </div>
            `;

            const slotsContainer = document.getElementById('slots-container');
            const poolContainer = document.getElementById('pool-container');

            for (let i = 0; i < state.currentWords.length; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.onclick = () => returnWord(i);
                slotsContainer.appendChild(slot);
            }

            scrambled.forEach(obj => {
                const btn = document.createElement('div');
                btn.className = 'word-btn';
                btn.innerHTML = _col(obj.word);
                btn.onclick = () => pickWord(btn, obj.word, obj.originalIndex);
                poolContainer.appendChild(btn);
                state.poolButtons.push({ btn, word: obj.word, originalIndex: obj.originalIndex });
            });
        }

        function showOrderHint() {
            if (state.lockGame || state.hintUsed) return;
            state.hintUsed = true;
            playHintSound();

            // Pirmiausia grąžiname neteisingose vietose esančius žodžius
            for (let i = 0; i < state.currentSlots.length; i++) {
                const placed = state.currentSlots[i];
                if (placed && placed.word !== state.currentWords[i]) {
                    placed.el.classList.remove('hidden-word');
                    state.currentSlots[i] = null;
                }
            }

            // Randame pirmą tuščią vietą ir įdedame teisingą žodį (jei liko bent 2 tuščios vietos)
            const emptyIndices = [];
            for (let i = 0; i < state.currentSlots.length; i++) {
                if (state.currentSlots[i] === null) emptyIndices.push(i);
            }

            if (emptyIndices.length >= 2) {
                const targetIdx = emptyIndices[0];
                const expectedWord = state.currentWords[targetIdx];
                const candidate = state.poolButtons.find(
                    p => !p.btn.classList.contains('hidden-word') && p.word === expectedWord
                );
                if (candidate) {
                    state.currentSlots[targetIdx] = {
                        word: candidate.word,
                        originalIndex: candidate.originalIndex,
                        el: candidate.btn
                    };
                    candidate.btn.classList.add('hidden-word');
                }
            }

            renderSlots();
            const hintArea = document.getElementById('hint-area');
            if (hintArea) {
                hintArea.innerHTML = `
                    <div class="hint-box inline-flex items-center gap-1.5 text-xs sm:text-sm">
                        <span>💡</span>
                        <span>${_col('Didžioji raidė — pradžioje, taškas (.) — gale!')}</span>
                    </div>
                `;
            }
        }

        function pickWord(btnElement, word, originalIndex) {
            if (state.lockGame || btnElement.classList.contains('hidden-word')) return;
            const emptyIndex = state.currentSlots.findIndex(s => s === null);
            if (emptyIndex === -1) return;

            playTapSound();
            state.currentSlots[emptyIndex] = { word, originalIndex, el: btnElement };
            btnElement.classList.add('hidden-word');
            renderSlots();
            checkOrderCompletion();
        }

        function returnWord(slotIndex) {
            if (state.lockGame) return;
            const item = state.currentSlots[slotIndex];
            if (!item) return;

            playReturnSound();
            item.el.classList.remove('hidden-word');
            state.currentSlots[slotIndex] = null;

            const messageEl = document.getElementById('message');
            messageEl.innerHTML = `<span>${_col('Pataisyk sakinį:')}</span>`;
            messageEl.className = "text-base sm:text-xl font-black h-7 text-orange-500 flex items-center justify-center";
            renderSlots();
        }

        function renderSlots() {
            const slotsContainer = document.getElementById('slots-container');
            if (!slotsContainer) return;
            const children = slotsContainer.children;
            for (let i = 0; i < children.length; i++) {
                const item = state.currentSlots[i];
                if (item) {
                    children[i].innerHTML = _col(item.word);
                    children[i].className = 'word-btn';
                } else {
                    children[i].textContent = '';
                    children[i].className = 'slot';
                }
            }
        }

        function checkOrderCompletion() {
            if (state.currentSlots.includes(null)) return;
            const slotsContainer = document.getElementById('slots-container');
            const messageEl = document.getElementById('message');
            const children = slotsContainer.children;

            const assembled = state.currentSlots.map(s => s.word).join(' ');
            const expected = state.currentWords.join(' ');

            if (assembled === expected) {
                state.lockGame = true;
                playCorrectSound();
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }
                messageEl.innerHTML = `<span>${_col('Teisingai! Šaunuolis!')} 🎉</span>`;
                messageEl.className = "text-xl sm:text-2xl font-black h-7 text-green-500 flex items-center justify-center";
                for (let i = 0; i < children.length; i++) {
                    children[i].classList.add('slot-correct', 'correct-anim');
                }
                setTimeout(() => {
                    state.round++;
                    loadQuestion();
                }, 1300);
            } else {
                const item = state.deck[state.round];
                if (state.firstTry && item && !state.missedQuestions.includes(item)) {
                    state.missedQuestions.push(item);
                }
                state.firstTry = false;
                state.streak = 0;
                playWrongSound();
                messageEl.innerHTML = `<span>${_col('Bandyk dar kartą! Paspausk ant žodžio, kad nuimtum.')} 🤔</span>`;
                messageEl.className = "text-sm sm:text-lg font-black min-h-[1.75rem] text-red-500 flex items-center justify-center";
                const hBtn = document.getElementById('hint-btn');
                if (hBtn) hBtn.classList.add('hint-btn-pulse');
                slotsContainer.classList.remove('shake');
                void slotsContainer.offsetWidth;
                slotsContainer.classList.add('shake');
                for (let i = 0; i < children.length; i++) {
                    children[i].classList.add('slot-wrong');
                }
            }
        }

        function showFillHint() {
            if (state.lockGame || state.hintUsed) return;
            state.hintUsed = true;
            playHintSound();
            const item = state.deck[state.round];
            const buttons = Array.from(document.querySelectorAll('[id^="fill-btn-"]'));
            const wrongBtns = buttons.filter(b => b.dataset.word !== item.correct && !b.disabled);
            shuffle(wrongBtns).slice(0, 2).forEach(b => {
                b.disabled = true;
                b.classList.add('opacity-30', 'pointer-events-none', 'scale-95');
            });
            const hBtn = document.getElementById('hint-btn');
            if (hBtn) hBtn.classList.add('hidden');
        }

        function renderFillQuestion() {
            const item = state.deck[state.round];
            const options = shuffle([...item.options]);

            const optsHtml = options.map((opt, idx) => `
                <button id="fill-btn-${idx}" data-word="${opt}" onclick="checkFillAnswer('${opt}', this)" class="word-btn w-full py-3.5 sm:py-4 px-4 text-xl sm:text-2xl">
                    ${_col(opt)}
                </button>
            `).join('');

            app.innerHTML = `
                ${renderGameTopBar()}
                <div class="p-3 sm:p-5 flex-1 flex flex-col justify-evenly gap-2 overflow-hidden">
                    <div class="flex flex-col items-center gap-1.5">
                        <div class="text-6xl sm:text-7xl drop-shadow-md">${item.emoji}</div>
                        <div>
                            <button id="hint-btn" onclick="showFillHint()" class="hint-btn">
                                <span>💡</span>
                                <span>${_col('Užuomina')}</span>
                            </button>
                        </div>
                    </div>

                    <div class="sentence-card bg-amber-50 border-2 border-amber-300 rounded-3xl p-4 sm:p-6 shadow-sm flex flex-wrap items-baseline justify-center content-center gap-x-2 gap-y-2 text-2xl sm:text-3xl font-black leading-relaxed">
                        <span>${_col(item.before)}</span>
                        <span class="inline-flex items-baseline whitespace-nowrap">
                            <span id="fill-blank" class="inline-flex items-center justify-center min-w-[110px] px-4 py-1 border-b-4 border-dashed border-orange-500 bg-white/80 rounded-xl text-orange-500">?</span><span>${item.after}</span>
                        </span>
                    </div>

                    <div id="message" class="text-base sm:text-xl font-black min-h-[1.75rem] text-slate-500 text-sub-title flex items-center justify-center"></div>

                    <div class="grid grid-cols-2 gap-2.5 sm:gap-3.5 w-full max-w-md mx-auto">
                        ${optsHtml}
                    </div>
                </div>
            `;
        }

        function checkFillAnswer(selected, btn) {
            if (state.lockGame) return;
            const item = state.deck[state.round];
            const blank = document.getElementById('fill-blank');
            const messageEl = document.getElementById('message');

            if (selected === item.correct) {
                state.lockGame = true;
                playCorrectSound();
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }
                blank.innerHTML = _col(selected);
                blank.className = "inline-flex items-center justify-center px-4 py-1 bg-green-100 border-2 border-green-500 rounded-xl correct-anim";
                btn.classList.add('slot-correct', 'correct-anim');
                messageEl.innerHTML = `<span>${_col('Puiku! Sakinys teisingas!')} 🎉</span>`;
                messageEl.className = "text-lg sm:text-2xl font-black min-h-[1.75rem] text-green-500 flex items-center justify-center";

                setTimeout(() => {
                    state.round++;
                    loadQuestion();
                }, 1300);
            } else {
                const item = state.deck[state.round];
                if (state.firstTry && item && !state.missedQuestions.includes(item)) {
                    state.missedQuestions.push(item);
                }
                state.firstTry = false;
                state.streak = 0;
                playWrongSound();
                btn.classList.add('slot-wrong', 'shake', 'opacity-50');
                btn.disabled = true;
                const hBtn = document.getElementById('hint-btn');
                if (hBtn) hBtn.classList.add('hint-btn-pulse');
                messageEl.innerHTML = `<span>${_col('Šis žodis čia netinka, bandyk kitą!')} 🤔</span>`;
                messageEl.className = "text-sm sm:text-lg font-black min-h-[1.75rem] text-red-500 flex items-center justify-center";
            }
        }

        function renderEndScreen() {
            app.innerHTML = renderEndScreenHelper({
                score: state.score,
                total: state.deck.length,
                restartFn: "startGame(state.mode)",
                retryFn: "retryMistakes()",
                mistakesCount: state.missedQuestions.length,
                menuFn: "renderStartScreen()"
            });
        }

        renderStartScreen();
    </script>
</body>
</html>
