<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>📐 Žodžių Tvarka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --sc-0: #dc2626;
            --sc-1: #1d4ed8;
            --sc-2: #15803d;
            --sc-3: #c2410c;
            --sc-4: #7e22ce;
            --sc-5: #be185d;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #ffecd2;
            background-image: radial-gradient(#ffb347 15%, transparent 16%);
            background-size: 28px 28px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .shake { animation: shake 0.45s ease-in-out; }

        @keyframes bounce-scale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .correct-anim { animation: bounce-scale 0.45s ease-in-out; }

        .btn-3d {
            transition: all 0.1s ease;
            box-shadow: 0 5px 0 rgba(0,0,0,0.2);
        }
        .btn-3d:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0 rgba(0,0,0,0.2);
        }

        .word-btn {
            display: inline-block;
            background-color: white;
            color: #1e293b;
            font-weight: 800;
            padding: 8px 15px;
            border-radius: 9999px;
            font-size: 1.15rem;
            box-shadow: 0 4px 0 #cbd5e1;
            border: 2px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.12s;
            margin: 4px;
        }
        @media (min-width: 640px) {
            .word-btn {
                padding: 10px 20px;
                font-size: 1.4rem;
                margin: 5px;
            }
        }
        .word-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #cbd5e1;
        }
        
        .slot {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-width: 85px;
            height: 46px;
            border: 3px dashed #f59e0b;
            border-radius: 9999px;
            margin: 3px;
            background: rgba(255, 255, 255, 0.65);
            transition: all 0.25s;
        }
        @media (min-width: 640px) {
            .slot {
                min-width: 110px;
                height: 54px;
                margin: 5px;
            }
        }
        
        .slot-correct {
            border-color: #10b981 !important;
            background: #d1fae5 !important;
            box-shadow: 0 4px 0 #34d399 !important;
        }

        .slot-wrong {
            border-color: #ef4444 !important;
            background: #fee2e2 !important;
            box-shadow: 0 4px 0 #fca5a5 !important;
        }
        
        .hidden-word {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.5);
        }

        /* Tamsioji tema */
        @media (prefers-color-scheme: dark) {
            :root {
                --sc-0: #ff6b6b;
                --sc-1: #38bdf8;
                --sc-2: #4ade80;
                --sc-3: #facc15;
                --sc-4: #c084fc;
                --sc-5: #f472b6;
            }
            body {
                background-color: #0b1120 !important;
                background-image: radial-gradient(#1e293b 2px, transparent 2px) !important;
                color: #f1f5f9 !important;
            }
            #app {
                background-color: #0f172a !important;
                border-color: #334155 !important;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6) !important;
                color: #f8fafc !important;
            }
            .top-bar {
                background-color: #1e293b !important;
                border-color: #334155 !important;
                color: #f1f5f9 !important;
            }
            .top-badge {
                background-color: #0f172a !important;
                border-color: #475569 !important;
            }
            .btn-3d {
                background-color: #1e293b !important;
                color: #f8fafc !important;
            }
            .btn-3d:hover {
                background-color: #334155 !important;
            }
            #fill-blank {
                background-color: #0f172a !important;
            }
            .word-btn {
                background-color: #1e293b !important;
                color: #f8fafc !important;
                box-shadow: 0 4px 0 #020617 !important;
                border-color: #334155 !important;
            }
            .slot {
                background: rgba(30, 41, 59, 0.6) !important;
                border-color: #f59e0b !important;
            }
            .slot-correct {
                border-color: #10b981 !important;
                background: rgba(6, 78, 59, 0.5) !important;
            }
            .sentence-card {
                background-color: #1e293b !important;
                border-color: #334155 !important;
            }
            .text-main-title {
                color: #f8fafc !important;
            }
            .text-sub-title {
                color: #94a3b8 !important;
            }
        }
    </style>
    <!-- Apsauga nuo priartinimo gestais (pinch to zoom) -->
    <script>
        document.addEventListener("gesturestart", function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("gesturechange", function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("gestureend", function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("touchstart", function(e) {
            if (e.touches && e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });
        document.addEventListener("touchmove", function(e) {
            if (e.touches && e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });
        document.addEventListener("wheel", function(e) {
            if (e.ctrlKey) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</head>
<body class="h-screen max-h-screen flex items-center justify-center p-2 sm:p-4 overflow-hidden transition-colors duration-200">

    <div id="app" class="bg-white/95 backdrop-blur rounded-3xl max-w-2xl w-full text-center shadow-2xl border-4 border-orange-400 flex flex-col overflow-hidden max-h-full">
    </div>

    <script>
        let audioCtx;
        function playTone(freq, type, duration, vol=0.12) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function playTapSound() { playTone(460, 'sine', 0.09, 0.08); }
        function playReturnSound() { playTone(320, 'sine', 0.09, 0.08); }
        function playCorrectSound() {
            playTone(523.25, 'sine', 0.12, 0.12);
            setTimeout(() => playTone(659.25, 'sine', 0.12, 0.12), 90);
            setTimeout(() => playTone(783.99, 'sine', 0.22, 0.12), 180);
        }
        function playWrongSound() {
            playTone(300, 'sawtooth', 0.15, 0.1);
            setTimeout(() => playTone(220, 'sawtooth', 0.25, 0.1), 130);
        }
        function playWinSound() {
            [440, 554.37, 659.25, 880].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.2, 0.12), i * 100));
        }

        // === SKIEMENŲ SPALVINIMAS ===
        const _V = 'aeėęiįyouųūąAEĖĘIĮYOUŲŪĄ';
        const _D = ['ai','au','ei','eu','ie','uo','ui','oi','ia','io','iu'];
        const _L = /[a-ząčęėįšųūžA-ZĄČĘĖĮŠŲŪŽ]/;
        const _O = new Set(['bl','br','dr','dv','fl','fr','gl','gr','gn','kl','kr','kn','kv','pl','pr','sk','sl','sm','sn','sp','sr','st','sv','šl','šv','šn','tr','tv','vr','žl','žv','str','skr','spr']);
        const _SC = ['var(--sc-0, #dc2626)','var(--sc-1, #1d4ed8)','var(--sc-2, #15803d)','var(--sc-3, #c2410c)','var(--sc-4, #7e22ce)','var(--sc-5, #be185d)'];

        function _syl(word) {
            if (!word || word.length <= 1) return [word || ''];
            const r = []; let s = '', i = 0, n = word.length;
            while (i < n) {
                const c = word[i];
                if (!_L.test(c)) { s += c; i++; continue; }
                if (!_V.includes(c)) { s += c; i++; }
                else {
                    if (i + 1 < n && _D.includes(word.slice(i, i + 2).toLowerCase())) { s += word.slice(i, i + 2); i += 2; }
                    else { s += c; i++; }
                    let j = i;
                    while (j < n && _L.test(word[j]) && !_V.includes(word[j])) j++;
                    let cl = word.slice(i, j);
                    if (j >= n || !_L.test(word[j])) { s += cl; i = j; while (i < n && !_L.test(word[i])) { s += word[i]; i++; } r.push(s); s = ''; }
                    else if (cl.length === 0) { r.push(s); s = ''; }
                    else if (cl.length === 1) { r.push(s); s = cl; i = j; }
                    else {
                        let u = [];
                        for (let k = 0; k < cl.length;) {
                            const p = cl.slice(k, k + 2).toLowerCase();
                            if (p === 'dz' || p === 'dž' || p === 'ch') { u.push(cl.slice(k, k + 2)); k += 2; }
                            else { u.push(cl[k]); k++; }
                        }
                        let sp = u.length - 1;
                        if (u.length >= 2) {
                            const l2 = (u[u.length - 2] + u[u.length - 1]).toLowerCase();
                            const l3 = u.length >= 3 ? (u[u.length - 3] + l2).toLowerCase() : '';
                            if (l3 && _O.has(l3)) sp = u.length - 3;
                            else if (_O.has(l2)) sp = u.length - 2;
                        }
                        s += u.slice(0, sp).join(''); r.push(s); s = u.slice(sp).join(''); i = j;
                    }
                }
            }
            if (s) r.push(s);
            return r.filter(x => x.length > 0);
        }

        function _col(text) {
            if (!text) return '';
            return text.split(/(\s+)/).map(token => {
                if (!token.trim() || !/[a-ząčęėįšųūžA-ZĄČĘĖĮŠŲŪŽ]/.test(token)) return token;
                const syls = _syl(token);
                return syls.map((s, i) => '<span style="color:' + _SC[i % _SC.length] + '">' + s + '</span>').join('');
            }).join('');
        }
        // === /SKIEMENŲ SPALVINIMAS ===

        const SHORT_SENTENCES = [
            { text: "Katė geria pieną.", emoji: "🐱" },
            { text: "Šuo laksto kieme.", emoji: "🐶" },
            { text: "Mama kepa tortą.", emoji: "🎂" },
            { text: "Tėtis skaito knygą.", emoji: "📖" },
            { text: "Vaikas valgo obuolį.", emoji: "🍎" },
            { text: "Saulė šviečia danguje.", emoji: "☀️" },
            { text: "Paukštis gieda medyje.", emoji: "🐦" },
            { text: "Varlė šokinėja tvenkinyje.", emoji: "🐸" },
            { text: "Mergaitė piešia gėlę.", emoji: "🌸" },
            { text: "Berniukas žaidžia futbolą.", emoji: "⚽" },
            { text: "Lietus lyja lauke.", emoji: "🌧️" },
            { text: "Drugelis skraido sode.", emoji: "🦋" },
            { text: "Pelė graužia sūrį.", emoji: "🐭" },
            { text: "Žuvis plaukia upėje.", emoji: "🐟" },
            { text: "Bitė renka medų.", emoji: "🐝" },
            { text: "Kiškis bėga miške.", emoji: "🐰" }
        ];

        const LONG_SENTENCES = [
            { text: "Baltas sniegas krenta iš dangaus.", emoji: "❄️" },
            { text: "Maža mergaitė skaito įdomią knygą.", emoji: "📚" },
            { text: "Rudens vėjas pučia geltonus lapus.", emoji: "🍁" },
            { text: "Vikri voveraitė renka skanius riešutus.", emoji: "🐿️" },
            { text: "Močiutė sode pasodino gražias gėles.", emoji: "🌷" },
            { text: "Linksmas šuniukas bėgioja žaliame kieme.", emoji: "🐕" },
            { text: "Ryte vaikai skuba į mokyklą.", emoji: "🎒" },
            { text: "Žalia varlytė tupi ant lapo.", emoji: "🐸" },
            { text: "Didelis lėktuvas skrenda virš debesų.", emoji: "✈️" },
            { text: "Darbšti bitutė neša saldų medų.", emoji: "🍯" }
        ];

        const FILL_WORD_TASKS = [
            { before: "Katė dubenėlyje laka baltą", after: ".", correct: "pieną", options: ["pieną", "akmenį", "debesį", "pieštuką"], emoji: "🐱" },
            { before: "Danguje ryškiai šviečia geltona", after: ".", correct: "saulė", options: ["saulė", "kėdė", "pagalvė", "šakutė"], emoji: "☀️" },
            { before: "Darbšti bitutė iš gėlių renka", after: ".", correct: "medų", options: ["medų", "sniegą", "popierių", "smėlį"], emoji: "🐝" },
            { before: "Žiemą iš debesų krenta baltas", after: ".", correct: "sniegas", options: ["sniegas", "uodai", "braškės", "lapai"], emoji: "❄️" },
            { before: "Kiškutis darže graužia traškią", after: ".", correct: "morką", options: ["morką", "knygą", "lempą", "kepurę"], emoji: "🐰" },
            { before: "Mokinys ant nugaros neša", after: ".", correct: "kuprinę", options: ["kuprinę", "lovą", "šaldytuvą", "kėdę"], emoji: "🎒" },
            { before: "Upėje greitai plaukia maža", after: ".", correct: "žuvelė", options: ["žuvelė", "pelėda", "voverė", "karvė"], emoji: "🐟" },
            { before: "Mama virtuvėje kepa saldų", after: ".", correct: "tortą", options: ["tortą", "kamuolį", "dviratį", "batą"], emoji: "🎂" },
            { before: "Voveraitė medyje gliaudo kietą", after: ".", correct: "riešutą", options: ["riešutą", "muilą", "laikrodį", "stiklą"], emoji: "🐿️" },
            { before: "Naktį danguje žiba ryškios", after: ".", correct: "žvaigždės", options: ["žvaigždės", "morkos", "pirštinės", "durys"], emoji: "⭐" }
        ];

        const state = {
            mode: 'short', // 'short' | 'long' | 'fill'
            deck: [],
            round: 0,
            totalRounds: 10,
            score: 0,
            streak: 0,
            firstTry: true,
            currentWords: [],
            currentSlots: [],
            lockGame: false
        };

        const app = document.getElementById('app');

        function shuffle(arr) {
            return [...arr].sort(() => Math.random() - 0.5);
        }

        function renderStartScreen() {
            app.innerHTML = `
                <div class="p-6 sm:p-8 flex flex-col items-center justify-center text-center">
                    <div class="text-5xl sm:text-6xl mb-2">📐</div>
                    <h1 class="text-main-title text-3xl sm:text-5xl font-black text-orange-600 mb-2">${_col('Žodžių Tvarka')}</h1>
                    <p class="text-sub-title text-base sm:text-xl text-slate-600 mb-5 sm:mb-7 font-bold">${_col('Sudėliok sakinius ir surask tinkamus žodžius!')}</p>
                    
                    <div class="flex flex-col gap-3 w-full max-w-sm">
                        <button onclick="startGame('short')" class="btn-3d py-3.5 sm:py-4 px-5 rounded-2xl bg-orange-100 hover:bg-orange-200 text-slate-800 border-2 border-orange-400 font-black text-lg sm:text-2xl">
                            📝 ${_col('Trumpi sakiniai')}
                        </button>
                        <button onclick="startGame('long')" class="btn-3d py-3.5 sm:py-4 px-5 rounded-2xl bg-amber-100 hover:bg-amber-200 text-slate-800 border-2 border-amber-400 font-black text-lg sm:text-2xl">
                            📖 ${_col('Ilgesni sakiniai')}
                        </button>
                        <button onclick="startGame('fill')" class="btn-3d py-3.5 sm:py-4 px-5 rounded-2xl bg-emerald-100 hover:bg-emerald-200 text-slate-800 border-2 border-emerald-400 font-black text-lg sm:text-2xl">
                            🔍 ${_col('Įstatyk trūkstamą žodį!')}
                        </button>
                    </div>
                </div>
            `;
        }

        function startGame(mode) {
            playTapSound();
            state.mode = mode;
            state.round = 0;
            state.score = 0;
            state.streak = 0;
            const pool = mode === 'short' ? SHORT_SENTENCES : mode === 'long' ? LONG_SENTENCES : FILL_WORD_TASKS;
            state.deck = shuffle(pool).slice(0, state.totalRounds);
            loadQuestion();
        }

        function renderTopBar() {
            return `
                <div class="top-bar bg-orange-100 border-b-2 border-orange-300 text-slate-800 px-4 py-2 sm:py-2.5 flex justify-between items-center font-bold text-sm sm:text-base shadow-sm shrink-0">
                    <div>⭐ ${_col('Taškai:')} <span class="text-orange-700 dark:text-amber-300 font-black">${state.score}</span></div>
                    <div class="top-badge bg-white/90 border border-orange-300 px-3 py-0.5 rounded-xl">${_col('Sakinys:')} <span class="text-orange-700 dark:text-amber-300 font-black">${state.round + 1} / ${state.deck.length}</span></div>
                    <div>🔥 ${_col('Serija:')} <span class="text-orange-700 dark:text-amber-300 font-black">${state.streak}</span></div>
                </div>
            `;
        }

        function loadQuestion() {
            if (state.round >= state.deck.length) {
                renderEndScreen();
                return;
            }
            state.lockGame = false;
            state.firstTry = true;

            if (state.mode === 'fill') {
                renderFillQuestion();
            } else {
                renderOrderQuestion();
            }
        }

        function renderOrderQuestion() {
            const item = state.deck[state.round];
            state.currentWords = item.text.split(' ').map(w => w.trim()).filter(w => w.length > 0);
            state.currentSlots = new Array(state.currentWords.length).fill(null);

            const scrambled = shuffle(state.currentWords.map((word, originalIndex) => ({ word, originalIndex })));

            app.innerHTML = `
                ${renderTopBar()}
                <div class="p-3 sm:p-5 flex-1 flex flex-col justify-between overflow-hidden">
                    <div class="text-5xl sm:text-6xl drop-shadow-md">${item.emoji}</div>

                    <div id="message" class="text-base sm:text-xl font-black h-7 text-slate-500 text-sub-title flex items-center justify-center">
                        ${_col('Spausk žodžius iš eilės ir sudėliok sakinį:')}
                    </div>

                    <div id="slots-container" class="flex flex-wrap justify-center items-center min-h-[60px] sm:min-h-[75px] py-1"></div>

                    <div id="pool-container" class="flex flex-wrap justify-center items-center min-h-[85px] sm:min-h-[110px] py-1"></div>
                </div>
            `;

            const slotsContainer = document.getElementById('slots-container');
            const poolContainer = document.getElementById('pool-container');

            for (let i = 0; i < state.currentWords.length; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.onclick = () => returnWord(i);
                slotsContainer.appendChild(slot);
            }

            scrambled.forEach(obj => {
                const btn = document.createElement('div');
                btn.className = 'word-btn';
                btn.innerHTML = _col(obj.word);
                btn.onclick = () => pickWord(btn, obj.word, obj.originalIndex);
                poolContainer.appendChild(btn);
            });
        }

        function pickWord(btnElement, word, originalIndex) {
            if (state.lockGame || btnElement.classList.contains('hidden-word')) return;
            const emptyIndex = state.currentSlots.findIndex(s => s === null);
            if (emptyIndex === -1) return;

            playTapSound();
            state.currentSlots[emptyIndex] = { word, originalIndex, el: btnElement };
            btnElement.classList.add('hidden-word');
            renderSlots();
            checkOrderCompletion();
        }

        function returnWord(slotIndex) {
            if (state.lockGame) return;
            const item = state.currentSlots[slotIndex];
            if (!item) return;

            playReturnSound();
            item.el.classList.remove('hidden-word');
            state.currentSlots[slotIndex] = null;

            const messageEl = document.getElementById('message');
            messageEl.innerHTML = _col('Pataisyk sakinį:');
            messageEl.className = "text-base sm:text-xl font-black h-7 text-orange-500 flex items-center justify-center";
            renderSlots();
        }

        function renderSlots() {
            const slotsContainer = document.getElementById('slots-container');
            if (!slotsContainer) return;
            const children = slotsContainer.children;
            for (let i = 0; i < children.length; i++) {
                const item = state.currentSlots[i];
                if (item) {
                    children[i].innerHTML = _col(item.word);
                    children[i].className = 'word-btn';
                } else {
                    children[i].textContent = '';
                    children[i].className = 'slot';
                }
            }
        }

        function checkOrderCompletion() {
            if (state.currentSlots.includes(null)) return;
            const slotsContainer = document.getElementById('slots-container');
            const messageEl = document.getElementById('message');
            const children = slotsContainer.children;

            const assembled = state.currentSlots.map(s => s.word).join(' ');
            const expected = state.currentWords.join(' ');

            if (assembled === expected) {
                state.lockGame = true;
                playCorrectSound();
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }
                messageEl.innerHTML = `${_col('Teisingai! Šaunuolis!')} 🎉`;
                messageEl.className = "text-xl sm:text-2xl font-black h-7 text-green-500 flex items-center justify-center";
                for (let i = 0; i < children.length; i++) {
                    children[i].classList.add('slot-correct', 'correct-anim');
                }
                setTimeout(() => {
                    state.round++;
                    loadQuestion();
                }, 1300);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playWrongSound();
                messageEl.innerHTML = `${_col('Bandyk dar kartą! Paspausk ant žodžio, kad nuimtum.')} 🤔`;
                messageEl.className = "text-sm sm:text-lg font-black h-7 text-red-500 flex items-center justify-center";
                slotsContainer.classList.remove('shake');
                void slotsContainer.offsetWidth;
                slotsContainer.classList.add('shake');
                for (let i = 0; i < children.length; i++) {
                    children[i].classList.add('slot-wrong');
                }
            }
        }

        function renderFillQuestion() {
            const item = state.deck[state.round];
            const options = shuffle([...item.options]);

            const optsHtml = options.map((opt, idx) => `
                <button id="fill-btn-${idx}" onclick="checkFillAnswer('${opt}', this)" class="word-btn py-2.5 sm:py-3.5 px-5 text-lg sm:text-2xl">
                    ${_col(opt)}
                </button>
            `).join('');

            app.innerHTML = `
                ${renderTopBar()}
                <div class="p-3 sm:p-5 flex-1 flex flex-col justify-between overflow-hidden">
                    <div class="text-5xl sm:text-6xl drop-shadow-md">${item.emoji}</div>

                    <div class="sentence-card bg-amber-50 border-2 border-amber-300 rounded-2xl p-4 sm:p-6 shadow-sm flex flex-wrap items-center justify-center gap-2 text-xl sm:text-3xl font-black">
                        <span>${_col(item.before)}</span>
                        <span id="fill-blank" class="inline-flex items-center justify-center min-w-[110px] px-4 py-1 border-b-4 border-dashed border-orange-500 bg-white/80 dark:bg-slate-800 rounded-xl text-orange-500">?</span>
                        <span>${item.after}</span>
                    </div>

                    <div id="message" class="text-base sm:text-xl font-black h-7 text-slate-500 text-sub-title flex items-center justify-center">
                        ${_col('Pasirink žodį, kuris tinka šiame sakinyje:')}
                    </div>

                    <div class="flex flex-wrap justify-center gap-2 sm:gap-3">
                        ${optsHtml}
                    </div>
                </div>
            `;
        }

        function checkFillAnswer(selected, btn) {
            if (state.lockGame) return;
            const item = state.deck[state.round];
            const blank = document.getElementById('fill-blank');
            const messageEl = document.getElementById('message');

            if (selected === item.correct) {
                state.lockGame = true;
                playCorrectSound();
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }
                blank.innerHTML = _col(selected);
                blank.className = "inline-flex items-center justify-center px-4 py-1 bg-green-100 border-2 border-green-500 rounded-xl correct-anim";
                btn.classList.add('slot-correct', 'correct-anim');
                messageEl.innerHTML = `${_col('Puiku! Sakinys teisingas!')} 🎉`;
                messageEl.className = "text-lg sm:text-2xl font-black h-7 text-green-500 flex items-center justify-center";

                setTimeout(() => {
                    state.round++;
                    loadQuestion();
                }, 1300);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playWrongSound();
                btn.classList.add('slot-wrong', 'shake', 'opacity-50');
                btn.disabled = true;
                messageEl.innerHTML = `${_col('Šis žodis čia netinka, bandyk kitą!')} 🤔`;
                messageEl.className = "text-sm sm:text-lg font-black h-7 text-red-500 flex items-center justify-center";
            }
        }

        function renderEndScreen() {
            playWinSound();
            let stars = "⭐";
            if (state.score >= 8) stars = "⭐⭐⭐";
            else if (state.score >= 5) stars = "⭐⭐";

            app.innerHTML = `
                <div class="p-6 sm:p-8 flex flex-col items-center justify-center text-center">
                    <h2 class="text-main-title text-3xl sm:text-4xl font-black text-purple-600 mb-4">${_col('Šaunuolis!')}</h2>
                    <div class="text-5xl sm:text-6xl mb-4 drop-shadow-md">${stars}</div>
                    <p class="text-sub-title text-xl sm:text-2xl text-slate-700 mb-6 font-bold">
                        ${_col('Tavo rezultatas:')} <span class="text-3xl sm:text-4xl text-orange-500 font-black">${state.score} / ${state.deck.length}</span>
                    </p>
                    <button onclick="renderStartScreen()" class="btn-3d bg-green-100 hover:bg-green-200 text-slate-800 border-2 border-green-400 text-xl sm:text-2xl font-black py-4 px-10 rounded-2xl w-full max-w-xs">
                        ${_col('Žaisti dar kartą')} 🔄
                    </button>
                </div>
            `;
        }

        renderStartScreen();
    </script>
</body>
</html>
