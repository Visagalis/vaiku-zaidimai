                        </button>
                    </div>

            `;
        }

        function startGame(mode) {
            getAudioCtx();
            clearGameTimers();
            state.mode = mode;
            state.score = 0;
            state.streak = 0;
            state.currentIndex = 0;
            state.missedQuestions = [];

            let pool = NATURE_RIDDLES;
            if (mode === 'items') pool = ITEM_RIDDLES;
            if (mode === 'detective') pool = DETECTIVE_QUESTIONS;

            state.questions = shuffle(pool).slice(0, 10);
            state.totalPossible = state.questions.length;
            renderQuestion();
        }

        function retryMistakes() {
            if (!state.missedQuestions || state.missedQuestions.length === 0) {
                startGame(state.mode);
                return;
            }
            getAudioCtx();
            clearGameTimers();
            state.questions = shuffle(state.missedQuestions);
            state.missedQuestions = [];
            state.totalPossible = state.questions.length;
            state.score = 0;
            state.streak = 0;
            state.currentIndex = 0;
            renderQuestion();
        }

        function renderQuestion() {
            if (state.currentIndex >= state.questions.length) {
                renderEndScreen();
                return;
            }

            state.firstTry = true;
            state.waiting = false;
            state.hintUsed = false;

            const q = state.questions[state.currentIndex];
            const options = shuffle([q.correct, ...q.wrong]);
            state.currentOptions = options;

            let bodyContent = '';
            if (state.mode === 'detective') {
                const speakText = q.clues.join('. ');
                const cluesHtml = q.clues.map(c => `
                    <div class="clue-pill px-3.5 py-1.5 rounded-2xl bg-white border-2 border-sky-300 font-extrabold text-sm sm:text-lg text-slate-800 shadow-sm w-full text-left">
                        ${_col(c)}
                    </div>
                `).join('');
                bodyContent = `
                    <div class="flex items-center justify-between w-full mb-1">
                        <span class="text-xs sm:text-sm font-black uppercase tracking-wider text-sky-700 dark:text-sky-300">🕵️ ${_col('Kas aš esu?')}</span>
                        ${renderSpeakBtn(speakText, 'Išklausyti užuominas')}
                    </div>
                    <div class="flex flex-col gap-1.5 w-full">
                        ${cluesHtml}
                    </div>
                `;
            } else {
                bodyContent = `
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-3xl sm:text-4xl">🗝️</span>
                        ${renderSpeakBtn(q.riddle, 'Išklausyti mįslę')}
                    </div>
                    <p class="text-base sm:text-2xl font-black text-slate-900 dark:text-white leading-snug text-center">
                        „${_col(q.riddle)}“
                    </p>
                `;
            }

            const optionsHtml = options.map((opt, idx) => `
                <button id="btn-${idx}" onclick="handleAnswer(${idx})"
                    class="btn-3d py-3 sm:py-3.5 px-3 bg-amber-50 text-slate-900 border-2 border-amber-300 rounded-2xl text-base sm:text-xl font-black shadow-[0_5px_0_#f59e0b] active:shadow-[0_0px_0_#f59e0b] transition-all flex items-center justify-center gap-2 min-h-[60px]">
                    <span class="opt-hint-emoji hidden text-2xl sm:text-3xl">${opt.emoji}</span>
                    <span>${_col(opt.word)}</span>
                </button>
            `).join('');

            appEl.innerHTML = `
                ${renderTopBar({ score: state.score, current: state.currentIndex + 1, total: state.questions.length, streak: state.streak, theme: 'amber' })}

                <div class="p-3 sm:p-5 flex-1 flex flex-col justify-evenly items-center gap-2">
                    <div class="riddle-card py-3.5 px-4 sm:px-6 flex flex-col items-center justify-center bg-gradient-to-b from-amber-100/80 to-amber-50/80 rounded-3xl border-2 border-amber-300 w-full shadow-inner gap-2">
                        ${bodyContent}
                        <div id="hint-box" class="hidden hint-box text-xs sm:text-sm mt-1">
                            💡 ${_col(q.hint)}
                        </div>
                        <button id="hint-btn" onclick="showRiddleHint()" class="hint-btn mt-1">
                            <span>💡</span> <span>${_col('Užuomina')}</span>
                        </button>
                    </div>

                    <div id="feedback" class="h-6 sm:h-8 flex items-center justify-center text-sm sm:text-lg font-black opacity-0 transition-opacity">
                        <span>&nbsp;</span>
                    </div>

                    <div class="grid grid-cols-2 gap-2.5 sm:gap-3.5 w-full">
                        ${optionsHtml}
                    </div>
                </div>
            `;
        }

        function showRiddleHint() {
            if (state.waiting || state.hintUsed) return;
            state.hintUsed = true;
            playHintSound();
            const hintBox = document.getElementById('hint-box');
            if (hintBox) hintBox.classList.remove('hidden');
            const hintBtn = document.getElementById('hint-btn');
            if (hintBtn) hintBtn.classList.add('hidden');

            document.querySelectorAll('.opt-hint-emoji').forEach(el => el.classList.remove('hidden'));

            const q = state.questions[state.currentIndex];
            const wrongIdxs = [];
            (state.currentOptions || []).forEach((opt, idx) => {
                const btn = document.getElementById(`btn-${idx}`);
                if (opt.word !== q.correct.word && btn && !btn.disabled) wrongIdxs.push(idx);
            });
            shuffle(wrongIdxs).slice(0, 1).forEach(idx => {
                const btn = document.getElementById(`btn-${idx}`);
                if (btn) {
                    btn.disabled = true;
                    btn.classList.add('opacity-35', 'line-through', 'pointer-events-none');
                }
            });
        }

        function handleAnswer(idx) {
            if (state.waiting) return;
            const selected = state.currentOptions[idx];
            const btn = document.getElementById(`btn-${idx}`);
            const q = state.questions[state.currentIndex];
            const feedback = document.getElementById('feedback');
            if (!selected || !btn) return;

            if (selected.word === q.correct.word) {
                state.waiting = true;
                playCorrectSound();
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }

                const emojiSpan = btn.querySelector('.opt-hint-emoji');
                if (emojiSpan) emojiSpan.classList.remove('hidden');
                btn.classList.remove('bg-amber-50', 'hover:bg-amber-100', 'text-slate-900', 'border-amber-300');
                btn.classList.add('bg-green-500', 'text-white', 'border-green-600', 'shadow-[0_5px_0_#15803d]', 'bounce-anim');

                if (feedback) {
                    feedback.innerHTML = `<span>${_col('Įminta! Tai')} ${q.correct.emoji} ${_col(q.correct.word)}! 🎉</span>`;
                    feedback.className = "h-6 sm:h-8 flex items-center justify-center text-sm sm:text-lg font-black text-green-600 opacity-100";
                }

                setGameTimeout(() => {
                    state.currentIndex++;
                    renderQuestion();
                }, 1250);
            } else {
                if (state.firstTry && !state.missedQuestions.includes(q)) {
                    state.missedQuestions.push(q);
                }
                state.firstTry = false;
                state.streak = 0;
                playWrongSound();

                btn.classList.add('bg-red-100', 'text-red-400', 'line-through', 'border-red-300', 'opacity-60', 'shake-anim');
                btn.disabled = true;

                if (feedback) {
                    feedback.innerHTML = `<span>${_col('Pagalvok dar kartelį!')} 🤔</span>`;
                    feedback.className = "h-6 sm:h-8 flex items-center justify-center text-sm sm:text-lg font-black text-red-500 opacity-100";
                }

                const hintBtn = document.getElementById('hint-btn');
                if (hintBtn && !state.hintUsed) hintBtn.classList.add('hint-btn-pulse');
            }
        }

        function renderEndScreen() {
            appEl.innerHTML = renderEndScreenHelper({
                score: state.score,
                total: state.totalPossible,
                restartFn: "startGame(state.mode)",
                retryFn: "retryMistakes()",
                mistakesCount: state.missedQuestions.length,
                menuFn: "renderStartScreen()"
            });
        }

        renderStartScreen();
    </script>
</body>
</html>
