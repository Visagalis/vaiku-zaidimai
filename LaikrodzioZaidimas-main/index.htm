<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laikrodžio Žaidimas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            background-color: #f0fdf4;
            background-image: radial-gradient(#86efac 2px, transparent 2px);
            background-size: 30px 30px;
            overflow-y: auto;
        }

        .screen {
            display: none;
        }
        .screen.active {
            display: flex;
        }

        /* Animations */
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .animate-bounce-click {
            animation: bounce 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }
        
        .clock-number {
            font-size: 24px;
            font-weight: 800;
            fill: #1e293b;
            text-anchor: middle;
            dominant-baseline: central;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- START SCREEN -->
    <div id="start-screen" class="screen active flex-col items-center justify-center w-full max-w-md bg-white p-8 rounded-3xl shadow-xl text-center border-4 border-green-400">
        <h1 class="text-4xl font-black text-green-600 mb-2">🕐 Laikrodžio Žaidimas</h1>
        <p class="text-xl text-gray-600 mb-8 font-bold">Mokykis atpažinti laiką!</p>
        
        <div class="flex flex-col gap-4 w-full">
            <button onclick="startGame('hours')" class="w-full py-4 bg-green-500 hover:bg-green-600 text-white rounded-2xl text-2xl font-bold shadow-[0_6px_0_#16a34a] active:shadow-[0_0px_0_#16a34a] active:translate-y-[6px] transition-all">
                Valandos
            </button>
            <button onclick="startGame('half-hours')" class="w-full py-4 bg-orange-500 hover:bg-orange-600 text-white rounded-2xl text-2xl font-bold shadow-[0_6px_0_#ea580c] active:shadow-[0_0px_0_#ea580c] active:translate-y-[6px] transition-all">
                Pusvalandžiai
            </button>
            <button onclick="startGame('minutes')" class="w-full py-4 bg-red-500 hover:bg-red-600 text-white rounded-2xl text-2xl font-bold shadow-[0_6px_0_#dc2626] active:shadow-[0_0px_0_#dc2626] active:translate-y-[6px] transition-all">
                Minutės
            </button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen flex-col items-center w-full max-w-lg bg-white p-4 sm:p-6 rounded-3xl shadow-xl border-4 border-blue-400 my-auto">
        <!-- Top Bar -->
        <div class="flex justify-between w-full mb-3 sm:mb-6 px-1 sm:px-2 text-lg sm:text-xl font-bold text-gray-700">
            <div class="flex items-center gap-1.5 sm:gap-2">⭐ <span id="score">0</span></div>
            <div class="flex items-center gap-1.5 sm:gap-2 text-blue-600" id="progress">1 / 10</div>
            <div class="flex items-center gap-1.5 sm:gap-2">🔥 <span id="streak">0</span></div>
        </div>
        
        <div id="feedback-msg" class="h-6 sm:h-8 text-xl sm:text-2xl font-black text-center mb-2 sm:mb-4"></div>

        <!-- Clock SVG Container -->
        <div class="w-[200px] h-[200px] xs:w-[240px] xs:h-[240px] sm:w-[280px] sm:h-[280px] mb-4 sm:mb-6 relative">
            <svg id="clock-svg" viewBox="0 0 300 300" class="w-full h-full drop-shadow-md">
                <circle cx="150" cy="150" r="145" fill="#f8fafc" stroke="#334155" stroke-width="10"/>
                <!-- Ticks and Numbers will be generated by JS -->
                <g id="clock-marks"></g>
                <g id="clock-numbers"></g>
                
                <!-- Hands -->
                <line id="hour-hand" x1="150" y1="150" x2="150" y2="70" stroke="#1e293b" stroke-width="10" stroke-linecap="round" transform-origin="150 150"/>
                <line id="minute-hand" x1="150" y1="150" x2="150" y2="40" stroke="#2563eb" stroke-width="6" stroke-linecap="round" transform-origin="150 150"/>
                
                <!-- Center point -->
                <circle cx="150" cy="150" r="8" fill="#ef4444"/>
            </svg>
        </div>

        <!-- Answers -->
        <div class="grid grid-cols-2 gap-2.5 sm:gap-4 w-full" id="answers-container">
            <!-- Buttons injected by JS -->
        </div>
    </div>

    <!-- END SCREEN -->
    <div id="end-screen" class="screen flex-col items-center justify-center w-full max-w-md bg-white p-8 rounded-3xl shadow-xl text-center border-4 border-yellow-400">
        <h2 class="text-4xl font-black text-yellow-500 mb-4" id="end-title">Žaidimas Baigtas!</h2>
        <div class="text-6xl mb-4" id="end-emoji">🏆</div>
        <p class="text-2xl font-bold text-gray-700 mb-2">Tavo rezultatas:</p>
        <p class="text-5xl font-black text-blue-600 mb-8"><span id="final-score">0</span> / 10</p>
        <button onclick="showStartScreen()" class="w-full py-4 bg-blue-500 hover:bg-blue-600 text-white rounded-2xl text-2xl font-bold shadow-[0_6px_0_#2563eb] active:shadow-[0_0px_0_#2563eb] active:translate-y-[6px] transition-all">
            Žaisti dar kartą
        </button>
    </div>

    <script>
        // Game State
        let difficulty = 'hours';
        let currentQuestion = 0;
        let score = 0;
        let streak = 0;
        let totalQuestions = 10;
        let correctAnswer = "";
        let isAnswering = false;
        let firstTry = true;

        // Audio Context Setup
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, startTime=0) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + startTime);
            
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime + startTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startTime + duration);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start(audioCtx.currentTime + startTime);
            osc.stop(audioCtx.currentTime + startTime + duration);
        }

        function playCorrectSound() {
            playTone(440, 'sine', 0.2, 0);   // A4
            playTone(554.37, 'sine', 0.2, 0.1); // C#5
            playTone(659.25, 'sine', 0.3, 0.2); // E5
        }

        function playWrongSound() {
            playTone(300, 'sawtooth', 0.3, 0);
            playTone(250, 'sawtooth', 0.4, 0.2);
        }

        function playWinSound() {
            playTone(523.25, 'square', 0.2, 0); // C5
            playTone(659.25, 'square', 0.2, 0.2); // E5
            playTone(783.99, 'square', 0.2, 0.4); // G5
            playTone(1046.50, 'square', 0.5, 0.6); // C6
        }

        // Init SVG Clock Face
        function initClockFace() {
            const marksGrp = document.getElementById('clock-marks');
            const numsGrp = document.getElementById('clock-numbers');
            marksGrp.innerHTML = '';
            numsGrp.innerHTML = '';
            
            const cx = 150, cy = 150;
            
            // Draw ticks
            for (let i = 0; i < 60; i++) {
                const angle = (i * 6) * Math.PI / 180;
                const isHour = i % 5 === 0;
                const r1 = 140;
                const r2 = isHour ? 125 : 133;
                
                const x1 = cx + r1 * Math.sin(angle);
                const y1 = cy - r1 * Math.cos(angle);
                const x2 = cx + r2 * Math.sin(angle);
                const y2 = cy - r2 * Math.cos(angle);
                
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1);
                line.setAttribute('y1', y1);
                line.setAttribute('x2', x2);
                line.setAttribute('y2', y2);
                line.setAttribute('stroke', '#64748b');
                line.setAttribute('stroke-width', isHour ? '4' : '2');
                marksGrp.appendChild(line);
            }
            
            // Draw numbers 1-12
            for (let i = 1; i <= 12; i++) {
                const angle = (i * 30) * Math.PI / 180;
                const r = 105;
                const x = cx + r * Math.sin(angle);
                const y = cy - r * Math.cos(angle);
                
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', x);
                text.setAttribute('y', y + 2); // slight adjustment for visual center
                text.setAttribute('class', 'clock-number');
                text.textContent = i;
                numsGrp.appendChild(text);
            }
        }

        function setClockHands(hours, minutes) {
            const hourDeg = (hours % 12) * 30 + minutes * 0.5;
            const minDeg = minutes * 6;
            
            const hourHand = document.getElementById('hour-hand');
            const minHand = document.getElementById('minute-hand');
            
            hourHand.style.transform = `rotate(${hourDeg}deg)`;
            minHand.style.transform = `rotate(${minDeg}deg)`;
        }

        // Screens
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showStartScreen() {
            showScreen('start-screen');
        }

        function startGame(level) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            difficulty = level;
            score = 0;
            streak = 0;
            currentQuestion = 0;
            updateTopBar();
            initClockFace();
            showScreen('game-screen');
            nextQuestion();
        }

        function updateTopBar() {
            document.getElementById('score').textContent = score;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').textContent = `${currentQuestion} / ${totalQuestions}`;
        }

        function padZero(num) {
            return num < 10 ? '0' + num : num.toString();
        }

        function generateTime() {
            let h = Math.floor(Math.random() * 12) + 1;
            let m = 0;
            
            if (difficulty === 'half-hours') {
                m = Math.random() > 0.5 ? 30 : 0;
            } else if (difficulty === 'minutes') {
                m = Math.floor(Math.random() * 12) * 5; // 0, 5, 10 ... 55
            }
            
            return { h, m, str: `${h}:${padZero(m)}` };
        }

        function generateWrongOptions(correctTime) {
            let options = new Set();
            options.add(correctTime.str);
            
            while (options.size < 4) {
                let tempTime;
                
                if (difficulty === 'hours') {
                    let h = Math.floor(Math.random() * 12) + 1;
                    tempTime = `${h}:00`;
                } else if (difficulty === 'half-hours') {
                    let h = Math.floor(Math.random() * 12) + 1;
                    let m = Math.random() > 0.5 ? 30 : 0;
                    tempTime = `${h}:${padZero(m)}`;
                } else {
                    let h = Math.floor(Math.random() * 12) + 1;
                    let m = Math.floor(Math.random() * 12) * 5;
                    tempTime = `${h}:${padZero(m)}`;
                }
                
                options.add(tempTime);
            }
            
            return Array.from(options).sort(() => Math.random() - 0.5);
        }

        function nextQuestion() {
            if (currentQuestion >= totalQuestions) {
                endGame();
                return;
            }
            
            currentQuestion++;
            firstTry = true;
            isAnswering = false;
            updateTopBar();
            
            const msgEl = document.getElementById('feedback-msg');
            msgEl.textContent = "Kiek valandų?";
            msgEl.className = "h-8 text-2xl font-black text-center mb-4 text-gray-700";

            let time = generateTime();
            correctAnswer = time.str;
            setClockHands(time.h, time.m);
            
            let answers = generateWrongOptions(time);
            
            const container = document.getElementById('answers-container');
            container.innerHTML = '';
            
            answers.forEach(ans => {
                const btn = document.createElement('button');
                btn.className = "time-btn py-4 bg-white border-4 border-slate-200 hover:border-blue-400 rounded-2xl text-3xl font-black text-slate-700 shadow-md transition-all active:scale-95";
                btn.textContent = ans;
                btn.onclick = () => handleAnswer(ans, btn);
                container.appendChild(btn);
            });
        }

        function handleAnswer(ans, btn) {
            if (isAnswering) return;
            
            if (ans === correctAnswer) {
                isAnswering = true;
                if (firstTry) {
                    score++;
                    streak++;
                }
                updateTopBar();
                playCorrectSound();
                
                btn.classList.remove('border-slate-200', 'hover:border-blue-400');
                btn.classList.add('bg-green-500', 'text-white', 'border-green-600', 'animate-bounce-click');
                
                const msgEl = document.getElementById('feedback-msg');
                const msgs = ["Puiku!", "Šaunuolis!", "Teisingai!", "Nuostabu!"];
                msgEl.textContent = msgs[Math.floor(Math.random() * msgs.length)];
                msgEl.className = "h-8 text-2xl font-black text-center mb-4 text-green-500";
                
                setTimeout(() => {
                    nextQuestion();
                }, 1500);
            } else {
                firstTry = false;
                streak = 0;
                updateTopBar();
                playWrongSound();
                
                btn.classList.remove('border-slate-200', 'hover:border-blue-400');
                btn.classList.add('bg-red-100', 'border-red-300', 'text-red-400', 'opacity-50', 'animate-shake');
                btn.disabled = true;
                
                const msgEl = document.getElementById('feedback-msg');
                msgEl.textContent = "Bandyk dar kartą!";
                msgEl.className = "h-8 text-2xl font-black text-center mb-4 text-red-500";
                
                setTimeout(() => {
                    btn.classList.remove('animate-shake');
                }, 400);
            }
        }

        function endGame() {
            showScreen('end-screen');
            document.getElementById('final-score').textContent = score;
            
            const emojiEl = document.getElementById('end-emoji');
            const titleEl = document.getElementById('end-title');
            
            if (score >= 8) {
                emojiEl.textContent = "🏆";
                titleEl.textContent = "Šaunuolis!";
                playWinSound();
            } else if (score >= 5) {
                emojiEl.textContent = "🌟";
                titleEl.textContent = "Neblogai!";
                playCorrectSound();
            } else {
                emojiEl.textContent = "👍";
                titleEl.textContent = "Bandyk dar!";
            }
        }

        // Init clock face immediately so it doesn't wait
        initClockFace();
    </script>
</body>
</html>
