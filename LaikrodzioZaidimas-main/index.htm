<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>🕐 Laikrodžio Žaidimas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/common.css">
    <script src="../shared/common.js"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4;
            background-image: radial-gradient(#86efac 20%, transparent 20%);
            background-size: 24px 24px;
            color: #1e293b;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .app-card {
            background-color: rgba(255, 255, 255, 0.96);
            border-color: #86efac;
        }

        .panel-box {
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
        }

        .opt-btn {
            background-color: #e0f2fe;
            color: #0369a1;
            border-color: #7dd3fc;
        }
        .opt-btn:hover {
            background-color: #bae6fd;
        }

        .ctrl-btn {
            background-color: #f1f5f9;
            color: #1e293b;
            border-color: #cbd5e1;
        }
        .ctrl-btn:active {
            transform: scale(0.94);
        }

        .clock-number {
            font-size: 22px;
            font-weight: 900;
            fill: #1e293b;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            user-select: none;
        }

        .clock-num-hit {
            fill: transparent;
            cursor: pointer;
            transition: fill 0.15s ease;
        }
        .clock-num-hit:hover {
            fill: rgba(59, 130, 246, 0.12);
        }
        .clock-num-hit:active {
            fill: rgba(59, 130, 246, 0.25);
        }

        #hour-hand-group, #minute-hand-group {
            transform-origin: 150px 150px;
            transition: transform 0.25s cubic-bezier(0.34, 1.4, 0.64, 1);
            will-change: transform;
        }

        #clock-svg.is-dragging #hour-hand-group,
        #clock-svg.is-dragging #minute-hand-group,
        #clock-svg.is-dragging #hour-hand,
        #clock-svg.is-dragging #minute-hand {
            transition: none !important;
        }

        .hand-handle {
            cursor: grab;
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .hand-handle:hover {
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.35));
        }
        .hand-handle:active,
        #clock-svg.is-dragging .hand-handle {
            cursor: grabbing;
        }

        /* Tamsioji Tema (Dark Mode) */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0b1120 !important;
                background-image: radial-gradient(#1e293b 25%, transparent 25%) !important;
                color: #f8fafc !important;
            }
            .app-card {
                background-color: #0f172a !important;
                border-color: #334155 !important;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6) !important;
                color: #f8fafc !important;
            }
            .bg-amber-100 {
                background-color: #1e293b !important;
                color: #fde68a !important;
                border-color: #f59e0b !important;
            }
            #user-time-badge {
                background-color: #064e3b !important;
                color: #a7f3d0 !important;
                border-color: #10b981 !important;
            }
            .panel-box {
                background-color: #1e293b !important;
                border-color: #334155 !important;
                color: #f8fafc !important;
            }
            .opt-btn {
                background-color: #1e293b !important;
                color: #f8fafc !important;
                border-color: #334155 !important;
            }
            .opt-btn:hover {
                background-color: #334155 !important;
            }
            .ctrl-btn {
                background-color: #1e293b !important;
                color: #f8fafc !important;
                border-color: #475569 !important;
            }
            .text-main-title {
                color: #f8fafc !important;
            }
            .text-sub-title {
                color: #cbd5e1 !important;
            }
            #clock-face-circle {
                fill: #1e293b !important;
                stroke: #64748b !important;
            }
            .clock-number {
                fill: #f8fafc !important;
            }
            #hour-hand {
                stroke: #fbbf24 !important;
            }
            #minute-hand {
                stroke: #60a5fa !important;
            }
            .hour-handle {
                fill: #f59e0b !important;
                stroke: #f8fafc !important;
            }
            .minute-handle {
                fill: #3b82f6 !important;
                stroke: #f8fafc !important;
            }
            #clock-inner-ring {
                stroke: #fbbf24 !important;
                opacity: 0.35 !important;
            }
        }
    </style>
</head>
<body class="h-screen max-h-screen overflow-hidden flex items-center justify-center p-2 sm:p-4">

    <div id="app" class="app-card w-full max-w-2xl rounded-3xl shadow-xl flex flex-col relative fade-in border-4 overflow-hidden max-h-full">
        <!-- Content rendered by JS -->
    </div>

    <script>
        const DAILY_ROUTINES = [
            { icon: '🌅', title: 'Keliamės į mokyklą', h: 7, m: 0, display: '07:00' },
            { icon: '🪥', title: 'Valomės dantukus ir pusryčiaujame', h: 7, m: 30, display: '07:30' },
            { icon: '🎒', title: 'Pamokų pradžia', h: 8, m: 0, display: '08:00' },
            { icon: '🍎', title: 'Priešpiečių pertrauka', h: 10, m: 0, display: '10:00' },
            { icon: '🍲', title: 'Pietų metas', h: 12, m: 0, display: '12:00' },
            { icon: '🎨', title: 'Dailės ir darbelių pamoka', h: 13, m: 0, display: '13:00' },
            { icon: '⚽', title: 'Būrelis po pamokų', h: 15, m: 0, display: '15:00' },
            { icon: '📚', title: 'Ruošiame namų darbus', h: 16, m: 30, display: '16:30' },
            { icon: '🍝', title: 'Vakarienė su šeima', h: 18, m: 0, display: '18:00' },
            { icon: '📖', title: 'Skaitome pasaką prieš miegą', h: 20, m: 30, display: '20:30' },
            { icon: '🌙', title: 'Einame miegoti', h: 21, m: 0, display: '21:00' }
        ];

        const state = {
            mode: 'hours', // 'hours' | 'minutes' | 'interactive' | 'routine'
            score: 0,
            streak: 0,
            question: 1,
            maxQuestions: 10,
            targetH: 3,
            targetM: 0,
            targetStr: '03:00',
            userH: 12,
            userM: 0,
            activeHand: 'hour', // 'hour' | 'minute'
            routineItem: null,
            routineSubMode: 'match', // 'match' | 'set'
            options: [],
            waiting: false,
            firstTry: true
        };

        const app = document.getElementById('app');

        function padZero(num) {
            return num < 10 ? '0' + num : num.toString();
        }

        function formatTime(h, m) {
            return `${padZero(h)}:${padZero(m)}`;
        }

        function renderTopBar() {
            return `
                <div class="top-bar bg-emerald-100 border-b-2 border-emerald-300 text-slate-800 px-3 sm:px-5 py-2 sm:py-2.5 flex justify-between items-center font-bold text-sm sm:text-lg shadow-sm shrink-0">
                    <div class="flex items-center gap-2">
                        <button onclick="renderStartScreen()" class="top-badge bg-white/90 hover:bg-emerald-200 border border-emerald-300 px-2 py-0.5 rounded-lg text-sm sm:text-base transition active:scale-95" title="Pradžia">🏠</button>
                        <span class="flex items-center gap-1">⭐ <span class="text-emerald-700 dark:text-amber-300 font-black">${state.score}</span></span>
                    </div>
                    <div class="top-badge bg-white/90 border border-emerald-300 px-2.5 py-0.5 rounded-xl font-black text-emerald-700 dark:text-amber-300">🎯 ${state.question} / ${state.maxQuestions}</div>
                    <div class="flex items-center gap-1">🔥 <span class="text-emerald-700 dark:text-amber-300 font-black">${state.streak}</span></div>
                </div>
            `;
        }

        function renderStartScreen() {
            app.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-4 sm:p-7 text-center fade-in">
                    <div class="text-5xl sm:text-6xl mb-1.5 bounce">🕐</div>
                    <h1 class="text-main-title text-2xl sm:text-4xl font-black text-gray-800 mb-4 tracking-tight">${_col('Laikrodžio Žaidimas')}</h1>
                    
                    <div class="flex flex-col gap-2.5 sm:gap-3 w-full max-w-md">
                        <button onclick="startGame('hours')" class="btn-tinted w-full py-3.5 px-4 rounded-2xl bg-emerald-100 hover:bg-emerald-200 text-slate-800 font-black text-base sm:text-xl shadow-lg transition transform active:scale-95 border-2 border-b-4 border-emerald-400 flex items-center justify-center gap-2.5">
                            <span class="text-2xl">🟢</span>
                            <span>${_col('Valandos')}</span>
                        </button>
                        <button onclick="startGame('minutes')" class="btn-tinted w-full py-3.5 px-4 rounded-2xl bg-amber-100 hover:bg-amber-200 text-slate-800 font-black text-base sm:text-xl shadow-lg transition transform active:scale-95 border-2 border-b-4 border-amber-400 flex items-center justify-center gap-2.5">
                            <span class="text-2xl">🟡</span>
                            <span>${_col('Minutės')}</span>
                        </button>
                        <button onclick="startGame('interactive')" class="btn-tinted w-full py-3.5 px-4 rounded-2xl bg-indigo-100 hover:bg-indigo-200 text-slate-800 font-black text-base sm:text-xl shadow-lg transition transform active:scale-95 border-2 border-b-4 border-indigo-400 flex items-center justify-center gap-2.5">
                            <span class="text-2xl">🖐️</span>
                            <span>${_col('Suk rodykles')}</span>
                        </button>
                        <button onclick="startGame('routine')" class="btn-tinted w-full py-3.5 px-4 rounded-2xl bg-rose-100 hover:bg-rose-200 text-slate-800 font-black text-base sm:text-xl shadow-lg transition transform active:scale-95 border-2 border-b-4 border-rose-400 flex items-center justify-center gap-2.5">
                            <span class="text-2xl">🌞</span>
                            <span>${_col('Dienotvarkė')}</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function startGame(mode) {
            initAudio();
            dragData.active = false;
            dragData.hand = null;
            dragData.hasMoved = false;
            state.mode = mode;
            state.score = 0;
            state.streak = 0;
            state.question = 1;
            generateQuestion();
        }

        let dragData = {
            active: false,
            hand: null,
            startX: 0,
            startY: 0,
            hasMoved: false
        };

        function buildClockSvgHTML(interactive) {
            const cx = 150, cy = 150;
            let ticksHtml = '';
            for (let i = 0; i < 60; i++) {
                const angle = (i * 6) * Math.PI / 180;
                const isHour = i % 5 === 0;
                const r1 = 138;
                const r2 = isHour ? 124 : 132;
                const x1 = (cx + r1 * Math.sin(angle)).toFixed(2);
                const y1 = (cy - r1 * Math.cos(angle)).toFixed(2);
                const x2 = (cx + r2 * Math.sin(angle)).toFixed(2);
                const y2 = (cy - r2 * Math.cos(angle)).toFixed(2);
                ticksHtml += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#64748b" stroke-width="${isHour ? '4' : '2'}" stroke-linecap="round"/>`;
            }

            let numbersHtml = '';
            for (let i = 1; i <= 12; i++) {
                const angle = (i * 30) * Math.PI / 180;
                const r = 102;
                const x = (cx + r * Math.sin(angle)).toFixed(2);
                const y = (cy - r * Math.cos(angle)).toFixed(2);
                if (interactive) {
                    numbersHtml += `<circle cx="${x}" cy="${y}" r="22" class="clock-num-hit" onclick="onClockNumberClick(${i})"/>`;
                }
                numbersHtml += `<text x="${x}" y="${parseFloat(y) + 1}" class="clock-number">${i}</text>`;
            }

            if (interactive) {
                return `
                    <svg id="clock-svg" viewBox="0 0 300 300" class="w-full h-full drop-shadow-md select-none touch-none cursor-grab"
                         onpointerdown="onClockPointerDown(event)"
                         onpointermove="onClockPointerMove(event)"
                         onpointerup="onClockPointerUp(event)"
                         onpointercancel="onClockPointerUp(event)">
                        <circle id="clock-face-circle" cx="150" cy="150" r="144" fill="#ffffff" stroke="#334155" stroke-width="8"/>
                        <circle id="clock-inner-ring" cx="150" cy="150" r="88" fill="rgba(245, 158, 11, 0.05)" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" pointer-events="none"/>
                        <g id="clock-marks" pointer-events="none">${ticksHtml}</g>
                        <g id="clock-numbers">${numbersHtml}</g>
                        <!-- Hour Hand Group (Interactive) -->
                        <g id="hour-hand-group">
                            <line x1="150" y1="150" x2="150" y2="72" stroke="transparent" stroke-width="44" stroke-linecap="round" data-hand="hour" class="cursor-pointer"/>
                            <line id="hour-hand" x1="150" y1="150" x2="150" y2="72" stroke="#d97706" stroke-width="10" stroke-linecap="round" pointer-events="none"/>
                            <circle cx="150" cy="72" r="13" fill="#f59e0b" stroke="#ffffff" stroke-width="2.5" class="hand-handle hour-handle" data-hand="hour"/>
                            <circle cx="150" cy="72" r="4" fill="#ffffff" pointer-events="none"/>
                        </g>
                        <!-- Minute Hand Group (Interactive) -->
                        <g id="minute-hand-group">
                            <line x1="150" y1="150" x2="150" y2="38" stroke="transparent" stroke-width="40" stroke-linecap="round" data-hand="minute" class="cursor-pointer"/>
                            <line id="minute-hand" x1="150" y1="150" x2="150" y2="38" stroke="#2563eb" stroke-width="7" stroke-linecap="round" pointer-events="none"/>
                            <circle cx="150" cy="38" r="11" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" class="hand-handle minute-handle" data-hand="minute"/>
                            <circle cx="150" cy="38" r="3.5" fill="#ffffff" pointer-events="none"/>
                        </g>
                        <!-- Center Pin -->
                        <circle cx="150" cy="150" r="10" fill="#ef4444" stroke="#ffffff" stroke-width="2.5" pointer-events="none"/>
                        <circle cx="150" cy="150" r="3.5" fill="#ffffff" pointer-events="none"/>
                    </svg>
                `;
            }

            return `
                <svg id="clock-svg" viewBox="0 0 300 300" class="w-full h-full drop-shadow-md select-none">
                    <circle id="clock-face-circle" cx="150" cy="150" r="144" fill="#ffffff" stroke="#334155" stroke-width="8"/>
                    <g id="clock-marks">${ticksHtml}</g>
                    <g id="clock-numbers">${numbersHtml}</g>
                    <!-- Hour Hand Group (Static) -->
                    <g id="hour-hand-group">
                        <line id="hour-hand" x1="150" y1="150" x2="150" y2="72" stroke="#d97706" stroke-width="10" stroke-linecap="round"/>
                        <circle cx="150" cy="72" r="5" fill="#f59e0b"/>
                    </g>
                    <!-- Minute Hand Group (Static) -->
                    <g id="minute-hand-group">
                        <line id="minute-hand" x1="150" y1="150" x2="150" y2="38" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
                        <circle cx="150" cy="38" r="4" fill="#2563eb"/>
                    </g>
                    <!-- Center Pin -->
                    <circle cx="150" cy="150" r="9" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
                </svg>
            `;
        }

        function updateClockHands(hours, minutes) {
            const hourGroup = document.getElementById('hour-hand-group');
            const minGroup = document.getElementById('minute-hand-group');
            const hourHand = document.getElementById('hour-hand');
            const minHand = document.getElementById('minute-hand');

            const hourDeg = (hours % 12) * 30 + minutes * 0.5;
            const minDeg = minutes * 6;

            if (hourGroup) {
                hourGroup.style.transform = `rotate(${hourDeg}deg)`;
            } else if (hourHand) {
                hourHand.style.transform = `rotate(${hourDeg}deg)`;
            }

            if (minGroup) {
                minGroup.style.transform = `rotate(${minDeg}deg)`;
            } else if (minHand) {
                minHand.style.transform = `rotate(${minDeg}deg)`;
            }
        }

        function getClockAngleAndDist(e, svg) {
            const pt = svg.createSVGPoint();
            pt.x = e.clientX;
            pt.y = e.clientY;
            const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
            const dx = svgP.x - 150;
            const dy = svgP.y - 150;
            const dist = Math.sqrt(dx * dx + dy * dy);
            let deg = Math.atan2(dx, -dy) * (180 / Math.PI);
            if (deg < 0) deg += 360;
            return { deg, dist, x: svgP.x, y: svgP.y };
        }

        function onClockPointerDown(e) {
            if (state.waiting) return;
            const svg = document.getElementById('clock-svg');
            if (!svg) return;

            try {
                svg.setPointerCapture(e.pointerId);
            } catch (err) {}

            const info = getClockAngleAndDist(e, svg);
            if (info.dist > 146) return;

            let hand = null;
            if (e.target && e.target.getAttribute) {
                hand = e.target.getAttribute('data-hand');
            }

            if (!hand) {
                if (info.dist < 88) {
                    hand = 'hour';
                } else {
                    hand = 'minute';
                }
            }

            dragData.active = true;
            dragData.hand = hand;
            dragData.startX = info.x;
            dragData.startY = info.y;
            dragData.hasMoved = false;

            setActiveHand(hand, false);
            svg.classList.add('is-dragging');

            updateHandFromAngle(info.deg, hand);
        }

        function onClockPointerMove(e) {
            if (!dragData.active || state.waiting) return;
            const svg = document.getElementById('clock-svg');
            if (!svg) return;

            const info = getClockAngleAndDist(e, svg);
            const moveDist = Math.hypot(info.x - dragData.startX, info.y - dragData.startY);
            if (moveDist > 6) {
                dragData.hasMoved = true;
            }

            updateHandFromAngle(info.deg, dragData.hand);
        }

        function onClockPointerUp(e) {
            const svg = document.getElementById('clock-svg');
            if (svg) {
                svg.classList.remove('is-dragging');
                try {
                    svg.releasePointerCapture(e.pointerId);
                } catch (err) {}
            }

            if (!dragData.active) return;
            dragData.active = false;
            dragData.hand = null;
            refreshInteractiveClock();
        }

        function updateHandFromAngle(deg, hand) {
            if (hand === 'minute') {
                let snappedM = Math.round(deg / 30) * 5;
                if (snappedM >= 60) snappedM = 0;

                if (snappedM !== state.userM) {
                    state.userM = snappedM;
                    playSound('tick');
                    refreshInteractiveClock();
                }
            } else if (hand === 'hour') {
                let hour = Math.round(deg / 30);
                if (hour === 0) hour = 12;

                if (hour !== state.userH) {
                    state.userH = hour;
                    playSound('tick');
                    refreshInteractiveClock();
                }
            }
        }

        function generateQuestion() {
            state.waiting = false;
            state.firstTry = true;

            if (state.mode === 'routine') {
                const item = DAILY_ROUTINES[(state.question - 1 + Math.floor(Math.random() * 3)) % DAILY_ROUTINES.length];
                state.routineItem = item;
                state.targetH = item.h;
                state.targetM = item.m;
                state.targetStr = item.display;
                state.routineSubMode = (state.question % 2 === 0) ? 'set' : 'match';

                if (state.routineSubMode === 'set') {
                    state.userH = 12;
                    state.userM = 0;
                    state.activeHand = 'hour';
                    renderInteractiveScreen(true);
                } else {
                    const opts = new Set([item.display]);
                    while (opts.size < 4) {
                        const other = DAILY_ROUTINES[Math.floor(Math.random() * DAILY_ROUTINES.length)];
                        opts.add(other.display);
                    }
                    state.options = Array.from(opts).sort(() => Math.random() - 0.5);
                    renderMatchScreen(true);
                }
                return;
            }

            let h = Math.floor(Math.random() * 12) + 1;
            let m = 0;

            if (state.mode === 'hours') {
                m = 0;
            } else if (state.mode === 'minutes') {
                const minsPool = [0, 15, 30, 45, 5, 10, 20, 25, 35, 40, 50, 55];
                m = minsPool[Math.floor(Math.random() * (state.question <= 5 ? 4 : minsPool.length))];
            } else if (state.mode === 'interactive') {
                const interactiveMins = [0, 0, 30, 15, 45, 5, 10, 20, 25, 35, 40, 50, 55];
                m = interactiveMins[Math.floor(Math.random() * (state.question <= 4 ? 3 : interactiveMins.length))];
            }

            state.targetH = h;
            state.targetM = m;
            state.targetStr = formatTime(h, m);

            if (state.mode === 'interactive') {
                state.userH = (h % 12) + 1;
                state.userM = 0;
                state.activeHand = 'hour';
                renderInteractiveScreen(false);
            } else {
                const opts = new Set([state.targetStr]);
                while (opts.size < 4) {
                    const rh = Math.floor(Math.random() * 12) + 1;
                    let rm = 0;
                    if (state.mode === 'minutes') {
                        const mp = [0, 15, 30, 45, 5, 10, 20, 25, 35, 40, 50, 55];
                        rm = mp[Math.floor(Math.random() * mp.length)];
                    }
                    opts.add(formatTime(rh, rm));
                }
                state.options = Array.from(opts).sort(() => Math.random() - 0.5);
                renderMatchScreen(false);
            }
        }

        function renderMatchScreen(isRoutine) {
            const routineBanner = isRoutine && state.routineItem ? `
                <div class="panel-box px-3 py-1.5 sm:py-2 rounded-2xl mb-1 text-center shadow-sm">
                    <div class="text-base sm:text-xl font-black text-main-title">${state.routineItem.icon} ${_col(state.routineItem.title)}</div>
                </div>
            ` : `
                <h2 class="text-center text-xl sm:text-2xl font-black text-slate-700 text-main-title flex items-center justify-center gap-2">
                    <span>🕐</span>
                    <span>${_col('Kiek valandų?')}</span>
                </h2>
            `;

            const optionsHtml = state.options.map((opt, idx) => `
                <button id="btn-${idx}" onclick="checkMatchAnswer(${idx}, '${opt}')" class="opt-btn py-2.5 sm:py-3.5 rounded-2xl font-black text-xl sm:text-3xl shadow-md border-b-4 transition transform active:scale-95">
                    ${opt}
                </button>
            `).join('');

            app.innerHTML = `
                ${renderTopBar()}
                <div class="flex-1 flex flex-col items-center justify-between p-2.5 sm:p-5 fade-in overflow-hidden">
                    ${routineBanner}

                    <div id="clock-wrap" class="w-[190px] h-[190px] sm:w-[240px] sm:h-[240px] my-auto shrink-0 flex items-center justify-center">
                        ${buildClockSvgHTML(false)}
                    </div>

                    <div id="feedback" class="h-6 sm:h-7 flex items-center justify-center font-black text-base sm:text-xl opacity-0 transition-opacity"></div>

                    <div class="grid grid-cols-2 gap-2.5 sm:gap-3.5 w-full">
                        ${optionsHtml}
                    </div>
                </div>
            `;
            updateClockHands(state.targetH, state.targetM);
        }

        function renderInteractiveScreen(isRoutine) {
            const headerHtml = isRoutine && state.routineItem ? `
                <div class="panel-box px-3 py-1.5 rounded-2xl text-center w-full shadow-sm">
                    <div class="text-base sm:text-xl font-black text-main-title">${state.routineItem.icon} ${_col(state.routineItem.title)} – <span class="text-indigo-600 dark:text-indigo-400 font-black">${state.targetStr}</span></div>
                </div>
            ` : `
                <div class="text-center">
                    <div class="inline-block px-5 py-1 rounded-2xl bg-amber-100 border-2 border-amber-400 text-amber-900 font-black text-2xl sm:text-4xl shadow-sm">
                        🎯 ${state.targetStr}
                    </div>
                </div>
            `;

            app.innerHTML = `
                ${renderTopBar()}
                <div class="flex-1 flex flex-col items-center justify-between p-2 sm:p-4 fade-in overflow-hidden">
                    ${headerHtml}

                    <div class="flex items-center gap-2 my-0.5">
                        <button id="toggle-hour-btn" onclick="setActiveHand('hour')" class="px-3 py-1.5 rounded-xl text-sm sm:text-base font-black border-2 transition ${state.activeHand === 'hour' ? 'btn-tinted bg-amber-100 border-amber-500 shadow-sm' : 'ctrl-btn opacity-70'}">
                            🕐 ${_col('Valandos')}
                        </button>
                        <button id="toggle-min-btn" onclick="setActiveHand('minute')" class="px-3 py-1.5 rounded-xl text-sm sm:text-base font-black border-2 transition ${state.activeHand === 'minute' ? 'btn-tinted bg-sky-100 border-sky-500 shadow-sm' : 'ctrl-btn opacity-70'}">
                            ⏱️ ${_col('Minutės')}
                        </button>
                        <span id="user-time-badge" class="px-3 py-1.5 rounded-xl bg-emerald-100 text-emerald-900 font-black text-sm sm:text-base border border-emerald-300">
                            ${formatTime(state.userH, state.userM)}
                        </span>
                    </div>

                    <div id="clock-wrap" class="w-[190px] h-[190px] min-[380px]:w-[215px] min-[380px]:h-[215px] sm:w-[250px] sm:h-[250px] my-auto shrink-0 flex items-center justify-center relative touch-none">
                        ${buildClockSvgHTML(true)}
                    </div>

                    <div id="feedback" class="h-6 sm:h-7 flex items-center justify-center font-black text-sm sm:text-lg opacity-0 transition-opacity"></div>

                    <!-- Tactile adjustment buttons -->
                    <div class="grid grid-cols-4 gap-1.5 sm:gap-2.5 w-full">
                        <button onclick="adjustTime(-1, 0)" class="ctrl-btn py-2 sm:py-2.5 rounded-xl font-black text-sm sm:text-base border-b-4 shadow-sm active:translate-y-0.5">
                            🕐 -1
                        </button>
                        <button onclick="adjustTime(1, 0)" class="ctrl-btn py-2 sm:py-2.5 rounded-xl font-black text-sm sm:text-base border-b-4 shadow-sm active:translate-y-0.5">
                            🕐 +1
                        </button>
                        <button onclick="adjustTime(0, -5)" class="ctrl-btn py-2 sm:py-2.5 rounded-xl font-black text-sm sm:text-base border-b-4 shadow-sm active:translate-y-0.5">
                            ⏱️ -5
                        </button>
                        <button onclick="adjustTime(0, 5)" class="ctrl-btn py-2 sm:py-2.5 rounded-xl font-black text-sm sm:text-base border-b-4 shadow-sm active:translate-y-0.5">
                            ⏱️ +5
                        </button>
                    </div>

                    <button onclick="checkInteractiveAnswer()" class="btn-tinted w-full py-2.5 sm:py-3.5 rounded-2xl bg-green-100 hover:bg-green-200 text-slate-800 font-black text-xl sm:text-2xl shadow-md border-2 border-b-4 border-green-400 transition transform active:scale-95 flex items-center justify-center gap-2">
                        <span>✅</span>
                        <span>${_col('Patvirtinti')}</span>
                    </button>
                </div>
            `;
            updateClockHands(state.userH, state.userM);
        }

        function setActiveHand(hand, withSound) {
            if (state.waiting) return;
            if (withSound === undefined) withSound = true;
            const changed = state.activeHand !== hand;
            state.activeHand = hand;
            if (withSound && changed) {
                playSound('tick');
            }
            const hBtn = document.getElementById('toggle-hour-btn');
            const mBtn = document.getElementById('toggle-min-btn');
            if (hBtn && mBtn) {
                hBtn.className = `px-3 py-1.5 rounded-xl text-sm sm:text-base font-black border-2 transition ${hand === 'hour' ? 'btn-tinted bg-amber-100 border-amber-500 shadow-sm' : 'ctrl-btn opacity-70'}`;
                mBtn.className = `px-3 py-1.5 rounded-xl text-sm sm:text-base font-black border-2 transition ${hand === 'minute' ? 'btn-tinted bg-sky-100 border-sky-500 shadow-sm' : 'ctrl-btn opacity-70'}`;
            }
        }

        function onClockNumberClick(num) {
            if (state.waiting) return;
            if (dragData.hasMoved) return;
            playSound('tick');
            if (state.activeHand === 'hour') {
                state.userH = num;
            } else {
                state.userM = (num % 12) * 5;
            }
            refreshInteractiveClock();
        }

        function adjustTime(deltaH, deltaM) {
            if (state.waiting) return;
            playSound('tick');
            if (deltaH !== 0) {
                state.userH = ((state.userH - 1 + deltaH + 12) % 12) + 1;
                setActiveHand('hour', false);
            }
            if (deltaM !== 0) {
                let totalMins = state.userM + deltaM;
                if (totalMins < 0) {
                    totalMins += 60;
                    state.userH = ((state.userH - 2 + 12) % 12) + 1;
                } else if (totalMins >= 60) {
                    totalMins -= 60;
                    state.userH = (state.userH % 12) + 1;
                }
                state.userM = totalMins;
                setActiveHand('minute', false);
            }
            refreshInteractiveClock();
        }

        function refreshInteractiveClock() {
            updateClockHands(state.userH, state.userM);
            const badge = document.getElementById('user-time-badge');
            if (badge) {
                badge.textContent = formatTime(state.userH, state.userM);
            }
        }

        function checkInteractiveAnswer() {
            if (state.waiting) return;
            const isHourMatch = (state.userH % 12) === (state.targetH % 12);
            const isMinMatch = state.userM === state.targetM;
            const feedback = document.getElementById('feedback');
            const clockWrap = document.getElementById('clock-wrap');

            if (isHourMatch && isMinMatch) {
                state.waiting = true;
                playSound('correct');
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }
                feedback.innerHTML = `<span>${_col('Puiku! Laikrodis nustatytas tiksliai!')} 🎉</span>`;
                feedback.className = "h-5 sm:h-6 flex items-center justify-center font-black text-sm sm:text-lg text-green-500 opacity-100";
                clockWrap.classList.add('bounce');

                setTimeout(() => {
                    if (state.question >= state.maxQuestions) {
                        renderEndScreen();
                    } else {
                        state.question++;
                        generateQuestion();
                    }
                }, 1150);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playSound('wrong');
                let hint = 'Patikrink valandų ir minučių rodykles!';
                if (!isHourMatch && isMinMatch) hint = 'Minutės teisingos, bet patikrink valandų rodyklę!';
                else if (isHourMatch && !isMinMatch) hint = 'Valandos teisingos, bet patikrink minučių rodyklę!';
                feedback.innerHTML = `<span>${_col(hint)} 🤔</span>`;
                feedback.className = "h-6 sm:h-7 flex items-center justify-center font-black text-sm sm:text-lg text-red-500 opacity-100";
                clockWrap.classList.remove('shake');
                void clockWrap.offsetWidth;
                clockWrap.classList.add('shake');
            }
        }

        function checkMatchAnswer(index, selectedStr) {
            if (state.waiting) return;
            const btn = document.getElementById(`btn-${index}`);
            const feedback = document.getElementById('feedback');
            const clockWrap = document.getElementById('clock-wrap');

            if (selectedStr === state.targetStr) {
                state.waiting = true;
                playSound('correct');
                if (state.firstTry) {
                    state.score++;
                    state.streak++;
                }
                btn.className = "py-2.5 sm:py-3.5 bg-green-500 text-white rounded-2xl font-black text-xl sm:text-3xl shadow-md border-b-4 border-green-700 transform scale-105 bounce";
                feedback.innerHTML = `<span>${_col('Teisingai! Šaunuolis!')} 🎉</span>`;
                feedback.className = "h-6 sm:h-7 flex items-center justify-center font-black text-base sm:text-xl text-green-500 opacity-100";

                setTimeout(() => {
                    if (state.question >= state.maxQuestions) {
                        renderEndScreen();
                    } else {
                        state.question++;
                        generateQuestion();
                    }
                }, 1100);
            } else {
                state.firstTry = false;
                state.streak = 0;
                playSound('wrong');
                btn.disabled = true;
                btn.className = "py-2.5 sm:py-3.5 bg-red-100 text-red-400 border-red-200 border-2 rounded-2xl font-bold text-xl sm:text-3xl shadow-sm line-through cursor-not-allowed opacity-60 shake";
                feedback.innerHTML = `<span>${_col('Bandyk dar kartą!')} 🤔</span>`;
                feedback.className = "h-6 sm:h-7 flex items-center justify-center font-black text-base sm:text-xl text-red-500 opacity-100";
                clockWrap.classList.remove('shake');
                void clockWrap.offsetWidth;
                clockWrap.classList.add('shake');
            }
        }

        function renderEndScreen() {
            playSound('win');

            let stars = 1;
            if (state.score >= 8) stars = 3;
            else if (state.score >= 5) stars = 2;

            const starHtml = Array(3).fill(0).map((_, i) =>
                `<span class="text-5xl sm:text-6xl ${i < stars ? 'text-yellow-400 bounce' : 'text-gray-400 opacity-40'} drop-shadow-md" style="animation-delay: ${i * 0.2}s">⭐</span>`
            ).join('');

            let message = "Neblogai! Pasitreniruok dar!";
            if (stars === 3) message = "Puikiai! Tu tikras laiko meistras!";
            else if (stars === 2) message = "Geras rezultatas!";

            app.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-6 sm:p-8 text-center fade-in">
                    <h2 class="text-main-title text-3xl sm:text-4xl font-black text-gray-800 mb-4">${_col('Žaidimas baigtas!')}</h2>
                    
                    <div class="flex justify-center gap-2 mb-4">
                        ${starHtml}
                    </div>
                    
                    <p class="text-sub-title text-xl sm:text-2xl font-bold text-gray-700 mb-2">${_col(message)} 🏆</p>
                    <p class="text-sub-title text-lg sm:text-xl text-gray-600 mb-8">${_col('Surinkai:')} <span class="font-black text-green-500">${state.score} / ${state.maxQuestions}</span></p>
                    
                    <button onclick="renderStartScreen()" class="btn-tinted w-full max-w-xs py-4 rounded-2xl bg-blue-100 hover:bg-blue-200 text-slate-800 font-black text-xl sm:text-2xl shadow-lg transition transform active:scale-95 border-2 border-b-4 border-blue-400">
                        🔄 ${_col('Dar kartą')}
                    </button>
                </div>
            `;
        }

        // Initialize
        renderStartScreen();
    </script>
</body>
</html>
