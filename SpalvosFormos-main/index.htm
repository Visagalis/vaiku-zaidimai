<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>🟡 Spalvos ir Formos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fef08a;
            background-image: radial-gradient(#fbbf24 10%, transparent 10%);
            background-size: 20px 20px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .shape-container svg {
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
            transition: transform 0.3s ease;
        }

        .btn-bounce:active {
            transform: scale(0.95);
        }

        /* Animations */
        @keyframes bounce-sm {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px) scale(1.05); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        @keyframes pop-in {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .animate-bounce-sm { animation: bounce-sm 0.5s ease-in-out; }
        .animate-shake { animation: shake 0.5s ease-in-out; }
        .animate-pop-in { animation: pop-in 0.4s ease-out forwards; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 4px solid white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-4 overflow-y-auto">

    <!-- AUDIO SYSTEM -->
    <script>
        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        
        function playTone(freq, type, duration, vol=0.1) {
            try {
                const ctx = getAudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                
                gain.gain.setValueAtTime(vol, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {
                console.warn('Audio playback error:', e);
            }
        }
        
        function playCorrectSound() {
            playTone(523.25, 'sine', 0.1, 0.2); // C5
            setTimeout(() => playTone(659.25, 'sine', 0.1, 0.2), 100); // E5
            setTimeout(() => playTone(783.99, 'sine', 0.2, 0.2), 200); // G5
        }
        
        function playWrongSound() {
            playTone(300, 'sawtooth', 0.2, 0.1);
            setTimeout(() => playTone(250, 'sawtooth', 0.3, 0.1), 150);
        }
        
        function playWinSound() {
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, i) => {
                setTimeout(() => playTone(freq, 'sine', 0.2, 0.2), i * 150);
            });
        }
    </script>

    <div id="app" class="w-full max-w-lg mx-auto">
        <!-- SCREENS WILL BE INJECTED HERE -->
    </div>

    <script>
        // === SKIEMENŲ SPALVINIMAS ===
        const _V = 'aeėęiįyouųūąAEĖĘIĮYOUŲŪĄ';
        const _D = ['ai','au','ei','eu','ie','uo','ui','oi','ia','io','iu'];
        const _L = /[a-ząčęėįšųūžA-ZĄČĘĖĮŠŲŪŽ]/;
        const _O = new Set(['bl','br','dr','dv','fl','fr','gl','gr','gn','kl','kr','kn','kv','pl','pr','sk','sl','sm','sn','sp','sr','st','sv','šl','šv','šn','tr','tv','vr','žl','žv','str','skr','spr']);
        const _SC = ['#dc2626','#2563eb','#16a34a','#ea580c','#9333ea','#db2777'];

        function _syl(word) {
            if (!word || word.length <= 1) return [word || ''];
            const r = []; let s = '', i = 0, n = word.length;
            while (i < n) {
                const c = word[i];
                if (!_L.test(c)) { s += c; i++; continue; }
                if (!_V.includes(c)) { s += c; i++; }
                else {
                    s += c; i++;
                    if (i < n && _V.includes(word[i]) && _D.includes((c + word[i]).toLowerCase())) { s += word[i]; i++; }
                    let j = i, u = [];
                    while (j < n && !_V.includes(word[j])) {
                        if (!_L.test(word[j])) break;
                        if (j+1 < n) { const p = (word[j]+word[j+1]).toLowerCase(); if (p==='ch'||p==='dz'||p==='dž') { u.push(word[j]+word[j+1]); j+=2; continue; } }
                        u.push(word[j]); j++;
                    }
                    if (j >= n || (j < n && !_V.includes(word[j]) && !_L.test(word[j]))) {
                        s += u.join(''); while (j < n && !_L.test(word[j])) { s += word[j]; j++; } i = j;
                        if (i >= n) { r.push(s); s = ''; }
                    } else if (u.length === 0) { r.push(s); s = ''; }
                    else if (u.length === 1) { r.push(s); s = u[0]; i = j; }
                    else {
                        let sp = u.length - 1;
                        if (u.length >= 3) { const l2 = (u[u.length-2]+u[u.length-1]).toLowerCase(); if (_O.has(l2)) sp = u.length - 2; }
                        if (u.length >= 4) { const l3 = (u[u.length-3]+u[u.length-2]+u[u.length-1]).toLowerCase(); if (_O.has(l3)) sp = u.length - 3; }
                        s += u.slice(0, sp).join(''); r.push(s); s = u.slice(sp).join(''); i = j;
                    }
                }
            }
            if (s) r.push(s);
            return r.filter(x => x.length > 0);
        }

        function _col(text) {
            if (!text) return '';
            return text.split(/(\s+)/).map(token => {
                if (!token.trim() || !/[a-ząčęėįšųūžA-ZĄČĘĖĮŠŲŪŽ]/.test(token)) return token;
                const syls = _syl(token);
                return syls.map((s, i) => '<span style="color:' + _SC[i % _SC.length] + '">' + s + '</span>').join('');
            }).join('');
        }
        // === /SKIEMENŲ SPALVINIMAS ===

        // Game Data
        const SHAPES = [
            { id: 'apskritimas', name: 'Apskritimas', svg: '<circle cx="100" cy="100" r="85" />' },
            { id: 'kvadratas', name: 'Kvadratas', svg: '<rect x="15" y="15" width="170" height="170" rx="10" />' },
            { id: 'trikampis', name: 'Trikampis', svg: '<polygon points="100,15 15,180 185,180" stroke-linejoin="round" />' },
            { id: 'staciakampis', name: 'Stačiakampis', svg: '<rect x="10" y="40" width="180" height="120" rx="10" />' },
            { id: 'rombas', name: 'Rombas', svg: '<polygon points="100,10 190,100 100,190 10,100" stroke-linejoin="round" />' },
            { id: 'ovalas', name: 'Ovalas', svg: '<ellipse cx="100" cy="100" rx="95" ry="60" />' },
            { id: 'penkiakampis', name: 'Penkiakampis', svg: '<polygon points="100,10 190,75 155,185 45,185 10,75" stroke-linejoin="round" />' },
            { id: 'sesiakampis', name: 'Šešiakampis', svg: '<polygon points="50,15 150,15 195,100 150,185 50,185 5,100" stroke-linejoin="round" />' }
        ];

        const COLORS = [
            { id: 'raudonas', name: 'Raudonas', hex: '#ef4444', dark: '#b91c1c' },
            { id: 'melynas', name: 'Mėlynas', hex: '#3b82f6', dark: '#1d4ed8' },
            { id: 'zalias', name: 'Žalias', hex: '#22c55e', dark: '#15803d' },
            { id: 'geltonas', name: 'Geltonas', hex: '#eab308', dark: '#a16207' },
            { id: 'oranzinis', name: 'Oranžinis', hex: '#f97316', dark: '#c2410c' },
            { id: 'violetinis', name: 'Violetinis', hex: '#8b5cf6', dark: '#6d28d9' },
            { id: 'rozinis', name: 'Rožinis', hex: '#ec4899', dark: '#be185d' }
        ];

        const TOTAL_QUESTIONS = 12;

        let gameState = {
            mode: null, 
            questionIndex: 0,
            score: 0,
            currentQuestion: null,
            isAnswering: false
        };

        const appEl = document.getElementById('app');

        const shuffle = (array) => [...array].sort(() => Math.random() - 0.5);
        const pickRandom = (array) => array[Math.floor(Math.random() * array.length)];

        function renderStartScreen() {
            appEl.innerHTML = `
                <div class="glass-panel rounded-3xl p-8 text-center animate-pop-in">
                    <div class="flex justify-center space-x-2 mb-4">
                        <svg class="w-12 h-12 text-red-500" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm0-2a6 6 0 100-12 6 6 0 000 12z" clip-rule="evenodd" /></svg>
                        <svg class="w-12 h-12 text-blue-500" viewBox="0 0 20 20" fill="currentColor"><path d="M4 4h12v12H4z" /></svg>
                        <svg class="w-12 h-12 text-green-500" viewBox="0 0 20 20" fill="currentColor"><path d="M10 3L3 15h14L10 3z" /></svg>
                    </div>
                    <h1 class="text-4xl font-black text-gray-800 mb-2 leading-tight">🟡 Spalvos<br>ir Formos</h1>
                    <p class="text-xl text-gray-600 mb-8 font-semibold">Atpažink figūras ir spalvas!</p>
                    
                    <div class="space-y-4">
                        <button onclick="startGame('shapes')" class="btn-bounce w-full block bg-green-500 hover:bg-green-600 text-white font-bold py-5 px-6 rounded-2xl text-2xl shadow-lg border-b-4 border-green-700 transition-colors">
                            Formos
                        </button>
                        <button onclick="startGame('mixed')" class="btn-bounce w-full block bg-orange-500 hover:bg-orange-600 text-white font-bold py-5 px-6 rounded-2xl text-2xl shadow-lg border-b-4 border-orange-700 transition-colors">
                            Spalvos ir Formos
                        </button>
                    </div>
                </div>
            `;
        }

        function generateQuestion() {
            const shape = pickRandom(SHAPES);
            const color = pickRandom(COLORS);
            
            let correctAnswerStr = gameState.mode === 'shapes' ? shape.name : `${color.name} ${shape.name.toLowerCase()}`;
            
            let wrongAnswers = [];
            if (gameState.mode === 'shapes') {
                let otherShapes = SHAPES.filter(s => s.id !== shape.id);
                wrongAnswers = shuffle(otherShapes).slice(0, 3).map(s => s.name);
            } else {
                let others = [];
                let wrongShape = pickRandom(SHAPES.filter(s => s.id !== shape.id));
                others.push(`${color.name} ${wrongShape.name.toLowerCase()}`);
                
                let wrongColor = pickRandom(COLORS.filter(c => c.id !== color.id));
                others.push(`${wrongColor.name} ${shape.name.toLowerCase()}`);
                
                let wrongS2 = pickRandom(SHAPES.filter(s => s.id !== shape.id && s.id !== wrongShape.id));
                let wrongC2 = pickRandom(COLORS.filter(c => c.id !== color.id && c.id !== wrongColor.id));
                others.push(`${wrongC2.name} ${wrongS2.name.toLowerCase()}`);
                
                wrongAnswers = others;
            }

            const options = shuffle([correctAnswerStr, ...wrongAnswers]);

            return { shape, color, correctAnswerStr, options };
        }

        function startGame(mode) {
            getAudioCtx();
            gameState = {
                mode,
                questionIndex: 0,
                score: 0,
                currentQuestion: null,
                isAnswering: false
            };
            nextQuestion();
        }

        function nextQuestion() {
            if (gameState.questionIndex >= TOTAL_QUESTIONS) {
                renderEndScreen();
                return;
            }
            gameState.isAnswering = false;
            gameState.firstTry = true;
            gameState.currentQuestion = generateQuestion();
            renderGameScreen();
        }

        function renderGameScreen() {
            const { shape, color, options } = gameState.currentQuestion;
            
            const progress = ((gameState.questionIndex) / TOTAL_QUESTIONS) * 100;
            const promptText = gameState.mode === 'shapes' ? 'Kokia tai forma?' : 'Kokia tai spalva ir forma?';

            appEl.innerHTML = `
                <div class="glass-panel rounded-3xl p-4 sm:p-6 relative">
                    <div class="flex justify-between items-center mb-3 sm:mb-4">
                        <div class="flex items-center space-x-1 text-yellow-500">
                            <svg class="w-7 h-7 sm:w-8 sm:h-8" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" /></svg>
                            <span class="text-xl sm:text-2xl font-bold">${gameState.score}</span>
                        </div>
                        <div class="text-gray-500 font-bold text-lg sm:text-xl">
                            ${gameState.questionIndex + 1} / ${TOTAL_QUESTIONS}
                        </div>
                    </div>
                    
                    <div class="w-full bg-gray-200 rounded-full h-2.5 mb-3 sm:mb-6">
                        <div class="bg-blue-500 h-2.5 rounded-full transition-all duration-300" style="width: ${progress}%"></div>
                    </div>

                    <h2 class="text-xl sm:text-2xl font-black text-gray-700 text-center mb-2 sm:mb-3">${_col(promptText)}</h2>

                    <div id="shape-container" class="shape-container flex justify-center mb-3 sm:mb-6 animate-pop-in h-32 sm:h-40 items-center">
                        <svg viewBox="0 0 200 200" width="130" height="130" class="sm:w-[160px] sm:h-[160px]" 
                             fill="${color.hex}" stroke="${color.dark}" stroke-width="8">
                            ${shape.svg}
                        </svg>
                    </div>

                    <div class="grid grid-cols-2 gap-2.5 sm:gap-3">
                        ${options.map((opt) => `
                            <button onclick="handleAnswer('${opt.replace(/'/g, "\\'")}', this)" 
                                    class="option-btn btn-bounce bg-white hover:bg-gray-50 text-gray-800 font-bold py-3 px-2 rounded-xl text-sm sm:text-base shadow border-2 border-gray-200 transition-all flex items-center justify-center text-center leading-snug">
                                ${_col(opt)}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function handleAnswer(selectedOption, btnElement) {
            if (gameState.isAnswering) return;

            const isCorrect = selectedOption === gameState.currentQuestion.correctAnswerStr;
            const shapeContainer = document.getElementById('shape-container');

            if (isCorrect) {
                gameState.isAnswering = true;
                if (gameState.firstTry) {
                    gameState.score++;
                }
                playCorrectSound();
                btnElement.classList.remove('bg-white', 'hover:bg-gray-50', 'text-gray-800', 'border-gray-200');
                btnElement.classList.add('bg-green-500', 'text-white', 'border-green-600', 'scale-105');
                shapeContainer.classList.remove('animate-bounce-sm');
                void shapeContainer.offsetWidth;
                shapeContainer.classList.add('animate-bounce-sm');
                
                gameState.questionIndex++;
                setTimeout(() => {
                    nextQuestion();
                }, 1200);
            } else {
                gameState.firstTry = false;
                playWrongSound();
                btnElement.disabled = true;
                btnElement.classList.remove('bg-white', 'hover:bg-gray-50', 'text-gray-800', 'border-gray-200');
                btnElement.classList.add('bg-red-100', 'text-red-400', 'border-red-300', 'line-through', 'opacity-60', 'cursor-not-allowed');
                shapeContainer.classList.remove('animate-shake');
                void shapeContainer.offsetWidth;
                shapeContainer.classList.add('animate-shake');
            }
        }

        function renderEndScreen() {
            playWinSound();
            
            let stars = 1;
            if (gameState.score >= 10) stars = 3;
            else if (gameState.score >= 7) stars = 2;

            const starHtml = Array(3).fill(0).map((_, i) => `
                <svg class="w-16 h-16 ${i < stars ? 'text-yellow-400 animate-bounce-sm' : 'text-gray-300'} drop-shadow-md" fill="currentColor" viewBox="0 0 20 20" style="animation-delay: ${i*0.2}s">
                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                </svg>
            `).join('');

            appEl.innerHTML = `
                <div class="glass-panel rounded-3xl p-8 text-center animate-pop-in">
                    <h2 class="text-4xl font-black text-gray-800 mb-6">Žaidimas baigtas!</h2>
                    
                    <div class="flex justify-center space-x-2 mb-6">
                        ${starHtml}
                    </div>
                    
                    <div class="text-2xl text-gray-600 font-bold mb-8">
                        Surinkai: <span class="text-blue-600 text-4xl">${gameState.score}</span> / ${TOTAL_QUESTIONS}
                    </div>

                    <button onclick="renderStartScreen()" class="btn-bounce w-full block bg-blue-500 hover:bg-blue-600 text-white font-bold py-5 px-6 rounded-2xl text-2xl shadow-lg border-b-4 border-blue-700 transition-colors">
                        Žaisti dar kartą!
                    </button>
                </div>
            `;
        }

        renderStartScreen();
    </script>
</body>
</html>
